# V4-17 live measure (acceptance 4): the first screens as a stream on the real models — three reference briefs, the
# directions in parallel, the platform's own preview builds; seconds to the first screen and to all three, ₽
# (apps/platform-api/test/v4-directions-stream.live.test.ts). Kopecks to a few tens of rubles a run. Never prints keys.
# Runs on manual dispatch (a model forced at the head of the art_direction route) and on pushes of V4-17 branches
# that change the directions step or the measure.
name: directions-stream-probe
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Модели (id из models.yaml) во главу маршрута art_direction, через запятую (пусто — по маршруту)"
        type: string
        default: ""
  push:
    branches: ["task/V4-17*"]
    paths:
      - "apps/platform-api/test/v4-directions-stream.live.test.ts"
      - "packages/agents/src/builder/v3/art-director.ts"
      - "packages/agents/src/builder/v3/directions/**"
      - ".github/workflows/directions-stream-probe.yml"
permissions:
  contents: read
concurrency:
  group: directions-stream-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No secrets in the environment of dependency installation.
      - run: pnpm install --frozen-lockfile
      - name: Measure
        env:
          WIZARD_STAGE_PROBE: stream
          WIZARD_PROBE_MODEL: ${{ inputs.model }}
          WIZARD_LLM_MODE: live
          CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
          CLOUDRU_BASE_URL: ${{ vars.CLOUDRU_BASE_URL }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MOONSHOT_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_BASE_URL: https://api.moonshot.ai/v1
          MIMO_API_KEY: ${{ secrets.MIMO_SECOND_API_KEY }}
        run: pnpm exec vitest run --project node apps/platform-api/test/v4-directions-stream.live.test.ts --reporter=verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directions-stream-probe
          path: tools/llm-probe/out/directions-stream.jsonl
          if-no-files-found: ignore
