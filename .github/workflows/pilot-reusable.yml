# Pilot on Timeweb Cloud from GitHub-hosted runners (docs/ops/deploy.md «Пилот: одна кнопка»; no self-hosted runner,
# no runner-local files). Called by bootstrap-pilot.yml and deploy-pilot.yml only. Order: the repository owner,
# main and the confirmation are checked first (no secret is read before that); images of the SHA are built into GHCR
# when missing (images.yml, GITHUB_TOKEN with packages: write); then tools/deploy/pilot.mjs creates or reuses the
# state bucket, the encrypted secrets bundle, the VM (OpenTofu), opens SSH for this runner's IP only, releases over an
# SSH tunnel and closes SSH again — also when anything fails (`close-access` with always()). `check` is the read-only
# preflight (tools/deploy/preflight.mjs): same owner/main checks, no PROD word, no images, no OpenTofu/helm setup.
# `eval` is the D67 measurement (docs/ops/eval-d67.md): diagnose-like cluster access for the database, the briefs over
# the public HTTPS; its report is uploaded as an artifact (no secrets, no personal data in it).
name: pilot-reusable

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      command:
        description: "check | bootstrap | deploy | destroy | diagnose | eval | reboot"
        type: string
        required: true
      sha:
        type: string
        default: ""
      confirm:
        type: string
        default: ""
      location:
        description: "ru-1 | ru-3 for this run; empty — the WIZARD_TIMEWEB_LOCATION variable"
        type: string
        default: ""
      server:
        description: "A Timeweb VM handed over to the environment (IP or id); empty — the one remembered in the bundle, else a new VM"
        type: string
        default: ""
      briefs:
        description: "eval: all or brief ids separated by commas"
        type: string
        default: "all"
      max_cost_rub:
        description: "eval: model budget of the measurement, ₽"
        type: string
        default: "2000"
      llm_daily_cap_rub:
        description: "deploy: the platform's daily model cap, ₽, until the next deploy (D75); empty — the variable or 700"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.a.outputs.sha }}
    steps:
      - id: a
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
          SHA: ${{ inputs.sha || github.sha }}
          DEPLOY_ENV: ${{ inputs.env }}
          COMMAND: ${{ inputs.command }}
          EVAL_BRIEFS: ${{ inputs.briefs }}
          EVAL_MAX_COST_RUB: ${{ inputs.max_cost_rub }}
          LLM_DAILY_CAP_RUB: ${{ inputs.llm_daily_cap_rub }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error title=pilot::Пилот запускает только владелец репозитория ($OWNER)."; exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=pilot::Запуск только из main."; exit 1
          fi
          case "$DEPLOY_ENV" in prod|staging) ;; *) echo "::error title=pilot::env — prod или staging."; exit 1 ;; esac
          case "$COMMAND" in check|bootstrap|deploy|destroy|diagnose|eval|reboot) ;; *) echo "::error title=pilot::неизвестная команда."; exit 1 ;; esac
          if [ "$COMMAND" = "eval" ]; then
            printf '%s' "$EVAL_BRIEFS" | grep -Eq '^(all|[a-z0-9-]+(,[a-z0-9-]+)*)$' || { echo "::error title=pilot::briefs — all или id через запятую."; exit 1; }
            printf '%s' "$EVAL_MAX_COST_RUB" | grep -Eq '^[0-9]{1,4}$' || { echo "::error title=pilot::max_cost_rub — целое число рублей."; exit 1; }
          fi
          if [ -n "$LLM_DAILY_CAP_RUB" ] && ! printf '%s' "$LLM_DAILY_CAP_RUB" | grep -Eq '^[1-9][0-9]{0,4}$'; then
            echo "::error title=pilot::llm_daily_cap_rub — целое число рублей или пусто."; exit 1
          fi
          if [ "$COMMAND" = "destroy" ] && [ "$DEPLOY_ENV" != "staging" ]; then
            echo "::error title=pilot::Удалять можно только staging."; exit 1
          fi
          # check and diagnose only read (diagnose opens SSH for this runner, as every job does): no confirmation word.
          if [ "$DEPLOY_ENV" = "prod" ] && [ "$COMMAND" != "check" ] && [ "$COMMAND" != "diagnose" ] && [ "$CONFIRM" != "PROD" ]; then
            echo "::error title=pilot::Подтверждение не совпало (нужно PROD)."; exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=pilot::sha — полный SHA из 40 символов."; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  images:
    needs: authorize
    if: inputs.command != 'destroy' && inputs.command != 'check' && inputs.command != 'diagnose' && inputs.command != 'eval' && inputs.command != 'reboot'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ needs.authorize.outputs.sha }}
      ghcr: true

  pilot:
    needs: [authorize, images]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && needs.images.result != 'failure' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    # eval: 10 briefs two at a time, each bounded by the driver's timeouts — 5.5 hours at most.
    timeout-minutes: ${{ inputs.command == 'check' && 5 || inputs.command == 'eval' && 330 || 90 }}
    permissions:
      contents: read
      packages: read
      # eval: live progress in an issue comment (the job log is readable only after the job ends).
      issues: write
    env:
      SHA: ${{ needs.authorize.outputs.sha }}
      DEPLOY_ENV: ${{ inputs.env }}
      COMMAND: ${{ inputs.command }}
      EVAL_BRIEFS: ${{ inputs.briefs }}
      EVAL_MAX_COST_RUB: ${{ inputs.max_cost_rub }}
      # Founder inputs (docs/ops/deploy.md «Что нужно от основателя»): secrets…
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      WIZARD_STATE_PASSPHRASE: ${{ secrets.WIZARD_STATE_PASSPHRASE }}
      CLOUDRU_API_KEY: ${{ secrets.CLOUDRU_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      # Models (D26, M2-32): provider base URLs and the default build tier are variables, the Yandex key is a secret.
      CLOUDRU_BASE_URL: ${{ vars.CLOUDRU_BASE_URL }}
      ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || vars.YANDEX_FOLDER_ID }}
      YANDEX_BASE_URL: ${{ vars.YANDEX_BASE_URL }}
      WIZARD_BUILD_DEFAULT_TIER: ${{ vars.WIZARD_BUILD_DEFAULT_TIER }}
      # D75: the platform's daily model cap, ₽ (empty — the default 700); raised only by the founder.
      WIZARD_LLM_DAILY_CAP_RUB: ${{ inputs.llm_daily_cap_rub || vars.WIZARD_LLM_DAILY_CAP_RUB }}
      # Timeweb S3 account key (panel → S3 → Ключи доступа): the keys on bucket objects in the API are refused by S3
      # (SignatureDoesNotMatch). Named apart from AWS_* so no tool on the runner picks them up implicitly.
      WIZARD_S3_ACCOUNT_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      WIZARD_S3_ACCOUNT_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      WIZARD_SMTP_HOST: ${{ secrets.WIZARD_SMTP_HOST || vars.WIZARD_SMTP_HOST }}
      WIZARD_SMTP_PORT: ${{ secrets.WIZARD_SMTP_PORT || vars.WIZARD_SMTP_PORT }}
      WIZARD_SMTP_USER: ${{ secrets.WIZARD_SMTP_USER || vars.WIZARD_SMTP_USER }}
      WIZARD_SMTP_PASSWORD: ${{ secrets.WIZARD_SMTP_PASSWORD }}
      WIZARD_SMTP_FROM: ${{ secrets.WIZARD_SMTP_FROM || vars.WIZARD_SMTP_FROM }}
      WIZARD_SMTP_TLS: ${{ vars.WIZARD_SMTP_TLS }}
      # Platform mail over the Unisender Go HTTP API on 443 (default for a *.unisender.ru host: the server's mail
      # ports are closed); WIZARD_MAIL_TRANSPORT=smtp forces SMTP, WIZARD_MAIL_API_BASE overrides the API origin.
      WIZARD_MAIL_TRANSPORT: ${{ vars.WIZARD_MAIL_TRANSPORT }}
      WIZARD_MAIL_API_BASE: ${{ vars.WIZARD_MAIL_API_BASE }}
      WIZARD_TELEGRAM_BOT_TOKEN: ${{ secrets.WIZARD_TELEGRAM_BOT_TOKEN }}
      WIZARD_OPS_ALERT_TELEGRAM_TOKEN: ${{ secrets.WIZARD_OPS_ALERT_TELEGRAM_TOKEN }}
      WIZARD_OPS_ALERT_CHAT_ID: ${{ secrets.WIZARD_OPS_ALERT_CHAT_ID || vars.WIZARD_OPS_ALERT_CHAT_ID }}
      WIZARD_OPS_ALERT_URL: ${{ secrets.WIZARD_OPS_ALERT_URL }}
      WIZARD_PLATFORM_YOOKASSA_SHOP_ID: ${{ secrets.WIZARD_PLATFORM_YOOKASSA_SHOP_ID }}
      WIZARD_PLATFORM_YOOKASSA_SECRET_KEY: ${{ secrets.WIZARD_PLATFORM_YOOKASSA_SECRET_KEY }}
      WIZARD_RECEIPT_VAT_CODE: ${{ vars.WIZARD_RECEIPT_VAT_CODE }}
      # …and variables. The repository is public, so its Actions logs are too: GitHub prints a step's env in clear
      # text, hence personal addresses are read from secrets first (a variable still works, but shows in the log).
      WIZARD_PLATFORM_DOMAIN: ${{ vars.WIZARD_PLATFORM_DOMAIN }}
      WIZARD_SYSTEMS_DOMAIN: ${{ vars.WIZARD_SYSTEMS_DOMAIN }}
      # Staging domains (no environment-level variables without GitHub Pro; pilot.mjs envVars never reuses prod's).
      WIZARD_STAGING_PLATFORM_DOMAIN: ${{ vars.WIZARD_STAGING_PLATFORM_DOMAIN }}
      WIZARD_STAGING_SYSTEMS_DOMAIN: ${{ vars.WIZARD_STAGING_SYSTEMS_DOMAIN }}
      WIZARD_ACME_EMAIL: ${{ secrets.WIZARD_ACME_EMAIL || vars.WIZARD_ACME_EMAIL }}
      WIZARD_FOUNDER_EMAIL: ${{ secrets.WIZARD_FOUNDER_EMAIL || vars.WIZARD_FOUNDER_EMAIL }}
      WIZARD_PLATFORM_MAIL_SPF: ${{ vars.WIZARD_PLATFORM_MAIL_SPF }}
      WIZARD_TIMEWEB_LOCATION: ${{ inputs.location || vars.WIZARD_TIMEWEB_LOCATION }}
      WIZARD_TIMEWEB_ZONE: ${{ vars.WIZARD_TIMEWEB_ZONE }}
      WIZARD_PILOT_SERVER: ${{ inputs.server || vars.WIZARD_PILOT_SERVER }}
      # DKIM selector of the platform mail provider (Unisender Go: gokey → gokey._domainkey.<platform domain>).
      WIZARD_PLATFORM_DKIM_SELECTOR: ${{ vars.WIZARD_PLATFORM_DKIM_SELECTOR || 'gokey' }}
      # GHCR: the packages of this public repository are public — the cluster pulls anonymously (a job token in the
      # pull secret expires with the job). A long-lived read:packages secret is used instead when provided; this job's
      # token only checks that the images of the SHA are there.
      WIZARD_GHCR_USER: ${{ github.actor }}
      WIZARD_GHCR_TOKEN: ${{ secrets.WIZARD_GHCR_TOKEN }}
      WIZARD_GHCR_JOB_TOKEN: ${{ github.token }}
      WIZARD_GHCR_ANONYMOUS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
      - name: Only commits of main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: opentofu/setup-opentofu@v1
        if: inputs.command != 'check'
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      # Same provider cache as ci.yml deploy-lint (the job's `tofu init` reads TF_PLUGIN_CACHE_DIR).
      - name: OpenTofu provider cache
        if: inputs.command != 'check'
        uses: actions/cache@v4
        with:
          path: ~/.tofu-plugin-cache
          key: tofu-providers-${{ hashFiles('infra/tofu/**/.terraform.lock.hcl') }}
          restore-keys: tofu-providers-
      - name: Provider cache directory
        if: inputs.command != 'check'
        run: |
          mkdir -p "$HOME/.tofu-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.tofu-plugin-cache" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v4
        if: inputs.command != 'check'
        with:
          version: v3.19.0
      - name: Tools
        if: inputs.command != 'check'
        run: |
          kubectl version --client=true
          ssh -V
      - name: Pilot (${{ inputs.command }})
        env:
          # Only eval uses it: the issue comment with the live progress of the measurement.
          GITHUB_TOKEN: ${{ inputs.command == 'eval' && github.token || '' }}
        run: |
          case "$COMMAND" in
            check) node tools/deploy/pilot.mjs check --env "$DEPLOY_ENV" ;;
            destroy) node tools/deploy/pilot.mjs destroy --env "$DEPLOY_ENV" ;;
            diagnose) node tools/deploy/pilot.mjs diagnose --env "$DEPLOY_ENV" ;;
            eval) node tools/deploy/pilot.mjs eval --env "$DEPLOY_ENV" --briefs "$EVAL_BRIEFS" --max-cost-rub "$EVAL_MAX_COST_RUB" ;;
            reboot) node tools/deploy/pilot.mjs reboot --env "$DEPLOY_ENV" ;;
            *) node tools/deploy/pilot.mjs "$COMMAND" --env "$DEPLOY_ENV" --tag "$SHA" ;;
          esac
      # The D67 report and the per-brief results (no token, no secrets; the eval account is a service one).
      - name: D67 report
        if: always() && inputs.command == 'eval'
        uses: actions/upload-artifact@v4
        with:
          name: d67-eval-${{ inputs.env }}-${{ github.run_id }}
          path: ${{ runner.temp }}/wizard-eval-${{ inputs.env }}
          if-no-files-found: ignore
          retention-days: 90
      # check opens nothing (and may run with a rejected TWC_TOKEN), so there is nothing to close.
      - name: Close SSH access
        if: always() && inputs.command != 'check'
        run: node tools/deploy/pilot.mjs close-access --env "$DEPLOY_ENV"
      - name: Clean up the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/wizard-pilot-$DEPLOY_ENV" "$RUNNER_TEMP/wizard-eval-$DEPLOY_ENV"
