name: ci
# GitHub Free: 2 000 Actions minutes a month for a private repository. Branch pushes are covered by their PR run
# (no second run per push); a newer push to the same PR cancels the older run.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizard
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wizard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wizard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WIZARD_DB_URL: postgres://wizard@localhost:5433/wizard
      WIZARD_LLM_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pip install pyyaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:code
      - run: pnpm typecheck
      - run: pnpm test
      # Time budgets alone, after the parallel suite (vitest.config.ts: perf).
      - run: pnpm test:perf
      - run: node tools/specs/validate.mjs
        if: hashFiles('tools/specs/validate.mjs') != ''
  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizard
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wizard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wizard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WIZARD_DB_URL: postgres://wizard@localhost:5433/wizard
      WIZARD_LLM_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizard/e2e exec playwright install --with-deps chromium
      # B2-32 (ui-kit.yaml#platform_v2): design system v2 demo — screenshots 390/1280 light/dark, contrast, reduced motion.
      - run: pnpm exec vitest run --project browser packages/ui-kit/test/v2.browser.test.ts
      # B2-34 (ui-kit.yaml#tokens.cabinet): cabinets of the module matrix on v2 — G0/G1, 390/1280 light/dark, contrast,
      # touch targets; screenshots packages/modules/test/artifacts/cabinet-*.png.
      - run: pnpm exec vitest run --project browser packages/modules/test/cabinets.browser.test.ts
      # B2-27 (modules.yaml#catalog reports): the goal panel — metrics by goal, hints «что улучшить», the empty state;
      # 390/1280 light/dark; screenshots packages/modules/test/artifacts/goal-panel-*.png.
      - run: pnpm exec vitest run --project browser packages/modules/test/goal-panel.browser.test.ts
      # B2-25 (platform-screens.yaml#S-canvas): the canvas screen on the recorded feed «клиника» (режим показа, no models),
      # 390/1280 light/dark: interview → sketch → plan → approval → build → ready; screenshots test/artifacts/canvas-*.png.
      - run: pnpm exec vitest run --project browser apps/platform-web/test/canvas.browser.test.ts apps/platform-web/test/canvas-pick.browser.test.ts
      # B2-33 (platform-screens.yaml#stack): every other platform screen on the design system v2 — 390/1280 light/dark,
      # no horizontal scroll, the start of prototype E opens the canvas; screenshots test/artifacts/platform-*.png.
      - run: pnpm exec vitest run --project browser apps/platform-web/test/platform-v2.browser.test.ts
      - run: pnpm e2e
      # Artifacts come only from fixture runs (WIZARD_LLM_MODE=fixture above), never from live LLM runs.
      - uses: actions/upload-artifact@v4
        if: always() && env.WIZARD_LLM_MODE == 'fixture'
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
            packages/ui-kit/test/artifacts/v2-*.png
            packages/modules/test/artifacts/cabinet-*.png
            packages/modules/test/artifacts/goal-panel-*.png
            apps/platform-web/test/artifacts/canvas-*.png
            apps/platform-web/test/artifacts/platform-*.png
          retention-days: 7
  # B2-24/B2-28 (gates.yaml#G1.browser.ci): goal scenarios of the modules and 390 px in Chromium, the matrix rows split
  # over three runners (WIZARD_GOALS_SHARD) next to e2e — each ≤ 8 min; the build job has no browser.
  goals:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizard
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wizard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wizard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WIZARD_DB_URL: postgres://wizard@localhost:5433/wizard
      WIZARD_LLM_MODE: fixture
      WIZARD_GOALS_SHARD: ${{ matrix.shard }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizard/e2e exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --project browser packages/modules/test/goals.browser.test.ts packages/modules/test/goals-b218.browser.test.ts
      # The gate's own browser cases and the time measure of a system with every module (≤ 90 s, gates.yaml#G1.browser).
      - if: matrix.shard == '1/3'
        run: pnpm exec vitest run --project browser packages/gates/test/goals.browser.test.ts packages/modules/test/goals-time.browser.test.ts
      # A plan build through the API with the platform's Chromium: goals.checked = true (B2-28).
      - if: matrix.shard == '2/3'
        run: pnpm exec vitest run --project browser apps/platform-api/test/b2-build-v2.browser.test.ts
  # L3-38 (deploy.yaml#cloud.ci_cd.ci): license policy of AGENTS.md over the whole dependency tree + CycloneDX SBOM.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check
      - run: node tools/supply-chain/sbom.mjs --out sbom-workspace.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-workspace
          path: sbom-workspace.cdx.json
          retention-days: 90
  # L3-21: transactions of different systems through one PgBouncer server connection (transaction mode).
  pgbouncer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizard
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wizard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wizard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WIZARD_DB_URL: postgres://wizard@localhost:5433/wizard
      WIZARD_PGBOUNCER_BIN: /usr/sbin/pgbouncer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # PgBouncer ≥ 1.21 (Ubuntu 24.04: 1.22); the test starts its own instance, the packaged service is stopped.
      - run: sudo apt-get update && sudo apt-get install -y pgbouncer
      - run: sudo systemctl stop pgbouncer || true
      - run: /usr/sbin/pgbouncer --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/runtime/test/pgbouncer.test.ts
  # M2-06: Helm chart (lint, render invariants for every provider variant, kubeconform), OpenTofu (fmt, validate of
  # every provider root: Timeweb from the OpenTofu registry, Cloud.ru through its mirror).
  deploy-lint:
    runs-on: ubuntu-latest
    # tools/deploy tests (PITR drill marks, pg-ops) need a PostgreSQL on :5433 like the other jobs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizard
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wizard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wizard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WIZARD_DB_URL: postgres://wizard@localhost:5433/wizard
      KUBECONFORM_VERSION: v0.7.0
      # WAL-G of the pilot database (infra/docker/postgres.Dockerfile pins the same release and sha256).
      WALG_VERSION: v3.0.9
      WALG_SHA256: 4f03ee4679db7f660bfd1b2b8291ac5df247cd2ec48074b60c112f4897299f24
      # Workflow lint (MIT, CI only): the pilot workflows (bootstrap-pilot, deploy-pilot) carry the deploy logic.
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP" kubeconform
          echo "KUBECONFORM_BIN=$RUNNER_TEMP/kubeconform" >> "$GITHUB_ENV"
      - name: wal-g (restore drill against a throwaway PostgreSQL 16 of the runner image)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wal-g.tar.gz" "https://github.com/wal-g/wal-g/releases/download/${WALG_VERSION}/wal-g-pg-22.04-amd64.tar.gz"
          echo "${WALG_SHA256}  $RUNNER_TEMP/wal-g.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wal-g.tar.gz" -C "$RUNNER_TEMP"
          echo "WALG_BIN=$RUNNER_TEMP/wal-g-pg-22.04-amd64" >> "$GITHUB_ENV"
          ls /usr/lib/postgresql/16/bin/pg_ctl
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: pip install pyyaml
      - run: pnpm install --frozen-lockfile
      - run: HELM_BIN="$(command -v helm)" pnpm exec vitest run tools/deploy
      - run: tofu fmt -check -recursive infra/tofu
      # Providers are downloaded once and cached between runs: the Cloud.ru registry is slow (~3 min per download)
      # and sometimes resets the connection; init is retried.
      - name: OpenTofu provider cache
        uses: actions/cache@v4
        with:
          path: ~/.tofu-plugin-cache
          key: tofu-providers-${{ hashFiles('infra/tofu/**/.terraform.lock.hcl') }}
          restore-keys: tofu-providers-
      - name: tofu validate
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.tofu-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in infra/tofu/*/envs/* infra/tofu/*/drills/*; do
            [ -f "$d/main.tf" ] || continue
            provider_dir="${d%%/envs/*}"; provider_dir="${provider_dir%%/drills/*}"
            if [ -f "$provider_dir/tofurc" ]; then export TF_CLI_CONFIG_FILE="$PWD/$provider_dir/tofurc"; else unset TF_CLI_CONFIG_FILE; fi
            ok=""
            for attempt in 1 2 3; do
              if tofu -chdir="$d" init -backend=false -input=false; then ok=1; break; fi
              echo "tofu init failed (attempt $attempt), retrying"; sleep $((attempt * 10))
            done
            [ -n "$ok" ] || exit 1
            tofu -chdir="$d" validate
          done
      - name: tofu test (module shapes offline — pilot and beta, no provider credentials)
        run: |
          for m in infra/tofu/*/modules/*; do
            [ -d "$m/tests" ] || continue
            tofu -chdir="$m" init -backend=false -input=false
            tofu -chdir="$m" test
          done
