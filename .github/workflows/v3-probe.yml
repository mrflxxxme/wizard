# V3-18: the probe of the v3 model routes on the pilot (step 2 of the lean dev harness, agents/builder-v3.md §4; ≤ 30 ₽;
# docs/ops/eval-pilot.md): one minimal real call per v3 callType route head — interview_v3, brief_extract, art_direction,
# page_compose, signature_section, critic_visual (one small image), techreview, research (when the server's research is
# live) — through the server's own gateway in the worker pod (tools/deploy/pilot.mjs v3-probe, tools/eval/server/probe.mjs):
# status, the model actually served, tier, scrub, latency, ₽. Paid, so pre-registered in the spend journal like eval
# (V3-01, tools/deploy/spend.mjs); the cap stops it. prod only; needs the word PROD. Its own small form (actionlint holds
# a workflow_dispatch form to 10 inputs); shares the concurrency group of prod with bootstrap, deploy and eval.
# probe_shape (critic | techreview | critic,techreview): the shape probe instead — the production request shapes of
# critic_visual and techreview on synthetic content, model by model of the chain, variants of analysis and the
# provider's own words on a refusal (tools/eval/server/probe-shape.mjs); one annotation per call type and model.
# pay_systems (V3-40): the payment check of shops already built by one measurement — the visitor's purchase on each
# draft paid with the test card on the founder's ЮKassa test shop (tools/eval/server/pay-probe.mjs), 0 ₽ of models.
name: v3-probe

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Полный SHA коммита main (пусто — последний коммит main)"
        type: string
        default: ""
      wave:
        description: "Журнал трат: волна плана v3 — пробы этапов идут в волну A (B, C — пробы своих волн)"
        type: choice
        options: [A, B, C]
        default: A
      purpose:
        description: "Журнал трат: цель пробы — что проверяем (например: головы маршрутов v3 отвечают на сервере)"
        type: string
        default: ""
      hypothesis:
        description: "Журнал трат: гипотеза — какой результат ждём и почему"
        type: string
        default: ""
      expect_rub:
        description: "Журнал трат: ожидаемый расход, ₽ (по ценам голов маршрутов ≈ 3 ₽; проба формы — ≈ 12 ₽)"
        type: string
        default: ""
      cap_rub:
        description: "Журнал трат: потолок пробы, ₽ — не больше 30; на нём проба останавливается"
        type: string
        default: ""
      confirm:
        description: "Введите PROD: проба вызывает модели с ключей сервера и пишет в базу пилота"
        type: string
        default: ""
      probe_shape:
        description: "Проба формы запросов: critic, techreview или critic,techreview — формы как в сборке на синтетике, каждая модель цепочки, варианты разбора и текст отказа провайдера (≈ 12 ₽, до ≈ 30 ₽). Пусто — проба голов маршрутов"
        type: string
        default: ""
      pay_systems:
        description: "Проба оплаты: id до трёх магазинов одного замера через запятую — покупка на превью и оплата тестовой картой ЮKassa, без сборки и вызовов моделей (0 ₽). Пусто — нет"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pilot-prod
  cancel-in-progress: false

jobs:
  pilot:
    uses: ./.github/workflows/pilot-reusable.yml
    permissions:
      contents: read
      packages: write
      issues: write
    with:
      env: prod
      command: v3-probe
      sha: ${{ inputs.sha }}
      confirm: ${{ inputs.confirm }}
      wave: ${{ inputs.wave }}
      purpose: ${{ inputs.purpose }}
      hypothesis: ${{ inputs.hypothesis }}
      expect_rub: ${{ inputs.expect_rub }}
      cap_rub: ${{ inputs.cap_rub }}
      founder_ok: "no"
      probe_shape: ${{ inputs.probe_shape }}
      pay_systems: ${{ inputs.pay_systems }}
    secrets: inherit
