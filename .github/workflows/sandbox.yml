# M2-01 acceptance (security/isolation.yaml#M2, #escape_tests): the isolation settings we ship really deny
# capabilities. Real workerd runs the pod config from apps/runtime/src/sandbox/workerd-config.ts; a container with the
# sandbox pod's security settings runs under gVisor (runsc) and is inspected with amicontained. Read-only,
# negative-capability assertions only (apps/runtime/test/sandbox/*.sandbox.test.ts, skipped without
# WIZARD_SANDBOX_E2E=1). CI-only tools, not distributed: THIRD_PARTY_NOTICES.md.
name: sandbox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump together with WORKERD_COMPATIBILITY_DATE (workerd-config.ts) when needed; workerd is Apache-2.0.
  WORKERD_VERSION: "1.20260930.1"
  # genuinetools/amicontained (MIT), release binary pinned by sha256.
  AMICONTAINED_VERSION: "v0.4.9"
  AMICONTAINED_SHA256: "d8c49e2cf44ee9668219acd092ed961fc1aa420a6e036e0822d7a31033776c9f"
  # Shell and tools for the in-container checks (busybox: GPL-2.0, CI-only, unmodified).
  PROBE_IMAGE: "busybox:1.36.1"

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gVisor (runsc) from the official apt repository
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          # platform=systrap as in the pods; --oci-seccomp applies docker's default profile (RuntimeDefault) in the sandbox
          sudo runsc install -- --platform=systrap --oci-seccomp
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
          runsc --version

      - name: Install workerd
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/workerd" "workerd@${WORKERD_VERSION}"
          echo "WORKERD_BIN=$RUNNER_TEMP/workerd/node_modules/.bin/workerd" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/workerd/node_modules/.bin/workerd" --version

      - name: Download amicontained and verify its checksum
        run: |
          curl -fsSL -o "$RUNNER_TEMP/amicontained" \
            "https://github.com/genuinetools/amicontained/releases/download/${AMICONTAINED_VERSION}/amicontained-linux-amd64"
          echo "${AMICONTAINED_SHA256}  $RUNNER_TEMP/amicontained" | sha256sum -c -
          chmod 0555 "$RUNNER_TEMP/amicontained"
          echo "AMICONTAINED_BIN=$RUNNER_TEMP/amicontained" >> "$GITHUB_ENV"

      - name: Pull the probe image
        run: docker pull "$PROBE_IMAGE"

      - name: Sandbox tests (workerd + gVisor)
        env:
          WIZARD_SANDBOX_E2E: "1"
          WIZARD_SANDBOX_PROBE_IMAGE: ${{ env.PROBE_IMAGE }}
        run: pnpm exec vitest run --config apps/runtime/sandbox.vitest.config.ts
