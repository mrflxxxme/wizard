# Release of one SHA of main to the pilot (docs/ops/deploy.md «Пилот: одна кнопка»): images into GHCR when missing,
# then Secrets and Helm only — no OpenTofu apply, no addons (bootstrap-pilot.yml does those). Only the repository
# owner, only from main, full SHA; prod needs the word PROD. Shares the concurrency group with bootstrap-pilot.
name: deploy-pilot

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Окружение"
        type: choice
        options: [prod, staging]
        default: prod
      sha:
        description: "Полный SHA коммита main"
        required: true
        type: string
      confirm:
        description: "Для prod введите PROD"
        type: string
        default: ""
      llm_daily_cap_rub:
        description: "Дневной лимит платформы на модели, ₽ — до следующей выкатки (пусто — 3 000 ₽ на время v3 или переменная WIZARD_LLM_DAILY_CAP_RUB); поднимает только основатель"
        type: string
        default: ""
      build_pipeline:
        description: "Конвейер новых систем: modules — бета v2 (план по целям, модули); legacy — прежний (старые системы остаются на своём)"
        type: choice
        options: [modules, legacy]
        default: modules
      pipeline_orgs:
        description: "V3-18: организации на v3 — uuid и виды eval, staff через запятую (eval — организации замеров); клиенты остаются на build_pipeline. Пусто — переменная WIZARD_BUILD_PIPELINE_ORGS"
        type: string
        default: ""
      stock_mode:
        description: "Фото на сайтах систем: off — графика темы; library — библиотека фото, её пополняет раннер выката (стоки с сервера в РФ закрыты); live — стоки с сервера (ключи PEXELS_API_KEY и PIXABAY_API_KEY, выкат проверяет каждый)"
        type: choice
        options: ["off", library, live]
        default: "off"

permissions:
  contents: read

concurrency:
  group: pilot-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  pilot:
    uses: ./.github/workflows/pilot-reusable.yml
    permissions:
      contents: read
      packages: write
      # The shared reusable requests it (live progress of eval); a caller must grant at least as much.
      issues: write
    with:
      env: ${{ inputs.env }}
      command: deploy
      sha: ${{ inputs.sha }}
      confirm: ${{ inputs.confirm }}
      llm_daily_cap_rub: ${{ inputs.llm_daily_cap_rub }}
      build_pipeline: ${{ inputs.build_pipeline }}
      pipeline_orgs: ${{ inputs.pipeline_orgs }}
      stock_mode: ${{ inputs.stock_mode }}
    secrets: inherit
