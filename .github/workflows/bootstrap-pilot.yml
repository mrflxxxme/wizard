# One button for the pilot (docs/ops/deploy.md «Пилот: одна кнопка»): creates — or brings back after the loss of the VM
# — the whole environment on Timeweb Cloud from GitHub-hosted runners: state bucket and keys, encrypted secrets bundle,
# VM, k3s, addons, Secrets, release, founder access. Idempotent: running it again changes only what is missing.
# Only the repository owner, only from main; prod needs the word PROD. staging can also be destroyed here.
# action `check` (the default) is a read-only preflight of the secrets and variables (tools/deploy/preflight.mjs):
# no images, no OpenTofu, no PROD word; about two Actions minutes. Run it first, then apply.
# action `eval` — the measurement (docs/ops/eval-d76.md; threshold d76 of beta v2 by default, d67 — docs/ops/eval-d67.md):
# a service account in the platform database, the briefs through the public address like a client, the report (with
# the screenshots of the systems under d76) in the job summary and as an artifact; needs the word PROD.
name: bootstrap-pilot

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Окружение"
        type: choice
        options: [prod, staging]
        default: prod
      action:
        description: "check — проверить настройки (ничего не меняет); apply — создать/обновить/восстановить; diagnose — состояние кластера, сертификатов и DNS за 3–5 минут (ничего не меняет); eval — замер: брифы через настоящую сборку на сервере, отчёт со скриншотами в итогах запуска (PROD, тратит бюджет моделей); reboot — жёсткая перезагрузка зависшего сервера (PROD); destroy — удалить (только staging)"
        type: choice
        options: [check, apply, diagnose, eval, reboot, destroy]
        default: check
      sha:
        description: "Полный SHA коммита main (пусто — последний коммит main)"
        type: string
        default: ""
      location:
        description: "Регион сервера: auto — переменная WIZARD_TIMEWEB_LOCATION или Москва; ru-1 — Санкт-Петербург; ru-3 — Москва"
        type: choice
        options: [auto, ru-3, ru-1]
        default: auto
      server:
        description: "Готовый сервер Timeweb (IP или id), если он отдан под пилот: один раз переустанавливается под k3s; пусто — сервер из прошлого запуска или новый"
        type: string
        default: ""
      briefs:
        description: "eval: какие брифы прогнать — all (все 10) или id через запятую: проба — 2–3 брифа, например mvp-01,mvp-04,mvp-07; повтор провалившихся"
        type: string
        default: "all"
      max_cost_rub:
        description: "eval: бюджет замера на модели, ₽ (d76: при превышении замер останавливается; проба — 50, замер — 300)"
        type: string
        default: "300"
      threshold:
        description: "eval: порог — d76 (бета v2: план, сценарии целей, скриншоты) или d67 (замер MVP)"
        type: choice
        options: [d76, d67]
        default: d76
      confirm:
        description: "Для prod (apply, eval, reboot) введите PROD; для check и diagnose не нужно"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pilot-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  pilot:
    uses: ./.github/workflows/pilot-reusable.yml
    permissions:
      contents: read
      packages: write
      # eval: live progress of the measurement in the issue «Замер D67: ход на сервере» (tools/eval/server/progress.mjs).
      issues: write
    with:
      env: ${{ inputs.env }}
      command: ${{ inputs.action == 'apply' && 'bootstrap' || inputs.action }}
      sha: ${{ inputs.sha }}
      confirm: ${{ inputs.confirm }}
      location: ${{ inputs.location != 'auto' && inputs.location || '' }}
      server: ${{ inputs.server }}
      briefs: ${{ inputs.briefs }}
      max_cost_rub: ${{ inputs.max_cost_rub }}
      threshold: ${{ inputs.threshold }}
    secrets: inherit
