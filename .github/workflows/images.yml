# M2-06 (deploy.yaml#cloud.ci_cd, L3-38): every image of infra/docker/images.json builds from the repo, gets a
# CycloneDX SBOM (syft via anchore/sbom-action, Apache-2.0) as an artifact. Pilot (platform/deploy.yaml#pilot): pushes
# of main go to GHCR of this repository (ghcr.io/<owner>/<image>:<sha>, private packages, the job's GITHUB_TOKEN with
# packages: write) when vars.WIZARD_IMAGES_GHCR == 'enabled' or the pilot is configured (repository variable
# WIZARD_PLATFORM_DOMAIN); pilot-reusable.yml calls this workflow with ghcr: true for the SHA it releases, and an image
# already in GHCR is not rebuilt. The pilot VM pulls with the release job's token (docs/ops/deploy.md «Пилот»).
# Beta: images are pushed by the deploy workflows on the self-hosted runner; the registry push step below is a
# bootstrap option only (registry credentials as repository secrets).
name: images

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "Commit to build (default: the caller's SHA)"
        type: string
        default: ""
      ghcr:
        description: "Push to GHCR of the repository (images already there are skipped)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # In a call github.workflow is the caller's name: the pilot never cancels (nor is cancelled by) a push's run.
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'images' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.m.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - id: m
        run: echo "names=$(node -p 'JSON.stringify(require("./infra/docker/images.json").images.map((i) => i.name))')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.names) }}
    env:
      TAG: ${{ inputs.sha || github.sha }}
      IMAGE: ${{ matrix.image }}
      REGISTRY: ${{ vars.WIZARD_REGISTRY_STAGING }}
      REGISTRY_USER: ${{ secrets.CLOUDRU_REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.CLOUDRU_REGISTRY_PASSWORD }}
      GHCR: ${{ (inputs.ghcr || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.WIZARD_IMAGES_GHCR == 'enabled' || vars.WIZARD_PLATFORM_DOMAIN != ''))) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Already in GHCR?
        id: have
        if: env.GHCR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "ghcr.io/$owner/$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=images::$IMAGE:$TAG уже в GHCR — сборка пропущена."
          fi
      - uses: actions/setup-node@v4
        if: steps.have.outputs.exists != 'true'
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.exists != 'true'
      - name: Build
        if: steps.have.outputs.exists != 'true'
        run: node tools/deploy/images.mjs build --only "$IMAGE" --tag "$TAG"
      - name: SBOM (CycloneDX)
        if: steps.have.outputs.exists != 'true'
        uses: anchore/sbom-action@v0
        with:
          image: wizard.local/${{ matrix.image }}:${{ env.TAG }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        if: steps.have.outputs.exists != 'true'
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90
      - name: Push (only with registry credentials)
        if: github.event_name == 'push' && env.REGISTRY != '' && env.REGISTRY_PASSWORD != ''
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          node tools/deploy/images.mjs build --only "$IMAGE" --registry "$REGISTRY" --tag "$TAG" --push
          docker logout "$REGISTRY"
      - name: Push to GHCR (pilot)
        if: env.GHCR == 'true' && steps.have.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node tools/deploy/images.mjs build --only "$IMAGE" --registry "ghcr.io/$owner" --tag "$TAG" --push
          docker logout ghcr.io
      - name: No push
        if: ${{ !(github.event_name == 'push' && env.REGISTRY != '' && env.REGISTRY_PASSWORD != '') && env.GHCR != 'true' }}
        run: echo "::notice title=images::$IMAGE собран без публикации (нет реестра Cloud.ru или это PR)."
