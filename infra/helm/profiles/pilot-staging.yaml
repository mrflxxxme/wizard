# Pilot staging on demand: the same stack on a smaller VM (2 vCPU / 4 GB, Timeweb Cloud MSK 50), synthetic data and
# fixture LLM only. Smaller database buffers, one sandbox pod, a shorter base-backup/drill cadence is not needed:
# staging is destroyed after use (its buckets go with it).
postgres:
  storageSize: 10Gi
  parameters:
    listen_addresses: "*"
    max_connections: "50"
    shared_buffers: 128MB
    effective_cache_size: 512MB
    work_mem: 4MB
    maintenance_work_mem: 64MB
    max_wal_size: 512MB
    min_wal_size: 128MB
    wal_compression: zstd
    checkpoint_timeout: 15min
    password_encryption: scram-sha-256
    log_min_messages: warning
    log_checkpoints: "off"
  drill:
    scratchSize: 5Gi
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
worker:
  resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "2", memory: 1Gi } }
data:
  size: 5Gi
sandbox:
  # one runtime sandbox pod, the G1 pod and one replacement in flight (512Mi each, profiles/pilot.yaml)
  maxPods: 1
  quota: { pods: 3, requestsCpu: 750m, requestsMemory: 1536Mi, limitsCpu: 3, limitsMemory: 1536Mi }
# V3-32: no repository sandbox on the 4 GB staging VM (its phase pod needs 1.5 GiB next to the release); JS repositories
# stay «не проверено» there, Wizard systems are checked by the gates in process.
repoSandbox:
  enabled: false
