# Profile pilot (platform/deploy.yaml#pilot; docs/ops/deploy.md «Пилот»): ONE VM with single-node k3s carries
# everything — platform-api, worker, runtime, platform-web, egress-proxy, PgBouncer, PostgreSQL 16 with WAL-G, the
# DNS-01 solver, Traefik, cert-manager, the gVisor RuntimeClass and the sandbox pool, a small metrics/logs stack.
# Layers on top of profiles/k3s.yaml (tools/deploy/infra.mjs PROFILES): values → provider → k3s → pilot →
# values-<env> → pilot-<env>. Requests/limits come from the memory measured on the dev stand (docs/ops/deploy.md
# «Пилот: замер»): requests ≈ measured idle-to-typical RSS, limits ≈ 2× the peak during a build + G1.
# Images: GHCR of the repository (built by .github/workflows/images.yml on GitHub-hosted runners), pulled with the
# docker-registry Secret wizard-ghcr; no in-cluster registry.
images:
  pullSecret: wizard-ghcr
# D24_pilot_free (platform/deploy.yaml#pilot.env): invite-only registration, payments off, LLM cap 6 000 ₽/month.
config:
  registration: invite
  payments: "off"
  llmMonthlyCapRub: 6000
  founderReview: "on"
postgres:
  inCluster: true
  storageSize: 30Gi
dataBackup:
  enabled: true
pgbouncer:
  replicas: 1
  defaultPoolSize: 10
  maxClientConn: 200
  serverTlsSslmode: disable
  resources: { requests: { cpu: 20m, memory: 16Mi }, limits: { cpu: 500m, memory: 64Mi } }
platformApi:
  replicas: 1
  # measured: 300 MiB idle, 356 MiB peak (tsx compiles on start)
  resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { cpu: "2", memory: 768Mi } }
worker:
  replicas: 1
  # Recreate, not RollingUpdate: the sandbox orchestrators (G1 here, runtime below) own their pods per process —
  # during a rolling update the old process's watchdog re-creates pods the new one just reconciled away, and they leak
  # into the namespace quota (found by the local rehearsal). A few seconds without builds/functions per deploy.
  strategy: { type: Recreate }
  # measured: 312 MiB idle, 565 MiB peak during a build + G1 (≈ +250 MiB per concurrent build)
  resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "3", memory: 1536Mi } }
runtime:
  replicas: 1
  strategy: { type: Recreate }
  # measured: 132 MiB idle, 185 MiB peak (preview + published system)
  resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "2", memory: 512Mi } }
platformWeb:
  replicas: 1
  resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { cpu: 250m, memory: 96Mi } }
egressProxy:
  replicas: 1
  resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
data:
  size: 20Gi
sandbox:
  # M2-18: the runtime runs system functions in workerd pods under gVisor on this node (runsc from cloud-init).
  # A pod = up to sandbox.systems systems, 512Mi; quota: two runtime pods, the G1 pod of a running build (M2-19)
  # and one replacement in flight (a new revision starts its pod before the old one is removed).
  orchestrate: true
  maxPods: 2
  memoryLimit: 512Mi
  cpuLimit: "1"
  quota: { pods: 4, requestsCpu: 1, requestsMemory: 2Gi, limitsCpu: 4, limitsMemory: 2Gi }
