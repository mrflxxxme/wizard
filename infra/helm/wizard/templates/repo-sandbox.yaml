{{- if .Values.repoSandbox.enabled }}
# V3-32: the repository sandbox (apps/platform-api/src/repo-agent/pod-sandbox.ts). platform-api's identity may manage
# the phase pods, read their logs and keep the workspace's ConfigMaps and PVC — in the sandbox namespace only; no
# Secrets, no exec/attach/portforward, no other namespace. PodSecurity restricted of that namespace still applies to
# every pod it creates (infra/k8s/namespaces.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wizard-repo-agent
  namespace: {{ .Values.namespaces.platform }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wizard-repo-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims]
    verbs: [list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wizard-repo-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wizard-repo-sandbox
subjects:
  - { kind: ServiceAccount, name: wizard-repo-agent, namespace: {{ .Values.namespaces.platform }} }
---
# Generated from apps/platform-api repoSandboxNetworkPolicy() (tools/deploy/test/helm.test.ts keeps it in sync):
# install → only the egress proxy; build, tests and the agent → no network; no ingress.
{{ tpl (.Files.Get "generated/repo-sandbox-networkpolicy.json") . }}
{{- end }}
