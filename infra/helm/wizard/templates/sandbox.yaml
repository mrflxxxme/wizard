{{- if .Values.sandbox.runtimeClass.create }}
# gVisor RuntimeClass of the sandbox pool (isolation.yaml#M2): created only when the cluster's
# sandbox nodes have runsc as a containerd handler. Pods of apps/runtime sandboxPod() select it by name.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels: {{- include "wizard.labels" . | nindent 4 }}
handler: {{ .Values.sandbox.runtimeClass.handler }}
scheduling:
  nodeSelector:
    wizard.ru/sandbox-node: "true"
  tolerations:
    - { key: wizard.ru/sandbox, operator: Exists, effect: NoSchedule }
{{- end }}
---
# Quotas of the sandbox namespace (deploy.yaml#runtime_limits: pod quotas here, call limits in runtime.yaml).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: wizard-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
spec:
  hard:
    pods: {{ .Values.sandbox.quota.pods | quote }}
    requests.cpu: {{ .Values.sandbox.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.sandbox.quota.requestsMemory }}
    limits.cpu: {{ .Values.sandbox.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.sandbox.quota.limitsMemory }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: wizard-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
spec:
  limits:
    - type: Container
      default: { cpu: "1", memory: 1536Mi }
      defaultRequest: { cpu: 250m, memory: 1536Mi }
      max: { cpu: "2", memory: 2Gi }
{{- if .Values.sandbox.orchestrate }}
---
# M2-18: the runtime's identity for the sandbox orchestrator. It may manage pods and ConfigMaps of the sandbox
# namespace and nothing else (no Secrets, no other namespace, no exec/attach/portforward).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wizard-runtime
  namespace: {{ .Values.namespaces.platform }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wizard-runtime-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, configmaps]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wizard-runtime-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wizard-runtime-sandbox
subjects:
  - { kind: ServiceAccount, name: wizard-runtime, namespace: {{ .Values.namespaces.platform }} }
{{- end }}
