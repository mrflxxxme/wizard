{{- $ns := .Values.namespaces.platform }}
{{- $mw := include "wizard.middlewares" . }}
# Public entry (Traefik, MIT): platform host → web + /api; systems domain (wildcard) → runtime public port only.
# /_wizard/internal/* is not routable: the public runtime port answers 404 for it (L3-19), the internal port has no
# Ingress. HSTS max-age ≥ 1 year, includeSubDomains, preload on prod (abuse.yaml#domain.psl, L3-14).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wizard-hsts
  namespace: {{ $ns }}
spec:
  headers:
    stsSeconds: {{ .Values.hsts.maxAge }}
    stsIncludeSubdomains: true
    stsPreload: {{ .Values.hsts.preload }}
    forceSTSHeader: true
    browserXssFilter: false
    contentTypeNosniff: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wizard-platform
  namespace: {{ $ns }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.domains.platform | quote }}]
      secretName: wizard-platform-tls
  rules:
    - host: {{ .Values.domains.platform | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: wizard-platform-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: wizard-platform-web, port: { name: http } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wizard-systems
  namespace: {{ $ns }}
  labels: {{- include "wizard.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ printf "*.%s" .Values.domains.systems | quote }}, {{ .Values.domains.systems | quote }}]
      secretName: wizard-systems-tls
  rules:
    - host: {{ printf "*.%s" .Values.domains.systems | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: wizard-runtime, port: { name: public } }
    # The apex serves no system (the runtime answers 421) but must carry HSTS over HTTPS for the preload list.
    - host: {{ .Values.domains.systems | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: wizard-runtime, port: { name: public } }
