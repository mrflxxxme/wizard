# Кредиты, тарифы, ledger, платежи. Источник цифр: product.yaml#decisions.D10_pricing (приоритет выше этого файла).
version: 1

credit:
  rub_cost_rate: 5                 # 1 кредит ≈ 5 ₽ себестоимости LLM (с НДС агента, по прайсу agents/models.yaml)
  unit: "милликредит (1 кредит = 1000) во всех расчётах и в БД; в API — кредиты числом с точностью 0.001 (= милликредит, без округления); округление до 0.1 — только при показе в UI (L1-16)"
  from_cost: "credits_milli = ceil(cost_rub × 1000 / rub_cost_rate) для каждой строки llm_calls с billable=true"
  typical: { build_create: "≈20 кредитов (потолок из карточки)", change: "3–6 кредитов", interview_turn: "0.1–1 кредит" }
  test: "M1-03: для любого завершённого прогона sum(charge по run_id) = min(cap, sum(llm_calls.credits_milli по run_id, billable)) с точностью до 1 милликредита"

plans:
  free:
    price_rub_month: 0
    grants: { welcome: { credits: 100, expires_after_days: 30 }, monthly: { credits: 25, from_day: 30, expires: "в момент следующего месячного гранта (не копятся)" } }
    limits: { prod_systems: 1, draft_systems: 3, members: 3 }
    login_methods: [email_otp, telegram]      # F4: вход по телефону (SMS) в созданных системах — только на платных тарифах
    prod_requires: "привязанная карта РФ (D9, card_binding)"
    inactive_drafts: "F5 (утверждено по рекомендации, основатель может пересмотреть): черновик Free без активности 60 дней (systems.last_activity_at) → уведомление за 7 дней, затем удаляется ТОЛЬКО схема draft с тестовыми данными; спека, код, ревизии и prod сохраняются (workflows.yaml#retention_cron)"
  pilot:   # D24_pilot_free: бесплатный пилот по приглашению основателя
    price_rub_month: 0
    assigned_by: "основатель (CLI платформы); самостоятельно выбрать нельзя"
    grants: { manual: "кредиты начисляет основатель CLI (ledger bucket topup с reason=pilot_grant, срок 365 дней)" }
    limits: { prod_systems: 5, draft_systems: 30, members: 30 }
    login_methods: [email_otp, telegram]      # SMS не подключаем на пилоте (расходы); phone_otp — после пилота на платных тарифах
    prod_requires: "приглашение основателя (идентификация вместо привязки карты на пилоте); CARD_BINDING_REQUIRED не применяется"
    payments: "WIZARD_PAYMENTS=off: покупка, подписки и привязка карты скрыты в UI (по Org.paymentsEnabled / Billing.paymentsEnabled) и отвечают 403 PAYMENTS_DISABLED"
    cli: "pnpm --filter @wizard/platform-api pilot invite|invites|revoke|plan|grant|orgs|spend|readiness|review-required (apps/platform-api/src/pilot/cli.ts); plan <orgId> pilot|free отказывает при активной подписке"
    new_orgs: "M2-09: в режиме WIZARD_REGISTRATION=invite новая org владельца пилотной org создаётся с plan=pilot без кредитов (их начисляет основатель) и require_founder_review=true; остальным создание org на пилоте закрыто (403 FORBIDDEN). В режиме open — Free, как в M1"
    topup: "докупки на pilot нет и при WIZARD_PAYMENTS=on (topup.available_on; createTopup → 403 FORBIDDEN, блок «Докупить» скрыт); смена тарифа на start/business при включённой оплате — обычная подписка"
  start:
    price_rub_month: 1990
    grants: { monthly: { credits: 50, expires: "конец периода подписки" } }
    limits: { prod_systems: 2, draft_systems: 10, members: 10 }
    login_methods: [email_otp, telegram, phone_otp]
  business:
    price_rub_month: 6990
    grants: { monthly: { credits: 230, expires: "конец периода подписки" } }
    limits: { prod_systems: 5, draft_systems: 30, members: 30 }
    login_methods: [email_otp, telegram, phone_otp]
  topup:
    price_rub: 990
    credits: 60
    expires_after_days: 365
    available_on: [free, start, business]
  sms:     # F4, L4-06, L3-25
    who_pays: "SMS для входа по телефону оплачивает платформа в пределах тарифа start/business; кредиты не списываются"
    daily_budget_per_org: { start: 100, business: 300 }   # защитный лимит от SMS-pumping (решение агента, основатель может пересмотреть); превышение → OTP_BUDGET_EXCEEDED (runtime.yaml#auth.anti_abuse) и уведомление владельцу
    downgrade: "При переходе на free phone_otp отключается у всех систем org со следующего запроса (registry.features.phoneOtp=false); уже вошедшие пользователи сохраняют сессии; на странице входа остаются email и Telegram"
    enforcement: "Публикация Free-системы с phone_otp в loginMethods → блокер PHONE_LOGIN_PLAN_REQUIRED (workflows.yaml#workflows.publish, api.yaml publishBlockers). В prod runtime отказывает в phone_otp при features.phoneOtp=false с русским сообщением (runtime.yaml#auth.methods_M1.phone_otp); draft-превью показывает метод с пометкой о тарифе. Эталонные примеры и оркестратор по умолчанию используют email_otp + telegram"
  interpretation:
    - "Утверждено основателем пакетом (F5, по рекомендации L4 Q4; может пересмотреть): пункты ниже, плюс plans.free.inactive_drafts"
    - "«N систем» тарифа = одновременно опубликованные в prod системы; черновики ограничены draft_systems"
    - "«до N пользователей» = участники организации (memberships). Конечные пользователи созданных систем не ограничиваются тарифом"
    - "Лимит members у Free (3) и draft_systems — толкование D10 (F5); менять через CHANGELOG"
  enforcement:
    - "Превышение лимита → 402 PLAN_LIMIT с details {limit, current, plan}; проверка в транзакции создания (createSystem, createInvite, publish)"
    - "Даунгрейд: лишние prod-системы остаются live 14 дней, уведомления владельцу за 7 и 1 день, затем снимаются с публикации (данные не удаляются)"

ledger:
  table: platform.credit_ledger
  rules:
    - "MUST: append-only; UPDATE/DELETE запрещены триггером (тест: попытка UPDATE → ошибка)"
    - "MUST: каждая запись имеет idempotency_key, уникальный в пределах org; повтор операции не создаёт вторую запись"
    - "MUST: изменения баланса org сериализуются pg_advisory_xact_lock(hashtext(org_id::text))"
    - "MUST: available = sum(amount_milli) ≥ 0 после любой записи hold/charge; иначе операция отклоняется INSUFFICIENT_CREDITS"
    - "Списание идёт из корзин с ближайшим bucket_expires_at (free_welcome/plan_monthly раньше topup); распределение по корзинам — в note, баланс корзин считается view platform.credit_buckets"
    - "Истечение корзины → запись expire на остаток корзины (credits_cron)"
  kinds:
    grant: "+ начисление тарифа, приветственный, докупка"
    hold: "− резерв на cap при старте прогона build/publish-free"
    release: "+ снятие резерва (всегда = hold по модулю) при завершении прогона"
    charge: "− фактическое списание"
    refund: "+ возврат списания"
    expire: "− сгорание корзины"
    adjustment: "± ручная корректировка staff (M1: единственный способ начислить платный тариф/докупку до M2)"

run_charging:
  interview_turn: "без hold; после хода — charge по факту (cap хода 2 кредита). При available ≤ 0 → 402 INSUFFICIENT_CREDITS на POST messages/answers"
  build:
    approve: "cap = card.cap.credits (формула — agents/orchestrator.yaml#estimation; пользователь может только понизить, не ниже ceil(estimate.credits.expected)). available < cap → 402 INSUFFICIENT_CREDITS {available, required: cap}; UI предлагает «Докупить» или понизить cap"
    start: "hold(−cap), idempotency hold:<runId>"
    finish: "одной транзакцией: release(+cap), charge(−min(used, cap)); перерасход сверх cap платформа берёт на себя"
    raise_cap: "needs_input budget → raise_cap_N: дополнительный hold(−N); отказ по available → вариант недоступен"
    refunds: "MUST: полный refund, если прогон завершён failed с code ∈ {INTERNAL, WORKER_RESTARTED, LLM_UNAVAILABLE, MIGRATION_FAILED} ИЛИ если ни одна ревизия прогона не прошла G0 (пользователь ничего не получил). Решение агента для беты, записать в CHANGELOG"
  estimate_vs_actual: "Карточка показывает estimate.credits {min, expected, max} и cap; отчёт прогона — фактическое used. SHOULD: медиана |used − expected|/expected ≤ 30% на eval-брифах (калибровка — orchestrator.yaml#estimation.calibration)"
  import_table: "hold(−15 кр., потолок импорта) в транзакции createImport, idempotency hold:<runId>; finish — как build: release, charge(−min(used, 15 кр.)); refund по кодам refunds. available < 15 → 402 INSUFFICIENT_CREDITS"
  style_and_compliance: "Панель «Стиль», setCompliance, rollback, publish — без LLM и без кредитов"
  runtime_ai: "M3: вызовы runtime_ai_* (только T0) списываются по факту: charge агрегируется по (system, час) с ключом ai:<systemId>:<yyyy-mm-ddThh>; лимит aiAction.monthlyLimit в вызовах на систему; при available ≤ 0 действие возвращает системе ошибку AI_CREDITS_EXHAUSTED, владельцу — уведомление"
  M0: "Ledger нет: runs.credits_used_milli считается из llm_calls; cap из карточки останавливает прогон (budget_exceeded)"

credits_cron:
  milestone: M1
  schedule: "DBOS scheduled, ежечасно"
  does: ["месячные гранты Free/тарифов по годовщине org/периода (idempotency grant:<bucket>:<org>:<period>)", "expire истёкших корзин", "уведомление владельцу при available < 10% месячного гранта"]

card_binding:
  milestone: M2
  purpose: "Идентификация клиента перед prod (D9; 149-ФЗ ст. 10.2-1 / ПП 2011 — позиция юриста E-LEGAL) + способ оплаты"
  flow:
    - "POST /orgs/:id/billing/card-binding → платёж 1 ₽ в магазине ПЛАТФОРМЫ: capture=false, save_payment_method=true, confirmation redirect"
    - "Вебхук payment.waiting_for_capture → GET /v3/payments/{id}; проверить payment_method.saved=true и payment_method.card.issuer_country = 'RU'"
    - "RU → payment_methods (last4, card_type, issuer_country), затем cancel платежа (деньги не списываются)"
    - "Не RU → cancel, payment_methods не создаётся, пользователю: «Нужна карта российского банка» (code CARD_NOT_RU)"
  anti_carding:   # L3-28
    - "MUST: ≤ 3 попыток привязки на org в сутки и ≤ 10 на IP клиента (deploy.yaml#cloud.client_ip); превышение → 429 RATE_LIMITED"
    - "MUST: одна карта (first6 + last4 + срок) — не более чем в 3 org; четвёртая → CARD_BINDING_REJECTED без раскрытия причины"
    - "MUST: 3-DS обязателен (confirmation redirect); привязка без 3-DS не принимается"
    - "Достаточность привязки как идентификации по ПП 2011 — E-LEGAL"
  implementation: "M2-07: предусловие включено при WIZARD_MILESTONE ≥ M2 или NODE_ENV=production (cardBindingRequired; иначе публикации M1, e2e и стенды без магазина не требуют карты). Платёж 1 ₽ с capture=false и save_payment_method; вебхук waiting_for_capture → GET → проверки по порядку: payment_method.saved, issuer_country = RU (CARD_NOT_RU), three_d_secure.applied, отпечаток карты (db.yaml#payment_methods.card_fingerprint) не встречается в ≥ 3 других org (включая отозванные) → иначе CARD_BINDING_REJECTED; затем всегда отмена платежа (ключ cancel:<paymentId>). Успех отзывает прежние карты org и переводит подписку на новую карту. Исход — payments.meta.result → api.yaml#Billing.cardBinding; return_url — /billing?payment=<id>"
  test: "M2-07: публикация без payment_methods (revoked_at is null) → 403 CARD_BINDING_REQUIRED; тестовый магазин с картой issuer_country≠RU → привязка отклонена; 4-я попытка привязки за сутки → 429"

recurring:
  milestone: M2
  provider: "ЮKassa, магазин самой платформы (не путать с магазинами клиентов — connectors/yookassa.yaml; смешивать MUST NOT)"
  first_payment: "платёж на цену тарифа с save_payment_method=true (или по уже привязанной карте)"
  renewal: "за 24 ч до current_period_end — письмо-уведомление (ежечасный проход, окно (now+23 ч, now+24 ч], отметки отправки нет); в момент окончания — платёж по payment_method_id с Idempotence-Key renew:<org>:<period>; повторы — renew:<org>:<period>:2 и :3 (каждая попытка — новый платёж). Период — календарный месяц (addMonth с усечением дня); грант plan_monthly с ключом grant:plan_monthly:<org>:<начало периода> до конца периода"
  retries: "3 попытки: день 0, +1, +3 (тариф сохраняется, новых кредитов нет); 4xx API или нет карты — неудачная попытка, неизвестный результат — платёж остаётся pending и повторяется с тем же ключом; затем status=past_due; через 7 дней past_due (end + 10 дней) → cancelled и plan=free (см. plans.enforcement)"
  plan_change: "subscriptions.plan — тариф следующего периода, текущий — orgs.plan. Тот же тариф — возобновить автоплатёж; дешевле — с продления (Billing.nextPlan); дороже — платёж сразу по привязанной карте за полную цену, новый период с текущего момента, кредиты старого периода живут до своего срока; без активной подписки — первый платёж (M2-07)"
  cancel: "DELETE subscription: автоплатёж выключается сразу (cancel_at_period_end, next_charge_at = null), тариф действует до конца периода; past_due при DELETE заканчивается сразу и переводит org на free"
  schedule: "DBOS scheduled wizard.billing_cron (apps/worker, `13 * * * *`): шаги billing_remind, billing_end, billing_due, renew:<org> на каждое продление, billing_reconcile (GET платежей pending/waiting_for_capture старше 10 мин и моложе 3 дней — страховка от потерянных уведомлений). Без DBOS (inprocess) — тот же проход по таймеру credits_cron"
  receipts: "54-ФЗ: объект receipt в каждом платеже («Чеки от ЮKassa»); email покупателя = email owner; vat_code из конфигурации WIZARD_RECEIPT_VAT_CODE (задаёт юрист/бухгалтер)"
  webhook: "только после сверки GET /v3/payments/{id}; обработка идемпотентна по provider_payment_id; тест: двойная доставка succeeded → один grant"
  topup: "payments kind=topup, succeeded → grant(+60×packs) bucket topup, idempotency topup:<paymentId>; с привязанной картой — списание сразу по payment_method_id (confirmationUrl = null), без карты — страница ЮKassa без сохранения карты"
  not_done: "Снятие лишних prod-систем через 14 дней после даунгрейда и отключение phone_otp при переходе на free (plans.enforcement, sms.downgrade), возвраты платежей платформы — не реализованы (M2-07)"

tax_note:
  status: "PENDING — E-LEGAL"
  text: >
    Аудит 03 (L4.1): при включении в реестр ПО передача прав освобождена от НДС, хостинг — нет. Поэтому цена тарифа
    SHOULD раскладываться в чеке на две позиции: «право использования ПО Wizard» и «услуги хостинга систем».
    Доли и ставки НДС (УСН/ОСН, 22%) определяет юрист/бухгалтер. До решения — одна позиция «Подписка Wizard»,
    ставка из WIZARD_RECEIPT_VAT_CODE. Код MUST поддерживать 1..2 позиции чека без изменения схемы БД.
