# Прогоны: жизненный цикл, воркфлоу, события. Нормативно для apps/platform-api (M0) и apps/worker (M1+).
# M0: in-process очередь внутри platform-api. M1: DBOS Transact (D6) с ТЕМИ ЖЕ границами шагов.
version: 1

execution:
  M0:
    engine: "in-process очередь (apps/platform-api/src/runs/queue.ts): FIFO, глобальная конкурентность WIZARD_RUN_CONCURRENCY (по умолчанию 2)"
    step_api: "Воркфлоу пишутся через обёртку runStep(ctx, name, fn) и runTransaction(ctx, name, fn) с сигнатурами, совместимыми с DBOS.runStep / DBOS.runTransaction, чтобы M1-01 был заменой реализации, а не переписыванием"
    restart: "MUST: при старте процесса все прогоны в status ∉ терминальных переводятся в failed с code WORKER_RESTARTED и событием run_failed (durability в M0 не обещана)"
  M1:
    engine: "@dbos-inc/dbos-sdk в apps/worker; platform-api только ставит воркфлоу в очередь (DBOS.startWorkflow с workflowID = runs.id) и читает run_events"
    queues: { runs: "конкурентность WIZARD_RUN_CONCURRENCY (по умолчанию 8) на воркер", interview: "конкурентность 16; interview_turn одной системы — строго последовательно (ключ partition = system_id)" }
    durability: "Тест M1-01: kill -9 воркера во время шага build_code → после рестарта прогон продолжается со следующего незавершённого шага; ни один завершённый LLM-шаг не вызывается повторно (счётчик llm_calls по run_id не растёт на повторы)"
    dbos_data:   # L3-09
      - "MUST: значение секрета (provideRunInput.secretValue) пишется в хранилище секретов в HTTP-обработчике platform-api; в воркфлоу (DBOS.send/recv, входы шагов) уходит только secret://name"
      - "MUST: выход LLM-шага в DBOS — ссылки и метаданные (revision, messageId, toolCalls без аргументов-значений, usage), не текст ответа модели; содержимое — только в ревизиях и messages"
      - "MUST: очистка dbos.* (workflow_status, operation_outputs, notifications) для воркфлоу в терминальном статусе старше 30 дней — ежесуточно (retention_cron)"
  ownership: "Цикл «план → ops → код → гейт → QA → fix» реализует runBuild(host) в packages/agents (architecture.yaml#interfaces.agent_host); каждый LLM-вызов и гейт идёт через host.runStep (M0 — identity, M1 — DBOS.runStep). Этот файл задаёт только имена шагов, статусы, события и лимиты платформы (L2-14)"
  step_rules:
    - "MUST: каждый LLM-вызов — отдельный шаг; его результат (ответ модели и usage) мемоизируется (M1: DBOS step output по execution.M1.dbos_data; M0: в памяти)"
    - "MUST: каждый батч applyOps и каждая фиксация файлов — отдельная транзакция, создающая ревизию; идемпотентность по idempotency_key = <runId>:<stepName>:<attempt>"
    - "MUST: каждый запуск гейта — отдельный шаг; полный GateReport → INSERT platform.gate_reports (db.yaml) и событие gate_result в той же транзакции"
    - "MUST: перед каждым LLM-шагом проверка бюджета (budget) и cancel_requested_at"
    - "MUST: события пишутся в platform.run_events в той же транзакции, что и эффект шага, затем публикуются в in-process шину SSE"
    - "SHOULD: шаг идемпотентен; внешние эффекты (письма, ЮKassa) — только с ключом идемпотентности"

system_stage:                     # platform.systems.stage
  states: [interview, card, building, ready, failed]
  transitions:
    - { from: interview, to: card, on: "interview_turn выдал карточку" }
    - { from: card, to: card, on: "новое сообщение/ответ изменили карточку (card_version++)" }
    - { from: card, to: interview, on: "оркестратор задал новые вопросы" }
    - { from: card, to: building, on: "approveCard" }
    - { from: ready, to: card, on: "interview_turn выдал карточку kind=change" }
    - { from: card, to: ready, on: "отмена change-карточки при preview_revision ≠ null" }
    - { from: ready, to: building, on: "approve мини-карточки правки или POST /systems/:id/fix (build mode=fix)" }
    - { from: building, to: ready, on: "build завершился (succeeded) ИЛИ завершился неуспешно, но preview_revision не null" }
    - { from: building, to: failed, on: "build failed/cancelled и preview_revision = null" }
    - { from: failed, to: interview, on: "новое сообщение" }
  test: "Юнит-тест таблицы переходов: любой переход вне списка бросает IllegalTransition"

run_lifecycle:
  statuses: [queued, waiting_lock, running, needs_input, succeeded, failed, cancelled]
  terminal: [succeeded, failed, cancelled]
  transitions:
    - { from: queued, to: running, on: "взят исполнителем; для прогонов с lock — после захвата platform.locks" }
    - { from: queued, to: waiting_lock, on: "lock занят (событие lock_waiting)" }
    - { from: waiting_lock, to: running, on: "lock освобождён; порядок FIFO по created_at" }
    - { from: running, to: needs_input, on: "needs_input (secret или decision; бюджет и эскалация строителя — decision id=budget / id=escalation)" }
    - { from: needs_input, to: running, on: "POST /runs/:id/input" }
    - { from: needs_input, to: failed, on: "24 ч без ответа → INPUT_TIMEOUT" }
    - { from: running, to: succeeded, on: "последний шаг выполнен" }
    - { from: running, to: failed, on: "ошибка без восстановления" }
    - { from: "*non-terminal", to: cancelled, on: "cancel; running — на границе шага, текущий LLM-вызов прерывается AbortSignal" }
  locking:
    needs_lock: [build, publish, rollback, import_table]
    lease: "platform.locks.lease_until = now()+2 мин, heartbeat каждые 30 с; просроченный lock перехватывается"
    release: "MUST: при любом терминальном статусе в той же транзакции"
    style_during_lock: "POST /systems/:id/style при занятом lock → 409 SYSTEM_LOCKED (панель «Стиль» блокируется в UI)"
  budget:
    source: "runs.credits_cap_milli из карточки (M0 тоже; ledger — с M1, billing.yaml)"
    check: "перед LLM-шагом: used + upper_bound(call) > cap (формула upper_bound — agents/builder.yaml#budgets.credits_cap) → событие budget_exceeded, затем needs_input kind=decision id=budget с вариантами raise_cap_<N> (N = 25% от cap, округление вверх до целого кредита) и stop"
    stop: "Выбор stop → run_finished status=cancelled; ревизии прогона остаются, preview_revision не меняется, если G0 не пройден"
    test: "M0-13: fixture с искусственно низким cap → после budget_exceeded нет ни одной новой строки llm_calls до ответа"
  llm_unavailable: "Все T0-модели недоступны (agents/models.yaml#fallback_rules): M0 — сразу run_failed LLM_UNAVAILABLE retryable=true. M1 — шаг повторяется через 5 мин до 6 раз, статус остаётся running, событие step_started с attempt+1; затем run_failed LLM_UNAVAILABLE retryable=true. Отдельного статуса «пауза» нет (L1-14)"
  failure_codes: [BUDGET_STOPPED, CONSECUTIVE_ERRORS, GATES_FAILED, LLM_UNAVAILABLE, INPUT_TIMEOUT, WORKER_RESTARTED, LOCK_TIMEOUT, MIGRATION_FAILED, INSUFFICIENT_CREDITS, DESTRUCTIVE_IN_PROD, ROLLBACK_TARGET_INVALID, ORCH_INVALID_OUTPUT, SMOKE_FAILED, EXPORT_FAILED, INTERNAL]

workflows:
  interview_turn:
    milestone: M0
    lock: false
    trigger: "POST /systems, /systems/:id/messages, /systems/:id/answers"
    steps:
      - { name: load_context, kind: tx, does: "история чата (свёртка по бюджету — agents/orchestrator.yaml), текущая спека draft, pending_questions" }
      - { name: orchestrate, kind: llm, callType: "interview | card", does: "route() с orgPolicy; алгоритм и инструменты — agents/orchestrator.yaml (вопросы, карточка, ответ, классификация правки style_only | small_edit | big_change)" }
      - { name: persist_output, kind: tx, does: "messages, systems.pending_questions / card (+card_version) / stage; событие chat_output. Уведомление о ПДн (agents/orchestrator.yaml#pii_notice) — messages {role: system, kind: notice, payload: {type: 'pii', categories}} + chat_output {kind: notice, messageId}" }
      - { name: route_change, kind: tx, does: "style_only → сообщение со ссылкой на «Стиль», без прогона; small_edit/big_change → мини-карточка/карточка kind=change ждёт approve (D7: авто-старта нет)" }
    budget: "cap на ход — 2 кредита; превышение → run_failed BUDGET_STOPPED без needs_input"

  build:
    milestone: M0
    lock: true
    trigger: "approveCard (mode create|change) | POST /systems/:id/fix после failed или непройденного гейта (mode=fix; cap = max(3, ceil(0.25 × cap исходной карточки)), решение агента — CHANGELOG) | M3: approve мини-карточки «Укажи и измени» (mode=point_edit)"
    modes: { create: "полная сборка по карточке", change: "правка готовой системы", fix: "plan и ops пропускаются, старт с фазы fix по последним GateReport (platform.gate_reports)", point_edit: "M3: agents/builder.yaml#point_and_edit — правка только target.file" }
    steps:
      - { name: acquire_lock, kind: tx }
      - { name: reserve_credits, kind: tx, milestone: M1, does: "ledger hold на cap (billing.yaml#run_charging); нехватка → run_failed INSUFFICIENT_CREDITS" }
      - { name: draft_snapshot, kind: tx, milestone: M1, only_in_modes: [change], does: "только если prod_revision ≠ null и draft ещё не снят с этой prod-ревизии: копия строк app_<key>_prod → app_<key>_draft (≤ 1000 на сущность), значения полей pii≠none заменяются синтетикой faker-ru детерминированно по id; ПДн из prod в draft не попадают (L4-11). Тест M1-04: grep значений prod-ПДн в draft = 0" }
      - { name: plan, kind: llm, callType: plan, skip_in_modes: [fix], does: "план: список сущностей, страниц, функций, критериев приёмки (agents/builder.yaml); событие plan_ready" }
      - { name: ops, kind: "loop(llm build_ops → tx applyOps)", skip_in_modes: [fix], does: "батчи ≤50 ops; каждый батч = ревизия; OpsError возвращаются модели структурно; событие ops_applied" }
      - { name: code, kind: "loop(llm build_code → tx commit_files)", does: "write_file копит изменения в рабочем дереве прогона; commit_files в конце каждого LLM-шага = ревизия kind=files; событие file_written на файл" }
      - { name: gate_G0, kind: gate, does: "runGates('G0') (G0-BUILD-01 собирает бандл через packages/build — architecture.yaml#interfaces.build_system; результат переиспользуется в bundle_and_reload)" }
      - { name: migrate_draft, kind: tx, does: "при G0 passed: planMigration(spec(preview_revision) | null, spec, {env: 'draft'}) → toDDL + toRLS в app_<key>_draft под wizard_owner; destructive в draft допустим; при несовместимости типов — DROP SCHEMA … CASCADE и создание заново (M0)" }
      - { name: seed_draft, kind: tx, does: "только при создании схемы: gates.generateSeed(spec, sha256(systemKey)) (qa.yaml#seed) + пользователи dev-<role> для каждой роли; повторно не сидировать (L2-04)" }
      - { name: bundle_and_reload, kind: step, does: "packages/build writeArtifact: бандл G0 в раскладке runtime.yaml#system_loading.artifact_layout, revisions.bundle_key, systems.preview_revision; затем POST /_wizard/internal/reload {systemId: schema_key, env: draft}" }
      - { name: gate_G1, kind: gate, does: "runGates('G1') против runtime draft с seed-данными" }
      - { name: report, kind: tx, does: "messages kind=run_report, run_finished; M1: ledger charge по факту + release hold" }
    fix_loop:
      on: "gate_G0 или gate_G1 failed"
      steps:
        - { name: qa_explain, kind: llm, callType: qa_explain, does: "объяснение провалов для строителя (agents/qa.yaml)" }
        - { name: fix, kind: "loop(llm fix → tx applyOps/commit_files)" }
        - { name: regate, kind: gate, does: "повтор проваленного уровня и всех ниже" }
      limits: "≤ 3 итерации на уровень гейта; 5 ошибок подряд считаются по agents/builder.yaml#escalation.consecutive_failures. Порог → needs_input kind=decision id=escalation, options = builder.yaml#escalation.buttons (rephrase — с freeText); без ответа 24 ч → run_failed INPUT_TIMEOUT; rollback → run_finished status=cancelled; повторный порог после retry → run_failed CONSECUTIVE_ERRORS (ошибки инструментов) или GATES_FAILED (исчерпаны итерации гейта, с последними отчётами)"
    after_failure: "Ревизии остаются; preview_revision указывает на последнюю ревизию с G0=passed; пользователь может нажать «Исправить» (POST /systems/:id/fix, build mode=fix) или откатиться"

  publish:
    milestone: M1
    lock: true
    trigger: "POST /systems/:id/publish (только owner, D11)"
    preconditions:
      - "revision ≤ draft_revision и revisions.g0_passed = true"
      - "M1: operatorName и operatorContact заданы, если в спеке есть поле pii ≠ none (compliance.yaml#system_package.operator; иначе OPERATOR_NAME_REQUIRED / OPERATOR_CONTACT_REQUIRED)"
      - "M2: привязана карта РФ (billing.yaml#card_binding; проверка включена при WIZARD_MILESTONE ≥ M2 или NODE_ENV=production, 403 CARD_BINDING_REQUIRED после SYSTEM_SUSPENDED и до проверки ревизии); лимит prod-систем тарифа; founder review approved, если orgs.require_founder_review (M2-09; до этого ревью создаёт только warn G2-AF-08/09 — ниже); с M2 — compliance.operatorAddress (OPERATOR_ADDRESS_REQUIRED), operatorInn — по контрольной сумме (INN_INVALID)"
      - "M2: founder_reviews ревизии в статусе pending или rejected → 403 FOUNDER_REVIEW_PENDING (и в publishBlockers)"
      - "M2: systems.suspended_at → 422 SYSTEM_SUSPENDED; orgs.suspended_at → 403 ORG_SUSPENDED (security/abuse.yaml#takedown.flow; оба — и в publishBlockers)"
      - "M2-09: «новые формы сбора ПДн» (abuse.yaml#identification.founder_review) = в ревизии есть entity.field с pii ≠ none, которого нет в схеме prod (schema_hwm_revision); первая публикация = у системы нет ни одной publications.live_at"
      - "F4: phone_otp в loginMethods какой-либо роли у org с plan=free → PHONE_LOGIN_PLAN_REQUIRED («Вход по телефону доступен на тарифах Старт и Бизнес»); billing.yaml#plans.*.login_methods"
    steps:
      - { name: acquire_lock, kind: tx }
      - { name: plan_migration, kind: tx, does: "planMigration(spec(schema_hwm_revision) или пустая, spec(revision)); publications status=planned" }
      - { name: gate_G0_prod, kind: gate, does: "G0 с env=prod: additiveOnly обязателен, иначе DESTRUCTIVE_IN_PROD → run_failed" }
      - { name: gate_G1_prod, kind: gate, milestone: M2, does: "предусловие G2 (gates.yaml#G2.precondition): если в gate_reports нет пройденного G1 на публикуемой ревизии (типично — ревизия из setCompliance без сборки), G1 прогоняется здесь; провал → run_failed GATES_FAILED" }
      - { name: gate_G2, kind: gate, milestone: M2, does: "runGates('G2') включая антифрод (security/abuse.yaml); env=prod, slug, secretExists (без чтения значения), abuse {orgAgeDays, plan, abuseReportsPrev, brandAllowlist}. Включается при WIZARD_MILESTONE ≥ M2 или NODE_ENV=production (prodG2Required). Блокер → run_failed GATES_FAILED, prod не тронут; провал G2-AF-* → message_ru первой упавшей AF-проверки (abuse.yaml#messages_ru) и событие abuse_flag; warn G2-AF-08/09 → founder_reviews pending и run_failed GATES_FAILED с abuse.yaml#messages_ru.review; после approve повтор публикации снова прогоняет G0 и G2 (M2-04)" }
      - { name: founder_review, kind: step, milestone: M2, does: "M2-09: при WIZARD_FOUNDER_REVIEW=on и orgs.require_founder_review первая публикация системы и ревизия с новыми полями ПДн ставятся на ревью основателя (founder_reviews pending, одна строка на ревизию — общая с G2-AF-08/09); новый запрос → алерт founder_review_requested (один раз на ревизию, db.yaml#ops_alerts). pending → run_failed GATES_FAILED с текстом abuse.yaml#messages_ru.review, rejected → GATES_FAILED «Модератор не одобрил…»; после approve повторная публикация проходит" }
      - { name: telegram_webhook, kind: step, does: "для интеграций telegram с bot=own: getMe (проверка токена) и setWebhook на prod-хост (connectors/telegram.yaml#bot_api); WIZARD_CONNECTORS≠live — вызовы пишутся в outbox; ошибка → run_failed GATES_FAILED, prod не тронут" }
      - { name: apply_migration, kind: tx, does: "toDDL+toRLS в схеме app_<key>_prod одной транзакцией, SET LOCAL lock_timeout='3s'; до 3 повторов с паузой 5/15/45 с при lock_timeout; status=applying" }
      - { name: switch, kind: tx, does: "одной транзакцией: новая publication live, прежняя superseded, systems.prod_revision, systems.schema_hwm_revision = max(hwm, revision); после коммита POST /_wizard/internal/reload {systemId: schema_key, env: prod} (runtime.yaml)" }
      - { name: smoke, kind: step, does: "GET prod-URL → 200 и /_wizard/health (внутренний порт, runtime.yaml#service_endpoints) отдаёт revision; провал → автоматический rollback prod на prev_publication (без DDL) и run_failed SMOKE_FAILED" }
      - { name: report, kind: tx }
    invariant: "Если упали после apply_migration до switch — схема расширена аддитивно, старый бандл продолжает работать (тест M1-04)"

  rollback:
    milestone: M1
    lock: true
    draft: "Новая ревизия kind=revert: spec и files_manifest_sha = как у toRevision, ops=[]; затем gate_G0 → preview. Destructive-изменения схемы draft допустимы"
    prod: "toRevision MUST быть ранее live в publications этой системы, иначе ROLLBACK_TARGET_INVALID. Без DDL: новая publication с migration_plan {steps: [], additiveOnly: true}, schema_revision = текущий hwm. Runtime работает по спеке toRevision поверх схемы-надмножества"
    test: "M1-04 e2e: prod с данными → ревизия с новым полем → publish → rollback prod → строки и новая колонка на месте, старые экраны работают"

  import_table:
    milestone: M1
    lock: true
    steps:
      - { name: profile, kind: step, does: "локально: парсинг, профиль колонок, DLP заголовков (data-boundary.yaml#import); значения в LLM не идут" }
      - { name: map, kind: llm, callType: import_mapping, does: "только SyntheticPayload (заголовки после scrub, профили, ≤5 синтетических строк)" }
      - { name: confirm, kind: needs_input, does: "decision decisionId=import_confirm: пользователь правит маппинг и разметку ПДн (PUT /systems/:id/imports/:importId/mapping, экран S-import) и подтверждает (choice confirm | cancel)" }
      - { name: schema_ops, kind: "loop(llm build_ops → tx applyOps)", does: "если нужна новая сущность/поля" }
      - { name: load_rows, kind: tx, does: "вставка значений в app_<key>_draft пачками по 1000 без участия LLM; исходник удаляется по TTL 7 дней" }

  retention_cron:
    milestone: M2
    ownership: "Механика удаления/обезличивания строк — runtime.yaml#workflows.retention (ежесуточно 03:00 МСК, поллер _w_jobs runtime с M1). Этот воркфлоу — платформенная часть"
    schedule: "DBOS scheduled, ежедневно 03:30 MSK (после runtime-прохода)"
    does:
      - "Перенос строк _w_deletion_log схем app_<key>_{draft,prod} в platform.deletion_log (system, env, entity, mode, cutoff, rows_affected; одна транзакция на схему: DELETE … RETURNING системной ролью, затем вставка) — владелец видит журнал в настройках (GET /systems/:id/deletion-log); при строках mode=consent_revoked — письмо owner org (только счётчики)"
      - "Контроль: prod-публикация live|suspended со спекой с retention, у которой отметка прохода runtime (runtime.yaml#workflows.retention) старше 26 ч или её нет при live_at старше 26 ч → событие лога retention_overdue уровня error {systemId, env, reason: no_pass|stale_pass, count: часы, status: requested|unreachable} (deploy.yaml#cloud.observability.alerts) и строка-запрос __wizard_retention_request в _w_jobs (не дублируется)"
      - "Платформенная уборка: auth_otps > 24 ч, run_events > 180 дней, gate_reports > 180 дней (кроме последнего на уровень и систему), импорты после expires_at, exports после expires_at, abuse_reports.contact_email через 1 год после закрытия, dbos.* терминальных воркфлоу > 30 дней (execution.M1.dbos_data)"
      - "messages: text у role=user (kind=text) — scrub (packages/pii) через 180 дней после последней активности системы (db.yaml#messages.retention)"
      - "Free-черновики (F5, billing.yaml#plans.free.inactive_drafts): система org с plan=free без активности 60 дней → за 7 дней письмо владельцу; затем DROP SCHEMA app_<key>_draft CASCADE (только тестовые данные), systems.draft_data_purged_at = now(), запись deletion_log mode=draft_purged. Спека, код, ревизии и prod не трогаются; следующая сборка пересоздаёт схему через migrate_draft/seed_draft"
    test: "M2-05: фикстура со строками старше/младше порога → удалены ровно старые; deletion_log.rows_affected совпадает. F5: Free-система с активностью 61 день назад → схема draft удалена, revisions и files на месте"

  delete_system:   # L3-36
    milestone: M2
    schedule: "в составе retention_cron"
    does: "через 30 дней после systems.deleted_at: DROP SCHEMA app_<key>_draft и app_<key>_prod CASCADE, удаление артефактов (бандлы, блобы, на которые не ссылается другая система), messages, imports, exports, secrets_refs (+ значения в бэкенде секретов); запись deletion_log mode=system_deleted. Строку platform.runs не создаёт"
    test: "Система с deleted_at = now−31d → схем и сообщений нет, deletion_log содержит system_deleted"

  export_data:     # L1-34, L4-08, M2-10
    milestone: M2
    lock: false
    trigger: "POST /systems/:id/exports {env} (только owner)"
    steps:
      - { name: dump, kind: step, does: "потоково из app_<key>_<env> под ролью __system: CSV (UTF-8 с BOM, ;-разделитель) на каждую сущность + spec.json текущей ревизии; код в выгрузку не входит (non_goals). qr_token и hiddenFields «для всех» не выгружаются (connectors/qr.yaml)" }
      - { name: sanitize, kind: step, does: "MUST: ячейки, начинающиеся с = + - @ \\t \\r, экранируются префиксом ' (formula injection, L3-37)" }
      - { name: store, kind: tx, does: "ZIP в хранилище артефактов, platform.exports {status: ready, expires_at: now()+24 ч} (она же — журнал выгрузок: кто, когда, env, число скачиваний); событие run_finished" }
    download: "GET /systems/:id/exports/:exportId → одноразовая ссылка TTL 15 мин; архив удаляется после expires_at"
    test: "M2-10: выгрузка «форума» содержит CSV всех сущностей и spec.json; ячейка «=1+1» выгружена как «'=1+1»; повторное скачивание по той же ссылке → 410"

  credits_cron:
    milestone: M1
    schedule: "DBOS scheduled, ежечасно"
    does: "Гранты, сгорание корзин, уведомления о низком балансе — billing.yaml#credits_cron. Строку platform.runs не создаёт (служебный)"

  nightly_eval:
    milestone: M1
    schedule: "GitHub Actions eval-live.yml, раз в неделю (понедельник 02:17 MSK), только если заданы ключи live; объём и бюджет — quality/eval.yaml#live_cadence (D20_eval_budget: 5 брифов раз в неделю, full — по метке PR, ≤ 4 000 ₽/мес)"
    does: "tools/eval/run.mjs --harness на брифах без ПДн; результат в artifacts eval/<date>.json; регрессия доли G0/G1 > 5 п.п. к медиане 7 дней → уведомление в CI-канал (M1-10)"

events:
  envelope: "RunEvent {runId, seq, type, ts, payload} (api.yaml#/components/schemas/RunEvent); seq с 1 без пропусков"
  rules:
    - "MUST: payload не содержит значений секретов и содержимого промптов; тексты для пользователя — на русском"
    - "MUST: тест M0-15 валидирует каждое событие fixture-прогонов «форум» и «кондитерская» по схемам ниже (ajv)"
    - "Терминальные: run_finished, run_failed — ровно одно на прогон, последнее"
    - "internal: true — событие пишется в run_events (журнал, аудит), но в SSE пользователя не отдаётся (model_switched: модель и tier пользователю не показываются, agents/models.yaml); seq в SSE-потоке на месте внутренних событий пропускается"
    - "Этот раздел — источник истины имён и payload событий для всех агентов (L1-02). Имена из agents/builder.yaml, которых здесь нет, отображаются так: gate_finished → gate_result; budget_warning → budget_update (UI сам показывает предупреждение при used ≥ 0.8·cap); needs_user → needs_input kind=decision id=escalation; run_finished {version, humanDiff} → run_finished {resultRevision, summary_ru}, человеческий diff — в ops_applied.summary_ru. Других типов событий нет"
  types:
    run_started:     { required: [kind], properties: { kind: string, mode: string, baseRevision: "integer|null", credits: "{estimate:number, cap:number}|null" } }
    plan_ready:      { required: [steps], properties: { steps: "[{id, kind: ops|code, title}] ≤ 20 — план строителя (agents/builder.yaml#loop.phases.plan)" } }
    step_started:    { required: [step, label_ru], properties: { step: string, label_ru: string, attempt: integer } }
    step_finished:   { required: [step], properties: { step: string, durationMs: integer, ruFallback: "boolean — хотя бы один LLM-вызов шага ушёл на модели в РФ по фолбэку; UI показывает общую строку без названий моделей (agents/models.yaml#fallback_rules, L4-20)" } }
    agent_message:   { required: [agent, messageId, text], properties: { agent: "orchestrator|builder|qa", messageId: string, text: string, delta: "boolean — true: кусок стрима, склеивать по messageId" } }
    chat_output:     { required: [kind, messageId], properties: { kind: "questions|card|answer|change_proposal|notice", messageId: string, cardVersion: integer } }
    model_switched:  { internal: true, required: [fromModel, toModel, reason], properties: { fromModel: string, toModel: string, reason: "fallback_circuit_open|fallback_error (agents/models.yaml#fallback_rules)" } }
    ops_applied:     { required: [revision, opsCount, summary_ru], properties: { revision: integer, opsCount: integer, opTypes: "string[]", summary_ru: "string[] — человеческий diff" } }
    file_written:    { required: [path, action], properties: { path: string, action: "create|update|delete", sha256: string, size: integer, revision: "integer|null" } }
    gate_started:    { required: [level], properties: { level: "G0|G1|G2", revision: integer } }
    gate_result:     { required: [level, passed], properties: { level: string, passed: boolean, revision: integer, durationMs: integer, failedChecks: "[{id, message_ru, file?, line?}] (≤20)", totalChecks: integer } }
    budget_update:   { required: [used, cap], properties: { used: number, cap: number, estimate: number } }
    budget_exceeded: { required: [used, cap], properties: { used: number, cap: number, nextStep: string } }
    lock_waiting:    { required: [holderRunId], properties: { holderRunId: string, holderName: string, position: integer } }
    needs_input:     { required: [inputId, kind, prompt_ru], properties: { inputId: string, kind: "secret|decision", decisionId: "budget|escalation|import_confirm|… — для decision", prompt_ru: string, options: "[{id, label, recommended?, freeText?: bool}] для decision и secret (у secret, например, {id: test, label: «Тестовый режим»}); freeText=true → ответ POST /runs/:id/input {choice, text}", secretName: "string для secret (secret://name)", expiresAt: string } }
    input_received:  { required: [inputId], properties: { inputId: string, choice: "string|null (для secret — всегда null; текст freeText в событие не попадает)" } }
    run_finished:    { required: [status], properties: { status: "succeeded|cancelled", resultRevision: "integer|null", creditsUsed: number, summary_ru: string, prodUrl: "string|null" } }
    run_failed:      { required: [code, message_ru], properties: { code: "run_lifecycle.failure_codes", message_ru: string, retryable: boolean, lastGoodRevision: "integer|null" } }
  budget_update_rate: "не чаще 1 раза в 2 с и после каждого LLM-шага"
