      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [proposalId, text], additionalProperties: false, properties: {proposalId: {type: string, pattern: '^[0-9a-f]{64}$'}, text: {type: string, minLength: 1, maxLength: 500}}}}}}
      responses:
        '200': {description: 'Новый набор (kind tuned), выбор (kind pick, brief — новая версия) или подсказка (kind unknown)', content: {application/json: {schema: {type: object, required: [proposal, kind, changed, reply], properties: {proposal: {$ref: '#/components/schemas/DesignDirections'}, kind: {enum: [tuned, pick, unknown]}, changed: {type: array, items: {type: integer}}, reply: {type: string}, brief: {type: object}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {description: 'NOT_FOUND — нет системы или набора направлений этой системы', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /systems/{id}/directions/pick:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: pickDesignDirection
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-09: «Выбрать» (n) или «Решите за меня» (skip) — новая версия брифа (author owner): design.archetype, pinned (skip — false, первое направление) и пожелания словами выбранного направления в design.references'
      requestBody: {required: true, content: {application/json: {schema: {oneOf: [{type: object, required: [proposalId, n], additionalProperties: false, properties: {proposalId: {type: string, pattern: '^[0-9a-f]{64}$'}, n: {type: integer, minimum: 1, maximum: 3}}}, {type: object, required: [proposalId, skip], additionalProperties: false, properties: {proposalId: {type: string, pattern: '^[0-9a-f]{64}$'}, skip: {const: true}}}]}}}}
      responses:
        '200': {description: Новая версия брифа, content: {application/json: {schema: {type: object, required: [brief, archetype, pinned], properties: {brief: {type: object}, archetype: {type: string}, pinned: {type: boolean}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/directions/references:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: addDesignReference
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-09 (GZ-03): ссылка-референс → страница через read_page (без JS, правила V3-05: robots, SSRF, лимиты) → принципы (цвета и шрифты встроенного CSS, ритм, фото, сетка) строкой в brief.design.references (новая версия брифа); тексты, логотипы и раскладка не копируются. До 3 референсов кроме логотипа; страница не прочиталась — сохраняется ссылка (read=false)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [url], additionalProperties: false, properties: {url: {type: string, minLength: 8, maxLength: 500}}}}}}
      responses:
        '201': {description: Принципы и новая версия брифа, content: {application/json: {schema: {type: object, required: [reference, brief, read], properties: {reference: {type: string}, brief: {type: object}, read: {type: boolean}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /systems/{id}/directions/references/upload:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: uploadDesignReference
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-09: логотип (PNG или SVG) или скриншот референса (PNG), до 2 МБ и 4096 точек по стороне → доминирующие цвета в OKLCH кодом (без модели со зрением) → строка принципов в brief.design.references; логотип даёт фирменный цвет и заменяет прежний. Файл не хранится'
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file, kind], properties: {file: {type: string, format: binary}, kind: {enum: [logo, screenshot]}}}}}}
      responses:
        '201': {description: Принципы и новая версия брифа, content: {application/json: {schema: {type: object, required: [reference, brief], properties: {reference: {type: string}, brief: {type: object}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {description: 'UNSUPPORTED_MEDIA_TYPE — не PNG (логотип — не PNG и не SVG)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /direction-previews/{proposalId}/{n}/{path}:
    get:
      operationId: getDirectionPreviewFile
      x-milestone: V3
      security: []
      x-path-wildcard: 'path — файл собранного превью (assets/*.js, assets/*.css, boot.js); ключ доступа — proposalId (sha256 набора со случайным nonce)'
      summary: 'V3-09: файлы живого первого экрана для <iframe srcdoc sandbox="allow-scripts"> (непрозрачный origin под CSP платформы): Access-Control-Allow-Origin *, без сессии; после рестарта сборка повторяется из сохранённого набора'
      parameters: [{name: proposalId, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}, {name: n, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 3}}, {name: path, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Файл превью, content: {text/javascript: {schema: {type: string}}, text/css: {schema: {type: string}}}}, '404': {description: Нет такого файла или набора}}
  /direction-previews/fonts/{file}:
    get:
      operationId: getDirectionPreviewFont
      x-milestone: V3
      security: []
      summary: 'V3-09: шрифты дизайн-систем превью из каталога ui-kit (D64), как /_wizard/fonts рантайма; CORS для непрозрачного origin'
      parameters: [{name: file, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: woff2, content: {font/woff2: {schema: {type: string, contentMediaType: font/woff2}}}}, '404': {description: Нет такого файла}}
  /direction-previews/photos/{name}:
    get:
      operationId: getDirectionPreviewPhoto
      x-milestone: V3
      security: []
      summary: 'V3-09: заглушка фото первого экрана (SVG без текста, цвет — от имени); стоковые фото подбираются при «Собрать»'
      parameters: [{name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{1,80}[.]svg$'}}]
      responses: {'200': {description: SVG, content: {image/svg+xml: {schema: {type: string}}}}, '404': {description: Нет такого файла}}
  # ==== конец блока V3-09 ====

  # ==== V3-30: внутренний git системы (db.yaml#system_git_commits) ====
  /systems/{id}/repo:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystemRepo
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-30 (D77 (2)–(3)): git-репозиторий системы в хранилище платформы в РФ — последний коммит, ссылки (main — каждая ревизия и версия брифа; preview и prod — коммиты ревизий превью и публикации, null — их нет) и число коммитов. Перед чтением репозиторий догоняет ревизии и версии брифа без коммита; behind=true — догнать не удалось (коммиты допишутся при следующей ревизии)'
      responses:
        '200': {description: Репозиторий, content: {application/json: {schema: {type: object, required: [head, refs, commits, behind], properties: {head: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/RepoCommit'}]}, refs: {type: object, required: [main, preview, prod], properties: {main: {$ref: '#/components/schemas/RepoRef'}, preview: {$ref: '#/components/schemas/RepoRef'}, prod: {$ref: '#/components/schemas/RepoRef'}}}, commits: {type: integer}, behind: {type: boolean}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo/commits:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listSystemRepoCommits
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-30: коммиты main от новых к старым; ?before=<seq> — следующая страница'
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}, {name: before, in: query, schema: {type: integer, minimum: 2}}]
      responses:
        '200': {description: Коммиты, content: {application/json: {schema: {type: object, required: [commits, nextBefore], properties: {commits: {type: array, items: {$ref: '#/components/schemas/RepoCommit'}}, nextBefore: {type: [integer, 'null']}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo/revisions/{v}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}]
    get:
      operationId: getSystemRepoRevisionCommit
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-30: коммит ревизии (ревизия ↔ коммит)'
      responses:
        '200': {description: Коммит ревизии, content: {application/json: {schema: {type: object, required: [revision, commit], properties: {revision: {type: integer}, commit: {$ref: '#/components/schemas/RepoCommit'}}}}}}
        '404': {description: 'NOT_FOUND — нет системы или коммита ревизии', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/repo/diff:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystemRepoDiff
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-30: разница коммита с родителем (первый коммит — с пустым деревом): изменённые файлы и patch в формате git diff (3 строки контекста); у двоичных файлов и файлов больше 1 МБ patch = null. ?revision=N или ?commit=<oid>; без них — последний коммит'
      parameters: [{name: revision, in: query, schema: {type: integer, minimum: 1}}, {name: commit, in: query, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}]
      responses:
        '200': {description: Разница, content: {application/json: {schema: {type: object, required: [commit, parent, files], properties: {commit: {$ref: '#/components/schemas/RepoCommit'}, parent: {type: [string, 'null']}, files: {type: array, items: {type: object, required: [path, status, binary, additions, deletions, patch], properties: {path: {type: string}, status: {enum: [added, modified, deleted]}, binary: {type: boolean}, additions: {type: integer}, deletions: {type: integer}, patch: {type: [string, 'null']}}}}}}}}}
        '400': {description: 'VALIDATION_FAILED — и revision, и commit', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'NOT_FOUND — нет системы или коммита', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/repo/archive:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystemRepoArchive
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-30: дерево коммита zip-архивом (папка <slug>-r<ревизия>, у коммита брифа — <slug>-<7 знаков oid>; файлы датированы временем коммита). ?revision=N или ?commit=<oid>; без них — последний коммит'
      parameters: [{name: revision, in: query, schema: {type: integer, minimum: 1}}, {name: commit, in: query, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}]
      responses:
        '200': {description: Архив, content: {application/zip: {schema: {type: string, format: binary}}}}
        '400': {description: 'VALIDATION_FAILED — и revision, и commit', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'NOT_FOUND — нет системы или коммита', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  # ==== конец блока V3-30 ====
  # ==== V3-33: свои ключи моделей (BYOK; security/data-boundary.yaml#byok). За флагом до проверки юристом (V3-35) ====
  /orgs/{orgId}/byok:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    get:
      operationId: getByok
      x-milestone: V3
      x-roles: [viewer]
      summary: 'Условия (версия текста), список провайдеров и ключи организации — только последние 4 символа. Функция выключена для организации (флаг WIZARD_BYOK / WIZARD_BYOK_ORGS, нет KMS) → {available: false}'
      responses: {'200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/ByokState'}}}}}
  /orgs/{orgId}/byok/consent:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    post:
      operationId: acceptByokConsent
      x-milestone: V3
      x-roles: [owner]
      summary: 'Однократное явное согласие с условиями (db.yaml#byok_consents: версия, sha256 текста, кто, когда); повтор — без изменений. Версия не совпала с текущей → 412 VERSION_CONFLICT; функция выключена → 403 FORBIDDEN'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [version], properties: {version: {type: string}}}}}}
      responses: {'200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/ByokState'}}}}}
  /orgs/{orgId}/byok/keys:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    post:
      operationId: addByokKey
      x-milestone: V3
      x-roles: [owner]
      summary: 'Ключ запечатывается сразу (конвертное шифрование, OpenBao Transit), затем проверочный вызов (GET /models, при необходимости «ping» ≤ 16 токенов). Ошибки валидации называют только поле (details.fields или details.field), значение ключа нигде не повторяется. Без согласия → 422 CONSENT_REQUIRED; провайдер, блокирующий РФ, без шлюза или с адресом самого провайдера → 400 VALIDATION_FAILED (details.reason); > 10 ключей → 402 PLAN_LIMIT; функция выключена → 403'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, model, key]
              properties:
                provider: {type: string, description: id из packages/llm/src/byok/providers.json}
                model: {type: string, maxLength: 128}
                key: {type: string, minLength: 8, maxLength: 512, writeOnly: true}
                gatewayUrl: {type: [string, 'null'], description: 'https-адрес OpenAI-совместимого шлюза пользователя; только для провайдеров с direct=false'}
                callTypes: {type: array, items: {type: string}, description: 'подмножество ByokState.callTypes; нет или [] — все'}
      responses: {'201': {description: Ключ сохранён и проверен, content: {application/json: {schema: {type: object, required: [key], properties: {key: {$ref: '#/components/schemas/ByokKey'}}}}}}}
  /orgs/{orgId}/byok/keys/{keyId}:
    parameters: [{$ref: '#/components/parameters/orgId'}, {name: keyId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateByokKey
      x-milestone: V3
      x-roles: [owner]
      summary: '«Использовать в сборках»: active или paused'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [status], properties: {status: {enum: [active, paused]}}}}}}
      responses: {'200': {description: Обновлено, content: {application/json: {schema: {type: object, required: [key], properties: {key: {$ref: '#/components/schemas/ByokKey'}}}}}}}
    delete:
      operationId: revokeByokKey
      x-milestone: V3
      x-roles: [owner]
      summary: 'Отзыв: шифртекст и обёрнутый ключ данных удаляются (status revoked); работает и после выключения флага'
      responses: {'200': {description: Отозван, content: {application/json: {schema: {type: object, required: [key], properties: {key: {$ref: '#/components/schemas/ByokKey'}}}}}}}
  /orgs/{orgId}/byok/keys/{keyId}/check:
    parameters: [{$ref: '#/components/parameters/orgId'}, {name: keyId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: checkByokKey
      x-milestone: V3
      x-roles: [owner]
      summary: 'Повторный проверочный вызов (ключ расшифровывается на время вызова); итог — ByokKey.check'
      responses: {'200': {description: Итог проверки, content: {application/json: {schema: {type: object, required: [key], properties: {key: {$ref: '#/components/schemas/ByokKey'}}}}}}}
  # ==== конец блока V3-33 ====
  # ==== V3-20: харнесс интеграций — контракты исходящих, проверка ключом, ключи собственного API системы ====
  /systems/{id}/integrations:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listSystemIntegrations
