# OpenAPI 3.1 платформы Wizard. Нормативно для apps/platform-api. Компактная запись (flow-style) намеренна.
# Вехи операций — x-milestone (M0/M1/M2); права ролей организации — x-roles; авторизация — info.x-auth.
openapi: 3.1.0
info:
  title: Wizard platform-api
  version: 1.0.0
  description: 'Нормативный контракт apps/platform-api (backlog M0-15, M1-02..M1-04, M1-07, M2-07..M2-09). Каждая операция помечена x-milestone; контрактный тест M0-15 покрывает все операции с x-milestone ≤ текущей вехи. Правила: все тела — JSON (кроме SSE и /files); все пользовательские тексты в ответах — на русском; идентификаторы — uuid; время — RFC 3339 UTC; кредиты в API — число с точностью 0.001 (= милликредит, billing.yaml#credit.unit), округление до 0.1 — только в UI. Тексты, пришедшие от LLM (сообщения агентов, карточка, message_ru гейтов), клиент MUST показывать только как текст или санированный markdown без raw HTML (L3-17). Обращение к объекту чужой организации (system, run, revision, file, events, export) → 404 NOT_FOUND, не 403 (контрактный IDOR-тест M0-15/M1-02). Мутирующие POST принимают заголовок Idempotency-Key (≤ 64 символа): повтор с тем же ключом и тем же телом в течение 24 ч MUST вернуть исходный ответ; с другим телом — 422 IDEMPOTENCY_MISMATCH. Авторизация по вехам — x-auth. Права ролей организации — x-roles (owner ⊃ editor ⊃ viewer, product.yaml#decisions.D11_team).

    '
  x-auth:
    M0: 'Один локальный пользователь. Заголовок X-Wizard-Dev-User: <email>; если заголовка нет — пользователь по умолчанию dev@wizard.local. Организация одна, id из сида 00000000-0000-0000-0000-000000000001. Сервер MUST слушать только 127.0.0.1, если WIZARD_AUTH_MODE=dev. MUST (L3-10, deploy.yaml#local.host_guard): Host вне {localhost, 127.0.0.1, [::1], *.localhost} → 421 HOST_NOT_ALLOWED; заголовки X-Forwarded-*, Forwarded, CF-* → 403 FORBIDDEN; не-GET с Origin ≠ WIZARD_PLATFORM_ORIGIN → 403.'
    M1: 'Email OTP → cookie __Host-wizard_session (локально по http — wizard_session; HttpOnly, Secure, Path=/, без Domain, SameSite=Lax, 30 дней скользящий срок; deploy.yaml#cloud.domains.cookies). Мутирующие запросы MUST содержать заголовок X-Wizard-CSRF, равный cookie __Host-wizard_csrf (double submit), и Origin платформы. Режим dev остаётся только при WIZARD_AUTH_MODE=dev и запрещён при NODE_ENV=production (тест: старт процесса падает).'
    M2: '+ staff: users.is_staff=true, MFA (TOTP) обязательна: без users.mfa_enrolled_at или без TOTP-подтверждения за последние 12 ч /admin/* → 403 MFA_REQUIRED. В бете staff — учётная запись основателя (F7); все действия /admin/* пишутся в staff_audit_log.'
servers: [{url: 'http://localhost:4000/api/v1', description: M0–M1 локально}]
security: [{devUser: []}, {session: []}]
paths:
  /systems:
    post:
      operationId: createSystem
      x-milestone: M0
      x-roles: [editor]
      summary: 'Создать систему из промпта; запускает прогон interview_turn. B2-02: в режиме показа (orgs.demo_replay) промпт должен совпадать с брифом записанного сценария tools/fixtures/demo/<name>.jsonl (пробелы не учитываются) — система запоминает сценарий (systems.demo_scenario); иначе 422 DEMO_REPLAY_NO_SCENARIO «В режиме показа есть только записанные сценарии: …», details {scenarios: [{name, title}]}, система не создаётся'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              additionalProperties: false
              properties: {prompt: {type: string, minLength: 3, maxLength: 8000}, orgId: {type: string, format: uuid, description: 'M1+: обязателен, если пользователь состоит в нескольких организациях'}, templateId: {type: string}}
      responses:
        '201': {description: 'Система создана, первый ход интервью поставлен в очередь', content: {application/json: {schema: {type: object, required: [system, run], properties: {system: {$ref: '#/components/schemas/System'}, run: {$ref: '#/components/schemas/Run'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      operationId: listSystems
      x-milestone: M0
      x-roles: [viewer]
      parameters: [{name: orgId, in: query, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/limit'}, {$ref: '#/components/parameters/cursor'}]
      responses: {'200': {description: 'Системы организации, новые сверху (не удалённые)', content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/System'}}, nextCursor: {type: [string, 'null']}}}}}}}
  /systems/{id}:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystem
      x-milestone: M0
      x-roles: [viewer]
      responses:
        '200':
          description: Система, текущая карточка и последние сообщения чата
          content:
            application/json:
              schema:
                type: object
                required: [system, messages]
                properties:
                  system: {$ref: '#/components/schemas/System'}
                  demoReplay: {type: boolean, description: 'B2-02: организация в режиме показа — платформа показывает плашку «Режим показа: ответы моделей записаны, расходов нет»'}
                  pipeline: {enum: [legacy, modules], description: 'B2-25: конвейер системы — modules (есть план или состояние интервью по целям) открывает экран-холст, legacy (карточка или интервью v1) — прежний экран; новая система без состояния — по WIZARD_BUILD_PIPELINE, как исполнитель интервью'}
                  card: {oneOf: [{$ref: '#/components/schemas/SystemCard'}, {type: 'null'}]}
                  pendingQuestions: {type: array, items: {$ref: '#/components/schemas/Question'}}
                  messages: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Message'}}
                  activeRunId: {type: [string, 'null'], format: uuid}
                  publishBlockers: {type: array, items: {type: string, enum: [CARD_BINDING_REQUIRED, OPERATOR_NAME_REQUIRED, OPERATOR_CONTACT_REQUIRED, OPERATOR_ADDRESS_REQUIRED, INN_INVALID, SELLER_REQUISITES_REQUIRED, OGRN_INVALID, PHONE_LOGIN_PLAN_REQUIRED, FOUNDER_REVIEW_PENDING, GATES_FAILED, PLAN_LIMIT, NOT_OWNER, SYSTEM_SUSPENDED, ORG_SUSPENDED]}, description: 'M1+; пусто — публиковать можно. ORG_SUSPENDED — orgs.suspended_at (abuse.yaml#takedown.flow)'}
                  techreviewBlockers: {type: array, items: {type: string}, description: 'V3-18: что нашло техревью v3-сборки, оставившей публикуемую ревизию (причина GATES_FAILED словами); пусто — техревью публикации не мешает'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSystem
      x-milestone: M2
      x-roles: [owner]
      summary: 'Удаление системы: сразу скрыта из списков и снята с публикации; схемы, сообщения, импорты, выгрузки, секреты и неиспользуемые блобы очищаются через 30 дней (запись system_deleted в журнале удаления, M2-05). Активный запуск → 409 SYSTEM_LOCKED, повтор → 404'
      responses: {'200': {description: Удалена, content: {application/json: {schema: {type: object, required: [id, deletedAt, purgeAfter], properties: {id: {type: string, format: uuid}, deletedAt: {type: string, format: date-time}, purgeAfter: {type: string, format: date-time}}}}}}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /systems/{id}/messages:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: postMessage
      x-milestone: M0
      x-roles: [editor]
      summary: Ход чата. Запускает interview_turn; исход хода — вопросы, карточка, ответ или change-прогон (workflows.yaml#workflows.interview_turn)
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: {type: string, minLength: 1, maxLength: 8000}
                target:
                  type: object
                  x-milestone: M3
                  description: '«Укажи и измени» (M3-01): элемент превью; формат wzId — ui/ui-kit.yaml#wz_id (L1-05). file MUST быть файлом draft-ревизии, иначе 422 VALIDATION_FAILED. Хранится в messages.payload.target'
                  required: [wzId, file]
                  additionalProperties: false
                  properties: {wzId: {type: string, pattern: '^[0-9a-f]{8}:[0-9]+$'}, componentName: {type: string, maxLength: 60}, file: {type: string, pattern: '^ui/[A-Za-z0-9_/.-]+\.tsx$'}, line: {type: integer, minimum: 1}}
                block:
                  type: object
                  x-milestone: B2
                  description: 'B2-29 («ткни и скажи»): блок холста, к которому относится пожелание — id блока (frame:what), подпись, модуль плана и номер секции страницы. Хранится в messages.payload.block; планировщик получает пожелание с указанием блока. С target не сочетается'
                  required: [id, title]
                  additionalProperties: false
                  properties: {id: {type: string, maxLength: 80}, title: {type: string, minLength: 1, maxLength: 120}, module: {type: string, maxLength: 40}, sectionIndex: {type: integer, minimum: 0}}
      responses: {'202': {description: 'Принято. Уведомление о ПДн создаёт асинхронный interview_turn (приходит через SSE chat_output{kind: notice}), в этом ответе его нет', content: {application/json: {schema: {type: object, required: [message, run], properties: {message: {$ref: '#/components/schemas/Message'}, run: {$ref: '#/components/schemas/Run'}}}}}}, '402': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
    get:
      operationId: listMessages
      x-milestone: M0
      x-roles: [viewer]
      parameters: [{$ref: '#/components/parameters/limit'}, {name: beforeSeq, in: query, schema: {type: integer}}]
      responses: {'200': {description: История чата, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Message'}}}}}}}}
  /systems/{id}/answers:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: postAnswers
      x-milestone: M0
      x-roles: [editor]
      summary: Ответы на вопросы-развилки; restByRecommendation=true принимает рекомендованный вариант для всех неотвеченных
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answers: {type: array, items: {type: object, required: [questionId], additionalProperties: false, properties: {questionId: {type: string}, optionId: {type: string}, text: {type: string, maxLength: 500, description: 'Свой вариант; ровно одно из optionId/text. forkId и byRecommendation дописывает сервер из pending_questions (orchestrator.yaml#schemas.Answer)'}}}}
                restByRecommendation: {type: boolean, default: false}
      responses: {'202': {description: 'Ответы сохранены, запущен interview_turn', content: {application/json: {schema: {type: object, required: [run], properties: {run: {$ref: '#/components/schemas/Run'}}}}}}, '402': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /systems/{id}/card/approve:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: approveCard
      x-milestone: M0
      x-roles: [editor]
      summary: 'Единственная точка согласования (D7): карточка системы или мини-карточка правки. Запускает build (create или change)'
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [cardVersion], additionalProperties: false, properties: {cardVersion: {type: integer, minimum: 1}, capCredits: {type: integer, minimum: 1, description: Можно только понизить cap.credits карточки; не ниже ceil(estimate.credits.expected)}}}}
      responses:
        '202': {description: Сборка поставлена в очередь (status queued или waiting_lock), content: {application/json: {schema: {type: object, required: [run], properties: {run: {$ref: '#/components/schemas/Run'}}}}}}
        '402': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /systems/{id}/plan:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystemPlan
      x-milestone: B2
      x-roles: [viewer]
      summary: 'B2-20 (бета v2, WIZARD_BUILD_PIPELINE=modules): план системы — последняя ревизия или ?revision=N; план компилируется заново при каждом чтении (без моделей), errors и sketch — по текущему каталогу модулей (specs/modules/modules.yaml)'
      parameters: [{name: revision, in: query, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: 'Ревизия плана; plan = null — интервью ещё не дошло до плана (без ?revision)', content: {application/json: {schema: {type: object, required: [plan], properties: {plan: {oneOf: [{$ref: '#/components/schemas/SystemPlanRevision'}, {type: 'null'}]}}}}}}
        '404': {description: 'NOT_FOUND — нет системы или ревизии ?revision', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      operationId: editSystemPlan
      x-milestone: B2
      x-roles: [editor]
      summary: 'B2-20: правка плана, ожидающего утверждения, без модели и без кредитов — параметр, модуль, цели, секции, дизайн (PlanEdit, по порядку, атомарно). План чистится от ПДн, проверяется и компилируется заново за доли секунды; любая ошибка отклоняет весь батч (422 PLAN_INVALID, details.errors — PlanError[]). Успех — новая ревизия source=edit (предыдущая superseded); dryRun=true — то же без сохранения (живой эскиз «что будет, если»). revision — ревизия, которую видел клиент (иначе 409 PLAN_REVISION_STALE). B2-29 («ткни и скажи»): у собранной системы (stage ready) правится и утверждённый план — новая ревизия ждёт утверждения, система переходит в card, в работу правка попадает после пересборки (approveSystemPlan, build mode change)'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [revision, edits], additionalProperties: false, properties: {revision: {type: integer, minimum: 1}, edits: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/PlanEdit'}}, dryRun: {type: boolean, default: false}}}}
      responses:
        '200': {description: Новая ревизия плана (или предпросмотр при dryRun), content: {application/json: {schema: {type: object, required: [plan], properties: {plan: {$ref: '#/components/schemas/SystemPlanRevision'}}}}}}
        '409': {description: 'NO_PLAN, PLAN_REVISION_STALE (details.revision — текущая), SYSTEM_LOCKED', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'PLAN_INVALID — details.errors: PlanError[] (modules.yaml#validation.codes)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/plan/sketch:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystemPlanSketch
      x-milestone: B2
      x-roles: [viewer]
      summary: 'B2-20: эскиз для холста по текущему (или ?revision=N) плану — облегчённое описание (PlanSketch); detail=full — ещё и результат compilePlan: AppSpec и файлы ui/** и functions/** (без моделей, детерминированно). Во время интервью эскиз приходит событием plan_sketch (workflows.yaml#events)'
      parameters: [{name: revision, in: query, schema: {type: integer, minimum: 1}}, {name: detail, in: query, schema: {enum: [sketch, full], default: sketch}}]
      responses:
        '200': {description: 'Эскиз; revision и sketch = null — плана ещё нет', content: {application/json: {schema: {type: object, required: [revision, sketch], properties: {revision: {type: [integer, 'null']}, sketch: {oneOf: [{$ref: '#/components/schemas/PlanSketch'}, {type: 'null'}]}, spec: {type: object, description: 'AppSpec (только detail=full и план компилируется)'}, files: {type: object, additionalProperties: {type: string}, description: 'путь → исходник (только detail=full)'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/plan/approve:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: approveSystemPlan
      x-milestone: B2
      x-roles: [editor]
      summary: 'B2-20 (grill-6 № 5): единственная точка старта сборки на конвейере модулей — утверждение плана (revision, которую видел клиент). План компилируется заново под блокировкой; с ошибками — 422 PLAN_INVALID. Запускает build (mode create, у собранной системы — change) с input {pipeline: modules, planRevision, plan}; cap = ceil((15 ₽ + бюджет custom) / 5 ₽) кредитов (D76 (9)). Этапы сборки по плану — сборщик v2 (B2-21, agents/builder.yaml#v2: тексты, дизайн, компиляция, дописывание, гейты; чекпоинт после каждого этапа). /card/approve для такой системы отвечает NO_CARD'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [revision], additionalProperties: false, properties: {revision: {type: integer, minimum: 1}}}}
      responses:
        '202': {description: Сборка поставлена в очередь, content: {application/json: {schema: {type: object, required: [run], properties: {run: {$ref: '#/components/schemas/Run'}}}}}}
        '402': {$ref: '#/components/responses/Error'}
        '409': {description: 'NO_PLAN (нет плана, ожидающего утверждения, или идёт сборка), PLAN_REVISION_STALE', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'PLAN_INVALID — details.errors: PlanError[]', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/brief:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystemBrief
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-02 (D77 (9), agents/builder-v3.md#3 C1): бриф системы — последняя версия или ?version=N и три схемы (путь клиента, данные и роли, интеграции), построенные кодом без модели'
      parameters: [{name: version, in: query, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: 'brief = null и diagrams = null — интервью ещё не записало бриф', content: {application/json: {schema: {type: object, required: [brief, diagrams], properties: {brief: {type: [object, 'null']}, diagrams: {type: [object, 'null']}}}}}}
        '404': {description: 'NOT_FOUND — нет системы или версии ?version', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      operationId: editSystemBrief
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-02: правка брифа владельцем — весь бриф и версия, на которой он правился (baseVersion; 0 — брифа не было). Новая версия max+1 с разницей по полям (author owner); бриф без изменений версию не создаёт (changed=false). Без модели и без кредитов'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [baseVersion, brief], additionalProperties: false, properties: {baseVersion: {type: integer, minimum: 0}, brief: {type: object}}}}
      responses:
        '200': {description: 'Последняя версия, схемы и changed', content: {application/json: {schema: {type: object, required: [brief, diagrams, changed], properties: {brief: {type: object}, diagrams: {type: object}, changed: {type: boolean}}}}}}
        '400': {description: 'VALIDATION_FAILED — details.errors: ошибки схемы брифа с местом по-русски', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '412': {description: 'VERSION_CONFLICT — бриф изменился после baseVersion (details.version — текущая)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: 'PAYLOAD_TOO_LARGE — бриф больше лимита', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/brief/versions:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listSystemBriefVersions
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-02: версии брифа от новых к старым — номер, автор, время и разница по полям, без тела брифа; ?before=N — следующая страница'
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}, {name: before, in: query, schema: {type: integer, minimum: 2}}]
      responses:
        '200': {description: Версии, content: {application/json: {schema: {type: object, required: [versions, nextBefore], properties: {versions: {type: array, items: {type: object}}, nextBefore: {type: [integer, 'null']}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/brief/upload:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: uploadSystemBrief
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-04 (D77 (8)): ТЗ из файла → черновик брифа. Файл docx, pdf, md или txt ≤ 10 МБ (тип — по сигнатуре, не по расширению; txt/md — UTF-8, UTF-16, Windows-1251, KOI8-R); текст извлекается на сервере платформы в РФ, файл живёт только в памяти запроса — ни байты, ни имя не сохраняются. Разбор — T0-вызов brief_extract (data-boundary.yaml#call_types.brief_extract), черновик очищается от ПДн (scrub) и заполняет только пустые разделы последней версии; новая версия author agent, источник — в допущениях. Без модели (нет записанного ответа, лимит LLM месяца, демо-режим, ошибка) — эвристический черновик (цели и сценарии из заголовков и списков). gaps — briefGaps: что интервью ещё спросит. Кредиты не списываются (вызов в llm_calls)'
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, contentMediaType: application/octet-stream}}}}}}
      responses:
        '201': {description: 'Новая версия брифа (changed=true)', content: {application/json: {schema: {type: object, required: [brief, diagrams, changed, source, gaps], properties: {brief: {type: object, description: 'BriefVersion (author agent)'}, diagrams: {type: object}, changed: {type: boolean}, source: {type: object, required: [kind, format, chars, truncated, method, chunks, answered, piiReplaced], properties: {kind: {const: file}, format: {enum: [docx, pdf, text]}, chars: {type: integer}, truncated: {type: boolean, description: 'текст длиннее 120 000 знаков обрезан'}, pages: {type: integer}, method: {enum: [model, heuristic]}, chunks: {type: integer}, answered: {type: integer}, piiReplaced: {type: integer}}}, gaps: {type: object, required: [sections, filled, missing, blocking], properties: {sections: {type: array, items: {type: object}}, filled: {type: array, items: {type: string}}, missing: {type: array, items: {type: string}}, blocking: {type: array, items: {type: string}}}}}}}}}
        '200': {description: 'Черновик ничего не добавил к последней версии (changed=false)', content: {application/json: {schema: {type: object, required: [brief, diagrams, changed, source, gaps], properties: {brief: {type: object, description: 'BriefVersion (author agent)'}, diagrams: {type: object}, changed: {type: boolean}, source: {type: object, required: [kind, format, chars, truncated, method, chunks, answered, piiReplaced], properties: {kind: {const: file}, format: {enum: [docx, pdf, text]}, chars: {type: integer}, truncated: {type: boolean, description: 'текст длиннее 120 000 знаков обрезан'}, pages: {type: integer}, method: {enum: [model, heuristic]}, chunks: {type: integer}, answered: {type: integer}, piiReplaced: {type: integer}}}, gaps: {type: object, required: [sections, filled, missing, blocking], properties: {sections: {type: array, items: {type: object}}, filled: {type: array, items: {type: string}}, missing: {type: array, items: {type: string}}, blocking: {type: array, items: {type: string}}}}}}}}}
        '400': {description: 'VALIDATION_FAILED — нет файла или multipart; details.reason: BAD_FILE (файл повреждён), ENCRYPTED (pdf с паролем), EMPTY_TEXT (нет текста, скан)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '412': {description: 'VERSION_CONFLICT — бриф менялся дважды за время разбора', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: 'PAYLOAD_TOO_LARGE — файл больше 10 МБ (details.reason FILE_TOO_LARGE) или больше 60 МБ после распаковки docx (UNPACKED_TOO_LARGE)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: 'UNSUPPORTED_MEDIA_TYPE — не docx, pdf, md или txt (старый .doc, rtf, odt, картинки, таблицы); подсказка в message_ru', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/brief/approve:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: approveSystemBrief
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-06 (D7, D77 (9), (11)): «Собрать» системы v3 — единственная точка согласования: сборка по версии брифа, которую видел владелец (startV3Build, V3-11; харнесс v3 при WIZARD_BUILD_PIPELINE=v3). Система из интервью проходит card по пути; потолок — V3_BUILD_CAP_CREDITS (100 кредитов = 500 ₽), capCredits в ответе; mode create, у собранной — change. Повтор с тем же Idempotency-Key — тот же ответ. Без модели и без списаний до старта'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [version], additionalProperties: false, properties: {version: {type: integer, minimum: 1, description: 'версия брифа, которую видел владелец'}}}}
      responses:
        '202': {description: 'Сборка поставлена в очередь', content: {application/json: {schema: {type: object, required: [run, capCredits], properties: {run: {$ref: '#/components/schemas/Run'}, capCredits: {type: integer}}}}}}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'NO_PLAN — у системы нет брифа; SYSTEM_LOCKED — сборка уже идёт', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '412': {description: 'VERSION_CONFLICT — бриф изменился после version (details.version — текущая)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
