      summary: '«Оспорить» (abuse.yaml#rescan, #messages_ru.G2-AF-*): последний G2-отчёт ревизии провалил блокер антифрода G2-AF-01…07 → тикет staff category=auto_g2 (sla_deadline +24 ч, алерт abuse_dispute_new и письма staff); один открытый тикет на систему (повтор возвращает его). Ответ владельцу — письмом при закрытии тикета (dismiss с note). Иначе 400. Тикеты auto_g2 не считаются в abuse_reports_prev (G2-AF-08)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}, text: {type: string, maxLength: 2000, description: комментарий владельца}}}}}}
      responses: {'202': {description: Заявка принята, content: {application/json: {schema: {type: object, required: [reportId, message_ru], properties: {reportId: {type: string, format: uuid}, message_ru: {type: string, description: abuse.yaml#messages_ru.dispute}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /abuse-reports:
    post:
      operationId: createAbuseReport
      x-milestone: M2
      security: []
      summary: '«Пожаловаться» (abuse.yaml#report). Без входа; лимит 10/ч на IP; ответ не раскрывает статус системы. Жалоба phishing на live-систему запускает abuse.yaml#takedown.auto_suspend: ≥ 3 жалобы phishing с разных IP за 1 ч → перепроверка live-ревизии текущим G2 (только G2-AF-01…07, не чаще раза в час на публикацию); провал → публикация suspended, эта жалоба становится тикетом takedown, письмо владельцу, алерт abuse_auto_suspend; G2 чист → только алерт abuse_phishing_cluster'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, category]
              properties: {url: {type: string, format: uri, description: URL на домене систем}, category: {enum: [phishing, fraud, brand_impersonation, illegal_content, pd_violation, spam, other]}, text: {type: string, maxLength: 4000}, contactEmail: {type: string, format: email}, contactConsent: {type: boolean, description: 'M2-08: отдельное согласие на обработку адреса заявителя (только для ответа по этой жалобе; хранится до 1 года после закрытия — db.yaml#abuse_reports.contact_email); обязательно true, если задан contactEmail, иначе 400'}}
      responses: {'202': {description: Жалоба принята, content: {application/json: {schema: {type: object, properties: {reportId: {type: string}}}}}}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports:
    get:
      operationId: adminListAbuseReports
      x-milestone: M2
      x-roles: [staff]
      parameters: [{name: status, in: query, schema: {enum: [new, triaged, takedown, dismissed, restored]}}]
      responses: {'200': {description: Очередь модерации по sla_deadline, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AbuseReport'}}}}}}}}
  /admin/abuse-reports/{reportId}/actions:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminAbuseAction
      x-milestone: M2
      x-roles: [staff]
      summary: 'Переходы abuse.yaml#takedown.flow: triage (new → triaged; открывает доступ staff к данным системы на 24 ч, можно уточнить category), takedown (new|triaged → takedown: publications.status=suspended, systems.suspended_at, письмо владельцу всегда — причина и как оспорить), dismiss (new|triaged → dismissed), restore (takedown → restored; publications снова live, письмо владельцу). Заявителю с contactEmail — нейтральное письмо о рассмотрении. Недопустимый переход → 400'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [action, note], properties: {action: {enum: [triage, takedown, dismiss, restore]}, note: {type: string, minLength: 3}, category: {enum: [phishing, fraud, brand_impersonation, illegal_content, pd_violation, spam, other], description: 'M2-08: уточнённая категория при triage'}}}}}}
      responses: {'200': {description: 'Выполнено, владельцу отправлено уведомление', content: {application/json: {schema: {$ref: '#/components/schemas/AbuseReport'}}}}}
  /admin/orgs/{orgId}/flags:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: adminSetOrgFlags
      x-milestone: M2
      x-roles: [staff]
      summary: 'Флаги организации, строка staff_audit_log org_flags. kind (B2-01, D76 (10)): client | staff — организация основателя (лимит пилота D70 не действует, доступен резерв дневного лимита WIZARD_LLM_STAFF_RESERVE_RUB) | eval — пробы и замеры (свой дневной лимит WIZARD_LLM_EVAL_DAILY_CAP_RUB, бюджет разработки v2). demoReplay (B2-02, D76 (12)): режим показа — все прогоны организации (интервью, сборка, правки) идут на записанных ответах моделей бесплатно (agents/models.yaml#credits.demo_replay); только для kind = staff (с учётом kind из этого же запроса), иначе 403 FORBIDDEN «Режим показа доступен только служебной организации» и флаг не ставится; смена kind на client/eval выключает режим'
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {requireFounderReview: {type: boolean}, passportCollectionAllowed: {type: boolean, description: abuse.yaml#patterns.gov_ids}, kind: {$ref: '#/components/schemas/OrgKind'}, demoReplay: {type: boolean}}}}}}
      responses: {'200': {description: Обновлено, content: {application/json: {schema: {type: object, required: [orgId, requireFounderReview, passportCollectionAllowed, kind, demoReplay], properties: {orgId: {type: string, format: uuid}, requireFounderReview: {type: boolean}, passportCollectionAllowed: {type: boolean}, kind: {$ref: '#/components/schemas/OrgKind'}, demoReplay: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/orgs/{orgId}/suspension:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    post:
      operationId: adminOrgSuspension
      x-milestone: M2
      x-roles: [staff]
      summary: 'abuse.yaml#takedown.flow «Повторное нарушение или явный фишинг → orgs.suspended_at»: suspend — все системы организации отдают 451 (вид deployments, draft и prod), publish → 403 ORG_SUSPENDED, в publishBlockers ORG_SUSPENDED; restore — снимает признак (системы, снятые своими тикетами, остаются снятыми). Строка staff_audit_log org_suspend|org_restore (target org:<id>, в note — тикет), письмо владельцам. Переход без изменения → 400'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [action, note], properties: {action: {enum: [suspend, restore]}, note: {type: string, minLength: 3, maxLength: 2000}, reportId: {type: string, format: uuid, description: тикет-основание}}}}}}
      responses: {'200': {description: Выполнено, content: {application/json: {schema: {type: object, required: [orgId, suspendedAt], properties: {orgId: {type: string, format: uuid}, suspendedAt: {type: [string, 'null'], format: date-time}}}}}}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/systems/{id}/founder-review:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: adminFounderReview
      x-milestone: M2
      x-roles: [staff]
      summary: 'Решение по ревизии, ожидающей ревью перед prod (M2-09); approve разблокирует publish этой ревизии. Смонтирован в M2-08 (staff MFA, строка staff_audit_log); CLI `pnpm --filter @wizard/platform-api moderation reviews | approve | reject` с прямым доступом к БД (M2-04) продолжает работать. reject требует note (≥ 3 символов, иначе 400). Владельцам org уходит письмо о решении (одобрено — можно публиковать; не одобрено — note как «что исправить»), и из админки, и из CLI. rejected тоже отдаётся в publishBlockers как FOUNDER_REVIEW_PENDING'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision, decision], properties: {revision: {type: integer}, decision: {enum: [approve, reject]}, note: {type: string}}}}}}
      responses: {'200': {description: Записано}}
  /admin/systems/{id}/founder-review/preview:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: adminFounderReviewPreview
      x-milestone: M2
      x-roles: [staff]
      summary: 'D75: посмотреть черновик системы перед решением по ревью. Только система с ожидающим ревью (иначе 404); ссылка как у getPreviewUrl — одноразовый preview-login на 15 мин от публичной роли (её нет — первая роль). Строка staff_audit_log founder_review_preview. reviewRevision — ревизия на ревью: если черновик новее, консоль это показывает'
      responses: {'200': {description: Ссылка, content: {application/json: {schema: {type: object, required: [url, revision, reviewRevision, expiresAt], properties: {url: {type: string}, revision: {type: integer}, reviewRevision: {type: integer}, roles: {type: array, items: {type: object, properties: {name: {type: string}, label: {type: string}}}}, expiresAt: {type: string, format: date-time}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/session:
    get:
      operationId: adminSession
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: состояние staff в этой сессии (без MFA-подтверждения). Не staff → 404 NOT_FOUND (консоль не раскрывается); вход по заголовку разработки (без сессии) никогда не подтверждён'
      responses: {'200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/StaffSession'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/mfa/enroll:
    post:
      operationId: adminMfaEnroll
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: начать подключение TOTP (RFC 6238, SHA1, 30 с, 6 цифр); секрет — в хранилище секретов (users.totp_secret_ref = secret://…), показывается один раз. Уже подключено → 400; сброс — CLI `moderation staff-reset-mfa <email>`'
      responses: {'200': {description: Секрет, content: {application/json: {schema: {type: object, required: [secret, otpauthUrl], properties: {secret: {type: string, description: base32}, otpauthUrl: {type: string}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /admin/mfa/confirm:
    post:
      operationId: adminMfaConfirm
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: первый код подтверждает подключение: mfa_enrolled_at, сессия подтверждена, 10 кодов восстановления (хранятся только HMAC) — показываются один раз. Неверный код → 401 OTP_INVALID; 5 неверных кодов за 15 мин → 429'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses: {'200': {description: Подключено, content: {application/json: {schema: {type: object, required: [recoveryCodes, mfaVerifiedUntil], properties: {recoveryCodes: {type: array, items: {type: string}}, mfaVerifiedUntil: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/mfa/verify:
    post:
      operationId: adminMfaVerify
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: step-up сессии кодом TOTP (каждый код — один раз, users.totp_last_step) или одноразовым кодом восстановления; действует 12 ч в этой сессии (x-auth.M2). Неверный → 401 OTP_INVALID; 5 неверных за 15 мин → 429'
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {code: {type: string, pattern: '^[0-9]{6}$'}, recoveryCode: {type: string}}}}}}
      responses: {'200': {description: Сессия подтверждена, content: {application/json: {schema: {type: object, required: [mfaVerifiedUntil], properties: {mfaVerifiedUntil: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports/{reportId}:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: adminGetAbuseReport
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: тикет — жалоба (текст, контакт заявителя), система, открытый доступ staff и журнал staff по тикету и системе; просмотр пишется в staff_audit_log'
      responses: {'200': {description: Тикет, content: {application/json: {schema: {$ref: '#/components/schemas/AbuseTicket'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports/{reportId}/access:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminOpenStaffAccess
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08 (compliance.yaml#platform.security_org staff_access, L3-43): открыть доступ staff к данным системы по открытому тикету на 24 ч; строка staff_audit_log; владельцу — письмо, кроме category=phishing. triage открывает доступ так же'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [note], properties: {note: {type: string, minLength: 3}}}}}}
      responses: {'200': {description: Доступ открыт, content: {application/json: {schema: {type: object, required: [until], properties: {until: {type: string, format: date-time}}}}}}, '400': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports/{reportId}/data:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}, {name: entity, in: query, schema: {type: string}}]
    get:
      operationId: adminSystemData
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: данные системы тикета только для чтения (prod, иначе draft): счётчики строк по сущностям и до 50 последних строк одной сущности; поля ПДн не отдаются (как выгрузка без ПДн, workflows.yaml#export_data). Без открытого доступа по тикету (24 ч, тикет не закрыт) → 403 FORBIDDEN; каждое чтение — строка staff_audit_log'
      responses: {'200': {description: Данные, content: {application/json: {schema: {type: object, required: [env, entities, columns, rows], properties: {env: {enum: [draft, prod]}, revision: {type: [integer, 'null']}, accessUntil: {type: string, format: date-time}, omittedPii: {type: integer}, entities: {type: array, items: {type: object, properties: {name: {type: string}, label: {type: string}, rows: {type: integer}}}}, entity: {type: [string, 'null']}, columns: {type: array, items: {type: string}}, rows: {type: array, items: {type: object}}}}}}}, '403': {$ref: '#/components/responses/Error'}}
  /admin/founder-reviews:
    get:
      operationId: adminListFounderReviews
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: ревизии, ожидающие ревью основателя перед prod (db.yaml#founder_reviews status=pending), старые первыми'
      responses: {'200': {description: Очередь, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {systemId: {type: string}, systemName: {type: string}, orgId: {type: string}, revision: {type: integer}, createdAt: {type: string, format: date-time}, egressHosts: {type: array, items: {type: string}, description: 'M2-52 (D71): хосты исходящих запросов функций ревизии (functions[].egress) — основатель видит их на ревью'}, newEgressHosts: {type: array, items: {type: string}, description: 'M2-52: хосты, которых нет в опубликованной ревизии (G2-EGRESS-01)'}}}}}}}}}}
  # ==== M2P · M2-22 (человеческий слой и цены: каталог цен, использование организации, обращения, заказы «под ключ», пробелы, матрица доступа) — новые пути дописывать ЗДЕСЬ, над этой строкой не трогать ====
  /orgs/{orgId}/usage:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    get:
      operationId: getOrgUsage
      x-milestone: M2P
      x-roles: [viewer]
      summary: 'M2-34/M2-56 (D70, mvp_scope): «На пилоте бесплатно» и остаток лимита пилота организации — сборки (build mode=create) и правки (mode=change|point_edit) за скользящие 30 дней; failed и cancelled не считаются, активные считаются. Для org не на тарифе pilot limit и left = null. Кредитов, потолков и себестоимости в ответе нет (billing.yaml#rub_model.principle)'
      responses: {'200': {description: Использование, content: {application/json: {schema: {$ref: '#/components/schemas/PilotUsage'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /support/requests:
    post:
      operationId: createSupportRequest
      x-milestone: M2P
      x-roles: [viewer]
      summary: 'M2-35 (D68, mvp_scope): «Написать команде». Копия — в db.yaml#support_requests; основателю — сообщение в Telegram через бота платформы (канал алертов WIZARD_OPS_ALERT_URL/CHAT_ID; письмо — WIZARD_OPS_ALERT_EMAIL): организация, почта клиента, ссылка на систему, срок ответа и текст с замаскированными ПДн (@wizard/pii scrub). systemId — система открыта (org берётся из неё; чужая → 404), иначе orgId или org пользователя по умолчанию. replyBy — 2 часа рабочего времени Пн–Пт 10–19 МСК (D60); message_ru — подтверждение со сроком. > 5 обращений в час от пользователя (по всем его организациям) или > 10 от организации → 429 RATE_LIMITED; проверка и вставка — в одной транзакции под pg_advisory_xact_lock пользователя и организации. В тексте для Telegram переводы строк в однострочных полях (организация, адрес, система, экран) заменяются пробелом. Ответ основатель даёт письмом'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 4000}, wantsTeam: {type: boolean, description: «Хочу, чтобы доделала команда»}, systemId: {type: string, format: uuid}, orgId: {type: string, format: uuid}, screen: {type: string, maxLength: 64, pattern: '^[a-z0-9_-]*$'}}}}}}
      responses: {'201': {description: Отправлено, content: {application/json: {schema: {type: object, required: [id, replyBy, message_ru], properties: {id: {type: string, format: uuid}, replyBy: {type: string, format: date-time}, message_ru: {type: string}}}}}}, '404': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/support/requests:
    get:
      operationId: adminListSupportRequests
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-35/M2-57 (mvp_scope): обращения «Написать команде» — сначала неотвеченные по сроку ответа, затем отвеченные; status=open — только неотвеченные'
      parameters: [{name: status, in: query, schema: {enum: [open, all]}}]
      responses: {'200': {description: Обращения, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SupportRequest'}}}}}}}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/support/requests/{requestId}/answered:
    parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminMarkSupportRequest
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-35 (mvp_scope): отметка «отвечено» (answered=false снимает её). Строка staff_audit_log support_answered | support_reopened (target support_request:<id>)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [answered], properties: {answered: {type: boolean}}}}}}
      responses: {'200': {description: Записано, content: {application/json: {schema: {type: object, required: [id, answeredAt], properties: {id: {type: string, format: uuid}, answeredAt: {type: [string, 'null'], format: date-time}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/development-requests:
    get:
      operationId: adminDevelopmentRequests
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-59 (D73, mvp_scope): «Запросы на развитие» — категории по частоте (за 7 и 30 дней, всего, число систем) и последние 50 запросов (category — только этой категории) со ссылкой на систему и почтой клиента, запустившего прогон. Пишет хост агентов прогона (recordDevelopmentRequest), не HTTP'
      parameters: [{name: category, in: query, schema: {$ref: '#/components/schemas/DevelopmentCategory'}}]
      responses: {'200': {description: Запросы, content: {application/json: {schema: {type: object, required: [categories, items], properties: {categories: {type: array, items: {type: object, required: [category, last7, last30, total, systems, lastAt], properties: {category: {$ref: '#/components/schemas/DevelopmentCategory'}, last7: {type: integer}, last30: {type: integer}, total: {type: integer}, systems: {type: integer}, lastAt: {type: string, format: date-time}}}}, items: {type: array, items: {$ref: '#/components/schemas/DevelopmentRequest'}}}}}}}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/pilot/orgs/{orgId}/limits:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: adminSetPilotLimits
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-34 (D70, mvp_scope): лимит пилота организации — сборки и правки за 30 дней (0…1000; null — по умолчанию 5 и 20). Строка staff_audit_log pilot_limits (target org:<id>)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {builds: {type: [integer, 'null'], minimum: 0, maximum: 1000}, edits: {type: [integer, 'null'], minimum: 0, maximum: 1000}}}}}}
