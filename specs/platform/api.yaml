      responses:
        '200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/RepoSyncState'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: disconnectRepoSync
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-31: отключение — хук проекта GitLab удаляется (по возможности), подключение с запечатанными токенами, PR, импорты и очередь удаляются; репозиторий клиента не трогаем (приложение GitHub клиент удаляет сам)'
      responses:
        '200': {description: Состояние без подключения, content: {application/json: {schema: {$ref: '#/components/schemas/RepoSyncState'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/github:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: startRepoSyncGithub
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-31: адрес установки GitHub App платформы (права Contents и Pull requests — запись, Checks — запись, Metadata — чтение; доступ к выбранным репозиториям) с подписанным state (система, пользователь, 15 мин). Приложение не настроено → 403 FORBIDDEN'
      responses:
        '200': {description: Адрес установки, content: {application/json: {schema: {type: object, required: [url], properties: {url: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /git-sync/github/setup:
    get:
      operationId: githubRepoSyncSetup
      x-milestone: V3
      summary: 'V3-31: Setup URL приложения GitHub (после установки). Установка подтверждается кодом OAuth самого пользователя: installation_id должен быть среди GET /user/installations, иначе 403; state чужой или устаревший → 400. Успех → 302 на «Настройки» системы (?repo=select#repo)'
      parameters: [{name: installation_id, in: query, required: true, schema: {type: string}}, {name: state, in: query, required: true, schema: {type: string}}, {name: code, in: query, schema: {type: string}}, {name: setup_action, in: query, schema: {type: string}}]
      responses:
        '302': {description: На страницу настроек системы}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/gitlab:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: startRepoSyncGitlab
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-31: адрес авторизации OAuth GitLab (authorization code + PKCE S256, scope api). Без baseUrl — gitlab.com приложением платформы; свой GitLab — https-адрес без пути, доступный из интернета, и Application ID/Secret приложения OAuth, созданного владельцем на своём сервере (запечатываются как токены). Ошибка адреса → 400 VALIDATION_FAILED (details.field)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {baseUrl: {type: [string, 'null']}, clientId: {type: [string, 'null']}, clientSecret: {type: [string, 'null'], writeOnly: true}}}}}}
      responses:
        '200': {description: Адрес авторизации, content: {application/json: {schema: {type: object, required: [url], properties: {url: {type: string}}}}}}
        '400': {$ref: '#/components/responses/Error'}
  /git-sync/gitlab/callback:
    get:
      operationId: gitlabRepoSyncCallback
      x-milestone: V3
      summary: 'V3-31: redirect URI приложения OAuth GitLab: код обменивается на токены (с code_verifier из state), токены запечатываются; успех → 302 на «Настройки» системы (?repo=select#repo)'
      parameters: [{name: code, in: query, required: true, schema: {type: string}}, {name: state, in: query, required: true, schema: {type: string}}]
      responses:
        '302': {description: На страницу настроек системы}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/repos:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listRepoSyncRepos
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-31: репозитории для выбора — доступные установке GitHub App или проекты GitLab с правами Developer и выше'
      responses:
        '200': {description: Репозитории, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [id, path, defaultBranch, private, webUrl], properties: {id: {type: string}, path: {type: string}, defaultBranch: {type: [string, 'null']}, private: {type: boolean}, webUrl: {type: string}}}}}}}}}
        '409': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/repo:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: selectRepoSyncRepo
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-31: выбор репозитория — проверяется доступ и сервер клонирования (тот же, что у провайдера); у GitLab создаётся хук проекта с секретным токеном. Подключение становится active, в очереди — первая отправка (в пустой репозиторий — сразу в основную ветку, иначе PR) и сверка. Репозиторий уже подключён к другой системе или уже выбран (сменить — через отключение) → 412 VERSION_CONFLICT'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [repoId], properties: {repoId: {type: string, pattern: '^[0-9]{1,20}$'}}}}}}
      responses:
        '200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/RepoSyncState'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/retry:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: retryRepoSync
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-31: «Повторить» — остановленные задания очереди возвращаются, подключение из error — в active, сверка сейчас'
      responses:
        '200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/RepoSyncState'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/preview/{rev}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: rev, in: path, required: true, schema: {type: integer, minimum: 1}}]
    get:
      operationId: getRepoSyncPreview
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-31: постоянная ссылка превью ревизии PR (её пишет Wizard в описание PR и в проверки). Браузеру (Accept: text/html) — 302 на свежий вход в превью, пока ревизия — превью черновика, иначе — 302 на страницу системы; клиенту API — тот же адрес в JSON'
      responses:
        '200': {description: Адрес, content: {application/json: {schema: {type: object, required: [url, current], properties: {url: {type: string}, current: {type: boolean, description: 'false — ревизия уже не превью, адрес — страница системы'}}}}}}
        '302': {description: Превью или страница системы (браузер)}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/repo-sync/pulls/{number}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: number, in: path, required: true, schema: {type: integer, minimum: 1}}]
    get:
      operationId: getRepoSyncPull
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-32 (остаток V3-31): превью PR разработчиков до мержа — постоянный адрес из проверок «Wizard / Превью PR» и «Wizard / G0…G2» в PR. Клиенту API — состояние превью (статус, ревизия-основа, файлы, объединённые построчно, гейты, причина отказа); браузеру (Accept: text/html) — 302 на «Настройки» системы (?pr=<номер>#repo). PR не превьюился → 404'
      responses:
        '200': {description: Превью PR, content: {application/json: {schema: {$ref: '#/components/schemas/RepoPullPreview'}}}}
        '302': {description: Настройки системы с этим PR (браузер)}
        '404': {$ref: '#/components/responses/Error'}
  /webhooks/git/github:
    post:
      operationId: githubRepoWebhook
      x-milestone: V3
      security: []
      summary: 'V3-31: вебхук GitHub App (один на приложение). Подпись X-Hub-Signature-256 (HMAC-SHA256 тела секретом приложения, сравнение за постоянное время) → иначе 401; повтор X-GitHub-Delivery — 202 {duplicate: true}; pull_request closed+merged в основную ветку и push в основную ветку → импорт в очереди; V3-32: pull_request opened/synchronize/reopened/ready_for_review в основную ветку из ветки не wizard/* → превью PR в очереди (ключ pr:<номер>), закрытие — превью closed; installation deleted/suspend, installation_repositories removed → подключение в error с причиной. Тело ≤ 5 МБ'
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: ping и события без действия}
        '202': {description: Принято}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /webhooks/git/gitlab/{linkId}:
    parameters: [{name: linkId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: gitlabRepoWebhook
      x-milestone: V3
      security: []
      summary: 'V3-31: хук проекта GitLab, созданный Wizard. X-Gitlab-Token равен секрету подключения (запечатан, сравнение за постоянное время) → иначе 401; повтор X-Gitlab-Event-UUID (или Idempotency-Key, иначе sha256 тела) — 202 {duplicate: true}; Merge Request Hook (merge в основную ветку) и Push Hook в основную ветку → импорт в очереди; V3-32: Merge Request Hook open/update/reopen в основную ветку из ветки не wizard/* → превью MR в очереди'
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Принято}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  # ==== конец блока V3-31 ====
  # ==== V3-32: агент для совместимых репозиториев (db.yaml agent_repos, agent_repo_tasks) ====
  /orgs/{orgId}/repo-agent:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getRepoAgent
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-32 (D77 (4)): репозитории организации для агента — провайдер, репозиторий, статус, отчёт о совместимости «что сможем / не сможем» (с причиной каждого «не сможем»), PR с предложением AGENTS.md, последние задачи с черновыми PR; песочница площадки (без неё JS-репозитории остаются «не проверены»). Токенов нет — только secret://repo/<провайдер>'
      responses:
        '200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/RepoAgentState'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/github:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: startRepoAgentGithub
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: адрес установки того же GitHub App платформы (права как у V3-31) с подписанным state цели «agent» (организация, пользователь, 15 мин); колбэк — /git-sync/github/setup, после него 302 на «Настройки» → «Репозитории» (?agentRepo=<id>)'
      responses:
        '200': {description: Адрес установки, content: {application/json: {schema: {type: object, required: [url], properties: {url: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/gitlab:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: startRepoAgentGitlab
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: адрес авторизации OAuth GitLab для агента (PKCE S256, scope api) — gitlab.com приложением платформы или свой GitLab с приложением владельца (Application ID/Secret запечатываются); колбэк — /git-sync/gitlab/callback'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {baseUrl: {type: [string, 'null']}, clientId: {type: [string, 'null']}, clientSecret: {type: [string, 'null'], writeOnly: true}}}}}}
      responses:
        '200': {description: Адрес авторизации, content: {application/json: {schema: {type: object, required: [url], properties: {url: {type: string}}}}}}
        '400': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/{repoId}:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}, {name: repoId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAgentRepo
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-32: один репозиторий агента — отчёт о совместимости и задачи'
      responses:
        '200': {description: Репозиторий, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRepo'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: disconnectAgentRepo
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: отключение — запись с запечатанными токенами и задачами удаляется; репозиторий клиента и его PR не трогаем'
      responses:
        '200': {description: Состояние без репозитория, content: {application/json: {schema: {$ref: '#/components/schemas/RepoAgentState'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/{repoId}/choices:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}, {name: repoId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: listAgentRepoChoices
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: репозитории для выбора — доступные установке GitHub App или проекты GitLab с правами Developer и выше'
      responses:
        '200': {description: Репозитории, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [id, path, defaultBranch, private, webUrl], properties: {id: {type: string}, path: {type: string}, defaultBranch: {type: [string, 'null']}, private: {type: boolean}, webUrl: {type: string}}}}}}}}}
        '403': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/{repoId}/repo:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}, {name: repoId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: selectAgentRepo
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: выбор репозитория — проверяется доступ и сервер клонирования; в очереди — проверка совместимости (голова основной ветки без истории, профиль, установка по lockfile, сборка и тесты в песочнице ≤ 10 мин; система Wizard — G0 и G2). Уже подключён или уже выбран → 412 VERSION_CONFLICT'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [repoId], properties: {repoId: {type: string, pattern: '^[0-9]{1,20}$'}}}}}}
      responses:
        '200': {description: Репозиторий, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRepo'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/{repoId}/check:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}, {name: repoId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: checkAgentRepo
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: «Проверить снова» — проверка совместимости в очереди (одна на репозиторий)'
      responses:
        '200': {description: Репозиторий, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRepo'}}}}
        '412': {$ref: '#/components/responses/Error'}
  /orgs/{orgId}/repo-agent/{repoId}/tasks:
    parameters: [{name: orgId, in: path, required: true, schema: {type: string, format: uuid}}, {name: repoId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: createAgentTask
      x-milestone: V3
      x-roles: [owner]
      summary: 'V3-32: задача агенту словами владельца. Только для совместимого репозитория (иначе 412 с причиной из отчёта); при нулевом внутреннем запасе — 402. Порядок: голова основной ветки → установка в песочнице (сеть только к реестру пакетов) → агент без сети (callType repo_code — только модели с инференсом в РФ, правила из AGENTS.md, CLAUDE.md, CONTRIBUTING или черновик Wizard) → сборка и тесты репозитория → техревью (детерминированные проверки и ревьюер другого семейства, repo_review) → черновой PR в ветку wizard/_agent/<дата>-<id>. Мержит только человек: автомерж этих PR не делается никогда. Модельная часть — по факту, потолок 80 ₽'
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [task], properties: {task: {type: string, minLength: 1, maxLength: 4000}}}}}}
      responses:
        '202': {description: Задача в очереди, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTask'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  # ==== конец блока V3-32 ====
components:
  securitySchemes: {devUser: {type: apiKey, in: header, name: X-Wizard-Dev-User, description: M0; только WIZARD_AUTH_MODE=dev}, session: {type: apiKey, in: cookie, name: __Host-wizard_session, description: 'M1+ (локально по http — wizard_session); + заголовок X-Wizard-CSRF для мутаций'}}
  parameters:
    systemId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    runId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    orgId: {name: orgId, in: path, required: true, schema: {type: string, format: uuid}}
    version: {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    idempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 64}}
  responses: {Error: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}}
  schemas:
    Error:
      type: object
      required: [code, message_ru]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 'M2-15 (D24_pilot_free): REGISTRATION_INVITE_ONLY — verifyOtp нового email при WIZARD_REGISTRATION=invite без приглашения основателя (CLI pilot invite) и без активного приглашения в org: «Регистрация в Wizard пока только по приглашению…»; PAYMENTS_DISABLED — startCardBinding, changeSubscription, cancelSubscription, createTopup при WIZARD_PAYMENTS=off: «Оплата на пилоте отключена — кредиты начисляет команда Wizard»; LLM_BUDGET_EXHAUSTED — новые interview_turn, build (create/change/fix) и import_table, когда Σ billable cost_rub live-вызовов llm_calls за календарный месяц (Europe/Moscow) ≥ WIZARD_LLM_MONTHLY_CAP_RUB (eval считается отдельно, eval.yaml#live_cadence.budget): «Месячный лимит платформы на работу моделей исчерпан…»'
          x-http-status:
            VALIDATION_FAILED: 400
            UNAUTHORIZED: 401
            OTP_INVALID: 401
            INSUFFICIENT_CREDITS: 402
            PLAN_LIMIT: 402
            BUILDS_LIMIT: 402
            EDITS_LIMIT: 402
            FORBIDDEN: 403
            MFA_REQUIRED: 403
            NOT_OWNER: 403
            CARD_BINDING_REQUIRED: 403
            FOUNDER_REVIEW_PENDING: 403
            ORG_SUSPENDED: 403
            REGISTRATION_INVITE_ONLY: 403
            PAYMENTS_DISABLED: 403
            NOT_FOUND: 404
            SYSTEM_LOCKED: 409
            NO_GATE_FAILURE: 409
            RUN_NOT_CANCELLABLE: 409
            RUN_NOT_WAITING_INPUT: 409
            CARD_VERSION_STALE: 409
            NO_CARD: 409
            NO_PLAN: 409
            PLAN_REVISION_STALE: 409
            PREVIEW_NOT_READY: 409
            INVITE_EXPIRED: 410
            EXPORT_LINK_USED: 410
            VERSION_CONFLICT: 412
            PAYLOAD_TOO_LARGE: 413
            UNSUPPORTED_MEDIA_TYPE: 415
            HOST_NOT_ALLOWED: 421
            OPS_INVALID: 422
            IDEMPOTENCY_MISMATCH: 422
            CONSENT_REQUIRED: 422
            LAST_OWNER: 422
            CARD_BINDING_REJECTED: 422
            OPERATOR_NAME_REQUIRED: 422
            OPERATOR_CONTACT_REQUIRED: 422
            OPERATOR_ADDRESS_REQUIRED: 422
            INN_INVALID: 422
            SELLER_REQUISITES_REQUIRED: 422
            OGRN_INVALID: 422
            PHONE_LOGIN_PLAN_REQUIRED: 422
            CARD_NOT_RU: 422
            SYSTEM_SUSPENDED: 422
            GATES_FAILED: 422
            DESTRUCTIVE_IN_PROD: 422
            DESTRUCTIVE_BLOCKED: 422
            DESTRUCTIVE_CONSEQUENCES_CHANGED: 409
            DESTRUCTIVE_UNDO_UNAVAILABLE: 409
            ROLLBACK_TARGET_INVALID: 422
            PLAN_INVALID: 422
            DEMO_REPLAY_NO_SCENARIO: 422
            RATE_LIMITED: 429
            INTERNAL: 500
            LLM_UNAVAILABLE: 503
            LLM_BUDGET_EXHAUSTED: 503
