        required: true
        content:
          application/json: {schema: {type: object, required: [email, code], properties: {email: {type: string, format: email}, code: {type: string, pattern: '^[0-9]{6}$'}, acceptOffer: {type: boolean}, pdConsent: {type: boolean, description: 'Отдельное согласие на обработку ПДн, не часть оферты'}}}}
      responses: {'200': {description: 'Set-Cookie wizard_session, wizard_csrf', content: {application/json: {schema: {type: object, properties: {user: {$ref: '#/components/schemas/User'}}}}}}, '401': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /auth/logout: {post: {operationId: logout, x-milestone: M1, responses: {'204': {description: Сессия отозвана}}}}
