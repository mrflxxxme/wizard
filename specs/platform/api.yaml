    # ==== V3-33: BYOK ====
    ByokKey:
      type: object
      description: 'V3-33: ключ организации к провайдеру моделей; сам ключ не возвращается никогда'
      required: [id, provider, providerName, model, verified, direct, gatewayHost, last4, status, check, lastUsedAt, lastErrorCode, createdAt]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        providerName: {type: string}
        model: {type: string}
        verified: {type: boolean, description: 'false → в интерфейсе «не проверена нами»; гейты и техревью работают как обычно'}
        direct: {type: boolean, description: 'true — провайдер принимает запросы из РФ и вызывается напрямую; false — через шлюз пользователя'}
        gatewayHost: {type: [string, 'null']}
        last4: {type: string, minLength: 4, maxLength: 4}
        status: {enum: [active, paused, revoked]}
        check:
          type: object
          required: [status, code, message_ru, checkedAt]
          properties:
            status: {enum: [pending, ok, failed]}
            code: {enum: [KEY_INVALID, NO_BALANCE, RATE_LIMITED, REGION_BLOCKED, MODEL_NOT_FOUND, UNREACHABLE, PROVIDER_ERROR, KMS_UNAVAILABLE, null]}
            message_ru: {type: [string, 'null']}
            checkedAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        lastErrorCode: {type: [string, 'null'], description: код ошибки последнего вызова без тела ответа}
        createdAt: {type: string, format: date-time}
    ByokState:
      type: object
      description: 'V3-33: состояние своих ключей организации; при available=false остальных полей нет'
      required: [available]
      properties:
        available: {type: boolean}
        consent:
          type: object
          required: [version, title, paragraphs, acceptedAt]
          properties:
            version: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[.][0-9]+$'}
            title: {type: string}
            paragraphs: {type: array, items: {type: string}}
            acceptedAt: {type: [string, 'null'], format: date-time, description: 'null — согласия на эту версию текста нет'}
        providers:
          type: array
          items:
            type: object
            required: [id, name, direct, location, verifiedModels, suggestedModels]
            properties:
              id: {type: string}
              name: {type: string}
              direct: {type: boolean}
              location: {enum: [ru, foreign]}
              verifiedModels: {type: array, items: {type: string}}
              suggestedModels: {type: array, items: {type: string}}
        keys: {type: array, items: {$ref: '#/components/schemas/ByokKey'}}
        callTypes: {type: array, items: {type: string}, description: 'этапы сборки, которые могут идти на своём ключе (packages/llm BYOK_CALL_TYPES)'}
    # ==== V3-21: окно ключа в чате ====
    SecretWindow:
      type: object
      description: 'V3-21: окно ключа (db.yaml#secret_windows) без ключевого материала'
      required: [id, env, name, secretRef, integrationId, integrationName, hosts, purpose, requestedBy, status, expiresAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        env: {enum: [draft, prod]}
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        secretRef: {type: string, pattern: '^secret://[a-z0-9_]+$', description: 'всё, что видит модель'}
        integrationId: {type: [string, 'null']}
        integrationName: {type: [string, 'null']}
        hosts: {type: array, minItems: 1, items: {type: string}, description: 'куда уйдёт ключ (D37) — окно показывает их владельцу'}
        purpose: {type: string}
        requestedBy: {enum: [agent, user]}
        status: {enum: [open, filled, cancelled, expired]}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    SecretWindowKey:
      description: 'V3-21: открытое окно с тем, что нужно браузеру для шифрования'
      allOf:
        - {$ref: '#/components/schemas/SecretWindow'}
        - type: object
          required: [alg, publicKey, context, form]
          properties:
            alg: {const: ECDH-ES+HKDF-SHA256+A256GCM}
            publicKey: {type: object, required: [kty, crv, x, y], properties: {kty: {const: EC}, crv: {const: P-256}, x: {type: string}, y: {type: string}}}
            context: {type: string, description: 'wz-key-window/v1:<окно>:<система>:<env>:<имя> — дополнительные данные AES-GCM и info HKDF (соль HKDF — id окна)'}
            form:
              description: 'V3-22: поля паспорта API (контракт source.kind = passport). Браузер шифрует {"fields": {ключ: значение}} вместо одного ключа; платформа собирает ключ (passportKey: Basic ЮKassa, код вебхука Битрикс24, у СДЭК — Account и Secure password одним значением oauth2cc:, токен получает runtime). У API с аккаунтом (amoCRM, Битрикс24) хост получателя — аккаунт из поля account.field: страница показывает его по мере ввода, контракт пересобирается под аккаунт до проверки. null — один ключ'
              oneOf:
                - {type: 'null'}
                - type: object
                  required: [passport, name, where_ru, compose, fields, account]
                  properties:
                    passport: {type: string}
                    name: {type: string}
                    where_ru: {type: string}
                    compose: {enum: [plain, basic, oauth_client_credentials, webhook_url]}
                    fields: {type: array, items: {type: object, required: [key, label_ru, hint_ru, example, pattern, flags, error_ru, secret], properties: {key: {type: string}, label_ru: {type: string}, hint_ru: {type: string}, example: {type: string}, pattern: {type: [string, 'null']}, flags: {type: string}, error_ru: {type: [string, 'null']}, secret: {type: boolean}}}}
                    account: {oneOf: [{type: 'null'}, {type: object, required: [label_ru, example, suffixes, customHost, reserved, field], properties: {label_ru: {type: string}, example: {type: string}, suffixes: {type: array, items: {type: string}}, customHost: {type: boolean}, reserved: {type: array, items: {type: string}}, field: {type: string}}}]}
    SealedSecret:
      type: object
      description: 'V3-21: ключ, зашифрованный в браузере: эфемерный публичный ключ P-256, nonce 12 байт и шифртекст в base64url'
      required: [v, alg, epk, iv, ct]
      additionalProperties: false
      properties:
        v: {const: 1}
        alg: {const: ECDH-ES+HKDF-SHA256+A256GCM}
        epk: {type: object, required: [kty, crv, x, y], additionalProperties: false, properties: {kty: {const: EC}, crv: {const: P-256}, x: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}, y: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}}}
        iv: {type: string, pattern: '^[A-Za-z0-9_-]{16}$'}
        ct: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 6000}
    SystemSecret:
      type: object
      description: 'V3-21: ключ системы (db.yaml#secret_bindings) — куда ему можно, последние 4 символа, версия, проверка; значения нет'
      required: [name, secretRef, env, integrationId, integrationName, hosts, last4, version, status, check, rotatedAt, createdAt]
      properties:
        name: {type: string}
        secretRef: {type: string, pattern: '^secret://[a-z0-9_]+$'}
        env: {enum: [draft, prod]}
        integrationId: {type: [string, 'null']}
        integrationName: {type: [string, 'null']}
        hosts: {type: array, items: {type: string}}
        last4: {type: string, maxLength: 4, description: 'пусто у ключей короче 12 символов'}
        version: {type: integer, minimum: 1}
        status: {enum: [unchecked, ok, failed]}
        check: {type: object, required: [code, message_ru, checkedAt], properties: {code: {type: [string, 'null']}, message_ru: {type: [string, 'null']}, checkedAt: {type: [string, 'null'], format: date-time}}}
        rotatedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    SecretCheckLine:
      type: object
      description: 'V3-21: проверка ключа одной интеграцией (onIntegrationKey V3-20)'
      required: [integrationId, ok, status, message_ru]
      properties:
        integrationId: {type: string}
        ok: {type: boolean}
        status: {enum: [mock, live, failed]}
        message_ru: {type: string}
        code: {type: string}
    # ==== V3-31: синхронизация репозитория ====
    RepoSyncState:
      type: object
      description: 'V3-31: подключение системы к GitHub или GitLab и состояние синхронизации; токенов нет'
      required: [available, providers, link, prs, imports, queue, publishGate]
      properties:
        available: {type: boolean, description: 'false — функция выключена на платформе (WIZARD_GIT_SYNC=off или нет KMS)'}
        providers: {type: object, required: [github, gitlab, gitlabSelfManaged], properties: {github: {type: boolean}, gitlab: {type: boolean, description: gitlab.com приложением платформы}, gitlabSelfManaged: {type: boolean}}}
        link:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, provider, status, statusRu, hostUrl, repo, autoMerge, secretRef, lastSyncAt, lastError, remoteHead, lastPushedRevision, connectedAt]
              properties:
                id: {type: string, format: uuid}
                provider: {enum: [github, gitlab]}
                status: {enum: [pending, active, paused, error]}
                statusRu: {type: string}
                hostUrl: {type: string}
                repo: {oneOf: [{type: 'null'}, {type: object, required: [id, path, webUrl, defaultBranch], properties: {id: {type: string}, path: {type: string}, webUrl: {type: [string, 'null']}, defaultBranch: {type: string}}}]}
                autoMerge: {type: boolean}
                secretRef: {type: string, pattern: '^secret://repo/[a-z]+$'}
                lastSyncAt: {type: [string, 'null'], format: date-time}
                lastError: {oneOf: [{type: 'null'}, {type: object, required: [code, message_ru], properties: {code: {type: string}, message_ru: {type: string}}}]}
                remoteHead: {oneOf: [{type: 'null'}, {type: object, required: [oid, revision], properties: {oid: {type: string, pattern: '^[0-9a-f]{40}$'}, revision: {type: [integer, 'null'], description: 'ревизия Wizard, которой соответствует голова основной ветки'}}}]}
                lastPushedRevision: {type: integer}
                connectedAt: {type: string, format: date-time}
        prs:
          type: array
          items:
            type: object
            required: [revision, number, url, branch, state, checks, createdAt]
            properties:
              revision: {type: integer}
              number: {type: [integer, 'null'], description: 'null — первая отправка прямо в основную ветку пустого репозитория (state direct)'}
              url: {type: [string, 'null']}
              branch: {type: string, description: 'wizard/<slug>/<ревизия>'}
              state: {enum: [open, merged, closed, superseded, direct]}
              checks: {type: array, items: {type: object, required: [key, state, title], properties: {key: {enum: [G0, G1, G2, techreview]}, state: {enum: [pending, success, failure, neutral]}, title: {type: string}}}}
              createdAt: {type: string, format: date-time}
        imports:
          type: array
          items:
            type: object
            required: [headOid, status, revision, baseRevision, prNumber, reason_ru, warnings, createdAt]
            properties:
              headOid: {type: string, pattern: '^[0-9a-f]{40}$'}
              status: {enum: [pending, noop, imported, rejected]}
              revision: {type: [integer, 'null'], description: новая ревизия импорта}
              baseRevision: {type: [integer, 'null']}
              prNumber: {type: [integer, 'null']}
              reason_ru: {type: [string, 'null'], description: 'причина отказа: конфликт, несовместимые изменения, спека, гейт'}
              warnings: {type: array, items: {type: string}}
              createdAt: {type: string, format: date-time}
        queue: {type: object, required: [waiting, failing, stopped, nextAttemptAt], properties: {waiting: {type: integer}, failing: {type: integer, description: ждут повтора после ошибки}, stopped: {type: integer, description: 'остановлены после 10 попыток или до действия владельца'}, nextAttemptAt: {type: [string, 'null'], format: date-time}}}
        publishGate: {type: object, required: [required, mergedRevision], properties: {required: {type: boolean, description: 'true — публикация ревизии только после мержа её PR'}, mergedRevision: {type: [integer, 'null'], description: 'последняя ревизия, которая есть в основной ветке'}}}
        pulls: {type: array, description: 'V3-32: превью открытых PR разработчиков (последние 10)', items: {$ref: '#/components/schemas/RepoPullPreview'}}
    RepoPullPreview:
      type: object
      description: 'V3-32: превью PR разработчиков до мержа — система с изменениями PR прошла (или нет) G0 → G1 → G2; в систему ничего не записано'
      required: [number, url, branch, headOid, status, statusRu, baseRevision, reason_ru, gates, files, merged, previewUrl, updatedAt]
      properties:
        number: {type: integer}
        url: {type: [string, 'null']}
        branch: {type: [string, 'null']}
        headOid: {type: string, pattern: '^[0-9a-f]{40}$'}
        status: {enum: [pending, passed, failed, rejected, noop, closed]}
        statusRu: {type: string}
        baseRevision: {type: [integer, 'null'], description: 'ревизия Wizard, на которой основана ветка PR'}
        reason_ru: {type: [string, 'null'], description: 'причина: ветка не от синхронизированной основной, несовместимые изменения, конфликт (с номерами строк), спека, гейт'}
        gates: {type: array, items: {type: object, required: [level, state, title], properties: {level: {enum: [G0, G1, G2]}, state: {enum: [success, failure, neutral]}, title: {type: string}}}}
        files: {type: array, items: {type: object, required: [path, status], properties: {path: {type: string}, status: {enum: [added, modified, deleted]}}}}
        merged: {type: array, items: {type: string}, description: 'файлы, объединённые построчно с правками Wizard'}
        previewUrl: {type: string}
        updatedAt: {type: string, format: date-time}
    # ==== V3-32: агент для совместимых репозиториев ====
    RepoAgentState:
      type: object
      required: [available, providers, sandbox, repos]
      properties:
        available: {type: boolean, description: 'false — агент выключен (WIZARD_REPO_AGENT=off) или нет подключения провайдеров и KMS'}
        providers: {type: object, required: [github, gitlab, gitlabSelfManaged], properties: {github: {type: boolean}, gitlab: {type: boolean}, gitlabSelfManaged: {type: boolean}}}
        sandbox: {type: object, required: [available, kind, note_ru], properties: {available: {type: boolean}, kind: {type: [string, 'null']}, note_ru: {type: [string, 'null']}}}
        repos: {type: array, items: {$ref: '#/components/schemas/AgentRepo'}}
    AgentRepo:
      type: object
      required: [id, provider, status, statusRu, hostUrl, repo, secretRef, headOid, checkedAt, compat, rulesPr, lastError, tasks, connectedAt]
      properties:
        id: {type: string, format: uuid}
        provider: {enum: [github, gitlab]}
        status: {enum: [pending, checking, ready, incompatible, unchecked, error]}
        statusRu: {type: string}
        hostUrl: {type: string}
        repo: {oneOf: [{type: 'null'}, {type: object, required: [id, path, webUrl, defaultBranch], properties: {id: {type: string}, path: {type: string}, webUrl: {type: [string, 'null']}, defaultBranch: {type: string}}}]}
        secretRef: {type: string, pattern: '^secret://repo/[a-z]+$'}
        headOid: {type: [string, 'null']}
        checkedAt: {type: [string, 'null'], format: date-time}
        compat: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/CompatReport'}]}
        rulesPr: {type: [string, 'null'], description: 'PR с предложением AGENTS.md, когда правил в репозитории нет'}
        lastError: {oneOf: [{type: 'null'}, {type: object, required: [code, message_ru], properties: {code: {type: string}, message_ru: {type: string}}}]}
        tasks: {type: array, items: {$ref: '#/components/schemas/AgentTask'}}
        connectedAt: {type: string, format: date-time}
    CompatReport:
      type: object
      description: 'V3-32: отчёт о совместимости (@wizard/agents/repo compatReport)'
      required: [version, verdict, kind, summary_ru, can, cannot, stack, sandbox, rules, developmentRequest, blocking_ru]
      properties:
        version: {const: 1}
        verdict: {enum: [compatible, partial, incompatible, unchecked]}
        kind: {enum: [wizard_system, js_web, js_monorepo, js_other, php, bitrix, onec, mobile, other_stack, empty]}
        summary_ru: {type: string}
        can: {type: array, items: {type: string}, description: 'что сможем'}
        cannot: {type: array, items: {type: object, required: [what_ru, why_ru], properties: {what_ru: {type: string}, why_ru: {type: string}}}, description: 'что не сможем — с причиной'}
        stack: {type: object, required: [frameworks, packageManager, lockfile, typescript, monorepo, node], properties: {frameworks: {type: array, items: {type: string}}, packageManager: {type: [string, 'null']}, lockfile: {type: [string, 'null']}, typescript: {type: boolean}, monorepo: {type: boolean}, node: {type: [string, 'null']}}}
        sandbox: {oneOf: [{type: 'null'}, {type: object, required: [status, steps, totalMs], properties: {status: {enum: [passed, failed, timeout, unavailable]}, totalMs: {type: integer}, reason_ru: {type: string}, steps: {type: array, items: {type: object, required: [step, command, ok, timedOut, durationMs, tail], properties: {step: {enum: [install, build, test]}, command: {type: string}, ok: {type: boolean}, timedOut: {type: boolean}, durationMs: {type: integer}, tail: {type: string}}}}}}]}
        rules: {type: array, items: {type: string}, description: 'AGENTS.md, CLAUDE.md, CONTRIBUTING, найденные в репозитории'}
        developmentRequest: {oneOf: [{type: 'null'}, {type: object, required: [category, quote], properties: {category: {enum: [mobile, other]}, quote: {type: string}}}]}
        blocking_ru: {type: [string, 'null'], description: 'почему агент не берёт задачи (несовместим или не проверено) — первая такая причина; null — берёт'}
    AgentTask:
      type: object
      required: [id, kind, kindRu, status, statusRu, task_ru, branch, pr, summary_ru, error_ru, costRub, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [check, rules, change]}
        kindRu: {type: string}
        status: {enum: [queued, running, done, failed]}
        statusRu: {type: string}
        task_ru: {type: [string, 'null']}
        branch: {type: [string, 'null'], description: 'wizard/_agent/<дата>-<id> или wizard/_agent/rules-<id>'}
        pr: {oneOf: [{type: 'null'}, {type: object, required: [number, url, draft], properties: {number: {type: integer}, url: {type: string}, draft: {type: boolean, description: 'false — тариф репозитория без черновых PR (GitHub Free, приватный): обычный PR с «Черновик:» в заголовке; мержит всё равно только человек'}}}]}
        summary_ru: {type: [string, 'null']}
        error_ru: {type: [string, 'null']}
        costRub: {type: number}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
