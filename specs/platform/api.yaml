# OpenAPI 3.1 платформы Wizard. Нормативно для apps/platform-api. Компактная запись (flow-style) намеренна.
# Вехи операций — x-milestone (M0/M1/M2); права ролей организации — x-roles; авторизация — info.x-auth.
openapi: 3.1.0
info:
  title: Wizard platform-api
  version: 1.0.0
  description: 'Нормативный контракт apps/platform-api (backlog M0-15, M1-02..M1-04, M1-07, M2-07..M2-09). Каждая операция помечена x-milestone; контрактный тест M0-15 покрывает все операции с x-milestone ≤ текущей вехи. Правила: все тела — JSON (кроме SSE и /files); все пользовательские тексты в ответах — на русском; идентификаторы — uuid; время — RFC 3339 UTC; кредиты в API — число с точностью 0.001 (= милликредит, billing.yaml#credit.unit), округление до 0.1 — только в UI. Тексты, пришедшие от LLM (сообщения агентов, карточка, message_ru гейтов), клиент MUST показывать только как текст или санированный markdown без raw HTML (L3-17). Обращение к объекту чужой организации (system, run, revision, file, events, export) → 404 NOT_FOUND, не 403 (контрактный IDOR-тест M0-15/M1-02). Мутирующие POST принимают заголовок Idempotency-Key (≤ 64 символа): повтор с тем же ключом и тем же телом в течение 24 ч MUST вернуть исходный ответ; с другим телом — 422 IDEMPOTENCY_MISMATCH. Авторизация по вехам — x-auth. Права ролей организации — x-roles (owner ⊃ editor ⊃ viewer, product.yaml#decisions.D11_team).

    '
  x-auth:
    M0: 'Один локальный пользователь. Заголовок X-Wizard-Dev-User: <email>; если заголовка нет — пользователь по умолчанию dev@wizard.local. Организация одна, id из сида 00000000-0000-0000-0000-000000000001. Сервер MUST слушать только 127.0.0.1, если WIZARD_AUTH_MODE=dev. MUST (L3-10, deploy.yaml#local.host_guard): Host вне {localhost, 127.0.0.1, [::1], *.localhost} → 421 HOST_NOT_ALLOWED; заголовки X-Forwarded-*, Forwarded, CF-* → 403 FORBIDDEN; не-GET с Origin ≠ WIZARD_PLATFORM_ORIGIN → 403.'
    M1: 'Email OTP → cookie __Host-wizard_session (локально по http — wizard_session; HttpOnly, Secure, Path=/, без Domain, SameSite=Lax, 30 дней скользящий срок; deploy.yaml#cloud.domains.cookies). Мутирующие запросы MUST содержать заголовок X-Wizard-CSRF, равный cookie __Host-wizard_csrf (double submit), и Origin платформы. Режим dev остаётся только при WIZARD_AUTH_MODE=dev и запрещён при NODE_ENV=production (тест: старт процесса падает).'
    M2: '+ staff: users.is_staff=true, MFA (TOTP) обязательна: без users.mfa_enrolled_at или без TOTP-подтверждения за последние 12 ч /admin/* → 403 MFA_REQUIRED. В бете staff — учётная запись основателя (F7); все действия /admin/* пишутся в staff_audit_log.'
servers: [{url: 'http://localhost:4000/api/v1', description: M0–M1 локально}]
security: [{devUser: []}, {session: []}]
paths:
  /systems:
    post:
      operationId: createSystem
      x-milestone: M0
      x-roles: [editor]
      summary: Создать систему из промпта; запускает прогон interview_turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              additionalProperties: false
              properties: {prompt: {type: string, minLength: 3, maxLength: 8000}, orgId: {type: string, format: uuid, description: 'M1+: обязателен, если пользователь состоит в нескольких организациях'}, templateId: {type: string}}
      responses:
        '201': {description: 'Система создана, первый ход интервью поставлен в очередь', content: {application/json: {schema: {type: object, required: [system, run], properties: {system: {$ref: '#/components/schemas/System'}, run: {$ref: '#/components/schemas/Run'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    get:
      operationId: listSystems
      x-milestone: M0
      x-roles: [viewer]
      parameters: [{name: orgId, in: query, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/limit'}, {$ref: '#/components/parameters/cursor'}]
      responses: {'200': {description: 'Системы организации, новые сверху (не удалённые)', content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/System'}}, nextCursor: {type: [string, 'null']}}}}}}}
  /systems/{id}:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getSystem
      x-milestone: M0
      x-roles: [viewer]
      responses:
        '200':
          description: Система, текущая карточка и последние сообщения чата
          content:
            application/json:
              schema:
                type: object
                required: [system, messages]
                properties:
                  system: {$ref: '#/components/schemas/System'}
                  card: {oneOf: [{$ref: '#/components/schemas/SystemCard'}, {type: 'null'}]}
                  pendingQuestions: {type: array, items: {$ref: '#/components/schemas/Question'}}
                  messages: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Message'}}
                  activeRunId: {type: [string, 'null'], format: uuid}
                  publishBlockers: {type: array, items: {type: string, enum: [CARD_BINDING_REQUIRED, OPERATOR_NAME_REQUIRED, OPERATOR_CONTACT_REQUIRED, OPERATOR_ADDRESS_REQUIRED, PHONE_LOGIN_PLAN_REQUIRED, FOUNDER_REVIEW_PENDING, GATES_FAILED, PLAN_LIMIT, NOT_OWNER, SYSTEM_SUSPENDED]}, description: M1+; пусто — публиковать можно}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/messages:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: postMessage
      x-milestone: M0
      x-roles: [editor]
      summary: Ход чата. Запускает interview_turn; исход хода — вопросы, карточка, ответ или change-прогон (workflows.yaml#workflows.interview_turn)
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: {type: string, minLength: 1, maxLength: 8000}
                target:
                  type: object
                  x-milestone: M3
                  description: '«Укажи и измени» (M3-01): элемент превью; формат wzId — ui/ui-kit.yaml#wz_id (L1-05). file MUST быть файлом draft-ревизии, иначе 422 VALIDATION_FAILED. Хранится в messages.payload.target'
                  required: [wzId, file]
                  additionalProperties: false
                  properties: {wzId: {type: string, pattern: '^[0-9a-f]{8}:[0-9]+$'}, componentName: {type: string, maxLength: 60}, file: {type: string, pattern: '^ui/[A-Za-z0-9_/.-]+\.tsx$'}, line: {type: integer, minimum: 1}}
      responses: {'202': {description: 'Принято. Уведомление о ПДн создаёт асинхронный interview_turn (приходит через SSE chat_output{kind: notice}), в этом ответе его нет', content: {application/json: {schema: {type: object, required: [message, run], properties: {message: {$ref: '#/components/schemas/Message'}, run: {$ref: '#/components/schemas/Run'}}}}}}, '402': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
    get:
      operationId: listMessages
      x-milestone: M0
      x-roles: [viewer]
      parameters: [{$ref: '#/components/parameters/limit'}, {name: beforeSeq, in: query, schema: {type: integer}}]
      responses: {'200': {description: История чата, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Message'}}}}}}}}
  /systems/{id}/answers:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: postAnswers
      x-milestone: M0
      x-roles: [editor]
      summary: Ответы на вопросы-развилки; restByRecommendation=true принимает рекомендованный вариант для всех неотвеченных
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answers: {type: array, items: {type: object, required: [questionId], additionalProperties: false, properties: {questionId: {type: string}, optionId: {type: string}, text: {type: string, maxLength: 500, description: 'Свой вариант; ровно одно из optionId/text. forkId и byRecommendation дописывает сервер из pending_questions (orchestrator.yaml#schemas.Answer)'}}}}
                restByRecommendation: {type: boolean, default: false}
      responses: {'202': {description: 'Ответы сохранены, запущен interview_turn', content: {application/json: {schema: {type: object, required: [run], properties: {run: {$ref: '#/components/schemas/Run'}}}}}}, '402': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /systems/{id}/card/approve:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: approveCard
      x-milestone: M0
      x-roles: [editor]
      summary: 'Единственная точка согласования (D7): карточка системы или мини-карточка правки. Запускает build (create или change)'
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [cardVersion], additionalProperties: false, properties: {cardVersion: {type: integer, minimum: 1}, capCredits: {type: integer, minimum: 1, description: Можно только понизить cap.credits карточки; не ниже ceil(estimate.credits.expected)}}}}
      responses:
        '202': {description: Сборка поставлена в очередь (status queued или waiting_lock), content: {application/json: {schema: {type: object, required: [run], properties: {run: {$ref: '#/components/schemas/Run'}}}}}}
        '402': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /systems/{id}/fix:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: startFixBuild
      x-milestone: M0
      x-roles: [editor]
      summary: '«Исправить» после неуспешной сборки или непройденного гейта: build mode=fix (workflows.yaml#workflows.build, L1-25). cap — по правилу workflows.yaml#workflows.build.trigger'
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {}}}}}
      responses:
        '202': {description: Прогон build mode=fix поставлен в очередь, content: {application/json: {schema: {type: object, required: [run], properties: {run: {$ref: '#/components/schemas/Run'}}}}}}
        '402': {$ref: '#/components/responses/Error'}
        '409': {description: 'SYSTEM_LOCKED или NO_GATE_FAILURE (последние отчёты гейтов пройдены — исправлять нечего)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listRevisions
      x-milestone: M0
      x-roles: [viewer]
      parameters: [{$ref: '#/components/parameters/limit'}, {name: beforeVersion, in: query, schema: {type: integer}}]
      responses: {'200': {description: 'Ревизии, новые сверху', content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/RevisionSummary'}}}}}}}}
  /systems/{id}/revisions/{v}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {$ref: '#/components/parameters/version'}]
    get:
      operationId: getRevision
      x-milestone: M0
      x-roles: [viewer]
      responses:
        '200':
          description: Спека, операции батча и список файлов ревизии
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/RevisionSummary'}
                - type: object
                  required: [spec, ops, files]
                  properties:
                    spec: {type: object, description: 'AppSpec, specs/appspec/appspec.schema.json'}
                    ops: {type: array, items: {type: object}, description: specs/appspec/ops.yaml}
                    files: {type: array, items: {type: object, required: [path, sha256, size], properties: {path: {type: string}, sha256: {type: string}, size: {type: integer}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/revisions/{v}/diff:
    parameters: [{$ref: '#/components/parameters/systemId'}, {$ref: '#/components/parameters/version'}]
    get:
      operationId: getRevisionDiff
      x-milestone: M1
      x-roles: [viewer]
      summary: Понятный diff (M1-08) между from (по умолчанию parent) и v
      parameters: [{name: from, in: query, schema: {type: integer}}]
      responses:
        '200':
          description: Изменения на человеческом языке
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties: {changes: {type: array, items: {type: object, required: [kind, text_ru], properties: {kind: {enum: [entity, field, role, permission, page, workflow, integration, function, theme, compliance, file]}, text_ru: {type: string}, destructive: {type: boolean}}}}}
  /systems/{id}/files/{path}:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getFile
      x-milestone: M0
      x-roles: [viewer]
      x-path-wildcard: 'path захватывает остаток URL со слешами (hono: /systems/:id/files/*). ''..'', абсолютные пути и NUL → 400'
      summary: Исходник файла ревизии (вкладка «Код», только чтение, D14)
      parameters: [{name: path, in: path, required: true, schema: {type: string}}, {name: rev, in: query, schema: {type: integer}, description: По умолчанию draftRevision}]
      responses: {'200': {description: 'Содержимое; ETag = sha256. MUST (L3-17): текстовые файлы — Content-Type text/plain; charset=utf-8, остальные — application/octet-stream с Content-Disposition attachment; всегда X-Content-Type-Options nosniff и CSP sandbox', content: {text/plain: {schema: {type: string}}, application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}}, '404': {$ref: '#/components/responses/Error'}}
  /systems/{id}/style:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: setStyle
      x-milestone: M0
      x-roles: [editor]
      summary: Панель «Стиль» — op set_theme без LLM и без кредитов (D13). Превью меняется без пересборки (CSS-переменные)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expectedVersion, theme], additionalProperties: false, properties: {expectedVersion: {type: integer}, theme: {type: object, description: appspec.schema.json#/$defs/theme}}}}}}
      responses:
        '200': {description: Создана ревизия author=user, content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {$ref: '#/components/schemas/RevisionSummary'}}}}}}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /systems/{id}/assets:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: uploadAsset
      x-milestone: M0
      x-roles: [editor]
      summary: 'Загрузка логотипа для панели «Стиль» (D13, L1-34, L4-26). Только PNG и WebP ≤ 1 МБ, тип определяется по сигнатуре файла (не по имени и Content-Type); SVG, HTML и прочее → 415 UNSUPPORTED_MEDIA_TYPE (security/isolation.yaml#user_files.logo, L3-18). Сервер перекодирует изображение (растеризация, ≤ 512×512, метаданные удаляются) и кладёт блоб в platform.files; новая ревизия kind=style содержит файл assets/logo.<ext> и theme.logoFile = этот путь (op set_theme, runtime раздаёт как статику бандла). Без кредитов'
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file, expectedVersion], properties: {file: {type: string, contentMediaType: application/octet-stream}, purpose: {const: logo}, expectedVersion: {type: integer}}}}}}
      responses:
        '201': {description: Создана ревизия kind=style с логотипом, content: {application/json: {schema: {type: object, required: [path, sha256, revision], properties: {path: {type: string, pattern: '^assets/logo\.(png|webp)$'}, sha256: {type: string}, width: {type: integer}, height: {type: integer}, revision: {$ref: '#/components/schemas/RevisionSummary'}}}}}}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /systems/{id}/compliance:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    put:
      operationId: setCompliance
      x-milestone: M1
      x-roles: [owner]
      summary: Данные оператора ПДн (op set_compliance, без кредитов); security/compliance.yaml. Экран — S10 «Персональные данные»
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expectedVersion, operatorName, operatorContact], additionalProperties: false, properties: {expectedVersion: {type: integer}, operatorName: {type: string, minLength: 3, maxLength: 300}, operatorContact: {type: string, format: email}, operatorAddress: {type: string, maxLength: 300, description: 'M2: адрес оператора для политики (обязателен до prod с M2 — compliance.yaml#system_package.operator)'}, operatorInn: {type: string, pattern: '^[0-9]{10}([0-9]{2})?$'}, policyPage: {type: string, pattern: '^/[a-z0-9/-]*$', description: 'Маршрут страницы политики (по умолчанию /privacy)'}, consentTemplateId: {type: string}, consentText: {type: string, maxLength: 4000, description: 'Свой текст согласия — только owner (compliance.yaml#system_package.consent.text)'}, retentionWaiver: {type: [object, 'null'], additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}}}}}
      responses: {'200': {description: Ревизия создана, content: {application/json: {schema: {type: object, properties: {revision: {$ref: '#/components/schemas/RevisionSummary'}}}}}}, '412': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /systems/{id}/preview-url:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getPreviewUrl
      x-milestone: M0
      x-roles: [viewer]
      summary: URL превью draft для iframe с dev-входом под ролью системы
      parameters: [{name: role, in: query, schema: {type: string}, description: Имя роли AppSpec; по умолчанию public-роль или первая}]
      responses:
        '200':
          description: 'M0: http://<slug>--draft.localhost:4100/_wizard/dev-login?role=<role>&next=/ без токена (runtime.yaml#auth.dev_login_M0, WIZARD_DEV_LOGIN=1). M2 (облако): https://<slug>--draft.<systems-domain>/_wizard/preview-login?t=<token>&next=<path>, token = HMAC(WIZARD_PREVIEW_SECRET) над {systemId, env: draft, role, revision, platformUserId, exp ≤ 15 мин, nonce}, nonce одноразовый (runtime.yaml#auth.preview_login_M2); без него draft-хост отдаёт 404. next — только путь по ^/(?![/\\]) (L3-11)'
          content:
            application/json:
              schema:
                type: object
                required: [url, revision, roles, expiresAt]
                properties: {url: {type: string, format: uri}, revision: {type: integer}, roles: {type: array, items: {type: object, properties: {name: {type: string}, label: {type: string}}}}, expiresAt: {type: string, format: date-time}}
        '409': {$ref: '#/components/responses/Error'}
  /systems/{id}/gates/latest:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getLatestGates
      x-milestone: M0
      x-roles: [viewer]
      responses:
        '200':
          description: 'Последние отчёты гейтов по draft: для каждого level — строка platform.gate_reports с max(revision) (db.yaml#gate_reports); форма GateReport — specs/quality/gates.yaml#report'
          content: {application/json: {schema: {type: object, required: [revision, reports], properties: {revision: {type: integer}, runId: {type: string, format: uuid}, reports: {type: array, items: {$ref: '#/components/schemas/GateReport'}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/lock:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get: {operationId: getLock, x-milestone: M1, x-roles: [viewer], responses: {'200': {description: Статус «кто меняет», content: {application/json: {schema: {$ref: '#/components/schemas/LockStatus'}}}}}}
    delete: {operationId: forceReleaseLock, x-milestone: M1, x-roles: [owner], summary: Принудительно снять блокировку (отменяет держащий прогон), responses: {'204': {description: Снята}}}
  /systems/{id}/publish:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: publish
      x-milestone: M1
      x-roles: [owner]
      summary: Публикация ревизии в prod (workflows.yaml#workflows.publish). M2+ требует карту РФ и прохождение G2
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision], additionalProperties: false, properties: {revision: {type: integer}, confirmDiff: {type: boolean, const: true, description: Пользователь видел diff}}}}}}
      responses:
        '202': {description: Прогон publish поставлен в очередь, content: {application/json: {schema: {type: object, properties: {run: {$ref: '#/components/schemas/Run'}}}}}}
        '402': {description: 'PLAN_LIMIT (лимит prod-систем тарифа, billing.yaml#plans.enforcement)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /systems/{id}/rollback:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: rollback
      x-milestone: M1
      x-roles: [editor]
      summary: 'env=draft: новая ревизия со спекой и файлами toRevision (editor достаточно; «Отменить» в S7). env=prod: переключение на ранее опубликованную ревизию без DDL — только owner, иначе 403 NOT_OWNER'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [env, toRevision], additionalProperties: false, properties: {env: {enum: [draft, prod]}, toRevision: {type: integer}}}}}}
      responses: {'202': {description: Прогон rollback, content: {application/json: {schema: {type: object, properties: {run: {$ref: '#/components/schemas/Run'}}}}}}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /systems/{id}/publications:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get: {operationId: listPublications, x-milestone: M1, x-roles: [viewer], responses: {'200': {description: История публикаций, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Publication'}}}}}}}}}
  /systems/{id}/imports:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: createImport
      x-milestone: M1
      x-roles: [editor]
      summary: 'Загрузка xlsx/csv ≤ 20 МБ. Значения обрабатываются только в РФ (data-boundary.yaml#import). MUST (L3-37): парсер xlsx — библиотека MIT/Apache без исполнения формул (берутся кешированные значения), распакованный размер ≤ 100 МБ и ≤ 1 млн ячеек (иначе 413), внешние связи и макросы игнорируются. Кнопка на S1 доступна только после создания системы (L1-54)'
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, contentMediaType: application/octet-stream}}}}}}
      responses: {'202': {description: Прогон import_table (профиль → маппинг), content: {application/json: {schema: {type: object, properties: {importId: {type: string, format: uuid}, run: {$ref: '#/components/schemas/Run'}}}}}}, '413': {$ref: '#/components/responses/Error'}}
  /systems/{id}/imports/{importId}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: importId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getImport
      x-milestone: M1
      x-roles: [editor]
      summary: 'Экран сопоставления колонок (M1-12): профиль колонок БЕЗ значений (data-boundary.yaml#import) и предложенный маппинг'
      responses: {'200': {description: Импорт, content: {application/json: {schema: {type: object, required: [id, status], properties: {id: {type: string, format: uuid}, status: {enum: [profiling, mapping, awaiting_confirm, importing, done, failed, expired]}, runId: {type: [string, 'null'], format: uuid}, inputId: {type: [string, 'null'], description: 'needs_input для подтверждения (decisionId=import_confirm)'}, profile: {type: array, items: {type: object, properties: {column: {type: string}, typeGuess: {type: string}, piiKindGuess: {type: [string, 'null']}, nullShare: {type: number}, distinct: {type: integer}}}}, mapping: {type: array, items: {$ref: '#/components/schemas/ImportColumnMapping'}}, rowsImported: {type: [integer, 'null']}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /systems/{id}/imports/{importId}/mapping:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: importId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: updateImportMapping
      x-milestone: M1
      x-roles: [editor]
      summary: 'Правка маппинга до подтверждения (status=awaiting_confirm); подтверждение — POST /runs/:id/input {inputId, choice: confirm}'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [mapping], additionalProperties: false, properties: {mapping: {type: array, items: {$ref: '#/components/schemas/ImportColumnMapping'}}}}}}}
      responses: {'200': {description: Маппинг сохранён}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /systems/{id}/exports:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: createExport
      x-milestone: M2
      x-roles: [owner]
      summary: 'Выгрузка данных (M2-10, L4-08): прогон export → ZIP (CSV по сущностям + spec.json; кода нет — non_goals). workflows.yaml#export_data'
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [env], additionalProperties: false, properties: {env: {enum: [draft, prod]}}}}}}
      responses: {'202': {description: Прогон поставлен в очередь, content: {application/json: {schema: {type: object, required: [exportId, run], properties: {exportId: {type: string, format: uuid}, run: {$ref: '#/components/schemas/Run'}}}}}}, '403': {$ref: '#/components/responses/Error'}}
    get: {operationId: listExports, x-milestone: M2, x-roles: [owner], responses: {'200': {description: 'Журнал выгрузок, новые сверху', content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Export'}}}}}}}}}
  /systems/{id}/exports/{exportId}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getExport
      x-milestone: M2
      x-roles: [owner]
      summary: 'Статус выгрузки; при status=ready выдаёт одноразовую ссылку на ZIP (TTL 15 мин, L3-37); архив удаляется через 24 ч'
      responses: {'200': {description: Выгрузка, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Export'}, {type: object, properties: {downloadUrl: {type: [string, 'null'], format: uri}}}]}}}}, '404': {$ref: '#/components/responses/Error'}, '410': {$ref: '#/components/responses/Error'}}
  /systems/{id}/deletion-log:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listDeletionLog
      x-milestone: M2
      x-roles: [owner]
      summary: 'Журнал автоудаления и обезличивания ПДн (db.yaml#deletion_log; compliance.yaml#system_package.retention.deletion_log). Только счётчики'
      parameters: [{$ref: '#/components/parameters/limit'}, {$ref: '#/components/parameters/cursor'}]
      responses: {'200': {description: Записи журнала, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [env, entity, mode, rowsAffected, createdAt], properties: {env: {enum: [draft, prod]}, entity: {type: string}, mode: {enum: [delete, anonymize, subject_request, draft_purged, system_deleted, user_deleted, consent_revoked]}, cutoff: {type: [string, 'null'], format: date-time}, rowsAffected: {type: integer}, createdAt: {type: string, format: date-time}}}}, nextCursor: {type: [string, 'null']}}}}}}}
  /systems/{id}/data/{entity}:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: entity, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}}]
    get:
      operationId: getSystemData
      x-milestone: M2
      x-roles: [owner]
      summary: 'Вкладка «Данные» (S4/S10): проксирует runtime GET /api/data/:entity (runtime.yaml#data_api) под первой isAdmin-ролью системы; значения полей pii≠none маскируются (+7 ••• ••• 45 10, i•••@mail.ru). Только чтение, только owner (L1-34)'
      parameters: [{name: env, in: query, schema: {enum: [draft, prod], default: draft}}, {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: 'Страница записей — форма runtime data_api (items, page, limit, total, hasMore), ПДн маскированы', content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object}}, page: {type: integer}, limit: {type: integer}, total: {type: integer}, hasMore: {type: boolean}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /runs/{id}: {parameters: [{$ref: '#/components/parameters/runId'}], get: {operationId: getRun, x-milestone: M0, x-roles: [viewer], responses: {'200': {description: Прогон, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}, '404': {$ref: '#/components/responses/Error'}}}}
  /runs/{id}/events:
    parameters: [{$ref: '#/components/parameters/runId'}]
    get:
      operationId: streamRunEvents
      x-milestone: M0
      x-roles: [viewer]
      summary: SSE событий прогона (workflows.yaml#events)
      description: 'Формат кадра: `id: <seq>`, `event: <type>`, `data: <RunEvent JSON>`. Сначала сервер MUST отдать все события с seq > after (или > Last-Event-ID), затем живые, без пропусков и дублей; события с internal: true (workflows.yaml#events, например model_switched) в поток не попадают — их seq пропускается. Каждые 15 с — комментарий `: ping`. После терминального события (run_finished | run_failed) поток закрывается. Тест: переподключение с Last-Event-ID=N даёт ровно события N+1..; seq строго возрастает.

        '
      parameters: [{name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}, {name: Last-Event-ID, in: header, schema: {type: string}}]
      responses: {'200': {description: Поток, content: {text/event-stream: {schema: {type: string}}}}}
  /runs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/runId'}]
    post:
      operationId: cancelRun
      x-milestone: M0
      x-roles: [editor]
      summary: Кооперативная отмена на ближайшей границе шага; текущий LLM-вызов прерывается AbortSignal
      responses: {'202': {description: Отмена запрошена, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}, '409': {$ref: '#/components/responses/Error'}}
  /runs/{id}/input:
    parameters: [{$ref: '#/components/parameters/runId'}]
    post:
      operationId: provideRunInput
      x-milestone: M0
      x-roles: [editor]
      summary: 'Ответ на needs_input. decision — M0; secret — M1: значение записывается в хранилище секретов в этом HTTP-обработчике, в воркфлоу (DBOS) уходит только secret://name; в БД платформы, DBOS и события значение не попадает (workflows.yaml#execution.M1.dbos_data, L3-09)'
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [inputId], additionalProperties: false, properties: {inputId: {type: string}, choice: {type: string, description: 'id варианта (decision; для secret — например test «Тестовый режим»)'}, text: {type: string, maxLength: 2000, description: 'Свободный ответ для варианта с freeText=true (например, rephrase эскалации строителя); без choice с freeText → 422'}, secretValue: {type: string, maxLength: 4096, writeOnly: true, description: для kind=secret}}}}
      responses: {'202': {description: Прогон продолжен, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}, '409': {$ref: '#/components/responses/Error'}}
