      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [mapping], additionalProperties: false, properties: {mapping: {type: array, items: {$ref: '#/components/schemas/ImportColumnMapping'}}}}}}}
      responses: {'200': {description: Маппинг сохранён}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /systems/{id}/exports:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: createExport
      x-milestone: M2
      x-roles: [owner]
      summary: 'Выгрузка данных (M2-10, L4-08): прогон export → ZIP (CSV по сущностям + spec.json; кода нет — non_goals). workflows.yaml#export_data. env=prod у неопубликованной системы и env=draft у несобранной → 409 PREVIEW_NOT_READY (UI до публикации шлёт env=draft); ≤ 20 выгрузок на систему за 24 ч → 429 RATE_LIMITED; бесплатно, без блокировки системы'
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [env], additionalProperties: false, properties: {env: {enum: [draft, prod]}, includePii: {type: boolean, default: false, description: 'Включить колонки с ПДн; только после явного подтверждения владельца в UI (M2-10). Отметка сохраняется в выгрузке'}}}}}}
      responses: {'202': {description: Прогон поставлен в очередь, content: {application/json: {schema: {type: object, required: [exportId, run], properties: {exportId: {type: string, format: uuid}, run: {$ref: '#/components/schemas/Run'}}}}}}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
    get: {operationId: listExports, x-milestone: M2, x-roles: [owner], responses: {'200': {description: 'Журнал выгрузок, новые сверху', content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Export'}}}}}}}}}
  /systems/{id}/exports/{exportId}:
