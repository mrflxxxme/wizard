      parameters: [{name: months, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 36, default: 12}}]
      responses: {'200': {description: Доля по месяцам, content: {application/json: {schema: {type: object, required: [months], properties: {months: {type: array, items: {$ref: '#/components/schemas/CapabilityMonth'}}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/systems:
    get:
      operationId: adminListSystems
      x-milestone: V3
      x-roles: [staff]
      summary: 'V3-18: системы клиентов для консоли основателя (вкладка «Системы и сбои»): не удалённые, по last_activity_at от новых; организация (id, name, kind), stage, suspended, draft/preview/published (prod_revision) ревизии, последняя сборка (runs kind=build: status, failureCode, at), траты моделей (сумма llm_calls.cost_rub по системе) и кредиты (сумма runs.credits_used_milli / 1000). Без данных клиентов, кроме названий. Не staff → 404, без MFA → 403'
      parameters: [{name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}]
      responses: {'200': {description: Системы, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [id, name, org, stage, publishedRevision, lastBuild, modelSpendRub, creditsUsed]}}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/runs:
    get:
      operationId: adminListRuns
      x-milestone: V3
      x-roles: [staff]
      summary: 'V3-18: прогоны по статусу (по умолчанию failed), от новых (coalesce(finished_at, created_at)): организация, система, kind, mode, errorCode (failure_code), messageRu (failure_message_ru — текст, который видел клиент), траты моделей прогона (llm_calls.cost_rub по run_id), кредиты, время. Фильтр kind. Не staff → 404, без MFA → 403'
      parameters: [{name: status, in: query, required: false, schema: {enum: [queued, waiting_lock, running, needs_input, succeeded, failed, cancelled], default: failed}}, {name: kind, in: query, required: false, schema: {type: string}}, {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}]
      responses: {'200': {description: Прогоны, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [id, org, system, kind, status, errorCode, messageRu, modelSpendRub, creditsUsed, createdAt]}}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  # ==== M2P · M2-98 (адрес и свой домен, дизайн и референсы, медиа и стоки, хосты egress в ревью; секреты и настройки — M2-95 после M2-22/M2-98) — новые пути дописывать ЗДЕСЬ ====
  /systems/{id}/webhooks:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listSystemWebhooks
      x-milestone: M2
      x-roles: [editor]
      summary: 'M2-53 (D71): секретные адреса входящих вебхуков системы (интеграции connector=webhook) для кабинета владельца — prod по опубликованной ревизии, draft по превью; адрес — /_wizard/hooks/webhook/<integration>/<hookToken>, hookToken = HMAC от WIZARD_SECRETS_KEY (тот же ключ у runtime), смена tokenVersion в спеке меняет адрес'
      responses: {'200': {description: Адреса, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [integration, env, url, verify, entity], properties: {integration: {type: string}, env: {enum: [draft, prod]}, url: {type: string, format: uri}, verify: {enum: [hmac, shared_secret]}, entity: {type: string}}}}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  # ==== конец блока M2-98 ====
  # ==== M2P · M2-72 (правки prod, удаляющие данные: последствия, подтверждение владельца, архив, «Отменить правку») ====
  /systems/{id}/destructive:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getDestructiveConsequences
      x-milestone: M2
      x-roles: [viewer]
      summary: 'M2-72 (product.yaml#decisions.D56_destructive_changes, D72): что публикация ревизии (по умолчанию draft_revision) удалит или сузит в данных prod — план schema_hwm_revision → revision (appspec destructiveChanges), счётчики по живым данным prod под системной ролью БД (FORCE RLS): удаление сущности — записей; удаление поля — заполненных значений; смена типа — заполненных и непереносимых значений; поле стало обязательным — пустых записей; новое правило проверки — нарушающих записей. text_ru — простыми словами («Удаление поля „Телефон“ в разделе „Заявки“ затронет 112 записей. Значения сохранятся в архиве, правку можно отменить»). required=false — подтверждение не нужно (удаление индексов и уникальности данных не меняет). hash — sha256 ревизии, базы и состава правки (kind, entity, field, fromType, toType, hasDefault, check — без счётчиков: новые записи после подтверждения его не отменяют, счётчики — для сведения); confirmation — последнее подтверждение этой ревизии (stale, если состав правки уже другой). canConfirm — пользователь owner'
      parameters: [{name: revision, in: query, schema: {type: integer, minimum: 1}}]
      responses:
        '200': {description: Последствия, content: {application/json: {schema: {$ref: '#/components/schemas/DestructiveConsequences'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /systems/{id}/destructive/confirm:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: confirmDestructive
      x-milestone: M2
      x-roles: [owner]
      summary: 'M2-72: владелец подтверждает последствия ревизии. Подтверждение привязано к revision и hash: последствия пересчитываются; другой hash → 409 DESTRUCTIVE_CONSEQUENCES_CHANGED (details.consequences — новый список, подтвердить заново); строка, нарушающая новое правило (blocking) → 422 DESTRUCTIVE_BLOCKED; нечего подтверждать → 400; не owner → 403 NOT_OWNER (D11). Прежние неприменённые подтверждения системы → superseded. Строка журнала db.yaml#destructive_changes (кто, когда, что). Публикация (workflows.yaml#workflows.publish, gate_G0_prod) без действующего подтверждения или с устаревшим (другой состав правки) → прогон failed DESTRUCTIVE_IN_PROD; blocking пересчитывается при публикации — появились нарушающие строки → тоже отказ; подтверждение помечается applied в транзакции миграции только из status confirmed (иначе миграция откатывается)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision, hash], additionalProperties: false, properties: {revision: {type: integer, minimum: 1}, hash: {type: string, pattern: '^[0-9a-f]{64}$'}}}}}}
      responses:
        '201': {description: Подтверждено, content: {application/json: {schema: {type: object, required: [change, consequences], properties: {change: {$ref: '#/components/schemas/DestructiveChangeRecord'}, consequences: {$ref: '#/components/schemas/DestructiveConsequences'}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /systems/{id}/destructive/changes:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: listDestructiveChanges
      x-milestone: M2
      x-roles: [viewer]
      summary: 'M2-72: журнал удаляющих правок системы (подтверждено, применено, отменено — кто и когда), новые первыми, ≤ 50. undo — правка, которую можно отменить: последняя применённая, пока схема prod на её ревизии (schema_hwm_revision); canUndo — пользователь owner'
      responses:
        '200': {description: Журнал, content: {application/json: {schema: {type: object, required: [items, undo, canUndo], properties: {items: {type: array, items: {$ref: '#/components/schemas/DestructiveChangeRecord'}}, undo: {type: ['object', 'null'], properties: {changeId: {type: string, format: uuid}, toRevision: {type: integer}}}, canUndo: {type: boolean}}}}}}
  /systems/{id}/destructive/changes/{changeId}/undo:
    parameters: [{$ref: '#/components/parameters/systemId'}, {name: changeId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: undoDestructiveChange
      x-milestone: M2
      x-roles: [owner]
      summary: '«Отменить правку» (M2-72): прогон kind=rollback {env: prod, toRevision, undoChangeId} — обратный план схемы к base_revision в одной транзакции: удалённые сущности и поля возвращаются из архива со значениями (по id), смена типа — исходные значения; добавленное правкой само уходит в архив; schema_hwm_revision = base_revision; prod переключается на публикацию, работавшую до правки; smoke. Только последняя применённая правка, пока после неё ничего не публиковали, иначе 409 DESTRUCTIVE_UNDO_UNAVAILABLE; не owner → 403 NOT_OWNER. Обычный откат prod к ревизии старше применённой правки → ROLLBACK_TARGET_INVALID (сначала «Отменить правку»)'
      responses:
        '202': {description: Прогон отмены, content: {application/json: {schema: {type: object, properties: {run: {$ref: '#/components/schemas/Run'}}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  # ==== конец блока M2-72 ====
  # ==== V3-09: три направления дизайна и референсы ====
  /systems/{id}/directions:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    get:
      operationId: getDesignDirections
      x-milestone: V3
      x-roles: [viewer]
      summary: 'V3-09 (D77 (7), agents/builder-v3.md): последний набор трёх направлений системы с живыми первыми экранами (previewHtml — документ для <iframe srcdoc sandbox="allow-scripts">) и выбранным направлением брифа; null — направлений ещё не предлагали'
      responses:
        '200': {description: Набор или null, content: {application/json: {schema: {type: object, required: [proposal], properties: {proposal: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/DesignDirections'}]}}}}}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: proposeDesignDirections
      x-milestone: V3
      x-roles: [editor]
      summary: 'V3-09: три первых экрана в разных архетипах по актуальному брифу — архетипы, токены, паттерны шапки и первого экрана считает код (V3-07, V3-08), тексты клиента пишет один вызов art_direction (T1 только после scrub) или код из брифа; ≤ 40 ₽ и ≤ 2 мин; превью собираются buildSystem параллельно. reroll — другие архетипы. Набор хранится блобом (id = sha256) и появляется в чате (payload.type design_directions)'
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {reroll: {type: boolean}}}}}}
      responses:
        '201': {description: Набор направлений, content: {application/json: {schema: {type: object, required: [proposal], properties: {proposal: {$ref: '#/components/schemas/DesignDirections'}}}}}}
        '400': {description: 'VALIDATION_FAILED — брифа ещё нет', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {description: 'RATE_LIMITED — больше 30 запросов к направлениям системы за 10 минут', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /systems/{id}/directions/refine:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: refineDesignDirections
      x-milestone: V3
      x-roles: [editor]
