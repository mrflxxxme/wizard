      x-roles: [owner]
      summary: 'Привязка карты РФ через магазин платформы в ЮKassa (billing.yaml#card_binding). return_url = <WIZARD_PLATFORM_ORIGIN>/billing?payment=<payments.id>; исход привязки страница возврата узнаёт опросом getBilling.cardBinding (отдельной операции статуса платежа нет — M2-11, предложение getPayment)'
      responses: {'200': {description: Ссылка на подтверждение, content: {application/json: {schema: {type: object, required: [confirmationUrl], properties: {confirmationUrl: {type: string, format: uri}}}}}}}
  /orgs/{orgId}/billing/subscription:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: changeSubscription
      x-milestone: M2
      x-roles: [owner]
      summary: 'Тот же тариф — возобновить автоплатёж; дешевле — с продления (Billing.nextPlan); дороже — платёж сразу по привязанной карте, новый период с текущего момента; без активной подписки — первый платёж по карте или страница ЮKassa (Billing.confirmationUrl) с save_payment_method (M2-07). 409 не используется'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [plan], properties: {plan: {enum: [start, business]}}}}}}
      responses: {'200': {description: Подписка оформлена или confirmationUrl для первой оплаты, content: {application/json: {schema: {$ref: '#/components/schemas/Billing'}}}}}
    delete: {operationId: cancelSubscription, x-milestone: M2, x-roles: [owner], summary: Отмена в конце периода (автоплатёж выключается сразу), responses: {'200': {description: Отменено, content: {application/json: {schema: {$ref: '#/components/schemas/Billing'}}}}}}
  /orgs/{orgId}/billing/topups:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    post:
      operationId: createTopup
      x-milestone: M2
      x-roles: [owner]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [packs], properties: {packs: {type: integer, minimum: 1, maximum: 20}}}}}}
      summary: 'Докупка пакетов (billing.yaml#topup; на тарифе pilot — 403 FORBIDDEN, billing.yaml#plans.topup.available_on, M2-09). С привязанной картой — списание сразу по payment_method_id (confirmationUrl = null, кредиты начислены в том же запросе); без карты — страница ЮKassa без сохранения карты'
      responses: {'200': {description: Платёж создан, content: {application/json: {schema: {type: object, properties: {confirmationUrl: {type: [string, 'null']}, paymentId: {type: string}}}}}}}
  /webhooks/yookassa:
    post:
      operationId: yookassaWebhook
      x-milestone: M2
      security: []
      summary: Уведомления магазина ПЛАТФОРМЫ. Доверять только после GET /v3/payments/{id} к API ЮKassa и проверки IP из списка ЮKassa; идемпотентно по provider_payment_id
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'200': {description: Принято}}
  /systems/{id}/disputes:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: disputeG2Block
      x-milestone: M2
      x-roles: [owner]
      summary: '«Оспорить» (abuse.yaml#rescan, #messages_ru.G2-AF-*): последний G2-отчёт ревизии провалил блокер антифрода G2-AF-01…07 → тикет staff category=auto_g2 (sla_deadline +24 ч, алерт abuse_dispute_new и письма staff); один открытый тикет на систему (повтор возвращает его). Ответ владельцу — письмом при закрытии тикета (dismiss с note). Иначе 400. Тикеты auto_g2 не считаются в abuse_reports_prev (G2-AF-08)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}, text: {type: string, maxLength: 2000, description: комментарий владельца}}}}}}
      responses: {'202': {description: Заявка принята, content: {application/json: {schema: {type: object, required: [reportId, message_ru], properties: {reportId: {type: string, format: uuid}, message_ru: {type: string, description: abuse.yaml#messages_ru.dispute}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /abuse-reports:
    post:
      operationId: createAbuseReport
      x-milestone: M2
      security: []
      summary: '«Пожаловаться» (abuse.yaml#report). Без входа; лимит 10/ч на IP; ответ не раскрывает статус системы. Жалоба phishing на live-систему запускает abuse.yaml#takedown.auto_suspend: ≥ 3 жалобы phishing с разных IP за 1 ч → перепроверка live-ревизии текущим G2 (только G2-AF-01…07, не чаще раза в час на публикацию); провал → публикация suspended, эта жалоба становится тикетом takedown, письмо владельцу, алерт abuse_auto_suspend; G2 чист → только алерт abuse_phishing_cluster'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, category]
              properties: {url: {type: string, format: uri, description: URL на домене систем}, category: {enum: [phishing, fraud, brand_impersonation, illegal_content, pd_violation, spam, other]}, text: {type: string, maxLength: 4000}, contactEmail: {type: string, format: email}, contactConsent: {type: boolean, description: 'M2-08: отдельное согласие на обработку адреса заявителя (только для ответа по этой жалобе; хранится до 1 года после закрытия — db.yaml#abuse_reports.contact_email); обязательно true, если задан contactEmail, иначе 400'}}
      responses: {'202': {description: Жалоба принята, content: {application/json: {schema: {type: object, properties: {reportId: {type: string}}}}}}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports:
    get:
      operationId: adminListAbuseReports
      x-milestone: M2
      x-roles: [staff]
      parameters: [{name: status, in: query, schema: {enum: [new, triaged, takedown, dismissed, restored]}}]
      responses: {'200': {description: Очередь модерации по sla_deadline, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AbuseReport'}}}}}}}}
  /admin/abuse-reports/{reportId}/actions:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminAbuseAction
      x-milestone: M2
      x-roles: [staff]
      summary: 'Переходы abuse.yaml#takedown.flow: triage (new → triaged; открывает доступ staff к данным системы на 24 ч, можно уточнить category), takedown (new|triaged → takedown: publications.status=suspended, systems.suspended_at, письмо владельцу всегда — причина и как оспорить), dismiss (new|triaged → dismissed), restore (takedown → restored; publications снова live, письмо владельцу). Заявителю с contactEmail — нейтральное письмо о рассмотрении. Недопустимый переход → 400'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [action, note], properties: {action: {enum: [triage, takedown, dismiss, restore]}, note: {type: string, minLength: 3}, category: {enum: [phishing, fraud, brand_impersonation, illegal_content, pd_violation, spam, other], description: 'M2-08: уточнённая категория при triage'}}}}}}
      responses: {'200': {description: 'Выполнено, владельцу отправлено уведомление', content: {application/json: {schema: {$ref: '#/components/schemas/AbuseReport'}}}}}
  /admin/orgs/{orgId}/flags:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: adminSetOrgFlags
      x-milestone: M2
      x-roles: [staff]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {requireFounderReview: {type: boolean}, passportCollectionAllowed: {type: boolean, description: abuse.yaml#patterns.gov_ids}}}}}}
      responses: {'200': {description: Обновлено}}
  /admin/orgs/{orgId}/suspension:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    post:
      operationId: adminOrgSuspension
      x-milestone: M2
      x-roles: [staff]
      summary: 'abuse.yaml#takedown.flow «Повторное нарушение или явный фишинг → orgs.suspended_at»: suspend — все системы организации отдают 451 (вид deployments, draft и prod), publish → 403 ORG_SUSPENDED, в publishBlockers ORG_SUSPENDED; restore — снимает признак (системы, снятые своими тикетами, остаются снятыми). Строка staff_audit_log org_suspend|org_restore (target org:<id>, в note — тикет), письмо владельцам. Переход без изменения → 400'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [action, note], properties: {action: {enum: [suspend, restore]}, note: {type: string, minLength: 3, maxLength: 2000}, reportId: {type: string, format: uuid, description: тикет-основание}}}}}}
      responses: {'200': {description: Выполнено, content: {application/json: {schema: {type: object, required: [orgId, suspendedAt], properties: {orgId: {type: string, format: uuid}, suspendedAt: {type: [string, 'null'], format: date-time}}}}}}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/systems/{id}/founder-review:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: adminFounderReview
      x-milestone: M2
      x-roles: [staff]
      summary: 'Решение по ревизии, ожидающей ревью перед prod (M2-09); approve разблокирует publish этой ревизии. Смонтирован в M2-08 (staff MFA, строка staff_audit_log); CLI `pnpm --filter @wizard/platform-api moderation reviews | approve | reject` с прямым доступом к БД (M2-04) продолжает работать. reject требует note (≥ 3 символов, иначе 400). Владельцам org уходит письмо о решении (одобрено — можно публиковать; не одобрено — note как «что исправить»), и из админки, и из CLI. rejected тоже отдаётся в publishBlockers как FOUNDER_REVIEW_PENDING'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision, decision], properties: {revision: {type: integer}, decision: {enum: [approve, reject]}, note: {type: string}}}}}}
      responses: {'200': {description: Записано}}
  /admin/session:
    get:
      operationId: adminSession
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: состояние staff в этой сессии (без MFA-подтверждения). Не staff → 404 NOT_FOUND (консоль не раскрывается); вход по заголовку разработки (без сессии) никогда не подтверждён'
      responses: {'200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/StaffSession'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/mfa/enroll:
    post:
      operationId: adminMfaEnroll
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: начать подключение TOTP (RFC 6238, SHA1, 30 с, 6 цифр); секрет — в хранилище секретов (users.totp_secret_ref = secret://…), показывается один раз. Уже подключено → 400; сброс — CLI `moderation staff-reset-mfa <email>`'
      responses: {'200': {description: Секрет, content: {application/json: {schema: {type: object, required: [secret, otpauthUrl], properties: {secret: {type: string, description: base32}, otpauthUrl: {type: string}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /admin/mfa/confirm:
    post:
      operationId: adminMfaConfirm
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: первый код подтверждает подключение: mfa_enrolled_at, сессия подтверждена, 10 кодов восстановления (хранятся только HMAC) — показываются один раз. Неверный код → 401 OTP_INVALID; 5 неверных кодов за 15 мин → 429'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses: {'200': {description: Подключено, content: {application/json: {schema: {type: object, required: [recoveryCodes, mfaVerifiedUntil], properties: {recoveryCodes: {type: array, items: {type: string}}, mfaVerifiedUntil: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/mfa/verify:
    post:
      operationId: adminMfaVerify
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: step-up сессии кодом TOTP (каждый код — один раз, users.totp_last_step) или одноразовым кодом восстановления; действует 12 ч в этой сессии (x-auth.M2). Неверный → 401 OTP_INVALID; 5 неверных за 15 мин → 429'
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {code: {type: string, pattern: '^[0-9]{6}$'}, recoveryCode: {type: string}}}}}}
      responses: {'200': {description: Сессия подтверждена, content: {application/json: {schema: {type: object, required: [mfaVerifiedUntil], properties: {mfaVerifiedUntil: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports/{reportId}:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: adminGetAbuseReport
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: тикет — жалоба (текст, контакт заявителя), система, открытый доступ staff и журнал staff по тикету и системе; просмотр пишется в staff_audit_log'
      responses: {'200': {description: Тикет, content: {application/json: {schema: {$ref: '#/components/schemas/AbuseTicket'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports/{reportId}/access:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminOpenStaffAccess
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08 (compliance.yaml#platform.security_org staff_access, L3-43): открыть доступ staff к данным системы по открытому тикету на 24 ч; строка staff_audit_log; владельцу — письмо, кроме category=phishing. triage открывает доступ так же'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [note], properties: {note: {type: string, minLength: 3}}}}}}
      responses: {'200': {description: Доступ открыт, content: {application/json: {schema: {type: object, required: [until], properties: {until: {type: string, format: date-time}}}}}}, '400': {$ref: '#/components/responses/Error'}}
  /admin/abuse-reports/{reportId}/data:
    parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}, {name: entity, in: query, schema: {type: string}}]
    get:
      operationId: adminSystemData
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: данные системы тикета только для чтения (prod, иначе draft): счётчики строк по сущностям и до 50 последних строк одной сущности; поля ПДн не отдаются (как выгрузка без ПДн, workflows.yaml#export_data). Без открытого доступа по тикету (24 ч, тикет не закрыт) → 403 FORBIDDEN; каждое чтение — строка staff_audit_log'
      responses: {'200': {description: Данные, content: {application/json: {schema: {type: object, required: [env, entities, columns, rows], properties: {env: {enum: [draft, prod]}, revision: {type: [integer, 'null']}, accessUntil: {type: string, format: date-time}, omittedPii: {type: integer}, entities: {type: array, items: {type: object, properties: {name: {type: string}, label: {type: string}, rows: {type: integer}}}}, entity: {type: [string, 'null']}, columns: {type: array, items: {type: string}}, rows: {type: array, items: {type: object}}}}}}}, '403': {$ref: '#/components/responses/Error'}}
  /admin/founder-reviews:
    get:
      operationId: adminListFounderReviews
      x-milestone: M2
      x-roles: [staff]
      summary: 'M2-08: ревизии, ожидающие ревью основателя перед prod (db.yaml#founder_reviews status=pending), старые первыми'
      responses: {'200': {description: Очередь, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {systemId: {type: string}, systemName: {type: string}, orgId: {type: string}, revision: {type: integer}, createdAt: {type: string, format: date-time}}}}}}}}}}
  # ==== M2P · M2-22 (человеческий слой и цены: каталог цен, использование организации, обращения, заказы «под ключ», пробелы, матрица доступа) — новые пути дописывать ЗДЕСЬ, над этой строкой не трогать ====
  /orgs/{orgId}/usage:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    get:
      operationId: getOrgUsage
      x-milestone: M2P
      x-roles: [viewer]
      summary: 'M2-34/M2-56 (D70, mvp_scope): «На пилоте бесплатно» и остаток лимита пилота организации — сборки (build mode=create) и правки (mode=change|point_edit) за скользящие 30 дней; failed и cancelled не считаются, активные считаются. Для org не на тарифе pilot limit и left = null. Кредитов, потолков и себестоимости в ответе нет (billing.yaml#rub_model.principle)'
      responses: {'200': {description: Использование, content: {application/json: {schema: {$ref: '#/components/schemas/PilotUsage'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /support/requests:
    post:
      operationId: createSupportRequest
      x-milestone: M2P
      x-roles: [viewer]
      summary: 'M2-35 (D68, mvp_scope): «Написать команде». Копия — в db.yaml#support_requests; основателю — сообщение в Telegram через бота платформы (канал алертов WIZARD_OPS_ALERT_URL/CHAT_ID; письмо — WIZARD_OPS_ALERT_EMAIL): организация, почта клиента, ссылка на систему, срок ответа и текст с замаскированными ПДн (@wizard/pii scrub). systemId — система открыта (org берётся из неё; чужая → 404), иначе orgId или org пользователя по умолчанию. replyBy — 2 часа рабочего времени Пн–Пт 10–19 МСК (D60); message_ru — подтверждение со сроком. > 5 обращений в час от пользователя или > 10 от организации → 429 RATE_LIMITED. Ответ основатель даёт письмом'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 4000}, wantsTeam: {type: boolean, description: «Хочу, чтобы доделала команда»}, systemId: {type: string, format: uuid}, orgId: {type: string, format: uuid}, screen: {type: string, maxLength: 64, pattern: '^[a-z0-9_-]*$'}}}}}}
      responses: {'201': {description: Отправлено, content: {application/json: {schema: {type: object, required: [id, replyBy, message_ru], properties: {id: {type: string, format: uuid}, replyBy: {type: string, format: date-time}, message_ru: {type: string}}}}}}, '404': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /admin/support/requests:
    get:
      operationId: adminListSupportRequests
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-35/M2-57 (mvp_scope): обращения «Написать команде» — сначала неотвеченные по сроку ответа, затем отвеченные; status=open — только неотвеченные'
      parameters: [{name: status, in: query, schema: {enum: [open, all]}}]
      responses: {'200': {description: Обращения, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SupportRequest'}}}}}}}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/support/requests/{requestId}/answered:
    parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminMarkSupportRequest
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-35 (mvp_scope): отметка «отвечено» (answered=false снимает её). Строка staff_audit_log support_answered | support_reopened (target support_request:<id>)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [answered], properties: {answered: {type: boolean}}}}}}
      responses: {'200': {description: Записано, content: {application/json: {schema: {type: object, required: [id, answeredAt], properties: {id: {type: string, format: uuid}, answeredAt: {type: [string, 'null'], format: date-time}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/development-requests:
    get:
      operationId: adminDevelopmentRequests
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-59 (D73, mvp_scope): «Запросы на развитие» — категории по частоте (за 7 и 30 дней, всего, число систем) и последние 50 запросов (category — только этой категории) со ссылкой на систему и почтой клиента, запустившего прогон. Пишет хост агентов прогона (recordDevelopmentRequest), не HTTP'
      parameters: [{name: category, in: query, schema: {$ref: '#/components/schemas/DevelopmentCategory'}}]
      responses: {'200': {description: Запросы, content: {application/json: {schema: {type: object, required: [categories, items], properties: {categories: {type: array, items: {type: object, required: [category, last7, last30, total, systems, lastAt], properties: {category: {$ref: '#/components/schemas/DevelopmentCategory'}, last7: {type: integer}, last30: {type: integer}, total: {type: integer}, systems: {type: integer}, lastAt: {type: string, format: date-time}}}}, items: {type: array, items: {$ref: '#/components/schemas/DevelopmentRequest'}}}}}}}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/pilot/orgs/{orgId}/limits:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: adminSetPilotLimits
      x-milestone: M2P
      x-roles: [staff]
      summary: 'M2-34 (D70, mvp_scope): лимит пилота организации — сборки и правки за 30 дней (0…1000; null — по умолчанию 5 и 20). Строка staff_audit_log pilot_limits (target org:<id>)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {builds: {type: [integer, 'null'], minimum: 0, maximum: 1000}, edits: {type: [integer, 'null'], minimum: 0, maximum: 1000}}}}}}
      responses: {'200': {description: Записано, content: {application/json: {schema: {type: object, required: [orgId, builds, edits, usage], properties: {orgId: {type: string, format: uuid}, builds: {type: integer}, edits: {type: integer}, usage: {$ref: '#/components/schemas/PilotUsage'}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  # ==== конец блока M2-22 ====
  /admin/pilot/readiness:
    get:
      operationId: adminPilotReadiness
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: флаг beta_readiness (db.yaml#platform_settings, M2-09) — кто и когда, заметка и чек-лист compliance.yaml#beta_readiness (РКН, юрист, поручения, Z.ai, docs/security). CLI `pilot readiness` работает как раньше'
      responses: {'200': {description: Состояние, content: {application/json: {schema: {$ref: '#/components/schemas/PilotReadiness'}}}}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
    put:
      operationId: adminSetPilotReadiness
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: включить/выключить beta_readiness; кто — email staff. Включение требует confirm=true и note ≥ 3 символов, иначе 400. Строка staff_audit_log pilot_readiness_on|off (target platform_settings:beta_readiness)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [on], properties: {on: {type: boolean}, confirm: {type: boolean}, note: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: Записано, content: {application/json: {schema: {$ref: '#/components/schemas/PilotReadiness'}}}}, '400': {$ref: '#/components/responses/Error'}}
  /admin/pilot/invites:
    get:
      operationId: adminListPilotInvites
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: приглашения основателя (db.yaml#pilot_invites, кроме отозванных), новые первыми; status: sent (ждёт входа), accepted, expired'
      responses: {'200': {description: Приглашения, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PilotInvite'}}}}}}}}
    post:
      operationId: adminCreatePilotInvite
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: приглашение в пилот — та же функция, что CLI `pilot invite` (createPilotInvite): письмо со ссылкой /login?email=…&next=/welcome, прежнее активное приглашение адреса отзывается. Пока beta_readiness выключен → 403 FORBIDDEN с текстом BETA_READINESS_MISSING_RU; уже зарегистрированный адрес или неверный email → 400. requireFounderReview (по умолчанию true) → orgs.require_founder_review пилотной org при первом входе. Строка staff_audit_log pilot_invite (target pilot_invite:<id>, email в журнал не пишется)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}, orgName: {type: string, maxLength: 120}, credits: {type: integer, minimum: 0, maximum: 100000}, requireFounderReview: {type: boolean, default: true}}}}}}
      responses: {'201': {description: Отправлено, content: {application/json: {schema: {type: object, required: [id, email, expiresAt, link, requireFounderReview], properties: {id: {type: string, format: uuid}, email: {type: string}, expiresAt: {type: string, format: date-time}, link: {type: string, description: Ссылка из письма — основатель может переслать сам}, requireFounderReview: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /admin/pilot/invites/{inviteId}/revoke:
    parameters: [{name: inviteId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: adminRevokePilotInvite
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: отозвать активное (не принятое) приглашение, как CLI `pilot revoke`; нет активного → 404. Строка staff_audit_log pilot_invite_revoke'
      responses: {'200': {description: Отозвано, content: {application/json: {schema: {type: object, required: [id, status], properties: {id: {type: string, format: uuid}, status: {const: revoked}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/pilot/orgs:
    get:
      operationId: adminListPilotOrgs
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: организации пилота (plan=pilot или созданные приглашением основателя) — как CLI `pilot orgs`: тариф, участники, доступно кредитов, списано за месяц, расход на модели ₽ за месяц (Europe/Moscow); capRub — WIZARD_LLM_MONTHLY_CAP_RUB платформы'
      responses: {'200': {description: Организации, content: {application/json: {schema: {type: object, required: [month, capRub, items], properties: {month: {type: string}, capRub: {type: number}, items: {type: array, items: {$ref: '#/components/schemas/PilotOrg'}}}}}}}}
  /admin/pilot/orgs/{orgId}/grants:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    post:
      operationId: adminGrantPilotCredits
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: начислить кредиты пилота (pilot_grant:<reference>, 365 дней), как CLI `pilot grant`; тот же reference второй раз не начисляет (granted=false). Строка staff_audit_log pilot_grant (target org:<id>)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [credits, reference], properties: {credits: {type: number, exclusiveMinimum: 0, maximum: 100000}, reference: {type: string, minLength: 3, maxLength: 200}}}}}}
      responses: {'200': {description: Начислено, content: {application/json: {schema: {type: object, required: [orgId, granted, reference, creditsAvailable], properties: {orgId: {type: string, format: uuid}, granted: {type: boolean}, reference: {type: string}, creditsAvailable: {type: number}}}}}}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/pilot/orgs/{orgId}/founder-review:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: adminSetPilotFounderReview
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: orgs.require_founder_review, как CLI `pilot review-required`. Строка staff_audit_log pilot_review_required (target org:<id>)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [on], properties: {on: {type: boolean}}}}}}
      responses: {'200': {description: Записано, content: {application/json: {schema: {type: object, required: [orgId, requireFounderReview], properties: {orgId: {type: string, format: uuid}, requireFounderReview: {type: boolean}}}}}}, '404': {$ref: '#/components/responses/Error'}}
  /admin/pilot/spend:
    get:
      operationId: adminPilotSpend
      x-milestone: M2
      x-roles: [staff]
      summary: 'pilot-admin: расход платформы на модели за календарный месяц (Europe/Moscow) против WIZARD_LLM_MONTHLY_CAP_RUB, как CLI `pilot spend`; warn — ≥ 80 % (порог алерта основателю), reached — новые LLM-прогоны получают 503 LLM_BUDGET_EXHAUSTED'
      responses: {'200': {description: Расход, content: {application/json: {schema: {$ref: '#/components/schemas/LlmSpend'}}}}}
  # ==== M2P · M2-98 (адрес и свой домен, дизайн и референсы, медиа и стоки, хосты egress в ревью; секреты и настройки — M2-95 после M2-22/M2-98) — новые пути дописывать ЗДЕСЬ ====
  # ==== конец блока M2-98 ====
components:
  securitySchemes: {devUser: {type: apiKey, in: header, name: X-Wizard-Dev-User, description: M0; только WIZARD_AUTH_MODE=dev}, session: {type: apiKey, in: cookie, name: __Host-wizard_session, description: 'M1+ (локально по http — wizard_session); + заголовок X-Wizard-CSRF для мутаций'}}
  parameters:
    systemId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    runId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    orgId: {name: orgId, in: path, required: true, schema: {type: string, format: uuid}}
    version: {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    idempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 64}}
  responses: {Error: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}}
  schemas:
    Error:
      type: object
      required: [code, message_ru]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 'M2-15 (D24_pilot_free): REGISTRATION_INVITE_ONLY — verifyOtp нового email при WIZARD_REGISTRATION=invite без приглашения основателя (CLI pilot invite) и без активного приглашения в org: «Регистрация в Wizard пока только по приглашению…»; PAYMENTS_DISABLED — startCardBinding, changeSubscription, cancelSubscription, createTopup при WIZARD_PAYMENTS=off: «Оплата на пилоте отключена — кредиты начисляет команда Wizard»; LLM_BUDGET_EXHAUSTED — новые interview_turn, build (create/change/fix) и import_table, когда Σ billable cost_rub live-вызовов llm_calls за календарный месяц (Europe/Moscow) ≥ WIZARD_LLM_MONTHLY_CAP_RUB (eval считается отдельно, eval.yaml#live_cadence.budget): «Месячный лимит платформы на работу моделей исчерпан…»'
          x-http-status:
            VALIDATION_FAILED: 400
            UNAUTHORIZED: 401
            OTP_INVALID: 401
            INSUFFICIENT_CREDITS: 402
            PLAN_LIMIT: 402
            BUILDS_LIMIT: 402
            EDITS_LIMIT: 402
            FORBIDDEN: 403
            MFA_REQUIRED: 403
            NOT_OWNER: 403
            CARD_BINDING_REQUIRED: 403
            FOUNDER_REVIEW_PENDING: 403
            ORG_SUSPENDED: 403
            REGISTRATION_INVITE_ONLY: 403
            PAYMENTS_DISABLED: 403
            NOT_FOUND: 404
            SYSTEM_LOCKED: 409
            NO_GATE_FAILURE: 409
            RUN_NOT_CANCELLABLE: 409
            RUN_NOT_WAITING_INPUT: 409
            CARD_VERSION_STALE: 409
            NO_CARD: 409
            PREVIEW_NOT_READY: 409
            INVITE_EXPIRED: 410
            EXPORT_LINK_USED: 410
            VERSION_CONFLICT: 412
            PAYLOAD_TOO_LARGE: 413
            UNSUPPORTED_MEDIA_TYPE: 415
            HOST_NOT_ALLOWED: 421
            OPS_INVALID: 422
            IDEMPOTENCY_MISMATCH: 422
            CONSENT_REQUIRED: 422
            LAST_OWNER: 422
            CARD_BINDING_REJECTED: 422
            OPERATOR_NAME_REQUIRED: 422
            OPERATOR_CONTACT_REQUIRED: 422
            OPERATOR_ADDRESS_REQUIRED: 422
            INN_INVALID: 422
            PHONE_LOGIN_PLAN_REQUIRED: 422
            CARD_NOT_RU: 422
            SYSTEM_SUSPENDED: 422
            GATES_FAILED: 422
            DESTRUCTIVE_IN_PROD: 422
            ROLLBACK_TARGET_INVALID: 422
            RATE_LIMITED: 429
            INTERNAL: 500
            LLM_UNAVAILABLE: 503
            LLM_BUDGET_EXHAUSTED: 503
        message_ru: {type: string, description: 'Готовый к показу текст на русском, без стеков и SQL'}
        details: {type: object, description: 'Структурные данные. Для OPS_INVALID — {errors: OpsError[]} (ops.yaml#apply.error_shape; коды — ops.yaml#apply.error_codes, в т. ч. OWNER_ONLY_FIELD); для GATES_FAILED — {reports: GateReport[]}; для INSUFFICIENT_CREDITS — {available, required}; для PLAN_LIMIT — {limit, current, plan}; для BUILDS_LIMIT и EDITS_LIMIT (D70, лимит пилота организации: сборки и правки за скользящие 30 дней, billing.yaml#rub_model.pilot_limit) — {limit, used, nextAt}, message_ru без слова «кредит», UI показывает «Написать команде»'}
    OrgRole: {enum: [owner, editor, viewer]}
    SystemStage: {enum: [interview, card, building, ready, failed], description: workflows.yaml#system_stage}
    System:
      type: object
      required: [id, orgId, slug, name, stage, draftRevision, createdAt]
      properties:
        id: {type: string, format: uuid}
        orgId: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$', description: Без '--'; runtime.yaml#routing.system_slug}
        name: {type: string}
        stage: {$ref: '#/components/schemas/SystemStage'}
        draftRevision: {type: integer, minimum: 0}
        previewRevision: {type: [integer, 'null'], description: Последняя ревизия с G0=passed и собранным бандлом}
        prodRevision: {type: [integer, 'null']}
        prodUrl: {type: [string, 'null'], format: uri}
        suspended: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SystemCard:
      type: object
      description: 'Нормативная схема — specs/agents/orchestrator.yaml#system_card. Мини-карточка правки (orchestrator.yaml#change_requests.small_edit) — та же схема с kind=change: обязательны cardVersion, kind, summary («что меняется»), estimate, cap; остальные поля опциональны (L1-51). API гарантирует поля ниже'
      required: [cardVersion, kind, estimate, cap]
      additionalProperties: true
      if: {properties: {kind: {const: change}}}
      then: {required: [summary]}
      properties:
        cardVersion: {type: integer, minimum: 1}
        kind: {enum: [create, change], description: добавляет platform-api}
        title: {type: string, maxLength: 80}
        summary: {type: string, maxLength: 400, description: 'для kind=change — «что меняется»'}
        estimate: {type: object, properties: {credits: {type: object, properties: {min: {type: number}, expected: {type: number}, max: {type: number}}}, minutes: {type: object}}}
        cap: {type: object, required: [credits], properties: {credits: {type: integer}}}
    Question:
      type: object
      description: agents/orchestrator.yaml#schemas.Question (источник истины, L1-10)
      required: [id, forkId, text, whyItMatters, options]
      properties:
        id: {type: string}
        forkId: {type: string, description: id из orchestrator.yaml#fork_taxonomy}
        text: {type: string, maxLength: 140}
        whyItMatters: {type: string, maxLength: 160}
        options: {type: array, minItems: 2, maxItems: 4, description: ровно один recommended=true, items: {type: object, required: [id, label, recommended], properties: {id: {type: string}, label: {type: string, maxLength: 60}, recommended: {type: boolean}, description: {type: string, maxLength: 140}}}}
        allowCustom: {type: boolean, default: true, description: 'свой ответ ≤ 500 символов (postAnswers.answers[].text)'}
    Message:
      type: object
      required: [id, seq, role, kind, createdAt]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        role: {enum: [user, assistant, system]}
        kind: {enum: [text, questions, answers, card, run_report, notice]}
        text: {type: string}
        payload: {type: object, description: 'По kind: notice — {type: pii, categories: string[]} (orchestrator.yaml#pii_notice); questions — {questionIds, analysis?: {title, roles, skeleton, constraints, forks: [{forkId, status: resolved|asking|pending}]}} для панели «Как я понял задачу» (S2, L4-26; сводка Analysis без ПДн); text от пользователя (M3) — {target?} как в postMessage; card — {cardVersion}; run_report — {runId, status}. M2-77/M2-59 (D73): questions, card и text ассистента могут нести gaps — [{category, quote, missing, offered}] пробелов возможностей хода (цитата после scrub ПДн); platform-web показывает под сообщением «Написать команде» с предзаполненным текстом'}
        runId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
    RevisionSummary:
      type: object
      required: [version, author, createdAt]
      properties:
        version: {type: integer}
        parentVersion: {type: [integer, 'null']}
        author: {enum: [user, agent, system]}
        authorUserId: {type: [string, 'null'], format: uuid}
        runId: {type: [string, 'null'], format: uuid}
        kind: {enum: [ops, files, style, revert, compliance]}
        summary_ru: {type: string}
        g0Passed: {type: [boolean, 'null']}
        createdAt: {type: string, format: date-time}
    Run:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        systemId: {type: [string, 'null'], format: uuid, description: null только для nightly_eval (db.yaml#runs.system_id)}
        kind: {enum: [interview_turn, build, publish, rollback, import_table, retention, nightly_eval, export]}
        mode: {enum: [create, change, fix, point_edit], description: 'только для build; point_edit — M3'}
        status: {enum: [queued, waiting_lock, running, needs_input, succeeded, failed, cancelled], description: workflows.yaml#run_lifecycle}
        currentStep: {type: [string, 'null']}
        credits: {type: object, properties: {estimate: {type: number}, cap: {type: number}, used: {type: number}}}
        baseRevision: {type: [integer, 'null']}
        resultRevision: {type: [integer, 'null']}
        failure: {type: [object, 'null'], properties: {code: {type: string}, message_ru: {type: string}}}
        lastEventSeq: {type: integer}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    RunEvent:
      type: object
      required: [runId, seq, type, ts, payload]
      description: Конверт; payload по type — workflows.yaml#events
      properties: {runId: {type: string, format: uuid}, seq: {type: integer, minimum: 1}, type: {type: string}, ts: {type: string, format: date-time}, payload: {type: object}}
    GateReport:
      type: object
      required: [level, passed, checks]
      description: Нормативно — specs/quality/gates.yaml#report (копия для контрактного теста; при расхождении выигрывает gates.yaml)
      properties:
        level: {enum: [G0, G1, G2]}
        passed: {type: boolean}
        specVersion: {type: integer}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer}
        summary: {type: object, properties: {pass: {type: integer}, fail: {type: integer}, warn: {type: integer}, skip: {type: integer}, error: {type: integer}}}
        checks:
          type: array
          items:
            type: object
            required: [id, status, severity, message_ru]
            properties: {id: {type: string}, status: {enum: [pass, fail, warn, skip, error]}, severity: {enum: [blocker, warning]}, message_ru: {type: string, maxLength: 300}, file: {type: string}, line: {type: integer}, path: {type: string}, acId: {type: string}, evidence: {type: string, maxLength: 500, description: без значений ПДн}, fixHint: {type: string}}
        explanations: {type: array, items: {type: object}, description: 'только G1: Explanation[] (agents/qa.yaml#explain)'}
    LockStatus:
      type: object
      required: [held]
      properties: {held: {type: boolean}, runId: {type: [string, 'null']}, holder: {type: [object, 'null'], properties: {userId: {type: string}, name: {type: string}}}, since: {type: [string, 'null'], format: date-time}, queue: {type: array, items: {type: string, format: uuid}}}
    Publication:
      type: object
      required: [id, env, revision, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        env: {const: prod}
        revision: {type: integer}
        schemaRevision: {type: integer}
        status: {enum: [planned, applying, live, superseded, failed, suspended]}
        migrationSteps: {type: integer}
        createdAt: {type: string, format: date-time}
    ImportColumnMapping:
      type: object
      required: [column, action]
      additionalProperties: false
      properties: {column: {type: string}, action: {enum: [map, skip, new_field]}, entity: {type: string}, field: {type: string}, pii: {enum: [none, basic], description: 'подтверждённая пользователем разметка ПДн'}}
    Export:
      type: object
      required: [id, env, status, createdAt]
      properties: {id: {type: string, format: uuid}, env: {enum: [draft, prod]}, status: {enum: [running, ready, failed, expired]}, includePii: {type: boolean, description: 'Выгрузка с колонками ПДн (createExport.includePii; хранится в runs.input)'}, size: {type: [integer, 'null']}, downloads: {type: integer}, expiresAt: {type: string, format: date-time}, createdBy: {type: string, format: uuid}, createdAt: {type: string, format: date-time}}
    User: {type: object, properties: {id: {type: string, format: uuid}, email: {type: string}, name: {type: [string, 'null']}, isStaff: {type: boolean}, mfaEnrolled: {type: boolean, description: M2}}}
    Org: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, plan: {enum: [free, pilot, start, business], description: 'pilot — только CLI основателя (billing.yaml#plans.pilot)'}, role: {$ref: '#/components/schemas/OrgRole'}, cardBound: {type: boolean}, paymentsEnabled: {type: boolean, description: 'M2-15: WIZARD_PAYMENTS платформы; false — S-billing скрывает покупку, подписки и привязку карты'}}}
    Member: {type: object, properties: {userId: {type: string}, email: {type: string}, name: {type: [string, 'null']}, role: {$ref: '#/components/schemas/OrgRole'}, joinedAt: {type: string, format: date-time}}}
    Invite: {type: object, properties: {id: {type: string}, email: {type: string}, role: {$ref: '#/components/schemas/OrgRole'}, expiresAt: {type: string, format: date-time}}}
    OrgSettings: {type: object, additionalProperties: false, properties: {ruOnly: {type: boolean, default: false}, buildModelLabel: {type: string, readOnly: true, description: 'Фактическая модель сборки по умолчанию для org с учётом ruOnly, t1Restricted и решения F2 (agents/models.yaml), например «GLM-5.3» или «модели в РФ»; S1/S3/S10 показывают её, а не константу (L4-20)'}, t1Restricted: {type: boolean, readOnly: true, description: 'db.yaml#orgs.t1_restricted (L3-02); ставит платформа/staff'}}}
    CreditBalance:
      type: object
      required: [balance, held, available]
      properties:
        balance: {type: number}
        held: {type: number, description: Резервы активных прогонов}
        available: {type: number}
        buckets: {type: array, items: {type: object, properties: {source: {enum: [free_welcome, free_monthly, plan_monthly, topup, adjustment]}, remaining: {type: number}, expiresAt: {type: [string, 'null'], format: date-time}}}}
    LedgerEntry:
      type: object
      required: [id, kind, amount, createdAt]
