      x-milestone: M2
      x-roles: [staff]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [action, note], properties: {action: {enum: [triage, takedown, dismiss, restore]}, note: {type: string, minLength: 3}}}}}}
      responses: {'200': {description: 'Выполнено, владельцу отправлено уведомление', content: {application/json: {schema: {$ref: '#/components/schemas/AbuseReport'}}}}}
  /admin/orgs/{orgId}/flags:
    parameters: [{$ref: '#/components/parameters/orgId'}]
    put:
      operationId: adminSetOrgFlags
      x-milestone: M2
      x-roles: [staff]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {requireFounderReview: {type: boolean}, passportCollectionAllowed: {type: boolean, description: abuse.yaml#patterns.gov_ids}}}}}}
      responses: {'200': {description: Обновлено}}
  /admin/systems/{id}/founder-review:
    parameters: [{$ref: '#/components/parameters/systemId'}]
    post:
      operationId: adminFounderReview
      x-milestone: M2
      x-roles: [staff]
      summary: Решение по ревизии, ожидающей ревью перед prod (M2-09); approve разблокирует publish этой ревизии
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision, decision], properties: {revision: {type: integer}, decision: {enum: [approve, reject]}, note: {type: string}}}}}}
      responses: {'200': {description: Записано}}
components:
  securitySchemes: {devUser: {type: apiKey, in: header, name: X-Wizard-Dev-User, description: M0; только WIZARD_AUTH_MODE=dev}, session: {type: apiKey, in: cookie, name: __Host-wizard_session, description: 'M1+ (локально по http — wizard_session); + заголовок X-Wizard-CSRF для мутаций'}}
  parameters:
    systemId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    runId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    orgId: {name: orgId, in: path, required: true, schema: {type: string, format: uuid}}
    version: {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    idempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 64}}
  responses: {Error: {description: Ошибка, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}}
  schemas:
    Error:
      type: object
      required: [code, message_ru]
      additionalProperties: false
      properties:
        code:
          type: string
          x-http-status:
            VALIDATION_FAILED: 400
            UNAUTHORIZED: 401
            OTP_INVALID: 401
            INSUFFICIENT_CREDITS: 402
            PLAN_LIMIT: 402
            FORBIDDEN: 403
            MFA_REQUIRED: 403
            NOT_OWNER: 403
            CARD_BINDING_REQUIRED: 403
            FOUNDER_REVIEW_PENDING: 403
            ORG_SUSPENDED: 403
            NOT_FOUND: 404
            SYSTEM_LOCKED: 409
            NO_GATE_FAILURE: 409
            RUN_NOT_CANCELLABLE: 409
            RUN_NOT_WAITING_INPUT: 409
            CARD_VERSION_STALE: 409
            NO_CARD: 409
            PREVIEW_NOT_READY: 409
            INVITE_EXPIRED: 410
            EXPORT_LINK_USED: 410
            VERSION_CONFLICT: 412
            PAYLOAD_TOO_LARGE: 413
            UNSUPPORTED_MEDIA_TYPE: 415
            HOST_NOT_ALLOWED: 421
            OPS_INVALID: 422
            IDEMPOTENCY_MISMATCH: 422
            CONSENT_REQUIRED: 422
            LAST_OWNER: 422
            OPERATOR_NAME_REQUIRED: 422
            OPERATOR_CONTACT_REQUIRED: 422
            OPERATOR_ADDRESS_REQUIRED: 422
            PHONE_LOGIN_PLAN_REQUIRED: 422
            CARD_NOT_RU: 422
            SYSTEM_SUSPENDED: 422
            GATES_FAILED: 422
            DESTRUCTIVE_IN_PROD: 422
            ROLLBACK_TARGET_INVALID: 422
            RATE_LIMITED: 429
            INTERNAL: 500
            LLM_UNAVAILABLE: 503
        message_ru: {type: string, description: 'Готовый к показу текст на русском, без стеков и SQL'}
        details: {type: object, description: 'Структурные данные. Для OPS_INVALID — {errors: OpsError[]} (ops.yaml#apply.error_shape); для GATES_FAILED — {reports: GateReport[]}; для INSUFFICIENT_CREDITS — {available, required}; для PLAN_LIMIT — {limit, current, plan}'}
    OrgRole: {enum: [owner, editor, viewer]}
    SystemStage: {enum: [interview, card, building, ready, failed], description: workflows.yaml#system_stage}
    System:
      type: object
      required: [id, orgId, slug, name, stage, draftRevision, createdAt]
      properties:
        id: {type: string, format: uuid}
        orgId: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$', description: Без '--'; runtime.yaml#routing.system_slug}
        name: {type: string}
        stage: {$ref: '#/components/schemas/SystemStage'}
        draftRevision: {type: integer, minimum: 0}
        previewRevision: {type: [integer, 'null'], description: Последняя ревизия с G0=passed и собранным бандлом}
        prodRevision: {type: [integer, 'null']}
        prodUrl: {type: [string, 'null'], format: uri}
        suspended: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SystemCard:
      type: object
      description: 'Нормативная схема — specs/agents/orchestrator.yaml#system_card. Мини-карточка правки (orchestrator.yaml#change_requests.small_edit) — та же схема с kind=change: обязательны cardVersion, kind, summary («что меняется»), estimate, cap; остальные поля опциональны (L1-51). API гарантирует поля ниже'
      required: [cardVersion, kind, estimate, cap]
      additionalProperties: true
      if: {properties: {kind: {const: change}}}
      then: {required: [summary]}
      properties:
        cardVersion: {type: integer, minimum: 1}
        kind: {enum: [create, change], description: добавляет platform-api}
        title: {type: string, maxLength: 80}
        summary: {type: string, maxLength: 400, description: 'для kind=change — «что меняется»'}
        estimate: {type: object, properties: {credits: {type: object, properties: {min: {type: number}, expected: {type: number}, max: {type: number}}}, minutes: {type: object}}}
        cap: {type: object, required: [credits], properties: {credits: {type: integer}}}
    Question:
      type: object
      description: agents/orchestrator.yaml#schemas.Question (источник истины, L1-10)
      required: [id, forkId, text, whyItMatters, options]
      properties:
        id: {type: string}
        forkId: {type: string, description: id из orchestrator.yaml#fork_taxonomy}
        text: {type: string, maxLength: 140}
        whyItMatters: {type: string, maxLength: 160}
        options: {type: array, minItems: 2, maxItems: 4, description: ровно один recommended=true, items: {type: object, required: [id, label, recommended], properties: {id: {type: string}, label: {type: string, maxLength: 60}, recommended: {type: boolean}, description: {type: string, maxLength: 140}}}}
        allowCustom: {type: boolean, default: true, description: 'свой ответ ≤ 500 символов (postAnswers.answers[].text)'}
    Message:
      type: object
      required: [id, seq, role, kind, createdAt]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        role: {enum: [user, assistant, system]}
        kind: {enum: [text, questions, answers, card, run_report, notice]}
        text: {type: string}
        payload: {type: object, description: 'По kind: notice — {type: pii, categories: string[]} (orchestrator.yaml#pii_notice); questions — {questionIds, analysis?: {title, roles, skeleton, constraints, forks: [{forkId, status: resolved|asking|pending}]}} для панели «Как я понял задачу» (S2, L4-26; сводка Analysis без ПДн); text от пользователя (M3) — {target?} как в postMessage; card — {cardVersion}; run_report — {runId, status}'}
        runId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
    RevisionSummary:
      type: object
      required: [version, author, createdAt]
      properties:
        version: {type: integer}
        parentVersion: {type: [integer, 'null']}
        author: {enum: [user, agent, system]}
        authorUserId: {type: [string, 'null'], format: uuid}
        runId: {type: [string, 'null'], format: uuid}
        kind: {enum: [ops, files, style, revert, compliance]}
        summary_ru: {type: string}
        g0Passed: {type: [boolean, 'null']}
        createdAt: {type: string, format: date-time}
    Run:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        systemId: {type: [string, 'null'], format: uuid, description: null только для nightly_eval (db.yaml#runs.system_id)}
        kind: {enum: [interview_turn, build, publish, rollback, import_table, retention, nightly_eval, export]}
        mode: {enum: [create, change, fix, point_edit], description: 'только для build; point_edit — M3'}
        status: {enum: [queued, waiting_lock, running, needs_input, succeeded, failed, cancelled], description: workflows.yaml#run_lifecycle}
        currentStep: {type: [string, 'null']}
        credits: {type: object, properties: {estimate: {type: number}, cap: {type: number}, used: {type: number}}}
        baseRevision: {type: [integer, 'null']}
        resultRevision: {type: [integer, 'null']}
        failure: {type: [object, 'null'], properties: {code: {type: string}, message_ru: {type: string}}}
        lastEventSeq: {type: integer}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    RunEvent:
      type: object
      required: [runId, seq, type, ts, payload]
      description: Конверт; payload по type — workflows.yaml#events
      properties: {runId: {type: string, format: uuid}, seq: {type: integer, minimum: 1}, type: {type: string}, ts: {type: string, format: date-time}, payload: {type: object}}
    GateReport:
      type: object
      required: [level, passed, checks]
      description: Нормативно — specs/quality/gates.yaml#report (копия для контрактного теста; при расхождении выигрывает gates.yaml)
      properties:
        level: {enum: [G0, G1, G2]}
        passed: {type: boolean}
        specVersion: {type: integer}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer}
        summary: {type: object, properties: {pass: {type: integer}, fail: {type: integer}, warn: {type: integer}, skip: {type: integer}, error: {type: integer}}}
        checks:
          type: array
          items:
            type: object
            required: [id, status, severity, message_ru]
            properties: {id: {type: string}, status: {enum: [pass, fail, warn, skip, error]}, severity: {enum: [blocker, warning]}, message_ru: {type: string, maxLength: 300}, file: {type: string}, line: {type: integer}, path: {type: string}, acId: {type: string}, evidence: {type: string, maxLength: 500, description: без значений ПДн}, fixHint: {type: string}}
        explanations: {type: array, items: {type: object}, description: 'только G1: Explanation[] (agents/qa.yaml#explain)'}
    LockStatus:
      type: object
      required: [held]
      properties: {held: {type: boolean}, runId: {type: [string, 'null']}, holder: {type: [object, 'null'], properties: {userId: {type: string}, name: {type: string}}}, since: {type: [string, 'null'], format: date-time}, queue: {type: array, items: {type: string, format: uuid}}}
    Publication:
      type: object
      required: [id, env, revision, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        env: {const: prod}
        revision: {type: integer}
        schemaRevision: {type: integer}
        status: {enum: [planned, applying, live, superseded, failed, suspended]}
        migrationSteps: {type: integer}
        createdAt: {type: string, format: date-time}
    ImportColumnMapping:
      type: object
      required: [column, action]
      additionalProperties: false
      properties: {column: {type: string}, action: {enum: [map, skip, new_field]}, entity: {type: string}, field: {type: string}, pii: {enum: [none, basic], description: 'подтверждённая пользователем разметка ПДн'}}
    Export:
      type: object
      required: [id, env, status, createdAt]
      properties: {id: {type: string, format: uuid}, env: {enum: [draft, prod]}, status: {enum: [running, ready, failed, expired]}, size: {type: [integer, 'null']}, downloads: {type: integer}, expiresAt: {type: string, format: date-time}, createdBy: {type: string, format: uuid}, createdAt: {type: string, format: date-time}}
    User: {type: object, properties: {id: {type: string, format: uuid}, email: {type: string}, name: {type: [string, 'null']}, isStaff: {type: boolean}, mfaEnrolled: {type: boolean, description: M2}}}
    Org: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, plan: {enum: [free, start, business]}, role: {$ref: '#/components/schemas/OrgRole'}, cardBound: {type: boolean}}}
    Member: {type: object, properties: {userId: {type: string}, email: {type: string}, name: {type: [string, 'null']}, role: {$ref: '#/components/schemas/OrgRole'}, joinedAt: {type: string, format: date-time}}}
    Invite: {type: object, properties: {id: {type: string}, email: {type: string}, role: {$ref: '#/components/schemas/OrgRole'}, expiresAt: {type: string, format: date-time}}}
    OrgSettings: {type: object, additionalProperties: false, properties: {ruOnly: {type: boolean, default: false}, buildModelLabel: {type: string, readOnly: true, description: 'Фактическая модель сборки по умолчанию для org с учётом ruOnly, t1Restricted и решения F2 (agents/models.yaml), например «GLM-5.3» или «модели в РФ»; S1/S3/S10 показывают её, а не константу (L4-20)'}, t1Restricted: {type: boolean, readOnly: true, description: 'db.yaml#orgs.t1_restricted (L3-02); ставит платформа/staff'}}}
    CreditBalance:
      type: object
      required: [balance, held, available]
      properties:
        balance: {type: number}
        held: {type: number, description: Резервы активных прогонов}
        available: {type: number}
        buckets: {type: array, items: {type: object, properties: {source: {enum: [free_welcome, free_monthly, plan_monthly, topup, adjustment]}, remaining: {type: number}, expiresAt: {type: [string, 'null'], format: date-time}}}}
    LedgerEntry:
      type: object
      required: [id, kind, amount, createdAt]
      properties:
        id: {type: string}
        kind: {enum: [grant, charge, hold, release, expire, refund, adjustment]}
        amount: {type: number, description: '+ начисление, − списание'}
        source: {type: string}
        runId: {type: [string, 'null']}
        systemId: {type: [string, 'null']}
        note_ru: {type: string}
        createdAt: {type: string, format: date-time}
    Billing:
      type: object
      properties:
        plan: {enum: [free, start, business]}
        status: {enum: [none, active, past_due, cancelled]}
        periodEnd: {type: [string, 'null'], format: date-time}
        cancelAtPeriodEnd: {type: boolean}
        card: {type: [object, 'null'], properties: {last4: {type: string}, issuerCountry: {type: string}, boundAt: {type: string, format: date-time}}}
        limits: {type: object, properties: {prodSystems: {type: integer}, members: {type: integer}, monthlyCredits: {type: number}}}
    AbuseReport:
      type: object
      properties: {id: {type: string}, systemId: {type: [string, 'null']}, category: {type: string}, status: {enum: [new, triaged, takedown, dismissed, restored]}, slaDeadline: {type: string, format: date-time}, createdAt: {type: string, format: date-time}}
