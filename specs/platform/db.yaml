# Схема БД платформы. Нормативно для apps/platform-api и apps/worker.
# Нотация колонки: "<pg type> [not null] [default ...] [references ...] [check ...]". pk — первичный ключ.
# Реализация: kysely-миграции в apps/platform-api/migrations (M0-15), имена SQL полностью квалифицированы (AGENTS.md).
version: 1
schema: platform                 # + схема dbos (создаёт DBOS в M1) + схемы app_<schema_key>_<env> (runtime)
conventions:
  - "MUST: все таблицы в схеме platform; id — uuid default gen_random_uuid(); колонка created_at timestamptz not null default now() есть в КАЖДОЙ таблице, кроме shards, subscriptions, locks (acquired_at), run_events (ts), и в списках ниже не повторяется"
  - "MUST: кредиты хранятся в милликредитах (bigint, 1 кредит = 1000); деньги — в копейках (bigint)"
  - "MUST: мягкое удаление только там, где есть deleted_at; остальное — физически"
  - "MUST NOT: хранить содержимое LLM-промптов/ответов в llm_calls; значения секретов нигде в platform"
  - "MUST: миграции только вперёд; каждая миграция транзакционна, SET LOCAL lock_timeout = '3s'"
  - "Тест M0-15: после migrate на пустой БД колонки таблиц с milestone M0 в information_schema совпадают с этим файлом (тест сам парсит db.yaml; L2-24). Объекты вне схемы platform (pii_vault, debug_transcripts — data-boundary.yaml, M1+, по умолчанию выключены) в тест не входят"
  - "Роли БД: wizard — владелец схемы platform (миграции platform-api); wizard_owner — миграции схем app_* и НЕ владелец platform, не superuser; wizard_runtime — runtime (deploy.yaml#local.postgres.roles, L3-01)"

seed_M0:
  - "users: dev@wizard.local (id 00000000-0000-0000-0000-0000000000aa)"
  - "orgs: «Локальная организация» (id 00000000-0000-0000-0000-000000000001), plan=free; memberships: owner"

tables:
  users:
    milestone: M0
    columns:
      id: "uuid pk"
      email: "text not null check (email = lower(email))"
      name: "text"
      is_staff: "boolean not null default false"          # M2; в бете staff = учётная запись основателя (F7)
      totp_secret_ref: "text"                             # M2, secret://; значение в OpenBao
      mfa_enrolled_at: "timestamptz"                      # M2; is_staff без MFA не получает доступ к /admin/* (api.yaml#info.x-auth.M2, F7)
      totp_last_step: "bigint"                            # M2-08; шаг RFC 6238 последнего принятого кода — код принимается один раз
      mfa_recovery_hashes: "jsonb"                        # M2-08; HMAC неиспользованных кодов восстановления (сами коды показываются один раз)
      deleted_at: "timestamptz"                           # M2, DELETE /me: email → anonymized-<id>, name → null, сессии отозваны (L3-36)
      pd_consent_at: "timestamptz"                        # M1, compliance.yaml#platform
      offer_accepted_at: "timestamptz"
      offer_version: "text"
    indexes: ["unique (email)"]

  auth_otps:
    milestone: M1
    columns:
      id: "uuid pk"
      email: "text not null"
      code_hash: "text not null"                          # HMAC-SHA256(pepper, code); pepper — WIZARD_SECRETS_KEY-производный, не в БД (L3-25)
      attempts: "smallint not null default 0 check (attempts <= 5)"
      expires_at: "timestamptz not null"
      consumed_at: "timestamptz"
      ip_hash: "text"
    indexes: ["(email, created_at desc)"]
    retention: "удалять строки старше 24 ч (retention_cron)"

  sessions:
    milestone: M1
    columns:
      id: "uuid pk"
      user_id: "uuid not null references platform.users on delete cascade"
      token_hash: "text not null"                         # sha256; сырой токен только в cookie
      csrf_hash: "text not null"
      expires_at: "timestamptz not null"
      revoked_at: "timestamptz"
      mfa_verified_at: "timestamptz"                          # M2-08; TOTP-подтверждение staff в этой сессии (step-up, api.yaml#info.x-auth.M2)
    indexes: ["unique (token_hash)", "(user_id)"]

  orgs:
    milestone: M0
    columns:
      id: "uuid pk"
      name: "text not null check (length(name) between 1 and 120)"
      plan: "text not null default 'free' check (plan in ('free','pilot','start','business'))"   # pilot — только CLI основателя (billing.yaml#plans.pilot, M2-15)
      ru_only: "boolean not null default false"           # M1, data-boundary.yaml#ru_only
      require_founder_review: "boolean not null default true"   # M2-09; в бете true
      passport_collection_allowed: "boolean not null default false"  # M2, abuse.yaml#patterns.gov_ids
      suspended_at: "timestamptz"                         # M2, abuse: приостановка всей организации (abuse.yaml#takedown.flow, api.yaml#adminOrgSuspension) — все системы org suspended в deployments, publish → ORG_SUSPENDED
      region_code: "text check (region_code ~ '^[0-9]{2}$')"   # M1: код субъекта РФ (ИНН, регион при регистрации, офлайн-GeoIP в РФ); L3-02
      t1_restricted: "boolean not null default false"      # M1: true → все вызовы org только T0 (route_reason policy_region_restricted); region_code is null (регион неизвестен) T1 НЕ ограничивает (D26_models_default, 2026-10-04); IP входа из регионов с ограничением Z.ai → true; список регионов — E-LEGAL

  memberships:
    milestone: M0
    columns:
      org_id: "uuid not null references platform.orgs on delete cascade"
      user_id: "uuid not null references platform.users on delete cascade"
      role: "text not null check (role in ('owner','editor','viewer'))"
    primary_key: [org_id, user_id]
    indexes: ["(user_id)"]
    invariants: ["У организации ≥ 1 owner — проверка в транзакции изменения роли/удаления (LAST_OWNER)"]

  invites:
    milestone: M1
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs on delete cascade"
      email: "text not null"
      role: "text not null check (role in ('owner','editor','viewer'))"
      token_hash: "text not null"
      invited_by: "uuid not null references platform.users"
      expires_at: "timestamptz not null"
      accepted_at: "timestamptz"
      revoked_at: "timestamptz"
    indexes: ["unique (token_hash)", "(org_id) where accepted_at is null and revoked_at is null"]

  pilot_invites:
    milestone: M2
    purpose: "M2-15 (D24_pilot_free): приглашения основателя при WIZARD_REGISTRATION=invite. Создаёт CLI платформы (pilot invite), письмо со ссылкой на /login. Первый вход нового email с активным приглашением создаёт org с plan=pilot (имя org_name), начисляет credits (pilot_grant) и отмечает accepted_*"
    columns:
      id: "uuid pk"
      email: "text not null check (email = lower(email))"
      org_name: "text"
      credits: "integer not null default 0 check (credits >= 0)"
      expires_at: "timestamptz not null"                       # 30 дней
      accepted_at: "timestamptz"
      accepted_user_id: "uuid references platform.users"
      org_id: "uuid references platform.orgs"
      revoked_at: "timestamptz"                               # повторное приглашение отзывает прежнее
      require_founder_review: "boolean not null default true"  # pilot-admin: флаг «ревью основателя» при приглашении → orgs.require_founder_review при принятии
    indexes: ["unique (email) where accepted_at is null and revoked_at is null"]

  ops_alerts:
    milestone: M2
    purpose: "Алерты основателю, отправляемые один раз на ключ — единственный путь дедупликации (apps/platform-api/src/ops/alert.ts alertOnce): llm_cap_80:<yyyy-mm>, llm_cap_100:<yyyy-mm> (лимит токенов месяца, M2-15), run_fail_rate:<yyyy-mm-ddThh> (M2-09), abuse_sla:<reportId> (M2-08), founder_review:<systemId>:<revision> (M2-09), auto_suspend:<publicationId>:<yyyy-mm-ddThh> (abuse.yaml#takedown.auto_suspend)"
    columns:
      key: "text pk"

  platform_settings:
    milestone: M2
    purpose: "M2-09: переключатели платформы, которые ставит CLI основателя (pilot readiness on|off), с отметкой кто/когда. beta_readiness = {on: bool, note?} — пока не on, CLI не отправляет приглашения партнёрам (зеркало M2-13: юрист и уведомление РКН; compliance.yaml#beta_readiness)"
    columns:
      key: "text pk"
      value: "jsonb not null"
      updated_by: "text not null"                             # кто переключил (--by или пользователь ОС)
      updated_at: "timestamptz not null"

  systems:
    milestone: M0
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs"
      slug: "text not null check (slug ~ '^[a-z][a-z0-9-]{1,30}[a-z0-9]$' and position('--' in slug) = 0)"   # поддомен, runtime.yaml#routing.system_slug
      schema_key: "text not null check (schema_key ~ '^[a-z0-9]{12}$')"           # = systemId в runtime.yaml (схема app_<schema_key>_<env>, каталог артефактов)
      name: "text not null"
      stage: "text not null default 'interview' check (stage in ('interview','card','building','ready','failed'))"
      card: "jsonb"                                        # текущая SystemCard (agents/orchestrator.yaml)
      card_version: "integer not null default 0"
      card_approved_version: "integer"
      pending_questions: "jsonb not null default '[]'"
      draft_revision: "integer not null default 0"         # последняя закоммиченная ревизия
      preview_revision: "integer"                          # последняя ревизия с G0=passed и бандлом
      prod_revision: "integer"                             # M1: что отдаётся в prod
      schema_hwm_revision: "integer"                       # M1: ревизия, чья схема фактически применена в prod (high-water mark)
      shard_id: "text"                                     # M2: platform.shards; M0–M1 null = локальный инстанс
      suspended_at: "timestamptz"                          # M2, снятие публикации
      draft_data_purged_at: "timestamptz"                  # M2: схема draft Free-черновика удалена по неактивности (F5, workflows.yaml#retention_cron)
      draft_purge_notice_at: "timestamptz"                 # M2: письмо владельцам за 7 дней до F5-очистки отправлено (идемпотентность прохода; M2-05)
      last_activity_at: "timestamptz not null default now()"   # сообщение, прогон, стиль или вход владельца в систему; основа для F5
      created_by: "uuid not null references platform.users"
      updated_at: "timestamptz not null default now()"
      deleted_at: "timestamptz"
    indexes: ["unique (slug)", "unique (schema_key)", "(org_id, created_at desc) where deleted_at is null"]

  messages:
    milestone: M0
    purpose: "История чата системы. Хранит сырой ввод пользователя (в РФ); к T1 уходит только после scrub"
    columns:
      id: "uuid pk"
      system_id: "uuid not null references platform.systems on delete cascade"
      seq: "integer not null"
      role: "text not null check (role in ('user','assistant','system'))"
      kind: "text not null check (kind in ('text','questions','answers','card','run_report','notice'))"
      text: "text"
      payload: "jsonb"
      run_id: "uuid"
      author_user_id: "uuid references platform.users"
    indexes: ["unique (system_id, seq)"]
    payload_shapes:
      notice: "{type: 'pii', categories: string[]} — уведомление о ПДн (agents/orchestrator.yaml#pii_notice)"
      text_user_M3: "{target?: {wzId, componentName?, file, line?}} — «Укажи и измени» (api.yaml#postMessage)"
    retention: "text у role=user и kind=text — scrub (packages/pii) через 180 дней после systems.last_activity_at; при удалении системы — физически (workflows.yaml#delete_system); L3-09"

  revisions:
    milestone: M0
    purpose: "Ревизия = батч ops ИЛИ набор файлов (ops.yaml#apply). История только вперёд; откат = новая ревизия kind=revert"
    columns:
      system_id: "uuid not null references platform.systems on delete cascade"
      version: "integer not null check (version >= 1)"
      parent_version: "integer"
      kind: "text not null check (kind in ('ops','files','style','revert','compliance'))"
      author: "text not null check (author in ('user','agent','system'))"
      author_user_id: "uuid references platform.users"
      run_id: "uuid references platform.runs"
      spec: "jsonb not null"                                # полный AppSpec после применения
      ops: "jsonb not null default '[]'"                    # батч операций (≤50)
      files_manifest_sha: "text not null"                  # sha256 blob-а JSON {path: sha256}, отсортированного по path
      bundle_key: "text"                                   # после успешной сборки: <schema_key>/<version> (runtime.yaml#system_loading.artifact_layout)
      g0_passed: "boolean"
      idempotency_key: "text"
      summary_ru: "text"
    primary_key: [system_id, version]
    indexes: ["unique (system_id, idempotency_key) where idempotency_key is not null", "(run_id)"]
    constraints: ["foreign key (system_id, parent_version) references platform.revisions (system_id, version)"]
    invariants:
      - "version = max(version)+1 выдаётся под SELECT ... FOR UPDATE по systems (CAS по expectedVersion = systems.draft_revision)"
      - "Вставка ревизии и обновление systems.draft_revision — в одной транзакции"

  files:
    milestone: M0
    purpose: "Индекс контент-адресуемых блобов (исходники, манифесты, бандлы). Содержимое — в хранилище артефактов (deploy.yaml#local.artifacts, cloud.object_storage)"
    columns:
      sha256: "text pk check (sha256 ~ '^[0-9a-f]{64}$')"
      size: "bigint not null check (size >= 0 and size <= 5242880)"
      content_type: "text not null"
      storage_key: "text not null"                         # M0: .data/artifacts/blobs/ab/cdef...; M2: s3://artifacts/blobs/ab/cdef...
    invariants: ["Запись в хранилище раньше строки в files; sha256 проверяется при чтении (тест: подмена байта → ошибка INTEGRITY)"]

  runs:
    milestone: M0
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs"
      system_id: "uuid references platform.systems"         # null для nightly_eval
      kind: "text not null check (kind in ('interview_turn','build','publish','rollback','import_table','retention','nightly_eval','export'))"
      mode: "text check (mode in ('create','change','fix','point_edit'))"      # point_edit — M3
      status: "text not null default 'queued' check (status in ('queued','waiting_lock','running','needs_input','succeeded','failed','cancelled'))"
      current_step: "text"
      input: "jsonb not null default '{}'"                  # параметры запуска (без секретов)
      pending_input: "jsonb"                                # {inputId, kind, ...} при needs_input
      card_version: "integer"
      credits_estimate_milli: "bigint"
      credits_cap_milli: "bigint"
      credits_used_milli: "bigint not null default 0"
      base_revision: "integer"
      result_revision: "integer"
      failure_code: "text"
      failure_message_ru: "text"
      cancel_requested_at: "timestamptz"
      started_by: "uuid references platform.users"
      dbos_workflow_id: "text"                              # M1
      heartbeat_at: "timestamptz"
      started_at: "timestamptz"
      finished_at: "timestamptz"
    indexes: ["(system_id, created_at desc)", "(status) where status in ('queued','waiting_lock','running','needs_input')", "unique (dbos_workflow_id)", "(finished_at) where finished_at is not null"]   # последний — доля упавших прогонов за час (алерт и метрика M2-09; миграция 0015)

  run_events:
    milestone: M0
    columns:
      run_id: "uuid not null references platform.runs on delete cascade"
      seq: "integer not null check (seq >= 1)"
      type: "text not null"                                 # workflows.yaml#events
      payload: "jsonb not null"
      ts: "timestamptz not null default now()"
    primary_key: [run_id, seq]
    invariants: ["seq выдаётся без пропусков в транзакции шага; событие пишется ДО публикации в SSE-шину (источник истины — таблица)"]
    retention: "180 дней (retention_cron, M2)"

  gate_reports:
    milestone: M0
    purpose: "Полный GateReport (quality/gates.yaml#report) каждого запуска гейта; событие gate_result несёт только сжатую выжимку (L1-11)"
    columns:
      run_id: "uuid not null references platform.runs on delete cascade"
      system_id: "uuid not null references platform.systems on delete cascade"
      revision: "integer not null"
      level: "text not null check (level in ('G0','G1','G2'))"
      passed: "boolean not null"
      report: "jsonb not null"                                # GateReport целиком, без значений ПДн (evidence — gates.yaml)
    primary_key: [run_id, level, revision]
    indexes: ["(system_id, level, revision desc)"]
    reads: "GET /systems/:id/gates/latest: для каждого level строка с max(revision) по system_id"
    retention: "180 дней, кроме последней строки на (system_id, level) (retention_cron, M2)"

  g1_checks:
    milestone: M2
    purpose: "QA-сценарии пройденного G1 (qa.yaml#checks.output) для критериев карточки без шагов в спеке: G1 при публикации ревизии без своего G1 (правка compliance поверх сборки, workflows.yaml#workflows.publish.steps.gate_G1_prod) берёт их у ближайшей ревизии ≤ публикуемой — по каждому AC, только при совпадении acId и sha256(text) (как qa.yaml#checks.determinism); у изменённого AC сценария нет → G1-AC-COVER. Сценарии синтетические (QA не видит записей и значений секретов)"
    columns:
      system_id: "uuid not null"
      revision: "integer not null"
      run_id: "uuid not null references platform.runs on delete cascade"
      checks: "jsonb not null"                                # [{acId, textSha256, check: QaCheck}] — только scenario/constraint с acId, level G1
    primary_key: [system_id, revision]
    constraints: ["foreign key (system_id, revision) references platform.revisions (system_id, version) on delete cascade"]
    invariants: ["Строка пишется в одной транзакции с gate_reports пройденного G1 (сборка или публикация); повторный пройденный G1 той же ревизии её заменяет"]
    retention: "живёт вместе с ревизией (retention_cron gate_reports её не трогает)"

  llm_calls:
    milestone: M0
    purpose: "Журнал маршрутизации и учёта = models.yaml#usage_record (одна строка на HTTP-попытку; models.yaml называет её llm_usage — имя таблицы здесь). НИКОГДА не содержит текст запросов и ответов"
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs"
      system_id: "uuid"
      run_id: "uuid references platform.runs"
      step: "text"
      call_type: "text not null"                            # models.yaml#call_types
      agent_role: "text"                                    # orchestrator | builder | qa | importer | auditor | runtime | support (models.yaml#routes)
      tier: "text not null check (tier in ('T0','T1'))"
      provider: "text not null"                             # cloudru | yandex | zai | fixture
      model_id: "text not null"                             # id из models.yaml#models
      attempt: "smallint not null default 1"
      status: "text not null check (status in ('ok','error','timeout','circuit_open','aborted'))"
      error_code: "text"
      route_reason: "text not null check (route_reason in ('policy_ru_only','policy_region_restricted','callType_forbidden_T1','pii_high_risk','pii_detected_interview','pii_hint','default_T1','default_T0','fallback_circuit_open','fallback_error'))"
      fallback_from: "text"
      policy_version: "text not null"
      scrubbed: "boolean not null"                          # true для всех T1
      pii_categories_count: "jsonb not null default '{}'"   # {phone_ru: 2, email: 1}; только счётчики детекторов
      input_tokens: "integer not null default 0"
      cached_tokens: "integer not null default 0"
      output_tokens: "integer not null default 0"
      tool_calls: "integer not null default 0"
      latency_ms: "integer"
      ttft_ms: "integer"
      cost_rub: "numeric(12,4) not null default 0"          # с НДС, по прайсу models.yaml
      credits_milli: "bigint not null default 0"
      billable: "boolean not null default true"             # false: ошибка провайдера (status ≠ ok)
      mode: "text not null check (mode in ('live','fixture','record'))"
      request_hash: "text"                                  # sha256 scrubbed-запроса (ключ fixture); не содержимое
    indexes: ["(run_id)", "(org_id, created_at)", "(tier, call_type, created_at)", "(created_at)"]   # последний — платформенный лимит токенов месяца (M2-15; миграция 0015)
    checks: ["check (tier = 'T0' or scrubbed)"]

  credit_ledger:
    milestone: M1
    purpose: "Append-only журнал кредитов (billing.yaml#ledger). UPDATE/DELETE запрещены триггером"
    columns:
      id: "bigint generated always as identity pk"
      org_id: "uuid not null references platform.orgs"
      kind: "text not null check (kind in ('grant','charge','hold','release','expire','refund','adjustment'))"
      amount_milli: "bigint not null"                        # >0 grant/release/refund; <0 charge/hold/expire
      bucket: "text check (bucket in ('free_welcome','free_monthly','plan_monthly','topup','adjustment'))"
      bucket_expires_at: "timestamptz"
      run_id: "uuid references platform.runs"
      system_id: "uuid"
      payment_id: "uuid"
      idempotency_key: "text not null"                       # например charge:<runId>, grant:free_monthly:<org>:<yyyy-mm>
      note_ru: "text"
      created_by: "uuid"
    indexes: ["unique (org_id, idempotency_key)", "(org_id, created_at desc)", "(run_id)"]
    invariants: ["Баланс = sum(amount_milli) по org; available = balance (holds уже отрицательные); available ≥ 0 проверяется под advisory lock org"]

  locks:
    milestone: M0
    purpose: "Одна сборка на систему (D11). В M0 — та же таблица, очередь in-process"
    columns:
      system_id: "uuid pk references platform.systems on delete cascade"
      run_id: "uuid not null references platform.runs"
      holder_user_id: "uuid references platform.users"
      acquired_at: "timestamptz not null default now()"
      lease_until: "timestamptz not null"                    # продлевается heartbeat каждые 30 с, lease 2 мин
    invariants: ["Захват: INSERT ... ON CONFLICT DO NOTHING либо UPDATE при lease_until < now() (перехват просроченной)"]

  publications:
    milestone: M1
    columns:
      id: "uuid pk"
      system_id: "uuid not null references platform.systems"
      env: "text not null default 'prod' check (env = 'prod')"   # draft не публикуется, он всегда = preview_revision
      revision: "integer not null"
      schema_revision: "integer not null"                    # hwm после применения
      prev_publication_id: "uuid references platform.publications"
      migration_plan: "jsonb not null"                       # MigrationPlan {steps[], additiveOnly} (architecture.yaml#interfaces.migration_plan)
      bundle_key: "text not null"
      status: "text not null check (status in ('planned','applying','live','superseded','failed','suspended'))"
      run_id: "uuid references platform.runs"
      created_by: "uuid not null references platform.users"
      live_at: "timestamptz"
      suspended_reason: "text"
    indexes: ["unique (system_id) where status = 'live'", "(system_id, created_at desc)"]
    constraints: ["foreign key (system_id, revision) references platform.revisions (system_id, version)"]

  secrets_refs:
    milestone: M1
    purpose: "Метаданные секретов коннекторов (secret://name). Значение — только в бэкенде"
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs"
      system_id: "uuid not null references platform.systems on delete cascade"
      env: "text not null check (env in ('draft','prod'))"
      name: "text not null check (name ~ '^[a-z0-9_]+$')"
      backend: "text not null check (backend in ('local_encrypted','openbao'))"   # M1 local_encrypted (AES-256-GCM, ключ WIZARD_SECRETS_KEY); M2 openbao
      backend_path: "text not null"
      created_by: "uuid references platform.users"
      rotated_at: "timestamptz"
    indexes: ["unique (system_id, env, name)"]

  imports:
    milestone: M1
    columns:
      id: "uuid pk"
      system_id: "uuid not null references platform.systems on delete cascade"
      source_sha: "text not null"                            # файл зашифрован, TTL 7 дней
      profile: "jsonb"                                       # профили колонок БЕЗ значений (data-boundary.yaml#import)
      mapping: "jsonb"
      status: "text not null check (status in ('profiling','mapping','awaiting_confirm','importing','done','failed','expired'))"
      rows_imported: "integer"
      expires_at: "timestamptz not null"
      created_by: "uuid not null references platform.users"

  exports:
    milestone: M2
    purpose: "Выгрузка данных системы (workflows.yaml#export_data, M2-10) и журнал выгрузок; признак выгрузки с ПДн (createExport.includePii) хранится в runs.input.includePii, отдельной колонки нет; ≤ 20 выгрузок на систему за 24 ч"
    columns:
      id: "uuid pk"
      system_id: "uuid not null references platform.systems on delete cascade"
      env: "text not null check (env in ('draft','prod'))"
      run_id: "uuid references platform.runs"
      status: "text not null check (status in ('running','ready','failed','expired'))"
      storage_key: "text"                                    # ZIP в хранилище артефактов
      size: "bigint"
      download_token_hash: "text"                            # одноразовая ссылка, TTL 15 мин
      download_token_expires_at: "timestamptz"
      downloads: "integer not null default 0"
      expires_at: "timestamptz not null"                     # created_at + 24 ч, затем архив удаляется
      created_by: "uuid not null references platform.users"
    indexes: ["(system_id, created_at desc)"]

  shards:
    milestone: M2
    columns:
      id: "text pk"                                          # app-pg-01, draft-pg-01
      kind: "text not null check (kind in ('prod','draft'))"
      dsn_secret_ref: "text not null"
      capacity: "integer not null default 2000 check (capacity <= 2000)"
      schema_count: "integer not null default 0"
      accepting: "boolean not null default true"
    invariants: ["Назначение шарда: accepting и schema_count < capacity*0.9, минимальный schema_count; инкремент под блокировкой строки"]

  subscriptions:
    milestone: M2
    columns:
      org_id: "uuid pk references platform.orgs"
      plan: "text not null check (plan in ('start','business'))"   # тариф СЛЕДУЮЩЕГО периода (даунгрейд ждёт продления, api.yaml#Billing.nextPlan); текущий — orgs.plan (M2-07)
      status: "text not null check (status in ('active','past_due','cancelled'))"
      payment_method_id: "uuid references platform.payment_methods"
      current_period_start: "timestamptz not null"
      current_period_end: "timestamptz not null"
      cancel_at_period_end: "boolean not null default false"
      next_charge_at: "timestamptz"
      failed_attempts: "smallint not null default 0"

  payment_methods:
    milestone: M2
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs"
      provider: "text not null default 'yookassa'"
      provider_method_id: "text not null"
      card_last4: "text not null"
      card_type: "text"
      issuer_country: "text not null check (issuer_country ~ '^[A-Z]{2}$')"
      card_fingerprint: "text not null"                      # HMAC(first6|last4|срок) — L3-28 «одна карта — ≤ 3 org»; first6, срок и PAN не хранятся (M2-07)
      bound_by: "uuid not null references platform.users"
      bound_at: "timestamptz not null default now()"
      revoked_at: "timestamptz"
    indexes: ["unique (provider, provider_method_id)", "(org_id) where revoked_at is null", "(card_fingerprint)"]

  payments:
    milestone: M2
    columns:
      id: "uuid pk"
      org_id: "uuid not null references platform.orgs"
      kind: "text not null check (kind in ('card_binding','subscription','topup'))"
      amount_kop: "bigint not null check (amount_kop > 0)"
      status: "text not null check (status in ('pending','waiting_for_capture','succeeded','canceled','refunded'))"
      provider_payment_id: "text"
      idempotence_key: "text not null"
      packs: "integer"
      settled_at: "timestamptz"
      meta: "jsonb not null default '{}'"                    # plan, mode (start|upgrade|renewal), periodStart, attempt, userId, ipHash = HMAC(IP; IPv6 по /64), result привязки карты (M2-07)
    indexes: ["unique (provider_payment_id)", "unique (idempotence_key)", "(org_id, kind, created_at desc)"]
    invariants: ["Попытка привязки карты = строка kind=card_binding (включая неудачные и брошенные): ≤ 3 на org и ≤ 10 на meta.ipHash за 24 ч (L3-28)"]

  abuse_reports:
    milestone: M2
    columns:
      id: "uuid pk"
      system_id: "uuid references platform.systems"
      publication_id: "uuid references platform.publications"
      url: "text not null"
      category: "text not null check (category in ('phishing','fraud','brand_impersonation','illegal_content','pd_violation','spam','other','auto_g2'))"
      text: "text"
      contact_email: "text"                                   # ПДн заявителя; удаляется через 1 год после закрытия
      reporter_ip_hash: "text"                                # HMAC(ip, pepper)
      status: "text not null default 'new' check (status in ('new','triaged','takedown','dismissed','restored'))"
      sla_deadline: "timestamptz not null"                    # created_at + 24 ч
      assignee: "uuid references platform.users"
      resolution_note: "text"
      resolved_at: "timestamptz"
    indexes: ["(status, sla_deadline)", "(system_id)", "(reporter_ip_hash, created_at)"]   # последний — лимит 10/ч на IP (M2-08)

  founder_reviews:
    milestone: M2
    columns:
      system_id: "uuid not null references platform.systems"
      revision: "integer not null"
      status: "text not null check (status in ('pending','approved','rejected'))"
      reviewer: "uuid references platform.users"
      note: "text"
      decided_at: "timestamptz"
    primary_key: [system_id, revision]
    indexes: ["(created_at) where status = 'pending'"]
    purpose: "Ревью основателя перед prod (abuse.yaml#scoring.effect). M2-04: строка pending создаётся публикацией при warn G2-AF-08/G2-AF-09 (ON CONFLICT DO NOTHING); ревью привязано к ревизии. Журнал модерации для события abuse_flag отдельной таблицы не имеет — это структурированная строка лога платформы (kind=abuse_flag → Loki) плюс platform.gate_reports (gates.yaml#G2.antifraud_rules)"

  deletion_log:
    milestone: M2
    purpose: "Журнал автоудаления ПДн (compliance.yaml#system_package.retention). Только счётчики, без значений"
    columns:
      id: "bigint generated always as identity pk"
      system_id: "uuid not null"
      env: "text not null"
      entity: "text not null"
      mode: "text not null check (mode in ('delete','anonymize','retention','subject_request','draft_purged','system_deleted','user_deleted','consent_revoked'))"
      cutoff: "timestamptz"
      rows_affected: "integer not null"
      run_id: "uuid"
      created_at: "timestamptz not null default now()"
    indexes: ["(system_id, created_at desc)"]
    retention: "3 года"

  staff_audit_log:
    milestone: M2
    purpose: "Действия staff (модерация, флаги, доступ к данным систем) — требование ОРД 152-ФЗ"
    columns:
      id: "bigint generated always as identity pk"
      actor: "uuid not null references platform.users"
      action: "text not null"
      target: "text not null"
      note: "text"
    indexes: ["(target, created_at desc)", "(actor, action, created_at desc)"]   # M2-08: журнал тикета; доступ staff по тикету и неудачные коды MFA
    retention: "3 года (deploy.yaml#cloud.observability: аудит staff 3 года)"

  brand_allowlist:
    milestone: M2
    purpose: "Организации, подтвердившие владение брендом из abuse.yaml#patterns.brands"
    columns:
      org_id: "uuid not null references platform.orgs"
      brand_id: "text not null"
      verified_by: "uuid not null references platform.users"
      evidence_note: "text not null"
    primary_key: [org_id, brand_id]

  # ==== M2P · M2-22: support_threads, support_messages, orders, capability_gaps, org_limits (резерв миграций — milestones.yaml M2P.plan.merge_rules) — дописывать ЗДЕСЬ ====
  # ==== конец блока M2-22 ====

  ai_action_calls:
    milestone: M3
    purpose: "M3-02: журнал вызовов ИИ-действий систем (runtime.yaml#ai_actions). id — ключ вызова от runtime (кнопка — случайный, шаг воркфлоу — wf:<jobId>:<step>, backfill — bf:<backfillId>:<recordId>): повтор с тем же id не считается в лимите aiAction.monthlyLimit повторно и не списывает кредиты второй раз (ledger charge с ключом ai:<systemId>:<yyyy-mm-ddThh>:<id>). Лимит месяца (Europe/Moscow) = число строк (system_id, action) со status ∈ {pending, ok}. Значений записей и ответов модели не хранит"
    columns:
      id: "text pk"
      org_id: "uuid not null references platform.orgs"
      system_id: "uuid not null references platform.systems"
      env: "text not null check (env in ('draft','prod'))"
      action: "text not null"
      call_type: "text not null check (call_type in ('runtime_ai_extract','runtime_ai_generate'))"
      source: "text not null check (source in ('button','workflow','backfill'))"
      status: "text not null check (status in ('pending','ok','error'))"
      error_code: "text"
      credits_milli: "bigint not null default 0"
      finished_at: "timestamptz"
    indexes: ["(system_id, action, created_at)"]

  ai_backfills:
    milestone: M3
    purpose: "M3-02: разовое заполнение старых записей ИИ-действием по флагу change-карточки (card.aiBackfill: имена aiActions). Сборка change создаёт строки pending для draft и prod; draft исполняется в конце сборки, prod — после переключения публикации, где спека содержит действие. Исполняет runtime (POST /_wizard/internal/ai-backfill на внутреннем порту) в пределах остатка aiAction.monthlyLimit"
    columns:
      id: "uuid pk"
      system_id: "uuid not null references platform.systems"
      env: "text not null check (env in ('draft','prod'))"
      action: "text not null"
      run_id: "uuid references platform.runs"
      status: "text not null default 'pending' check (status in ('pending','done','failed'))"
      filled: "integer not null default 0"
      skipped: "integer not null default 0"
      stop_code: "text"                                       # AI_LIMIT_REACHED | AI_CREDITS_EXHAUSTED | AI_UNAVAILABLE | RUNTIME_UNREACHABLE
      finished_at: "timestamptz"
    indexes: ["unique (system_id, env, action) where status = 'pending'"]

  # ==== M2P · M2-98: custom_domains (+ tombstones), design_references, design_directions, media_assets, fetch_log — дописывать ЗДЕСЬ ====
  # ==== конец блока M2-98 ====

views:
  wz_runtime.otp_sends:
    milestone: M1
    purpose: "Глобальные счётчики OTP по всем системам (runtime.yaml#auth, M1-05): только HMAC адреса и сети клиента; DML — роль runtime. В облаке создаёт миграция M2-06, локально — runtime при первом использовании (CREATE IF NOT EXISTS под advisory xact lock)"
    columns:
      id: "bigint generated always as identity pk"
      destination_hmac: "bytea not null"
      system_id: "text not null"
      env: "text not null"
      channel: "text not null"
      ip_hmac: "bytea"
      org_key: "text"
      billable: "boolean not null default false"
      sent_at: "timestamptz not null default now()"
    indexes: ["(destination_hmac, sent_at)", "(system_id, ip_hmac, sent_at)", "(org_key, sent_at) where billable"]
    retention: "строки старше 2 суток удаляются при вставке"
  credit_buckets:
    milestone: M1
    purpose: "Остаток по корзинам кредитов (billing.yaml#ledger): (org_id, bucket, bucket_expires_at) → sum(amount_milli) из credit_ledger с учётом распределения charge по корзинам (note)"
  system_owner_emails:
    milestone: M2
    purpose: "M2-50 (D69): email владельцев организации для уведомления $owner — runtime читает, как deployments; миграция 0024"
    definition: "systems (deleted_at is null) × memberships (role = owner) × users (deleted_at is null) → {system_id: schema_key, email}"
  deployments:
    milestone: M0
    purpose: "Реестр для runtime (runtime.yaml#system_loading.registry), только чтение ролью runtime"
    definition: >
      draft: systems с preview_revision is not null → {system_id: schema_key, slug, env: 'draft', revision: preview_revision,
      spec_hash: sha256(revisions.spec), bundle_key, published_at: revisions.created_at, suspended, features};
      prod (M1+): publications со status = 'live' или 'suspended' → то же с env = 'prod', published_at = live_at.
      suspended = systems.suspended_at is not null or orgs.suspended_at is not null or publications.status = 'suspended' (runtime отдаёт 451, L1-32; abuse.yaml#takedown; orgs.suspended_at — миграция 0015, в draft и prod).
      features = {phoneOtp: orgs.plan in ('start','business')} — вход по телефону в prod только на платных тарифах (F4, billing.yaml#plans; в draft метод виден с пометкой — runtime.yaml#auth.methods_M1.phone_otp)
      org_id = systems.org_id, plan = orgs.plan ('free' | 'start' | 'business') — для SMS-бюджета org (M1-05) и лимитов коннекторов по тарифу (ctx.system.plan, M1-06); features.phoneOtp остаётся производным от plan
