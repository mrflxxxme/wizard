# Развёртывание. M0–M1 — локально; M2 — Cloud.ru Evolution (D16), staging + prod; пилот (решение основателя 01.10.2026) — #pilot.
version: 1

local:                             # M0 (M0-01, M0-15, M0-17)
  postgres:
    version: "16"
    how: "pnpm db:up → initdb (если нет) в .data/pg, pg_ctl -D .data/pg -o '-p 5433 -k .data/pg' -l .data/pg/log start; без Docker"
    database: "wizard (пароль из .env WIZARD_DB_URL); схемы platform, dbos (M1), app_<key>_<env>"
    roles: "wizard — владелец схем platform и dbos (миграции platform-api); wizard_owner — создаёт и мигрирует только схемы app_*, НЕ владелец platform, без прав на неё, не superuser; wizard_runtime — runtime.yaml#postgres.roles. MUST: DDL из toDDL/toRLS исполняется только под wizard_owner (L3-01); тест: SQL-инъекция в литерале спеки не видит схему platform"
    down: "pnpm db:down → pg_ctl stop -m fast"
    reset: "pnpm db:reset → drop всех схем app_* и platform, повторные миграции (только локально; E-EXTERNAL не нужен)"
  ports: { platform_api: 4000, platform_web: 5173, runtime: 4100, postgres: 5433 }
  hosts:
    platform: "http://localhost:5173 (vite проксирует /api → :4000)"
    systems: "http://<slug>--<env>.localhost:4100, env ∈ {draft, prod}"
    note: "Chromium резолвит *.localhost в 127.0.0.1 сам; Node-клиенты в тестах MUST ходить на 127.0.0.1:4100 с заголовком Host"
  artifacts: "Исходники ревизий: .data/artifacts/blobs/<sha256[0:2]>/<sha256> (platform.files.storage_key). Собранные бандлы: .data/artifacts/<systemId>/<revision>/… (runtime.yaml#system_loading.artifact_layout; systemId = systems.schema_key)"
  secrets: ".env (не коммитится; .env.example — с пустыми значениями); M0 секреты коннекторов — переменные WIZARD_SECRET_<SCHEMAKEY>_<NAME>; с M1 — .data/secrets.enc (AES-256-GCM, ключ WIZARD_SECRETS_KEY) через platform.secrets_refs"
  bundles_never_contain_env: "MUST (L3-13): .env, .data/** и любые файлы вне ui/** и functions/** ревизии не попадают в бандлы систем: сборка идёт в каталоге-копии ревизии, резолвер отклоняет пути вне ui/**, functions/** и импорты кроме @wizard/sdk, @wizard/ui-kit; loaders только ts/tsx; define/process.env не пробрасываются (security/isolation.yaml#static_checks_G0). Тест: import k from '../../../.env?raw' → G0 blocker, в dist нет ни одной строки из .env"
  env_vars:   # канонический список (L1-18); .env.example синхронизируется с ним
    db: [WIZARD_DB_URL]
    llm: [WIZARD_LLM_MODE, CLOUDRU_BASE_URL, CLOUDRU_API_KEY, YANDEX_BASE_URL, YANDEX_API_KEY, YANDEX_FOLDER_ID, ZAI_BASE_URL, ZAI_API_KEY, DEEPSEEK_BASE_URL, DEEPSEEK_API_KEY, WIZARD_FIXTURE_LENIENT, WIZARD_FIXTURE, WIZARD_BUILD_DEFAULT_TIER]
    auth_and_exec: [WIZARD_AUTH_MODE, WIZARD_DEV_LOGIN, WIZARD_UNSAFE_LOCAL_EXEC, WIZARD_PREVIEW_SECRET, WIZARD_INTERNAL_TOKEN, WIZARD_PUBLIC_SCHEME]
    platform: [WIZARD_PLATFORM_ORIGIN, WIZARD_SYSTEMS_DOMAIN, WIZARD_RUN_CONCURRENCY, WIZARD_SECRETS_KEY, WIZARD_MILESTONE, WIZARD_DEV_SMTP]
    M1: [WIZARD_TELEGRAM_BOT_TOKEN, WIZARD_TELEGRAM_WEBHOOK_SECRET, WIZARD_TELEGRAM_BOT_USERNAME, WIZARD_TELEGRAM_API_BASE, WIZARD_TELEGRAM_OAUTH_BASE, WIZARD_SMTP_HOST, WIZARD_SMTP_PORT, WIZARD_SMTP_USER, WIZARD_SMTP_PASSWORD, WIZARD_MAIL_DOMAIN, WIZARD_CONNECTORS]   # общий бот уведомлений платформы (connectors/telegram.yaml#bot)
    M2: [WIZARD_RECEIPT_VAT_CODE, WIZARD_TRUSTED_PROXIES, WIZARD_YOOKASSA_API_BASE, WIZARD_YOOKASSA_IP_ALLOWLIST, WIZARD_PLATFORM_YOOKASSA_SHOP_ID, WIZARD_PLATFORM_YOOKASSA_SECRET_KEY, WIZARD_LEGAL_TEMPLATES_DIR, WIZARD_FILES_STORAGE, WIZARD_FILES_DIR, WIZARD_S3_ENDPOINT, WIZARD_S3_REGION, WIZARD_S3_BUCKET, WIZARD_S3_ACCESS_KEY_ID, WIZARD_S3_SECRET_ACCESS_KEY, WIZARD_S3_KMS_KEY_ID, WIZARD_REGISTRATION, WIZARD_PAYMENTS, WIZARD_LLM_MONTHLY_CAP_RUB, WIZARD_OPS_ALERT_URL, WIZARD_OPS_ALERT_CHAT_ID, WIZARD_OPS_ALERT_EMAIL, WIZARD_FOUNDER_REVIEW, WIZARD_SMTP_FROM, WIZARD_SMTP_TLS, WIZARD_MAIL_TRANSPORT, WIZARD_MAIL_API_BASE, WIZARD_METRICS_PORT, WIZARD_METRICS_HOST]   # M2-09: письма платформы через SMTP (WIZARD_SMTP_* + отправитель WIZARD_SMTP_FROM, TLS implicit|starttls|none; без WIZARD_SMTP_HOST — outbox; в production без SMTP старт отклоняется), алерты основателю ещё и письмом, ревью основателя перед prod (on|off, по умолчанию on при NODE_ENV=production), /metrics на отдельном порту; пилот (M2-15, #pilot.env): регистрация open|invite, оплата on|off, платформенный лимит токенов месяца в ₽ (по умолчанию 6000), вебхук алертов основателю; магазин ЮKassa ПЛАТФОРМЫ (M2-07; без обоих ключей операции оплаты → 500 «Оплата пока не подключена», вебхук → 404; WIZARD_RECEIPT_VAT_CODE ∈ 1–6, 11, 12, пусто → 1 вне production, в production с ключами магазина обязателен; база API и allowlist IP общие с коннектором); каталог замены юр. шаблонов runtime (M2-05); файлы полей file (runtime.yaml#files, M2-14): fs (по умолчанию WIZARD_FILES_DIR или .data/files) | memory | s3 (Cloud.ru, регион ru-central-1, бакет system-files; s3 без ключей — ошибка старта)
    M3: [WIZARD_PLATFORM_INTERNAL_URL, WIZARD_AI_FIXTURE]   # M3-02: ИИ-действия — runtime зовёт шлюз platform-api POST /internal/v1/ai/run (URL сервиса platform-api внутри кластера + WIZARD_INTERNAL_TOKEN; без них кнопки ИИ отвечают 503); platform-api зовёт backfill на внутреннем порту runtime (WIZARD_RUNTIME_INTERNAL_URL + тот же токен). WIZARD_AI_FIXTURE=<suite>/<name> — фикстура ИИ-действий в fixture-режиме (по умолчанию unit/runtime-ai)
    connector_secrets_M0: "WIZARD_SECRET_<SCHEMAKEY>_<NAME> (с M1 — secrets_refs)"
    notes: "Ключи провайдеров — имена из agents/models.yaml#providers. WIZARD_INTERNAL_TOKEN — заголовок X-Wizard-Internal-Token (runtime.yaml#system_loading). WIZARD_PUBLIC_SCHEME (http|https) выбирает имя cookie runtime (runtime.yaml#auth.session_cookie)"
  bind: "Все процессы слушают 127.0.0.1. MUST: при WIZARD_UNSAFE_LOCAL_EXEC=1 или WIZARD_DEV_LOGIN=1 и адресе привязки ≠ loopback процесс отказывается стартовать (isolation.yaml#M0_M1)"
  host_guard:   # L3-10: DNS rebinding и туннели
    - "MUST: platform-api и runtime отвечают 421, если Host ∉ {localhost, 127.0.0.1, [::1], *.localhost} (с портом или без), когда WIZARD_AUTH_MODE=dev или WIZARD_UNSAFE_LOCAL_EXEC=1"
    - "MUST: в тех же режимах запросы с заголовками X-Forwarded-*, Forwarded или CF-* → 403 FORBIDDEN (признак туннеля ngrok/cloudflared)"
    - "MUST: platform-api в режиме dev проверяет Origin у всех не-GET: только http://localhost:5173 (WIZARD_PLATFORM_ORIGIN), иначе 403"
    - "Тест: по одному на Host=evil.example, X-Forwarded-For, Forwarded, CF-Connecting-IP, чужой Origin"
  test: "M0 exit: на чистой машине `pnpm i && pnpm db:up && pnpm dev` → GET :4000/api/v1/systems 200, GET :4100/_wizard/health 200"

cloud:                             # M2 (M2-06). Все ресурсы — в РФ (Cloud.ru Evolution, регион Москва)
  environments:
    staging: { purpose: "автодеплой из main; дизайн-партнёры не ходят; системы — *.<systems-domain-staging>", data: "только синтетика" }
    prod: { purpose: "бета", deploy: "GitHub Actions environment prod с ручным одобрением (первый выкат — E-EXTERNAL)" }
    isolation: "отдельные проекты Cloud.ru (K8s, PG, S3, KMS) для staging и prod; общих секретов нет"
  domains:
    platform: "<codename>.ru — UI и API платформы (E-NAME; покупка к неделе 12, F8)"
    systems: "*.<systems-domain> — отдельный регистрируемый нейтральный домен (не поддомен платформы, не связан с финальным именем; покупка в неделю 0, F8), чтобы фишинг в системах не бил по репутации и cookie платформы (D9, abuse.yaml#domain); M2-06 разворачивается сразу на нём"
    system_host: "<slug>.<systems-domain> (prod), <slug>--draft.<systems-domain> (draft, закрыт одноразовым токеном превью — runtime.yaml#auth.preview_login_M2)"
    psl: "MUST (L3-14): заявка на включение <systems-domain> в Public Suffix List (private section) подаётся в M2-06, чтобы поддомены разных систем были разными site; до включения защита держится на __Host-cookie и CSRF runtime (runtime.yaml#auth). HSTS includeSubDomains; preload (abuse.yaml#domain)"
    tls: "Wildcard-сертификаты отдельно для *.<systems-domain> и <platform-domain>: cert-manager + ACME DNS-01 (API DNS Cloud.ru или регистратора); автообновление за 30 дней; ключи не покидают кластер"
    cookies: "Cookie платформы — __Host-wizard_session и __Host-wizard_csrf: Secure, Path=/, БЕЗ Domain (не уходят на поддомены платформы; L3-17), никогда не выставляются на домене систем; HSTS на обоих доменах"
  client_ip: "MUST (L3-27): IP клиента = адрес последнего хопа доверенного ingress (CIDR из WIZARD_TRUSTED_PROXIES); X-Forwarded-For от недоверенного источника игнорируется. Лимиты по IPv6 считаются по /64. Тест: XFF от недоверенного адреса не меняет ключ лимита"
  kubernetes:
    service: "Cloud.ru Managed Kubernetes"
    node_pools:
      platform: "platform-api, worker (DBOS), runtime (data API, статика, RPC), egress-proxy, ingress; runc"
      sandbox: "исполнение функций систем: workerd в подах с runtimeClassName: gvisor (runsc), taint sandbox=true:NoSchedule; отдельные пулы free и paid (isolation.yaml#M2)"
    open_question:
      id: W0-CLOUDRU-GVISOR
      text: "Поддерживает ли Cloud.ru Managed K8s кастомный RuntimeClass (gVisor runsc) на пользовательском пуле узлов, и доступна ли вложенная виртуализация (для Firecracker)?"
      owner: "основатель → поддержка Cloud.ru, неделя 0 (тикет в docs/week0/)"
      fallback: "Если нет: самостоятельный кластер kubeadm на ВМ Cloud.ru для пула sandbox с containerd + runsc; остальное — в Managed K8s. Стоимость fallback: +3–5 дней, эскалация E-MONEY при расходе > порога"
      blocking: "M2-01 и M2-06 — да; M0–M1 — нет"
    policies: ["NetworkPolicy default-deny во всех namespace", "automountServiceAccountToken: false для sandbox", "PodSecurity restricted", "resource requests/limits на всех подах"]
  postgres:
    service: "Cloud.ru Managed PostgreSQL 16"
    clusters:
      platform: "platform + dbos; HA (2 узла), PITR 14 дней"
      apps: "app-pg-01..N: схемы app_<key>_prod; ≤ 2000 схем на кластер (D4, аудит 04 T3); карта шардов — platform.shards"
      drafts: "draft-pg-01..: схемы app_<key>_draft; отдельно от prod; у Free без активности 60 дней удаляется только схема draft с тестовыми данными, спека, код и ревизии сохраняются (F5, workflows.yaml#retention_cron; уведомление за 7 дней)"
    pooling: "PgBouncer ≥ 1.21, transaction mode, max_prepared_statements > 0; контекст только set_config(..., true) внутри транзакции; запреты SET без LOCAL, session advisory lock, LISTEN — lint и тест в security/isolation.yaml#db_access (L3-21)"
    roles: "wizard_owner (миграции), wizard_runtime (runtime.yaml#postgres.roles); M2 — роли sys_<systemId>_<env> на систему (isolation.yaml#db_access)"
    week0_questions: ["wal_level=logical доступен?", "встроенный пулер?", "лимиты на число объектов/схем в кластере", "PITR-окно и время восстановления"]
    backup: "PITR провайдера + ежедневные снапшоты; pg_dump на тысячах схем НЕ использовать (аудит 04 T3)"
    restore_drill: "M2-06 acceptance: восстановление staging-кластера на момент T−1 ч в новый кластер, проверка контрольных строк; повтор ежемесячно (runbook docs/runbooks/pitr.md)"
  object_storage:
    service: "Cloud.ru Object Storage (S3-совместимое), SSE-KMS"
    buckets: { artifacts: "блобы ревизий и бандлы (версионирование вкл.)", imports: "загруженные таблицы, lifecycle 7 дней", eval: "результаты eval", backups: "экспорт логов аудита", system-files: "файлы полей type=file систем (runtime.yaml#files, M2-14), ключ app_<key>_<env>/<fileId>; SSE-KMS (WIZARD_S3_KMS_KEY_ID)" }
  secrets:
    pilot: "Пилот (D23_pilot): основатель задаёт только секреты/переменные GitHub (docs/founder/pilot-launch.md); внутренние ключи окружения (пароль PG, WIZARD_SECRETS_KEY, WIZARD_PREVIEW_SECRET, WIZARD_INTERNAL_TOKEN, ключи WAL-G и бэкапа .data, SSH) генерирует bootstrap-pilot один раз и хранит в зашифрованном файле (scrypt → AES-256-GCM, ключ — WIZARD_STATE_PASSPHRASE) в бакете состояния; OpenBao в пилоте нет"
    ci: "Ключи prod/staging — в OpenBao в РФ; в GitHub нет долгоживущих ключей: деплой получает короткоживущий токен через OIDC на self-hosted раннере (L3-38). В образах и репозитории секретов нет (E-ACCESS)"
    tenant: "Секреты коннекторов систем → OpenBao (MPL-2.0) в кластере prod, auto-unseal через Cloud.ru KMS; platform.secrets_refs хранит только путь"
    platform_bot: "Токен и webhook-секрет общего Telegram-бота уведомлений платформы (connectors/telegram.yaml#bot) — секрет платформы в OpenBao (prod/staging раздельно), локально — .env; получение токена у @BotFather — E-ACCESS"
    kms: "Cloud.ru KMS: KEK для OpenBao, SSE для S3, ключи HMAC для reversible tokenization (data-boundary.yaml#tokenization)"
  observability:
    rule: "MUST: логи, метрики, трейсы, ошибки — только в РФ, в собственном контуре или сервисах Cloud.ru. MUST NOT: Sentry SaaS, Datadog, New Relic, Grafana Cloud, Google Analytics, внешние CDN/прокси, терминирующие TLS вне РФ"
    stack: "Prometheus + Grafana + Loki (self-hosted в кластере) или Cloud.ru Monitoring/Logging; ошибки — GlitchTip (MIT) self-hosted или только логи. Пилот (M2-06, #pilot.observability): VictoriaMetrics single + VictoriaLogs single (Apache-2.0), логи собирает vlagent (чарт victoria-logs-collector) вместо Vector; метрики — /metrics на WIZARD_METRICS_PORT по аннотациям prometheus.io/*; запросы — vmui (docs/ops/observability.md)"
    pii_in_logs: "MUST: логгер (pino) пишет только allowlist полей; свободный текст не логируется, а поля message/err проходят redaction packages/pii.scrub. Ошибки PG → {sqlstate, constraint} (без detail/where); ошибки провайдеров LLM → {status, code} (без тела); route — без query-строки; сегмент hookToken и /bot<token>/ маскируются; egress-прокси не логирует path/query (L3-08). Тела запросов не логируются. Тест: запрос с телефоном в теле → в логе [ТЕЛЕФОН_1] или ничего; канареечный e2e + grep по логам всех процессов"
    retention: "логи 30 дней, метрики 90 дней, аудит staff 3 года"
    alerts: ["run failed rate > 20% за 1 ч", "abuse_reports с sla_deadline < 2 ч", "PG шард schema_count > 90% capacity", "ошибки T1 > 10% → автоматический фолбэк на T0 (data-boundary.yaml)", "сертификат истекает < 14 дней", "retention_overdue: у prod-системы с retention нет прохода runtime > 26 ч (событие лога, M2-05)", "founder_review_requested — ревизия ждёт ревью основателя (M2-09)", "llm_monthly_cap_warning / llm_monthly_cap_reached — 80 % и 100 % месячного лимита токенов (M2-15)", "abuse_report_new, abuse_dispute_new, abuse_sla_at_risk — новая жалоба, «Оспорить» владельца, < 2 ч до срока (M2-08)", "abuse_auto_suspend / abuse_phishing_cluster — автоматическое снятие по abuse.yaml#takedown.auto_suspend или ≥ 3 жалобы на фишинг за час без провала G2"]
    alert_channel: "Алерты основателю платформы (apps/platform-api/src/ops/alert.ts): событие лога level error|warn + необязательный вебхук WIZARD_OPS_ALERT_URL (Telegram Bot API, WIZARD_OPS_ALERT_CHAT_ID) + письмо WIZARD_OPS_ALERT_EMAIL; повтор отсекается одним путём — ключ в db.yaml#ops_alerts (alertOnce: месяц для лимита токенов, час для доли сбоев и автоснятия, жалоба для SLA, ревизия для ревью)"
  ci_cd:
    ci: ".github/workflows/ci.yml: lint, typecheck, test, specs-validate, e2e (fixture); pnpm install --frozen-lockfile; SBOM (CycloneDX) и license-check всего дерева зависимостей (лицензии — AGENTS.md)"
    supply_chain: "pnpm: onlyBuiltDependencies (allowlist скриптов установки), minimumReleaseAge: 1440 (L3-38)"
    cd: ".github/workflows/deploy.yml на self-hosted раннере в Cloud.ru (не GitHub-hosted): сборка образов → Cloud.ru Artifact Registry → helm upgrade staging; prod — вручную с одобрением. Пилот (M2-06, #pilot.images): образы собирает .github/workflows/images.yml на GitHub-hosted раннерах и кладёт в GHCR (vars.WIZARD_IMAGES_GHCR=enabled), релиз ждёт тег в GHCR и выкатывает `pnpm infra:apply`; prod — только ручной запуск владельцем; Artifact Registry не используется"
    iac: "OpenTofu (MPL-2.0) + провайдер Cloud.ru в infra/; `pnpm infra:apply --env staging|prod` — одна команда (M2-06)"
  runtime_limits: "Лимиты функций — specs/runtime/runtime.yaml и isolation.yaml#limits; здесь только квоты подов"

pilot:                             # Решение основателя 01.10.2026: пилот на паре живых клиентов. Runbook и расчёт — docs/ops/deploy.md «Пилот»
  scope: "Полная функциональность (сборка в чате, гейты G0–G2 с живым runtime, превью, публикация, песочница gVisor, файлы, коннекторы Telegram/SMTP, retention) при упрощённой инфраструктуре; оплата в платформе выключена (D24_pilot_free, #pilot.env); действует вместо #cloud, пока рост по метрикам не потребует большего"
  env:   # M2-15, D24_pilot_free: значения пилота (infra/helm/profiles/pilot.yaml → config.*); код M2-07/M2-11 остаётся и включается после пилота
    WIZARD_REGISTRATION: "invite — новый email входит только по приглашению основателя (pnpm --filter @wizard/platform-api pilot invite <email> [--org-name] [--credits]) или активному приглашению в org; без него verifyOtp → 403 REGISTRATION_INVITE_ONLY"
    WIZARD_PAYMENTS: "off — покупка, подписки и привязка карты скрыты в S-billing, операции оплаты → 403 PAYMENTS_DISABLED, вебхук ЮKassa и продления выключены"
    WIZARD_LLM_MONTHLY_CAP_RUB: "6000 — Σ billable cost_rub live-вызовов llm_calls за календарный месяц (МСК); достигнут → новые сборки, ходы интервью и импорты → 503 LLM_BUDGET_EXHAUSTED и алерт основателю (один раз в месяц), 80 % → предупреждение. Live-eval считается отдельно (≤ 4 000 ₽, quality/eval.yaml#live_cadence.budget); вместе ≤ 10 000 ₽ (D20_eval_budget)"
    WIZARD_OPS_ALERT_URL: "необязательный вебхук алертов (тот же, что у pg-ops; Secret wizard-postgres); без него — только событие лога level error/warn"
    WIZARD_FOUNDER_REVIEW: "on (M2-09) — orgs.require_founder_review действует: первая публикация системы в prod и публикация с новыми полями ПДн ждут одобрения основателя (pnpm --filter @wizard/platform-api moderation approve); организации пилота создаются с require_founder_review=true, выключить для org — pilot review-required <orgId> off"
    WIZARD_OPS_ALERT_EMAIL: "необязательный адрес для тех же алертов письмом (почта платформы, WIZARD_SMTP_*; Secret wizard-postgres)"
    WIZARD_OPS_ALERT_CHAT_ID: "chat_id для вебхука Bot API Telegram (тело {text, chat_id}); вместе с WIZARD_OPS_ALERT_URL"
    WIZARD_SMTP_HOST: "почтовый провайдер в РФ (E-ACCESS, docs/ops/mail.md) вместе с WIZARD_SMTP_PORT/USER/PASSWORD — Secret wizard-platform-env; в production без SMTP platform-api не стартует"
    WIZARD_SMTP_FROM: "обязателен при заданном WIZARD_SMTP_HOST: «Wizard <noreply@домен платформы>» (DKIM, SPF, DMARC домена — у провайдера)"
    WIZARD_SMTP_TLS: "implicit | starttls | none; по умолчанию implicit на порту 465, иначе starttls; none в production запрещён"
    WIZARD_MAIL_TRANSPORT: "smtp | unisender-api (connectors/email.yaml#transport): необязательная; по умолчанию unisender-api для WIZARD_SMTP_HOST *.unisender.ru (на сервере пилота закрыты почтовые порты, письма уходят через HTTP API на 443 с ключом WIZARD_SMTP_PASSWORD), иначе smtp; другое значение — ошибка старта platform-api"
    WIZARD_MAIL_API_BASE: "необязательный адрес HTTP API почты (https; по умолчанию из хоста: smtp.goN.unisender.ru → https://goN.unisender.ru, иначе https://goapi.unisender.ru)"
    WIZARD_METRICS_PORT: "9464 (helm metrics.port) у platform-api, worker и runtime; WIZARD_METRICS_HOST — адрес привязки; пусто или off — слушатель выключен (по умолчанию локально)"
  provider: "Timeweb Cloud; ВМ только в Москве (location ru-3, валидация в infra/tofu/timeweb). S3 Timeweb есть только в Санкт-Петербурге (ru-1) — единственная часть вне Москвы, в РФ"
  budget: { target_rub_month: "5 000–10 000", expected_rub_month: "≈ 2 900–3 000 (prod, без ВМ раннера — выкат с GitHub-hosted раннеров) + staging по часам", auto_growth_ceiling_rub_month: 20000 }
  availability: { downtime: "1–2 ч допустимы", rpo: "≈ 1 мин (archive_timeout 60 с)", rto: "≤ 2 ч (пересоздание ВМ одной командой; БД восстанавливается из архива сама)" }
  environments:
    prod: "одна ВМ Cloud MSK 80: 4 vCPU / 8 ГБ / 80 ГБ NVMe (пресет с потолком цены max_price); single-node k3s"
    staging: "тот же модуль OpenTofu и профиль, ВМ Cloud MSK 50: 2 vCPU / 4 ГБ; создаётся и удаляется workflow `bootstrap-pilot` (`staging`, `apply` / `destroy`); `infra.mjs` — ручной путь; только синтетика"
  kubernetes: "k3s на одной ВМ без managed control plane. На ней же: platform-api, worker, runtime, platform-web, egress-proxy, PgBouncer, PostgreSQL, DNS-01-решатель, Traefik, cert-manager, RuntimeClass gvisor и пул песочницы (узел помечен wizard.ru/sandbox-node=true, пул free). По одной реплике (infra/helm/profiles/pilot.yaml)"
  sizing: "Замер RSS на стенде (tools/deploy/rss-sample.mjs, docs/ops/deploy.md «Пилот: замер»): пик всего стека ≈ 4,7 ГБ из ≈ 7,7 ГБ → запас ≈ 39 % (≥ 30 %). CPU: всплески сборки до ≈ 2,7 ядра, в покое < 0,5 ядра"
  postgres:
    service: "PostgreSQL 16 в кластере: StatefulSet wizard-postgres на local-path (том на диске ВМ), образ wizard-postgres (PostgreSQL + WAL-G + rclone + infra/postgres/pg-ops.mjs)"
    pooling: "PgBouncer как в #cloud.postgres.pooling; до сервера в кластере — без TLS, только под NetworkPolicy (pod → pod на одной ВМ)"
    archiving: "WAL-G: archive_command на каждый сегмент WAL, archive_timeout 60 с, шифрование libsodium (ключ из Secret wizard-postgres), сжатие zstd, WALG_PREVENT_WAL_OVERWRITE; бакет backups, префикс pg/"
    base_backup: "CronJob wizard-pg-basebackup ежедневно в 02:17 МСК; хранение 14 дней (wal-g delete before FIND_FULL <сейчас − 14 дней>)"
    monitoring: "Сайдкар pg-ops monitor. Отставание архива — возраст самого старого готового, но не отправленного сегмента; > 5 мин → событие walg_archive_lag (level error). Также: ошибки архивации, нет базовой копии > 26 ч, нет успешного учения > 8 сут. /healthz и /metrics (VictoriaMetrics)"
    restore_drill: "CronJob wizard-pg-restore-drill еженедельно (вс 04:37 МСК): точка восстановления под SHARE-блокировками с точными счётчиками строк таблиц схемы platform → базовая копия + WAL в одноразовый PostgreSQL → сверка счётчиков по каждой таблице → лог pg_restore_drill_ok | pg_restore_drill_failed и строка wizard_ops.ops_runs. Для пилота заменяет ручное учение #cloud.postgres.restore_drill; ручной прогон — kubectl create job --from=cronjob/wizard-pg-restore-drill"
    bootstrap: "Пустой том (пересозданная ВМ) → init-контейнер восстанавливает БД из архива (последняя базовая копия + весь WAL). Пустой архив → initdb. Недоступный архив → под не стартует"
  data_volume: "Том .data (исходники ревизий, зашифрованный файл секретов коннекторов) копируется rclone crypt в бакет backups (префикс data/) раз в минуту, удалённо ничего не удаляется; восстановление — kubectl create job --from=cronjob/wizard-data-restore"
  object_storage: "Бакеты files (10 ГБ, поля type=file) и backups (100 ГБ: WAL-G и копия .data), пресет увеличивается автоматически; ключи — на бакет"
  images: "GHCR репозитория (ghcr.io/<owner>/<image>:<sha>, приватные пакеты): собирает .github/workflows/images.yml на GitHub-hosted раннерах при vars.WIZARD_IMAGES_GHCR=enabled; ВМ тянет образы с токеном задания выката (`GITHUB_TOKEN`, `packages: read`, Secret wizard-ghcr; необязательно — постоянный `WIZARD_GHCR_TOKEN`), образы своего SHA собирает и `pilot-reusable.yml`; реестра в кластере нет. Docker Hub — через зеркало dockerhub.timeweb.cloud. Если GHCR станет недоступен из РФ — профиль k3s с реестром в кластере (--build-images)"
  observability: "VictoriaMetrics single (90 дней, том 5 ГБ) и VictoriaLogs single (30 дней, том 5 ГБ) со сборщиком vlagent вместо Vector. Алерты — события level error в логе плюс необязательный вебхук WIZARD_OPS_ALERT_URL (например, Bot API Telegram) и письмо WIZARD_OPS_ALERT_EMAIL. M2-09: /metrics платформы, воркера и runtime на порту metrics.port (9464; аннотации prometheus.io/*, NetworkPolicy — только из namespace наблюдаемости): прогоны по видам и итогам, длительность, провалы проверок гейтов, ₽ моделей за месяц и лимит, очередь, ревью основателя, проходы retention; отставание архива WAL — pg-ops (wizard_pg_archive_lag_seconds). Алерт «доля упавших прогонов > 20 % за час» (не меньше 5 завершённых) — раз в час, проверка каждые 10 минут (wizard.ops_checks). Запросы vmui — docs/ops/observability.md"
  scale_up:
    - "CPU ВМ > 60 % или RAM > 75 % устойчиво (p95 за 7 дней) → пресет больше (MSK 160: 8 vCPU / 16 ГБ, ≈ 4 300 ₽)"
    - "Сборки или песочница упираются в одну ВМ → вторая ВМ (агент k3s с пулом песочницы, settings.sandbox_nodes)"
    - "Клиенту нужен SLA или простой 1–2 ч стал неприемлем → managed PostgreSQL (форма беты, settings.postgres) или HA"
    - "Автоматический рост без основателя — до 20 000 ₽/мес (escalation.yaml); выше — эскалация E-MONEY"
