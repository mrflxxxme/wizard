# Типизированные операции над AppSpec. Нормативно.
# Паттерн (из nucex «Чистый лист»): модель не переписывает спеку целиком, а шлёт батч операций.
version: 1

apply:
  signature: "applyOps(spec: AppSpec, ops: Op[], expectedVersion: number) -> {spec, version} | {errors: OpsError[]}"
  rules:
    - "MUST: батч атомарен — либо все операции применены и итог валиден по appspec.schema.json + семантическим правилам, либо ничего"
    - "MUST: expectedVersion != текущей версии → ошибка VERSION_CONFLICT (HTTP 412 на уровне API)"
    - "MUST: каждый батч сохраняется как ревизия: {version, parentVersion, kind: ops|files|style|revert, author: user|agent|system, runId?, ops (может быть [] для kind≠ops), createdAt}"
    - "MUST: идемпотентность — повтор батча с тем же idempotencyKey возвращает прежний результат"
    - "MUST: максимум 50 операций в батче; превышение → BATCH_TOO_LARGE"
  error_shape: "{code, path (JSON Pointer), message_ru, allowed?: string[] (допустимые значения), hint?}"
  error_codes: [VERSION_CONFLICT, SCHEMA_INVALID, UNKNOWN_ENTITY, UNKNOWN_FIELD, UNKNOWN_ROLE, DUPLICATE_NAME, RESERVED_NAME, REF_TARGET_MISSING, PII_CATEGORY_FORBIDDEN, DESTRUCTIVE_IN_PROD, BATCH_TOO_LARGE, LIMIT_EXCEEDED, INVALID_ROW_FILTER, OWNER_ONLY_FIELD]

ops:                           # op: params → эффект
  set_app:            "{name?, description?} → обновить app"
  set_theme:          "{accent?, font?, radius?, density?, mode?, logoFile?} → обновить theme (не расходует кредиты, если вызвана из панели «Стиль»)"
  add_entity:         "{name, label, fields[], indexes?, ownerField?, retention?}"
  update_entity:      "{name, label?, indexes?, ownerField?, retention?}"
  remove_entity:      "{name} → только draft; в prod-плане помечается DESTRUCTIVE"
  add_field:          "{entity, field}"
  update_field:       "{entity, name, patch: {label?, required?, unique?, default?, enum?, pii?, min?, max?, maxLength?}}; смена type запрещена (удалить + добавить)"
  remove_field:       "{entity, name} → только draft"
  add_role:           "{name, label, access, loginMethods?, isAdmin?, selfSignup?}"
  update_role:        "{name, patch: {label?, access?, loginMethods?, isAdmin?, selfSignup?}}"
  remove_role:        "{name} → только draft, каскадно удаляет permissions"
  set_permission:     "{role, entity, ops[], rowFilter?, rowFilterOps?, hiddenFields?, readonlyFields?} → upsert по (role, entity); rowFilterOps ⊆ ops, только при непустом rowFilter (иначе INVALID_ROW_FILTER); без rowFilterOps rowFilter действует на все ops"
  remove_permission:  "{role, entity}"
  add_workflow:       "{workflow}"
  update_workflow:    "{name, workflow}"
  remove_workflow:    "{name}"
  add_integration:    "{integration}"
  update_integration: "{name, patch}"
  remove_integration: "{name}"
  add_function:       "{name, kind, file, public?, roles?, egress?, collectsPii?} (исходник кладётся отдельным инструментом write_file); collectsPii=true — функция пишет ПДн, вызов ролью без isAdmin требует _consent (runtime/sdk.md)"
  remove_function:    "{name}"
  add_page:           "{route, title, file, roles[], nav?}"
  update_page:        "{route, patch}"
  remove_page:        "{route}"
  add_ai_action:      "{aiAction} (M3)"
  set_acceptance:     "{acceptance[]} → заменить список критериев приёмки"
  set_compliance:     "{consentTemplateId?, consentText?, operatorName?, operatorContact?, operatorInn?, operatorAddress?, retentionWaiver?, policyPage?}. MUST: от author=agent разрешены только consentTemplateId и policyPage; consentText, operator*, retentionWaiver → OWNER_ONLY_FIELD (их задаёт владелец; consentText из шаблона подставляет платформа, author=system)"

semantic_rules:                # проверяются после применения батча
  - "Имена сущностей, полей, ролей уникальны в своей области; не зарезервированы (id, created_at, updated_at, created_by, user, role, select, order, group, table ... — полный список в packages/appspec/src/reserved.ts)"
  - "ref.entity существует; ownerField — поле типа ref на системную сущность users или поле с $user"
  - "permission.role и permission.entity существуют; hiddenFields/readonlyFields существуют в сущности"
  - "rowFilter ссылается на существующие поля; значения — литералы типа поля (кодируются sqlLiteral, см. migrations.sql_values; литерал не начинается с $) или $user.id/$user.<attr>"
  - "$user.<attr> в rowFilter — только атрибуты, которые пользователь не меняет сам: id, role, phone, email, telegram_id (задаются входом); display_name и прочие → INVALID_ROW_FILTER"
  - "rowFilterOps ⊆ ops и только вместе с непустым rowFilter; op вне rowFilterOps проверяется только по роли"
  - "Не более одной роли с access=public; роли public не могут иметь update/delete, к которым не применяется rowFilter (нет rowFilter или op ∉ rowFilterOps)"
  - "default, min, max поля кодируются sqlLiteral для типа поля (int — безопасное целое, date — ГГГГ-ММ-ДД, datetime — ISO 8601 с поясом, email/phone/url — формат CHECK, строки без NUL); иначе SCHEMA_INVALID"
  - "Поле pii ∈ {special, biometric} → PII_CATEGORY_FORBIDDEN (MVP)"
  - "Сущность с хотя бы одним полем pii=basic MUST иметь retention ИЛИ явный compliance.retentionWaiver (M2)"
  - "Каждая page.roles и function.roles ссылаются на существующие роли"
  - "Каждый integration.secretRefs объявлен, но значение секрета в спеке НЕ хранится"
  - "Лимиты: сущностей ≤60, полей на сущность ≤80, страниц ≤80, функций ≤200"
  - "Роль с access=login MUST иметь loginMethods (≥1); роль access=public MUST NOT иметь loginMethods. phone_otp допустим схемой; доступность по тарифу (F4) проверяют billing и runtime"
  - "selfSignup=true несовместим с isAdmin=true"
  - "Имена сущностей, совпадающие с ключевыми словами SQL-стандарта (session, user, order, group, ...), допускаются только если reserved.ts явно их разрешает: DDL всегда квотирует идентификаторы, поэтому session разрешено; список в packages/appspec/src/reserved.ts — источник истины"
  - "Системная сущность users (id, role, phone?, email?, telegram_id?, display_name) существует неявно; имя users зарезервировано; $user.<attr> ссылается на её поля"
  - "Перед prod: compliance.operatorName и operatorContact заполнены, если есть поля pii≠none (проверяет G2); с M2 — и operatorAddress (L3-34; security/compliance.yaml#system_package.operator)"
  - "Поле type=file хранит только ключ хранилища; загрузка, раздача и классификация ПДн — с M2-14 (runtime.yaml#files, L3-18); до M2 поле, которое пишет роль без isAdmin, блокирует G0-SPEC-06 (FILE_FIELD_UNSUPPORTED)"

migrations:
  plan: "planMigration(prev, next) → steps[] из: create_schema, create_table, add_column, add_index, create_enum_type, alter_enum_add_value, add_fk, set_rls, drop_* (destructive), alter_column_type (destructive)"
  prod_policy: "MUST: в prod разрешены только аддитивные шаги (create_*, add_*, alter_enum_add_value, set_rls, ослабление NOT NULL). Любой destructive → DESTRUCTIVE_IN_PROD, публикация блокируется G0"
  required_new_column_policy: "Новое required-поле в prod добавляется nullable + backfill default + затем NOT NULL в том же плане, если default задан; иначе остаётся nullable, а required проверяется в data API"
  sql_values:                   # L3-01
    - "MUST: toDDL/toRLS не интерполируют значения спеки. Литералы (default, min/max, maxLength, enum-значения, литералы rowFilter, служебные строки) — только через sqlLiteral(value, fieldType) в packages/appspec/src/sql.ts: число — безопасное целое или конечное, bool — TRUE/FALSE, date/datetime/uuid — проверка формата и явное приведение типа, строка — ' → '', NUL и некорректный Юникод запрещены, без E-строк и dollar-quoting; json — JSON.stringify + то же экранирование + ::jsonb"
    - "MUST: идентификаторы — только ident (appspec.schema.json) + quoteIdent; имя > 63 байт или с NUL → ошибка (Postgres молча усекает)"
    - "MUST: скрипт начинается с SET LOCAL lock_timeout и SET LOCAL standard_conforming_strings = on; тела DO/функций — dollarQuote с тегом, которого нет в теле"
    - "MUST: исполнитель миграций шлёт каждый оператор отдельным вызовом extended protocol (без multi-statement)"
    - "Property/fuzz-тест (packages/appspec/test/sql-injection.test.ts): строки с ', \\, $$, $wz$, E'', ;, --, /*, Юникод-двойниками апострофа в default/rowFilter/json не меняют набор объектов схемы и возвращаются из БД без изменений"
  roles:                        # L3-01; роли БД — isolation.yaml, deploy.yaml
    - "M0–M1: миграции исполняет wizard_owner; он MUST NOT быть владельцем схемы platform и superuser"
    - "M2: мигратор на систему sys_owner_<key>_<env> — toDDL(plan, schema, {migrationRole}): CREATE SCHEMA … AUTHORIZATION <role>, затем SET LOCAL ROLE <role>; всё остальное исполняется с правами владельца только этой схемы"
  ddl_rules:
    - "Все имена в SQL полностью квалифицированы: \"app_<id>_<env>\".\"<table>\""
    - "Имена индексов и UNIQUE (общие на схему): ix_|ux_|uq_ + <table>$<col>[$<col>…] ($ не встречается в ident — нет коллизий вида ticket_type+x и ticket+type_x); длиннее 63 символов — усечение + хеш"
    - "Системные колонки: id uuid pk default gen_random_uuid(), created_at timestamptz default now(), updated_at timestamptz, created_by uuid"
    - "Типы: string→text(check len), text→text, int→bigint, decimal→numeric(18,6), money→numeric(14,2), bool→boolean, date→date, datetime→timestamptz, enum→text + CHECK, ref→uuid + FK, file→text(storage key), json→jsonb, email/phone/url→text + CHECK, qr_token→text unique"
    - "Транзакционный DDL, SET LOCAL lock_timeout = '3s'"
    - "Неявные индексы: на каждом ref-поле, на ownerField и на created_at; уникальный индекс на unique-полях"
    - "Сущность с retention.mode=anonymize: её поля pii≠none в БД nullable, required проверяется data API"
  rls:
    - "RLS включается на каждой таблице; политики строятся из permissions; контекст — set_config('wizard.user_id', ..., true) и set_config('wizard.role', ..., true) внутри транзакции"
    - "rowFilter входит в политику только для ops из rowFilterOps (по умолчанию — все ops разрешения); для остальных ops политика проверяет только роль"
    - "RLS — второй рубеж; первый — построитель запросов runtime (оба проверяются в G2)"
