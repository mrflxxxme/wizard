# Eval-стенд: качество, цена и безопасность харнесса и моделей на брифах. Нормативно для tools/eval.
# MUST: прогон eval при любой смене промптов (packages/agents/src/**/prompts/**), specs/agents/models.yaml или версии модели.
version: 1

briefs:
  location: "tools/eval/briefs/<id>.json"
  format:
    id: "^(ev|gd|hz)-[0-9]{2}-[a-z0-9-]+$ — ev: ивенты, gd: товары на заказ, hz: горизонтальные"
    segment: "events | made_to_order | horizontal"
    title: "≤ 100, по-русски"
    text: "бриф как его написал бы владелец бизнеса, 300–1500 символов"
    partner: "опционально {ref: P01…P99, original: {key: eval/partners/<ref>/<id>.<ext>, sha256, bytes}} — синтетический пересказ брифа дизайн-партнёра; оригинал только в S3 eval в РФ (tools/eval/partner-brief.mjs), в репозиторий не попадает (M2-12)"
    expected:
      roles: "string[] — «Подпись :: стем1|стем2»"
      entities: "string[] — тот же формат"
      must_have_features: "string[]"
      acceptance_criteria: "string[]"
    answers: "опционально {forkId: optionId} для харнесса; по умолчанию «Остальное — по рекомендациям»"
    canaries: "опционально string[] — синтетические ПДн-канарейки, вставленные в text (ФИО нерусского происхождения, латиница, @handle, телефон не РФ); метрика pii_leaks"
    mvp: "Набор замера D67 (M2-88 mvp_scope): id ^mvp-[0-9]{2}-[a-z0-9-]+$, segment mvp, class site|booking|crm|other, text 60–1500 (как владелец пишет в чат, часть нарочно небрежна), free_answer — ответ на свободный вопрос интервью, beyond.gap_stems — у брифа сверх возможностей. В набор P по умолчанию не входят: loadBriefs('mvp') или id"
  matching: "Ожидание — подстрока-стем в нижнем регистре (ё→е) в именах+label ролей/сущностей, во всей спеке (features) и в acceptance+workflows (AC). Реализация — tools/eval/lib/score.mjs"
  set: "≥ 12 брифов к M0 (≥ 5 ev, ≥ 3 gd, ≥ 4 hz; ≥ 4 брифа с canaries); 30 к M2 (≥ 10 hz; включая по 3 брифа от каждого дизайн-партнёра — в репозитории только синтетические пересказы, оригиналы — в S3 eval в РФ)"
  rules:
    - "MUST: в брифах нет ПДн: CI прогоняет packages/pii по всем text → 0 находок (кроме явных примеров вида +7 999 000-00-00, помеченных в allowlist брифа, и значений canaries — они синтетические)"
    - "MUST: expected не меняется одновременно с промптами в одном PR (иначе метрика подгоняется); изменение expected — отдельный PR с причиной"
    - "SHOULD: ≥ 2 брифа содержат случайные ПДн-подобные фрагменты синтетики (проверка pii_notice и маршрутизации на T0)"

modes:
  spec_only:
    what: "Бриф → черновик AppSpec одним вызовом с инструментом (текущий tools/eval/run.mjs). Сравнение моделей между собой"
    command: "node tools/eval/run.mjs --models=<id,…>"
  harness:
    what: "Полный путь: оркестратор (ответы answers или по рекомендации) → карточка → строитель → G0 → QA → G1 (без G2 до M2)"
    command: "node tools/eval/run.mjs --harness --models=<id,…> [--briefs=…]"
    model_override: "--models задаёт модель для всех build-callType; роутер и границы ПДн работают как в продукте (T1 не получает pii_forbidden_for_T1)"
  server_d67:
    what: "Замер D67 на сервере пилота (product.yaml#decisions.D67_mvp_readiness): брифы mvp-* через настоящий конвейер по API кабинета, как клиент — интервью (кнопка: рекомендованный вариант или первый; свободный вопрос: free_answer), карточка, сборка с одним «Исправить», G2 первой публикацией (останавливается на ревью основателя). Готовность — G0–G2 без блокеров; G2-SECRET-02 (секреты интеграций вводит владелец) готовность не снимает. Бриф сверх возможностей засчитывается, если система с заменой готова или отказ честный и записан в «Запросы на развитие». Параллельность 2, бюджет --max-cost-rub (2 000 ₽): новые брифы не стартуют, когда расход его достиг"
    command: "eval-pilot (с V3; tools/deploy/pilot.mjs eval); вручную — tools/eval/server/cli.mjs seed|run|collect|report|cleanup (docs/ops/eval-d67.md)"
  server_d76:
    what: "Замер беты v2 (B2-41; product.yaml#decisions.D76_beta_v2 (6), заменяет D67 для v2): тот же путь клиента, что server_d67, плюс план системы и браузерные проверки G1. Драйвер читает утверждённый план (GET /systems/:id, поле plan, или GET /systems/:id/plan — B2-20) и помечает бриф covered (в плане нет custom и outOfScope), uncovered (иначе) или unknown (план не прочитан — не засчитывается). «Готова» = G0–G2 без блокеров (G2-SECRET-02 — действие владельца, как в D67) + в отчёте G1 есть G1-MOBILE-01 и он пройден + все G1-GOAL-<id> пройдены (gates.yaml#G1.browser). Хук screenshot(r) драйвера (CLI --screenshots) кладёт снимки систем в r.screenshots — отчёт строит сетку скриншотов (по 3 в ряд). Порог строгий: fail-fast на первом незасчитанном брифе полного прогона"
    command: "eval-pilot, threshold d76 (по умолчанию; tools/deploy/pilot.mjs eval --threshold d76: cap_rub с предрегистрацией в журнале трат v3 — жёсткая остановка, снимки в артефакте shots/, расход бюджета разработки беты v2 в отчёте; docs/ops/eval-d76.md); вручную — node tools/eval/server/cli.mjs run … --threshold d76 [--screenshots DIR] (снимки каждой системы через ссылку превью на 390 и 1280 px — tools/eval/server/screenshots.mjs, Chromium из packages/e2e); report читает threshold из результата. На конвейере модулей драйвер утверждает план как есть (getSystemPlan → approveSystemPlan), браузерные проверки берёт из G1 сборки. Сухой прогон без сети — packages/e2e/stand/d76-dry.ts на записях tools/fixtures/demo/b2"
  server_v3:
    what: "Замер v3 на сервере пилота (D77_v3; docs/plans/2026-10-08-v3.md §4, §6): брифы v3-* по пути v3, как владелец в кабинете (грилл-интервью, направления, «Собрать», сборка харнессом v3, G0–G2, первая публикация до ревью основателя). Порог v3 — чекпоинт 1 (loadBriefs('v3'): v3-01…v3-05), отчёт v3-a-checkpoint1-<дата>. Порог v3-final (V3-40) — финальный замер: loadBriefs('v3-final') — 12 брифов, по 3 на класс (сайт бизнеса, услуги с записью, CRM или админ-система, магазин); снимки 390 и 1440 px, отпечатки сайтов в collect; отчёты v3-final-run-<дата> (по брифам) и v3-final-<дата> (по критериям §6: функционально, слепое сравнение ≥ 70 % пар, разнообразие по метрике гейта шаблонности packages/gates, медиана ≤ 20 мин и максимум ≤ 30, средняя ≤ 300 ₽ и максимум ≤ 500 ₽, расход разработки v3 ≤ 12 000 ₽ по журналу трат). Повтор — только упавших брифов (briefs через запятую, волна retry), итог по всем прогонам — cli.mjs final"
    command: "eval-pilot, threshold v3 | v3-final (tools/deploy/pilot.mjs eval; docs/ops/eval-pilot.md); слепое сравнение — node tools/eval/blind/cli.mjs build | aggregate; итог — node tools/eval/server/cli.mjs final"
  contract:
    what: "Контрактный тест провайдер × модель: tool calling без thinking, отсутствие reasoning_content в запросах, usage присутствует, отказ на response_format не используется"
    command: "node tools/eval/run.mjs --contract"
  llm_mode:
    fixture: "CI, каждый PR. WIZARD_LLM_MODE=fixture, без сети; ключи не нужны"
    live: "По расписанию live_cadence (при наличии ключей в GitHub Secrets) и вручную перед PR с промптами/моделями"
    record: "live + запись фикстур; используется для обновления tools/fixtures"
  model_ids: "Только id из specs/agents/models.yaml#models (напр. glm-5.1, glm-5.3)"
  spec_only_schema: "M0-18: tools/eval валидирует ответ по specs/appspec/appspec.schema.json; до этого — упрощённая схема tools/eval/lib/appspec.mjs (known-issues #11)"

live_cadence:           # решение основателя F6, пересмотрено 01.10.2026 (product.yaml#decisions.D20_eval_budget, D23_pilot)
  nightly_smoke: "Раз в неделю (имя ключа сохранено для совместимости) — 5 брифов (ротационный поднабор least-recently-picked, tools/eval/lib/rotation.mjs: условия ≥ 1 ev, ≥ 1 gd, ≥ 1 hz, ≥ 1 с canaries, остальные места — брифы, которые дольше всех не запускались; весь набор из N брифов — за ⌈N/5⌉ запусков), одна модель — модель сборки по умолчанию (models.yaml#week0_decision)"
  full: "Все брифы × 2 модели (по умолчанию + лучшая альтернативная) — только по метке PR eval:full при смене промптов, models.yaml или версии модели, и перед закрытием вехи"
  week0: "Неделя 0: spec_only на наборе M0, GLM-5.3 против лучшей T0 → правило models.yaml#week0_decision (F2)"
  budget: "≤ 4 000 ₽/мес на live-eval (в общем потолке токенов 10 000 ₽/мес, D20). tools/eval суммирует cost_rub отчётов tools/eval/results/ за календарный месяц; если прогноз прогона превышает остаток — full не стартует (ночной smoke продолжается), нужна эскалация E-MONEY"
  pilot_P: "Замер порога D42 (набор P, 20 брифов) — product.yaml#decisions.D59_eval_budget_and_autonomy: до 6 000 ₽ в рамках месячного лимита платформы WIZARD_LLM_MONTHLY_CAP_RUB (отдельной статьи нет; включая шаг audit); один полный прогон, повтор только провалившихся брифов (M2-88, M2-89). Харнесс считает остаток лимита по llm_calls стенда и не стартует бриф, прогноз которого не помещается"

metrics:          # на пару (бриф, модель); агрегаты — среднее/доля по набору
  - { id: g0_pass,            kind: bool,  def: "G0 passed на финальной ревизии (harness) / спека валидна по схеме и семантике (spec_only)" }
  - { id: g0g1_pass,          kind: bool,  def: "G0 и G1 passed (harness)" }
  - { id: coverage,           kind: float, def: "взвешенное покрытие expected (roles 0.2, entities 0.3, features 0.3, acceptance 0.2)" }
  - { id: tokens,             kind: "{input, cached, output}", def: "сумма usage_record прогона" }
  - { id: cost_rub,           kind: float, def: "Σ costRub (models.yaml#credits)" }
  - { id: credits,            kind: float, def: "Σ creditsMilli / 1000 (models.yaml#credits)" }
  - { id: minutes,            kind: float, def: "стенное время от брифа до финального гейта" }
  - { id: stages,             kind: object, def: "этапы харнесса v2 из внутреннего события build_metrics последнего build-прогона (agents/builder.yaml#harness.metrics): доля задач ТЗ с первого хода, задачи исправления, вердикты рецензента; замер на сервере читает его из platform.run_events (tools/eval/server collectSql)" }
  - { id: first_preview_minutes, kind: float, def: "стенное время от брифа до первой ревизии с G0 passed (первое превью)" }
  - { id: steps,              kind: int,   def: "шаги строителя" }
  - { id: questions_asked,    kind: int,   def: "число вопросов оркестратора" }
  - { id: estimate_ratio,     kind: float, def: "credits / card.estimate.credits.expected" }
  - { id: budget_exceeded,    kind: bool }
  - { id: escalations,        kind: int,   def: "needs_user в прогоне (в eval автоответ retry один раз, затем провал)" }
  - { id: pii_leaks,          kind: int,   def: "Независимо от детектора packages/pii: (а) число точных вхождений значений canaries брифа (и их нормализованной формы: нижний регистр, цифры телефона без разделителей) в исходящих T1-payload — перехватчик HTTP в tools/eval, payload не сохраняется; + (б) T1-запросы с callType из pii_forbidden_for_T1" }
  - { id: pii_suspect_t1,     kind: int,   def: "M1: находки независимого детектора (Natasha-сайдкар, не packages/pii) в T1-payload; разбор вручную, не hard" }
  - { id: fallback_rate,      kind: float, def: "доля вызовов с routeReason=fallback_*" }

thresholds:
  hard:                       # нарушение → CI/ночной прогон красный
    - "pii_leaks = 0 во всех режимах (включая канарейки)"
    - "fixture: g0_pass = 100% и g0g1_pass = 100% для демо-фикстур «форум» и «кондитерская» (demo/forum, demo/bakery)"
    - "fixture: нет FIXTURE_MISS"
  by_milestone:
    M0: "live: g0_pass ≥ 1 из 12 брифов (milestones.yaml M0); questions_asked ∈ [3, 7] в среднем"
    M1: "live, лучшая модель: g0g1_pass ≥ 80% (backlog M1-09); estimate_ratio ∈ [0.6, 1.5] для ≥ 80% брифов"
    M2: "live: g0g1_pass ≥ 85%; средние credits ≤ 25; p80 minutes ≤ 30; p80 first_preview_minutes ≤ 10; 0 ложных блокировок G2 на брифах (backlog M2-04)"
    B2: "server_d76, брифы mvp-* и до 10 реальных брифов основателя (B2-40), бюджет ≤ 300 ₽ (docs/plans/2026-10-06-beta-v2.md раздел 5): брифы covered — готовы все (10 из 10 при 10 covered); брифы uncovered — все дошли до рабочей системы (та же готовность, без недостающей части) и всё из outOfScope записано в «Запросы на развитие» (по базе; без таблицы — честный ответ в чате, отмечается «*»); unknown и пропущенные брифы — провал порога. Экономика (D76 (8)): средняя сборка ≤ 15 ₽ и ≤ 5 мин без дописывания, дописывание ≤ +20 ₽ — строками отчёта. Реализация — tools/eval/server/driver.mjs (planCoverage, browserSummary, isReadyD76, countedD76) и report.mjs (evaluate, сетка скриншотов)"
    M2P: "live, набор P (D42, D59): publish_ready ≥ 16 из 20 без помощи человека (publish_ready = G0, G1 и G2 на финальной ревизии без блокеров; ожидание ревью основателя — G2-AF-08/09, G2-EGRESS-01, require_founder_review — не считается помощью и пишется отдельной метрикой needs_founder_review); медиана minutes ≤ 40 (от отправки брифа до publish_ready, включая этап дизайна); cost_rub ≤ 300 на систему (без шага audit); beyond-брифы — gap_reported; 0 ложных блокировок G2; 0 выдуманных фактов в опубликованных текстах. Детали метрик — M2-29"
  soft:                       # предупреждение в отчёте PR
    - "cost_rub вырос > 25% к baseline"
    - "minutes вырос > 30% к baseline"
    - "fallback_rate > 10%"

regression:
  baseline: "tools/eval/baseline.json: {mode, modelId, briefSetHash, metrics агрегаты, commit, date}"
  rule: "Доля g0_pass или g0g1_pass упала более чем на 5 п.п. к baseline той же пары (mode, modelId, briefSetHash) → провал (CI для fixture, ночной — issue + красный статус)"
  update: "baseline обновляется только PR-ом с отчётом live-прогона (tools/eval/results/<date>-<mode>.json) и строкой в specs/CHANGELOG.md"
  pr_rule: "PR, меняющий промпты или models.yaml, MUST содержать перезаписанные фикстуры (mode=record), метку eval:full и отчёт live (live_cadence.full); CI проверяет отсутствие FIXTURE_MISS и регрессию"
  pr_rule_M2P: "Исключение на время вехи M2P (executability MP-08): PR задач волн p-w0…p-w3, меняющие промпты или models.yaml, проходят только fixture-режим: demo-фикстуры ищутся по (callType, номер) и регенерируются детерминированно (gen-golden.mjs), sha256-фикстуры unit и eval перезаписывает один раз M2-85 после M2-77; метка eval:full и live-отчёт не требуются. Единый live-замер — M2-88 и M2-89 в бюджете D59"
  test: "Юнит-тест сравнения: baseline 0.80 → текущее 0.74 = провал; 0.76 = успех"

fixtures:
  location: "tools/fixtures/<suite>/<name>.jsonl; suite ∈ {demo, eval, unit}; демо M0: tools/fixtures/demo/forum.jsonl, tools/fixtures/demo/bakery.jsonl (имена = specs/appspec/examples/<name>.json)"
  line:
    v: 1
    key: "sha256 канонического запроса (hex)"
    callType: string
    modelId: string
    request: "{messages, tools: {name, schemaHash}[], params: {temperature, max_tokens}} — после scrub для любого tier (T0 тоже); брифы без ПДн"
    response: "{text?, toolCalls: {id, name, args}[], finishReason}"
    usage: "{promptTokens, cachedPromptTokens, completionTokens}"
    latencyMs: int
    recordedAt: datetime
  canonical_request: >
    JSON с отсортированными ключами из {callType, modelId, messages, tools[].name+schemaHash, temperature, max_tokens};
    перед хешированием нормализуются: uuid → <uuid:N> по порядку появления, ISO-даты → <date>, runId/systemId → плейсхолдеры,
    пробелы в конце строк удаляются.
  lookup:
    - "suite=demo (скриптованные «золотые»): поиск по (callType, порядковый номер вызова этого callType в прогоне); из request сравниваются только tools[].name; разрешено в CI; промах → FIXTURE_MISS"
    - "suite=eval|unit: поиск по key (sha256 канонического запроса); при нескольких совпадениях — по порядку записи"
    - "Промах → FIXTURE_MISS с callType и первыми 200 символами последнего сообщения; сеть не используется"
    - "WIZARD_FIXTURE_LENIENT=1 (только локально) — для suite=eval|unit промах → следующая неиспользованная запись того же callType"
  golden: "node tools/fixtures/gen-golden.mjs <name> детерминированно пишет tools/fixtures/demo/<name>.jsonl из tools/fixtures/golden/<name>.yaml (Analysis, ответы, SystemCard, план, сценарии QA) + specs/appspec/examples/<name>.json (apply_ops батчами ≤50 через specToOps) + исходников кода (write_file). Ключи и сеть не нужны; usage — оценка символы/3.2"
  record: "WIZARD_LLM_MODE=record дописывает строки; скрипт tools/eval/fixtures-prune.mjs удаляет неиспользованные после прогона"
  rules:
    - "MUST: фикстуры не содержат ключей, заголовков авторизации и ПДн (CI: pii.detect по файлам = 0, поиск секретов = 0)"
    - "MUST: record отказывает, если sha256 брифа ∉ tools/eval/briefs и ∉ demo (ad-hoc промпты, воспроизведение данных партнёров не записываются); T0-запросы хранятся после scrub, key считается от scrubbed-формы"
    - "MUST: CI-артефакты (Playwright-трейсы, скриншоты, отчёты) — только fixture-прогонов; артефакты live — в S3 eval в РФ"
    - "MUST: фикстуры детерминированно воспроизводят прогон: два прогона подряд дают идентичные ревизии спеки и файлов (тест)"

report:
  outputs: "tools/eval/results/<ISO-дата>-<mode>.json (все метрики по парам) + .md (таблица: модель × {g0, g0g1, coverage, ₽, credits, мин, вопросы, pii_leaks})"
  ci_summary: "Таблица в GitHub step summary; ссылка на отчёт"
