      Headless Chromium (Playwright, Apache-2.0) под gVisor (research §4.3), executability MP-04 и MP-31. fetcher-public: только интернет
      — весь трафик Chromium через собственный прокси с проверкой IP после резолва и соединением по проверенному IP (pinning), включая
      подресурсы, iframe, fetch и XHR страницы, meta refresh и JS-редиректы; NetworkPolicy запрещает кластер, RFC 1918 и метаданные
