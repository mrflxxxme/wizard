# Граф задач. Агенты берут задачу, у которой все deps закрыты. Одна группа parallel_group
# может выполняться одновременно разными агентами (изолированные пакеты/файлы).
# Поля: id, title, milestone, deps, specs, owner (роль агента), parallel_group, estimate_days, acceptance
# owner: platform (backend/инфра), frontend, agents (LLM-харнесс), qa (тесты/гейты), docs
tasks:
