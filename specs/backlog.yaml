      - "GitHub Actions workflow .github/workflows/ci.yml выполняет lint, typecheck, test, specs-validate"
      - "Скрипт `pnpm db:up` поднимает локальный Postgres 16 (pg_ctl в .data/pg, порт 5433) без Docker; `pnpm db:down` останавливает"

