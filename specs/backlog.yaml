# Граф задач — единственный исполняемый план. Агент берёт задачу со status: todo, у которой все deps в status: done
# (порядок захвата и слияния — AGENTS.md «Порядок работы»). Задачи одной parallel_group правят разные каталоги.
# Поля: id, title, milestone, deps, specs, owner, parallel_group, estimate_days, status, claimed_by, acceptance.
#   specs: путь к файлу или файл#якорь (якорь = путь ключей YAML через точку; проверяет validate.mjs);
#          «файл (slice --milestone M0)» — читать срез `node tools/specs/slice.mjs <файл> --milestone M0` (M0-19).
#   owner: platform (backend/инфра), frontend, agents (LLM-харнесс), qa (тесты/гейты), docs, founder (действие основателя;
#          агент такую задачу не берёт, а готовит материалы и сверяет её acceptance).
#   status: todo | in_progress | done. claimed_by: id сессии агента (обязателен при in_progress).
#   Задачи вехи M2P (полнофункциональный пилот, решения D26–D64) дополнительно несут:
#   description — что сделать и зафиксированные имена (договорённость между параллельными задачами волны p-w0);
#   owns — пути, которые задаче можно править (внутри волны не пересекаются; общие файлы и порядок мержа —
#          milestones.yaml M2P.plan.hotspots и merge_rules). Спека — первой: файлы из specs задачи правятся до кода;
#          новые спеки, которые задача пишет сама, перечислены в owns, а не в specs;
#   specs_pending — спеки, которые создают задачи из deps (пока файла нет, slice его не печатает; читать, когда появится);
#   critical — true у задач с запасом ≤ 1 дня до критического пути вехи: из доступных их берут первыми (AGENTS.md п. 1).
# Волны и критический путь M0 — milestones.yaml#milestones (M0.plan). Происхождение правок — docs/reviews/spec-audit/.
