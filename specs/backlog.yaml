    title: "Адрес системы: имя <имя>.sandpile.ru и свой домен клиента — одна DNS-запись, проверка с подсказками, автоматический сертификат, маршрутизация runtime"
    milestone: M2P
    deps: [M2-98, M2-23, M2-37]
    specs: ["specs/platform/api.yaml", "specs/platform/db.yaml", "specs/runtime/runtime.yaml#routing", "specs/platform/deploy.yaml", "specs/security/abuse.yaml#domain", "specs/product.yaml#decisions.D38_sites_domains", "docs/research/integrations-2026-10.md#7. Кастомные домены"]
    owner: platform
    parallel_group: p-w2
    estimate_days: 2.5
    status: todo
    claimed_by: null
    description: >
      Имя на sandpile.ru — проверка доступности, reserved и «надгробий». Свой домен (executability MP-03): владение подтверждает TXT
      _btb-challenge.<домен> с токеном организации, плюс одна целевая запись (CNAME на <slug>.sandpile.ru для поддомена или A на
      статический IP входа для корня); проверка DNS с подсказками на русском (не та запись, ещё не обновилось, CAA, лишний AAAA);
      сертификат по HTTP-01 через cert-manager (ресурс создаёт platform-api, как оркестратор песочницы), сначала staging-issuer в CI,
      backoff при отказе; периодическая перепроверка; снятие удаляет Certificate и хост Ingress; освобождённые домены и slug ≥ 90 дней в
      «надгробиях»; ≤ 3 домена на организацию, ≤ 5 проверок в час на домен. runtime по Host находит систему; Host вне проверенных → 421;
