  - id: S-canvas
    mockup: "docs/prototype/v2-canvas-e.html (прототип E «Холст», grill-7)"
    name: "Экран-холст: система клиента на весь экран (конвейер modules)"
    route: "/s/:systemId при getSystem.pipeline = modules (legacy и без поля — S2–S7)"
    milestone: B2
    task: B2-25
    regions:
      top: "плавающая стеклянная панель canvas-top: знак и «Born to Build», название системы антиквой (canvas-name), во время сборки — кольцо и «осталось …» (canvas-eta, на ≤ 600 px — в строке сборки), после сборки — «Сайт / Кабинет / Телефон» (canvas-views, canvas-view-<site|cab|phone>), «Как это работает» (canvas-xray-toggle), «Написать команде» (canvas-support — плавающая кнопка D68 на холсте скрыта, чтобы не закрывать чат), тема (canvas-theme)"
      board: "холст canvas-board на всю ширину: рамки «Сайт» (адресная строка), «Кабинет», «Телефон» (canvas-frame-<id>) из блоков canvas-block (data-kind, data-block-state = sketch | materializing | ready; CanvasBlock из @wizard/ui-kit/v2). Во время интервью — блоки модулей-кандидатов эскиза (stage interview), после плана — секции лендинга, экраны модулей (screens[].module), панель цели (метрика на каждую цель), уведомления на телефоне. Данные в блоках — образцы («пример данных»), тексты — из плана. Подпись рамки и метки: цели (canvas-tag-goal) и «не входит → замена» (canvas-tag-out) на блоке своего модуля, ответы интервью (canvas-tag) — на блоке модуля вопроса"
      chat: "ChatSheet снизу по центру (canvas-sheet): над строкой ввода (canvas-composer) — карточка вопроса (canvas-question «N из M», вариант «советуем», canvas-rest «Остальное — по рекомендациям»), план (canvas-plan-card: цели · блоки · не входит, «Собрать» canvas-approve), строка сборки (canvas-build-row, canvas-build-step «i из N»), сбой (canvas-failure), «Система готова» (canvas-ready: canvas-open-<site|cab|phone>) или 2–3 последние реплики (canvas-recent). История — по тапу или протягиванию ручки вверх (p-sheet-grab), реплики canvas-message; на 390 px — лист снизу"
      xray: "слой canvas-xray (XrayLines): цепочка автоматики словами, привязанная к блокам (что делает посетитель на сайте → запись в кабинете → напоминания «за сутки и за 2 ч» → панель цели), холст уменьшается, чтобы цепочка поместилась; панель canvas-xray-data «Кто видит данные» (роль → данные, «только свои», «часть») и «Сколько хранятся» (срок и удаление или обезличивание), под «Что происходит само» — все автоматизации плана. Всё — из эскиза (PlanSketch.automations, access, retention), без модели"
    data:
      - "GET /systems/:id → pipeline, stage, pendingQuestions (вопросы интервью по целям: topic, module, param), messages, activeRunId, demoReplay"
      - "SSE прогона: plan_sketch {stage, planRevision, sketch} — холст перерисовывается только при смене ключа эскиза (stage plan — fingerprint); chat_output → GET /systems/:id; build_stage и step_* — ход сборки"
      - "Открытие экрана во время интервью без активного прогона: эскиз — из plan_sketch прогона последнего сообщения kind=questions (повтор событий завершённого прогона)"
      - "GET /systems/:id/plan → revision, errors, sketch; POST /systems/:id/plan/approve {revision} → build; POST /systems/:id/answers; POST /systems/:id/messages (пожелание к плану после плана и после сборки; с выбранным блоком — block {id, title, module?, sectionIndex?}); POST /systems/:id/fix — повтор после сбоя"
      - "B2-29 «ткни и скажи»: PATCH /systems/:id/plan {revision, edits} — сначала dryRun (эскиз перерисовывается по ответу сразу), затем сохранение; без модели и кредитов. Варианты секций — PlanSketch.sections[].variants, переключатели модульного экрана — modules[].params[].type/options"
    states:
      interview: "эскиз из модулей-кандидатов в приглушённом виде (контур и полосы вместо текста); вопросы по одному; ответ сразу ставит метку на блок модуля и подсвечивает его (без модели и без запроса), после последнего ответа — один POST /answers и план"
      card: "план: эскиз из экранов модулей с метками целей и «не входит», карточка плана; ошибки плана — списком, «Собрать» недоступна; сборка стартует только по «Собрать» (approve с ревизией, PLAN_REVISION_STALE → «План изменился — показываю новую версию» и перечитать план)"
      building: "«материализация»: блоки по порядку сайт → телефон → кабинет становятся настоящими в доле готовых этапов; строка «Собираю · <этап простыми словами> · i из N», кольцо и «осталось …»; слой «Как это работает» сам показывается с 30 до 70 % сборки, затем скрыт и включается кнопкой; вторая попытка после сбоя пишет «N этапов взяты из прошлой попытки»"
      ready: "«Система готова» антиквой, число блоков; виды «Сайт / Кабинет / Телефон»; тап или Enter по блоку подсвечивает его кольцом цвета бизнеса и ставит его название меткой в строку ввода (p-composer-target; Esc или крестик снимает); колбэк onBlockSelect"
      pick: "B2-29 «ткни и скажи» (grill-7 № 4) — в плане до «Собрать» (блоки эскиза) и у собранной системы: над строкой ввода подсказки по типу блока (p-composer-suggestion-<view|remove|up|down>: «Другой вид» — следующий готовый вариант секции, «Убрать», «Выше/Ниже» — порядок секций; у экрана модуля — «Убрать» модуль) и переключатели параметров модуля блока (canvas-params, canvas-param-<param>[-<value>]: bool, enum, enum_list до 7 значений), «вид i из N» (canvas-pick-variant), строка canvas-pick-note. Правка — PATCH /plan (dryRun → сохранение), блок отмечается «касанием»; убранная секция — «Блок «…» убран · Вернуть» (canvas-undo). Правка, которую план не принимает (422), — «Так не получится: …» и откат эскиза; устаревшая ревизия — canvas-notice «План успели изменить в другом окне…» и свежий эскиз. Собранная система: правка — новая ревизия плана (stage card), блоки остаются собранными, canvas-notice «Нажмите «Пересобрать»», карточка плана «План изменён · Пересобрать» (build mode change). Свой текст с меткой блока уходит планировщику как пожелание к этому блоку (в истории — «<блок>: <текст>»)"
      failed: "canvas-failure: причина словами по коду (PLAN_INVALID — «откройте план и поправьте», MODULE_BUG, STAGE_BUDGET_EXCEEDED, GATES_FAILED…), код, этап и текст сервера — под «Подробнее» (canvas-failure-more), «Попробовать ещё раз» (canvas-retry, кроме PLAN_INVALID) → /fix"
    rules:
      - "Ход сборки читает только адаптер buildProgress(events) (src/screens/canvas/buildProgress.ts): build_stage {stage, status started|done|reused|skipped, index, total, label_ru, remainingSec} сборщика v2, без него — step_started/step_finished и оценка по средней длительности шага"
      - "Цвет бизнеса (план design.accent → PlanSketch.accent) холст перенимает через custom properties (CSSOM: CSP платформы запрещает вставку <style>); светлая и тёмная тема (переключатель, по умолчанию — как в системе), prefers-reduced-motion выключает движение"
      - "Тексты — по-русски, без жаргона; названия моделей, кредиты и коды — только под «Подробнее»"
