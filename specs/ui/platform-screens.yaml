# apps/platform-web — экраны платформы. Нормативно. Макеты: docs/wizard-concept-v3.html, экраны 1–10
# (структура и состав — MUST, визуальное сходство — нет). API: specs/platform/api.yaml (при расхождении путей
# и полей выигрывает api.yaml), события: specs/platform/workflows.yaml#events, карточка и вопросы:
# specs/agents/orchestrator.yaml. Здесь — что видит пользователь, откуда данные и как это проверить.
version: 1
app: apps/platform-web
tasks: [M0-16, M0-30, M1-08, M1-11, M1-12, M2-08, M2-09, M2-11, M2-15, M3-01, M2-56, M2-57, M2-59, M2-86, B2-25, B2-33]   # M0-30: метка модели сборки по итогу eval (F2); M1-11: S10, публикация S6, M1-части S1/S3/S4/S7, S-auth, S-invite; M1-12: UI импорта; M2-08: S-abuse, S-admin; M2-09: S-welcome; M2-11: S-billing, карта, выгрузка, блок «Персональные данные» (L4-02); M2-15: пилот (оплата выключена, вход по приглашению)

stack:
  - "React 19 + Vite 7, TypeScript strict. Роутер — свой минимальный на History API (≤ 12 маршрутов: /, /login, /invite/:token, /legal/:doc, /s/:id, /s/:id/code, /s/:id/settings, /s/:id/import/:importId, /billing, /welcome, /abuse, /admin. До M2 было ≤ 10: публичная форма жалобы, консоль staff и онбординг пилота — отдельные маршруты, потому что у каждого свой доступ (без входа, staff с MFA, пилот); тикет и вкладки консоли — параметр ?report=, а не маршруты); сторонний — только с обоснованием в PR"
  - "B2-33: компоненты и токены — @wizard/ui-kit/v2 (ui-kit.yaml#platform_v2, прототип E, грилл-7): токены --p-*, ActionButton/Chip/Serif/Glass/ThemeRoot, тёплая нейтральная палитра, графит + янтарь только там, где что-то создаётся, антиква только в «человеческих» моментах. <html> — корень v2 (data-p-root, светлая/тёмная/авто; выбор хранится вместе с холстом, ключ wz.canvas.theme) на всех маршрутах, кроме старого рабочего пространства (/s/:id конвейера legacy, «Код», импорт — остаются на ui-kit v1 и --w-* до удаления legacy). Общая рамка экранов — components/v2/Shell (плавающая стеклянная панель platform-top: знак и «Born to Build», действия экрана, «Системы · Тарифы», переключатель темы theme-toggle), кнопки — components/v2/Button. CSS modules; под CSP — без вставки <style> (тема и цвета только через атрибуты и CSSOM). Проверка — apps/platform-web/test/platform-v2.browser.test.ts: каждый экран 390/1280 × светлая/тёмная, фон и шрифт v2, без горизонтальной прокрутки, скриншоты test/artifacts/platform-*.png (артефакт CI)"
  - "MVP (M2-86, D27, D28, D48, D70): бренд — Born to Build (заголовок вкладки, шапка, письма; «Wizard» — только внутреннее имя). В кабинете клиента нет кредитов, G0/G1/G2, prod, PITR, DRAFT, «миграция», spec.json и file:line: проверки называются словами (ru.build.gate: «Проверка сборки», «Проверка сценариев работы», «Проверка прав доступа, данных и согласий»), технические детали — только под раскрытием «Подробнее для специалиста» (components/ui.tsx Specialist, закрыто по умолчанию); /admin не проверяется. Тексты фич — src/i18n/ru/<фича>.ts (support, pricing, gaps). Правило ниже про латинские метки DRAFT/PROD/G0–G2 к кабинету клиента больше не применяется"
  - "Весь текст — русский (src/i18n/ru.ts); ошибки API показываются из Error.message_ru; data-testid по таблицам ниже. Допустимы короткие латинские метки DRAFT, PROD, G0, G1, G2 — всегда с русской подсказкой (title/aria-label: «Черновик», «Опубликовано», «Проверки уровня N»); для нетехнических экранов SHOULD «Черновик»/«Опубликовано» (L4-22)"
  - "Авторизация: M0 — заголовок X-Wizard-Dev-User; M1 — cookie __Host-wizard_session + X-Wizard-CSRF на мутациях (api.yaml#info.x-auth); мутации с Idempotency-Key (uuid на клик)"
  - "MUST (L3-17): CSP платформы: default-src 'self'; script-src 'self'; frame-src <origin систем> (локально http://*.localhost:4100); object-src 'none'; base-uri 'none'. Текст от LLM (agent_message, карточка, вопросы, message_ru гейтов, вкладка «Код») — только как текст или санированный markdown без raw HTML; dangerouslySetInnerHTML запрещён"
  - "Адаптивность: MUST от 1024px; < 1024px чат и превью — вкладки «Чат / Превью»; SHOULD 390px без горизонтального скролла"

regions:   # раскладка рабочего пространства (экраны 2–7)
  rail: "узкая колонка: логотип W (→ /), «+» новая система, настройки системы (M1)"
  chat: "колонка 380–440px: шапка (имя системы · этап, пилюли статуса и блокировки), лента, подвал (ввод + кнопки этапа)"
  main: "верхняя панель (пилюля DRAFT/PROD + адрес, вкладки Превью/Код (M1)/Данные (M2), переключатель ролей, переключатель ширины превью 390 / 768 / 1280 — L4-27) и содержимое"
  aside: "правая панель 300px — «Стиль»"

# ---------------- Прогоны и SSE ----------------
sse:
  endpoint: "GET /runs/:id/events — кадры id: <seq>, event: <type>, data: RunEvent {runId, seq, type, ts, payload}"
  client_rules:
    - "MUST: EventSource с Last-Event-ID; дедуп по seq; после терминального события поток закрыт — переподключаться не нужно"
    - "MUST: при открытии /s/:id: GET /systems/:id → messages, card, pendingQuestions, activeRunId; если activeRunId — подписка с after=0 для восстановления «Хода сборки»"
    - "MUST: неизвестный type — игнор + console.warn"
    - "MUST: состояние — чистый редьюсер reduceRun(state, event) (src/run/reducer.ts), vitest на записанных fixture-потоках «форум» и «кондитерская»"
  events:   # payload — workflows.yaml#events.types; ниже только реакция UI
    run_started: "очистить «Ход сборки»; kind/mode → заголовок этапа; credits → «0 из ≤cap кредитов»"
    plan_ready: "список шагов плана (title) в «Ход сборки» со статусом «в очереди»; step_started/step_finished отмечают их"
    step_started: "строка шага label_ru со спиннером (attempt > 1 → «попытка N»)"
    step_finished: "строка шага → ✓; ruFallback = true → одна строка «Часть шагов выполнена на моделях в РФ» (build-model-notice; без названий моделей и tier, формулировка — agents/models.yaml; L4-20), повторно не добавляется. model_switched — внутреннее событие, в SSE не приходит"
    agent_message: "пузырь с подписью Оркестратор/Строитель/Проверка; delta=true — дописывать текст по messageId"
    chat_output: "kind=questions → перечитать pendingQuestions (S2); card → перечитать card (S3); change_proposal → S7; answer → сообщение в ленте; notice → плашка pii_notice. Источник данных — GET /systems/:id"
    ops_applied: "summary_ru → строки «Спека: …» в текущем шаге"
    file_written: "деталь шага («UI: ui/pages/landing.tsx»); инвалидировать кеш вкладки «Код»"
    gate_started: "строка гейта level — «проверяется»"
    gate_result: "строка гейта ✓/✗, «N из totalChecks»; failedChecks раскрываются по клику; G0 passed → обновить превью"
    budget_update: "«used из ≤cap кредитов»; used ≥ 0.8·cap → пилюля warn (события budget_warning нет — workflows.yaml#events.rules)"
    budget_exceeded: "карточка «Достигнут потолок cap кредитов» (role=alert); решение приходит как needs_input(decision)"
    lock_waiting: "плашка «Сейчас меняет holderName. Вы в очереди: position»; кнопки запуска disabled"
    needs_input: "decision → карточка с options (recommended отмечен) → POST /runs/:id/input {inputId, choice}; вариант с freeText → поле ввода ≤ 2000 и {inputId, choice, text} (например, «Объяснить по-другому» при decisionId=escalation); secret → форма секрета (S4)"
    input_received: "закрыть карточку needs_input с тем же inputId (в т.ч. если ответил другой участник)"
    run_finished: "итог summary_ru («Собрал за N минут и M кредитов»); prodUrl → ссылка; этап из GET /systems/:id"
    run_failed: "карточка ошибки message_ru (role=alert); для kind=build — «Исправить» → POST /systems/:id/fix (L1-25); для kind=interview_turn и retryable — «Повторить» → POST /systems/:id/messages с последним текстом; lastGoodRevision → превью остаётся"

stages:   # System.stage (workflows.yaml#system_stage) → экран; B2-25: систему конвейера modules (getSystem.pipeline) все стадии ведёт S-canvas
  interview: S2
  card: "S3 (card.kind=create) или S7 (card.kind=change)"
  building: S4
  ready: S6
  failed: "S4 с карточкой ошибки"

# ---------------- Контракт превью (iframe) ----------------
preview_contract:
  src: "GET /systems/:id/preview-url?role=<role> → {url, revision, roles[], expiresAt}. M0: url = /_wizard/dev-login?role=&next= без токена; M2 (облако): /_wizard/preview-login с одноразовым HMAC-токеном (TTL 15 мин, nonce) — api.yaml#getPreviewUrl, L2-29, L3-11; обновлять за 60 с до expiresAt. next — только путь текущего маршрута (^/(?![/\\\\]))"
  iframe: "sandbox=\"allow-scripts allow-forms allow-same-origin allow-popups\" allow=\"camera\"; origin превью — домен систем (≠ домен платформы), architecture.yaml#environments.domains. M2: вход в iframe держится на cookie __Host-wz_prev (SameSite=None; Partitioned) только draft-хоста; prod-cookie не ослабляются (runtime.yaml#auth.session_cookie, L3-15)"
  bridge: "Скрипт моста /_wizard/bridge.js runtime подключает только в draft-бандлы (specs/runtime/runtime.yaml); в prod его нет"
  envelope: "{wz: 1, type, id?: string, payload}; ответ несёт тот же id; таймаут ответа 2 с → fallback (перезагрузка iframe)"
  security:
    - "MUST: postMessage с точным targetOrigin (не '*'); платформа принимает только event.origin === origin(url) и event.source === iframe.contentWindow"
    - "MUST: мост принимает только origin платформы (WIZARD_PLATFORM_ORIGIN вшит в draft-сборку); неизвестные type игнорируются"
    - "MUST: через мост не идут данные записей и ПДн — только роль, маршрут, токены стиля, метаданные компонентов"
    - "MUST (L3-16): код системы исполняется в том же окне, что и мост, поэтому платформа валидирует каждый payload из превью по zod-схеме; element-selected.file MUST быть файлом текущей ревизии и ^ui/, иначе игнор; error.message ≤ 300 символов и рендерится только как текст; ready.revision сверяется с ожидаемой"
  to_preview:
    set-role: { payload: "{role, url}", effect: "платформа сначала берёт preview-url?role=…; мост переходит на url с текущим маршрутом (location.replace) — вход под ролью; ответ после загрузки — ready с новой ролью" }
    apply-theme-tokens: { payload: "{tokens: Record<'--w-*', string>, mode: light|dark|auto, fontFaces?: {family, weight, file, unicodeRange}[] (M2-42: шрифты несохранённой темы, файлы /_wizard/fonts)}", effect: "applyTokens на <html> без перезагрузки и сборки; ответ theme-applied; MUST < 100 мс" }
    navigate: { payload: "{route}", effect: "клиентская навигация (useNavigate)" }
    select-mode: { payload: "{enabled: boolean}", effect: "M3: наведение обводит ближайший [data-wz-component] (оверлей pointer-events:none); клик в capture-фазе с preventDefault → element-selected; Esc → select-cancelled" }
    highlight: { payload: "{wzId | null}", effect: "M3: подсветить все экземпляры с этим wzId" }
  from_preview:
    ready: "{protocol: 1, route, role, revision} — после загрузки; платформа сразу шлёт apply-theme-tokens с несохранёнными правками стиля"
    route-changed: "{route} — платформа восстанавливает маршрут после перезагрузки превью"
    element-selected: "{componentName, wzId, file, line, rect: {x, y, width, height}} — file/line из wz-map.json (ui-kit.yaml#wz_id)"
    select-cancelled: "{}"
    error: "{message} — ошибка рантайма превью → плашка «Превью не загрузилось» + «Обновить»"
  reload_policy: "Новый src (cache-bust revision) при gate_result{G0, passed} или росте System.previewRevision; debounce 1 с; маршрут и роль сохраняются. До первого previewRevision — заглушка «Превью появится после первой проверки» (409 PREVIEW_NOT_READY)"
  acceptance:
    - "vitest: мост отбрасывает сообщения с чужим origin; платформа — с чужим source"
    - "Playwright: apply-theme-tokens меняет computed background кнопки превью; число навигаций iframe не меняется"
    - "Playwright: set-role participant → organizer меняет пункты навигации превью, маршрут сохраняется"

# ---------------- Уведомление о ПДн в чате ----------------
pii_notice:
  source: "Message {role: system, kind: notice, payload: {type: 'pii', categories: string[]}} в GET /systems/:id; появление — по SSE chat_output{kind: notice} (в ответе POST messages его нет, L1-09); текст — orchestrator.yaml#pii_notice.text_template"
  rules:
    - "MUST: плашка со щитом (role=note) сразу под сообщением пользователя, где найдены ПДн: категории словами (телефон, email, ФИО, адрес, дата рождения), никогда не значения"
    - "MUST: один раз за сессию (как в orchestrator.yaml); при org.ruOnly добавлять «Сборка идёт на моделях в РФ»"
    - "MUST (M1-07): при загрузке таблицы — «Моделям за рубежом передаются только названия колонок и синтетические строки»"
    - "SHOULD: в пузыре пользователя найденные значения показаны маскированно («+7 912 ••• 45 10»), если API отдаёт payload.maskedText"
  test_ids: [chat-pii-notice]
  acceptance: ["Playwright (fixture): бриф с «+7 912 345 45 10» → ровно одна плашка chat-pii-notice, текст содержит «телефон» и не содержит «345 45 10»"]

# ---------------- Экраны ----------------
screens:
  - id: S1
    mockup: 1
    name: "Старт"
    route: "/"
    milestone: M0
    regions:
      topbar: "B2-33: в плавающей панели platform-top — пилюля тарифа (start-usage) и «Выйти», остальное — тихой строкой под вводом. Политика моделей: «Сборка: <OrgSettings.buildModelLabel>, ПДн удаляются до отправки · данные систем: только в РФ» (ruOnly или модели в РФ по умолчанию, F2 → «Сборка: модели в РФ»); M0 — метка из конфигурации platform-api, не константа в коде (L4-20); переключатель «только РФ» (M1, owner → PATCH /orgs/:orgId/settings); пилюля «<Тариф> · N кредитов до <ближайшее сгорание>» (M1, GET /orgs/:orgId/credits + GET /orgs/:orgId; M2-11 — ссылка на S-billing)"
      hero: "B2-33 (прототип E): по центру экрана приветствие антиквой по времени суток («Добрый день»), строка пояснения и одна строка ввода «Расскажите о своём деле» (растёт с текстом; Enter — отправить, Shift+Enter — новая строка; круглая кнопка-стрелка start-submit «Начать»), под ней примеры-чипы (шаблоны) и тихая строка: политика моделей, организация, «Только РФ», «Как устроен пилот», «Загрузить таблицу» (M1-07) — активна только после создания системы (в чате S2 и далее; L1-54), на S1 — подсказка «Таблицу можно загрузить после первого сообщения». Первая фраза создаёт систему и открывает её (/s/:id — холст для конвейера modules); при отправке приветствие и примеры гаснут, строка «дышит»"
      templates: "примеры-чипы (Chip v2, контурные) типов задач: Мероприятие и регистрация · Заказы и предзаказы · Заявки и модерация · Внутренний инструмент · Кабинет клиента · Своя задача — подставляют заготовку промпта"
      demo_replay: "B2-02 (D76 (12)): при Org.demoReplay — плашка start-demo-replay «Режим показа: ответы моделей записаны, расходов нет» над заголовком и чипы «Записанные сценарии» start-demo-<name> (Org.demoScenarios) — подставляют бриф сценария; в чате S2–S10 та же плашка workspace-demo-replay при getSystem.demoReplay. Простая, без нового дизайна"
      systems: "ниже первого экрана — «Ваши системы»: карточки систем (имя антиквой, пилюля prod/draft, этап); M1: «Команда: N человек · пригласить»"
    data: ["GET /systems", "POST /systems {prompt, templateId?} → {system, run}", "M1: GET /me, GET /orgs/:orgId/settings, GET /orgs/:orgId/credits"]
    states:
      empty_prompt: "«Начать» disabled; Enter и Ctrl/Cmd+Enter отправляют"
      submitting: "кнопка loading → /s/:system.id"
      no_systems: "блок систем скрыт"
      error: "role=alert с message_ru; 402 INSUFFICIENT_CREDITS → «Пополнить» (→ S-billing); текст промпта сохраняется"
    rules:
      - "M2-09: /?template=<id> (переход с S-welcome) — шаблон выбран и заготовка промпта подставлена; у org на тарифе pilot — ссылка «Как устроен пилот» (start-pilot-about → /welcome; в test_ids не входит: рендерится только у пилотных org)"
    test_ids: [start-prompt, start-submit, start-template-<id>, start-upload, start-policy, start-ru-only, start-usage, start-system-card, support-open, platform-top, theme-toggle]
    acceptance:
      - "Playwright (fixture): бриф «форум» → «Начать» → URL /s/<id>, в ленте сообщение пользователя"
      - "Клик по шаблону заполняет textarea; при пустом промпте кнопка disabled; @1024px без горизонтального скролла"

  - id: S2
    mockup: 2
    name: "Интервью кнопками"
    route: "/s/:systemId (stage=interview)"
    milestone: M0
    regions:
      chat: "шапка «Новая система · понимание задачи»; сообщения; плашка ПДн; сводка оркестратора («Разложил задачу: N ролей, M видов данных… Осталось K развилок»); принятые ответы строками ✓; карточка вопроса"
      question_card: "UI показывает pendingQuestions по одному (степпер): «Вопрос k из n» + whyItMatters; 2–4 варианта (radiogroup), recommended — пилюля «рекомендую» и выбран по умолчанию; «Свой вариант» при allowCustom (≤ 500 символов); «Далее» и «Остальное — по рекомендациям»"
      main: "«Как я понял задачу»: название, Роли, Ядро (пилюли звеньев каталог/заявка/процесс/оплата/выдача), Специфика, Ограничения; «Развилки» со статусом решено / выбираете сейчас / ожидает"
    data: ["GET /systems/:id (pendingQuestions, messages)", "SSE chat_output{kind: questions}", "POST /systems/:id/answers {answers: [{questionId, optionId | text}], restByRecommendation?}", "POST /systems/:id/messages {text}"]
    rules:
      - "MUST: ответы копятся локально и уходят одним POST answers после последнего «Далее» или по «Остальное — по рекомендациям» (restByRecommendation=true вместе с уже выбранными)"
      - "Данные «Как я понял» — из payload.analysis сообщения kind=questions (api.yaml#/components/schemas/Message; L4-26); если его нет — блок скрыт"
    states:
      analyzing: "скелетон + «Разбираю задачу…» до chat_output"
      submitting: "кнопки loading; повторная отправка невозможна (Idempotency-Key)"
    test_ids: [chat-message, chat-pii-notice, question-card, question-progress, question-option-<id>, question-recommended, question-custom, question-next, question-accept-rest, understanding-panel, forks-list]
    acceptance:
      - "Playwright (fixture «форум»): 3–7 вопросов, в каждом ровно один question-recommended и он выбран по умолчанию"
