    behaviour: ["Часы работы владельца; цифры табличные"]
    test_ids: [wz-hours, wz-hours-item]

  - name: Logos
    milestone: B2
    props: |
      interface LogosProps extends WzBase {
        title?: string; anchor?: string; tone?: 'default' | 'alt' | 'accent';
        items: { name: string; image?: ImageSource }[];   // партнёры и клиенты по названию, только с разрешения владельца
        variant?: 'row' | 'grid' | 'marquee';   // ряд; плитки; бегущая строка (при prefers-reduced-motion стоит и переносится, на наведении — пауза)
      }
    behaviour: ["Вторая копия ленты marquee — aria-hidden: читалка слышит список один раз"]
    test_ids: [wz-logos, wz-logos-item]

  - name: TextBlock
    milestone: B2
    props: |
      interface TextBlockProps extends WzBase {
        title?: string; text: string; anchor?: string; tone?: 'default' | 'alt' | 'accent';
        variant?: 'plain' | 'two_columns' | 'quote';   // узкая колонка; две колонки на широком экране; крупная цитата
      }
    behaviour: ["Текст владельца; без заголовка — скрытый заголовок из первых слов текста"]
    test_ids: [wz-textblock]

  - name: Pricing
    milestone: B2
    props: |
      interface PricingProps extends WzBase {
        entity: string;                       // строки цен из данных системы (service каталога или package_plan абонементов)
        title: string; intro?: string; note?: string; anchor?: string; tone?: 'default' | 'alt' | 'accent';
        nameField?: string; priceField?: string; descriptionField?: string;   // по умолчанию name, price
        details?: { field: string; suffix?: string }[];   // «60 мин», «8 визитов»
        query?: ListQuery; action?: { label: string; href: string }; emptyText?: string;
        variant?: 'cards' | 'table' | 'compact';   // карточки тарифов; прайс-лист строками; «название … цена»
      }
    behaviour:
      - "Цены не вписываются в страницу: DataSource.useList(entity) — владелец меняет их в кабинете; нет цены — «Цена по запросу»; пусто — «Цены скоро появятся»"
      - "Таблица на 390 px складывается в строки «название — цена» без горизонтальной прокрутки"
    test_ids: [wz-pricing, wz-pricing-item, wz-pricing-primary]

  - name: Booking
    milestone: B2
    props: |
      interface BookingProps extends WzBase {
        title: string; intro?: string; anchor?: string; tone?: 'default' | 'alt' | 'accent';
        action: { label: string; href: string };   // на страницу записи (/booking модуля «Запись по слотам»)
        steps?: string[];                          // по умолчанию «Выберите услугу», «Выберите удобное время», «Оставьте контакты»
        variant?: 'card' | 'split' | 'inline';     // карточка с шагами; текст слева, шаги и кнопка справа; одна полоса
      }
    behaviour: ["Секция лендинга «Запись на время»: подбор слота живёт на странице записи; id секции по умолчанию booking"]
    test_ids: [wz-booking, wz-booking-primary]

  - name: LandingSection
    milestone: B2
    props: |
      interface LandingSectionProps extends WzBase {
        title: string; intro?: string; anchor?: string; tone?: 'default' | 'alt' | 'accent';
        main?: boolean;          // h1 вместо h2 — когда секция и есть страница (/services)
        children?: ReactNode;    // содержимое модуля (витрина каталога)
      }
    behaviour: ["Рамка секции лендинга (отступы ритма темы, контейнер, заголовок блоков) вокруг содержимого модуля: витрина «Услуги из каталога» выглядит как остальные секции"]
    test_ids: [wz-section]

  - name: GoalHints
    milestone: B2
    props: |
      interface GoalHintsProps extends WzBase {
        title?: string; subtitle?: string;     // «Что улучшить», «по показателям за 30 дней»
        items: { id: string; title: string; text: string; action: { label: string; href: string; external?: boolean } }[];
        emptyText?: string;                    // пустое состояние, когда подсказок нет
      }
    behaviour:
      - "Подсказки панели цели (B2-27, модуль reports): до трёх карточек кабинета v2 — что случилось, что сделать и ссылка на действие (раздел кабинета или платформа); кромка фирменного цвета, ссылка — касание ≥ 44 px"
      - "external — ссылка открывается в новой вкладке (target=_blank, rel=noopener noreferrer), для чтения с экрана — «откроется в новой вкладке»; без подсказок — пустое состояние EmptyState"
    test_ids: [wz-goalhints, wz-goalhints-item-<id>, wz-goalhints-action-<id>]
    acceptance: ["vitest+DOM (test/goalhints.dom.test.ts): карточки, внешняя ссылка в новой вкладке, пустое состояние; браузер — packages/modules/test/goal-panel.browser.test.ts"]

demo:
  path: packages/ui-kit/demo
  rule: "MUST: vite-страница со всеми компонентами на спеках «форум» и «кондитерская» (specs/appspec/examples/*.json) через createMemoryDataSource; блоки лендинга и Image — на демо-спеке «студия» (demo/fixtures.ts, тексты помечены «пример»); переключатели роли, темы (все поля theme, 10 тем), ширины"
  ci: "Playwright: скриншоты 1280 и 390 в light/dark; проверки a11y, responsive, wz_id; каждый вариант блока лендинга — в 10 темах на 390 и 1280 (B2-35, test/sections.browser.test.ts)"

# ---------------- Дизайн-система платформы v2 (B2-32) ----------------
# Источник: docs/reviews/grill-7.md (решения 1–10), утверждённый прототип docs/prototype/v2-canvas-e.html, план беты v2 §3.
platform_v2:
  scope: "Только интерфейс платформы (platform-web: холст, плавающий чат, кабинет, /admin). Код систем клиентов её не импортирует: у систем — компоненты и токены --w-* выше. Экраны переводят на v2 задачи B2-25, B2-29, B2-33"
  entry: "import { … } from \"@wizard/ui-kit/v2\" (src/v2/index.ts) и один раз import \"@wizard/ui-kit/v2/theme.css\" (шрифты, токены, база, зерно, выключение движения)"
  root: "Корень помечается applyPlatformTheme(el, {theme, business, glass, grain}) или <ThemeRoot>: data-p-root; data-p-theme=light|dark (нет — по prefers-color-scheme); data-p-biz — цвет бизнеса клиента; data-p-glass=off — стекло без размытия; data-p-motion=off — движение выключено. MUST: цвет бизнеса ставится CSS-переменными корня (--p-biz-light … --p-biz-wash-dark, businessVars) без вставки <style> — CSP платформы его запрещает (B2-34); схему выбирают правила tokens.css"
  tokens:
    prefix: "--p-*; таблицы — src/v2/tokens.ts (PLATFORM_COLORS, platformTokens), CSS — src/v2/tokens.css = platformThemeCss() (тест сверяет, UPDATE_V2_CSS=1 перезаписывает)"
    palette: { light: { bg: "#F8F7F4", surface: "#FFFFFF", ink: "#1D1C1A", ink_2: "#6B6862", line: "#E9E6E0" }, dark: { bg: "#1B1A18", surface: "#252421", ink: "#EEECE7", ink_2: "#A6A29A" } }
    accents: "Графит --p-graphite (#1D1C1A, в тёмной #EEECE7) — главные кнопки; янтарь --p-amber #D98A2B со свечением --p-amber-glow #F2B45C — только там, где что-то создаётся (кнопка «create», кромка материализации, сборка); текст на янтаре — тёмный --p-amber-ink"
    business: "Цвет бизнеса клиента — --p-biz, --p-biz-text, --p-biz-ink, --p-biz-soft, --p-biz-ring, --p-biz-wash (businessColors): заливка сдвигается по L в OKLCH до ≥ 3:1 к фону и поверхности, текст на ней ≥ 4.5:1, цветной текст ≥ 4.5:1 на всех фонах платформы и на подложке. С data-p-biz токены --p-tint* (кольца, выбор, свечение ввода) берут цвет бизнеса, без него — графит"
    depth: "Тени --p-sh-1, --p-sh-2, --p-sh-float; радиусы --p-r-xl 24, --p-r-lg 18, --p-r-md 13, --p-r-sm 10, --p-r-pill; кривые --p-spring, --p-ease"
    glass: "Стекло только у плавающих слоёв (Glass): сначала сплошной --p-glass-solid, полупрозрачный --p-glass с blur(22px) — только в @supports(backdrop-filter) и без data-p-glass=off"
    grain: "Зерно бумаги: фиксированный слой шума с непрозрачностью --p-grain (0.055 / 0.07) под содержимым, без перехвата ввода; V3-06: текстура — файл src/v2/grain.svg (url относительно theme.css), не data:-URI — CSP платформы (default-src 'self') data:-картинки не пускает; сборщик платформы не встраивает ассеты (assetsInlineLimit 0)"
  motion: "«Материализация» (MATERIALIZE_MS = 1500): контур → поверхность → содержимое, по кромке пробегает янтарный свет; строка ввода «дышит», пока ИИ думает. В @keyframes и transition — только transform и opacity (visibility — без анимации). При prefers-reduced-motion и data-p-motion=off анимации и переходы выключены, блок сразу становится готовым"
  fonts: "MUST: Inter (400, 500, 600) — интерфейс; Source Serif 4 (400, 500) — только «человеческие» моменты (приветствие, название системы, «Система готова»; компонент Serif). cyrillic+latin (+latin-ext ради ₽, с unicode-range) woff2 в packages/ui-kit/fonts-platform (scripts/sync-fonts.mjs из @fontsource/*, OFL-1.1), каталог src/v2/font-catalog.ts, @font-face — src/v2/fonts.css с относительными url: сборщик платформы кладёт файлы в свой бандл, CDN нет; лицензии — THIRD_PARTY_NOTICES.md (D64)"
  components:
    ThemeRoot: "корень на контейнере: тема, цвет бизнеса, стекло, зерно, движение"
    ActionButton: "variant primary (графит) | secondary | create (янтарь, искра; busy — искра пульсирует) | ghost; size md|sm"
    Chip: "вариант ответа или подсказка: pressed → aria-pressed и галочка; recommended → слово «советуем» (не только цвет); tone outline — примеры"
    Tag: "метки на эскизе: goal (точка цвета бизнеса и примечание), out — «не входит» (зачёркнуто)"
    Serif: "антиква для «человеческих» моментов, size xl|lg|md"
    Glass: "плавающая стеклянная панель с запасным вариантом"
    Composer: "плавающая строка ввода: скрытая метка поля, отправка без пустого текста, target — метка выбранного блока (клик снимает выбор), suggestions — подсказки над строкой, state idle|thinking (дыхание)|building (янтарное свечение), size start — большая строка первого экрана"
    QuestionCard: "карточка вопроса: шаг, вопрос, варианты-чипы (fieldset), рекомендованный помечен «советуем», «Дальше» недоступна без выбора"
    ChatSheet: "плавающий чат снизу по центру над холстом; на телефоне — лист: ручка (aria-expanded, aria-controls) открывает историю тапом или протягиванием вверх (SHEET_DRAG_THRESHOLD = 14 px), закрывает протягиванием вниз, Esc или тапом мимо; ChatMessage me|ai|sys (+ warn)"
    CanvasBlock: "блок холста: state sketch (пунктирный контур, скелетон текста SketchText) | materializing (onMaterialized по окончании) | ready; onSelect делает готовый блок кнопкой («ткни и скажи»), selected — кольцо цвета бизнеса"
    XrayLines: "слой «Как это работает»: пронумерованные шаги простыми словами и тонкие линии (wirePath) поверх холста; метки не выходят за слой; поток пульсирует прозрачностью"
    BriefSummary: "V3-06: краткий бриф в чате перед «Собрать» — миниатюры трёх схем (кнопки p-brief-thumb-<journey|dataRoles|integrations> открывают панель на схеме) и 5–8 тезисов простыми словами (briefTheses; на ≤ 600 px — три и «Ещё N пунктов» p-brief-theses-more), «Открыть бриф целиком» p-brief-open"
    BriefPanel: "V3-06: полный бриф по разделам с пометкой того, что изменила последняя версия (data-changed, слово «новое»/«изменено», не только цвет), вкладки «Бриф / Схемы / Версии / Сессии» (role=tablist, стрелки, Home, End), версии с разницей (BriefDiffView), «Изменить» раздела открывает BriefEditor, «Изменить словами»"
    BriefDiagram: "V3-06: схема брифа (граф briefDiagrams) своей слоистой раскладкой в SVG (layoutBriefGraph: слои по длиннейшему пути, дорожки длинных рёбер, подписи рёбер в полосах между слоями; узлы и подписи не перекрываются, ширина — по контейнеру, 390 px читаемо); mini — миниатюра без текста; для экранных чтецов — граф списком слов"
    BriefDiffView: "V3-06: разница версии брифа по разделам: «Добавлено / Изменено / Удалено» словом, было и стало как <del>/<ins>"
    BriefEditor: "V3-06: правка разделов брифа — цели, сценарии, роли, «не входит», допущения — короткими формами (у поля подпись), проверка validateBrief с местом ошибки по-русски, onSave(brief, baseVersion)"
    SessionsFeed: "V3-06: лента сессий системы — интервью, сборки, правки (в панели и словами) со статусом, временем, версиями брифа и первыми строками изменений"
  test_ids: "Корень компонента: data-p-component=<Name> и data-testid p-<name> (или testId): p-root, p-button, p-chip, p-tag, p-serif, p-glass, p-composer(-row|-input|-send|-target|-suggestions|-suggestion-<id>), p-question(-option-<id>|-submit), p-sheet(-dock|-grab|-history), p-message, p-block(-edge), p-xray(-node-<id>); V3-06: p-brief-summary(-version), p-brief-theses(-more), p-brief-thumb-<key>, p-brief-open, p-brief-panel(-version), p-brief-tab-<brief|diagrams|versions|sessions>, p-brief-body-<tab>, p-brief-section-<field>, p-brief-item, p-brief-edit-<section>, p-brief-news(-all), p-brief-notice, p-brief-ask, p-brief-close, p-brief-version-<n>, p-brief-diagram, p-brief-svg, p-brief-frame, p-brief-node-<id>, p-brief-edge-label, p-brief-diff(-<field>), p-brief-change, p-brief-editor(-errors), p-brief-edit-section-<section>, p-brief-add-<section>, p-brief-save, p-brief-cancel, p-sessions, p-session, p-session-version-<n>"
  demo: "packages/ui-kit/demo/v2 (страница /v2/ той же vite-сборки): все компоненты и состояния; параметры ?theme=, ?biz=%23RRGGBB|none, ?glass=off, ?motion=off, ?sheet=inline&history=open; V3-06: packages/ui-kit/demo/brief (страница /brief/): краткий бриф, схемы, панель на брифах V3-02 — ?theme=, ?part=all|summary|panel, ?tab=, ?brief=dental|shop"
  acceptance:
    - "vitest (test/v2-tokens.test.ts): палитра и акценты грилла-7; пары текст/фон обеих тем ≥ 4.5:1 (фокус ≥ 3:1); 4096 цветов бизнеса × 2 темы — заливка ≥ 3:1, текст на ней и цветной текст ≥ 4.5:1; в @keyframes и transition только transform/opacity; reduced motion и data-p-motion=off выключают всё; запасной вариант стекла; шрифты — OFL-1.1, текст лицензии, источник, строки THIRD_PARTY_NOTICES, глифы А–я, Ё, ё, без CDN"
    - "vitest+happy-dom (test/v2.dom.test.ts): поведение QuestionCard, Composer, CanvasBlock (материализация, reduced motion), ChatSheet, applyPlatformTheme, XrayLines"
    - "Playwright (test/v2.browser.test.ts, CI-джоб e2e): скриншоты demo/v2 390 и 1280 в светлой и тёмной теме (артефакты), контраст по computed-цветам, подписи полей, касания ≥ 44 px на 390, без горизонтальной прокрутки; анимации идут и выключаются при prefers-reduced-motion; шрифты грузятся только со своего адреса; цвет бизнеса; стекло без blur; лист тянется вверх и закрывается"
    - "V3-06: vitest test/brief-layout.test.ts (раскладка без наложений на типичных, предельных и 60 случайных графах, ширина контейнера, тезисы, ключи подсветки), test/brief.dom.test.ts (вкладки с клавиатуры, подсветка, версии, редактор → onSave с baseVersion); Playwright test/brief.browser.test.ts — demo/brief 390 и 1280 × светлая и тёмная: контраст, подписи, касания, без горизонтальной прокрутки, узлы и подписи схем не перекрываются на настоящих глифах, правка → версия 4"
