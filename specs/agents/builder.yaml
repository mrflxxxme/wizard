# Строитель: карточка → операции AppSpec + код UI/функций → G0/G1 → исправления. Нормативно для packages/agents/src/builder.
# Приёмы контекста — по мотивам Chef (Apache-2.0, chef-agent/ChatContextManager.ts), переписаны под AI SDK 7 UIMessage.parts.
# Заимствованные фрагменты Chef/bolt.diy сохраняют заголовки; Apache-2.0 NOTICE и MIT © StackBlitz — в THIRD_PARTY_NOTICES.md (AGENTS.md).
# Модели — specs/agents/models.yaml (callTypes plan, build_ops, build_code, fix).
version: 1

inputs:
  card: "SystemCard утверждённой версии (orchestrator.yaml#system_card) + cap"
  spec: "текущая AppSpec + version (для новой системы — минимальная: app, одна роль admin)"
  files: "дерево файлов ревизии: {path, bytes, sha256}[] (ui/**.tsx, functions/**.ts)"
  history: "последние 5 ревизий: {version, author, humanDiff}[]"
  mode: "create | change | fix | point_edit — значения runs.mode (platform/workflows.yaml#workflows.build.modes). fix: фазы plan и ops пропускаются, старт с фазы fix по последним GateReport. point_edit — M3, см. point_and_edit"
  target: "только point_edit: {wzId, componentName, file, line, route, instruction ≤ 500} (ui/ui-kit.yaml#wz_id)"

# ---------------------------------------------------------------- Инструменты (zod → JSON Schema, models.yaml#call_policy)
tools:
  apply_ops:
    input: "{ops: Op[] 1..50 (specs/appspec/ops.yaml), expectedVersion: int, idempotencyKey?: string}"
    output: "{ok: true, version, humanDiff: string[], notes?: string[]} | {ok: false, errors: OpsError[]}"
    rules:
      - "MUST (M2P): add_page на /login или на странице политики (set_compliance.policyPage этого батча, иначе спеки, иначе /privacy) отбрасывается до применения, а страница, на адрес которой позже лёг policyPage, снимается вторым батчем remove_page (тот же ключ + «:reserved»): эти адреса рендерит runtime (runtime.yaml#routing, G0-SPEC-05). Модель получает notes с причиной"
      - "MUST: ошибки возвращаются модели как результат инструмента (не исключение), с path/code/allowed/hint"
      - "MUST NOT (mode=create|change): set_acceptance со списком, где удалён или ослаблен AC из карточки; такие батчи → ACCEPTANCE_LOCKED"
      - "MUST NOT: ops, ослабляющие права ролей ниже карточки ради прохождения гейта (G2 это ловит; в create — ошибка PERMISSION_WIDENING, если роль получает op, которого нет в card.roles[].can)"
  write_file:
    input: "{path: string, content: string}"
    rules:
      - "MUST: path соответствует ^ui/[A-Za-z0-9_/-]+\\.tsx$ или ^functions/[A-Za-z0-9_/-]+\\.ts$; иначе PATH_FORBIDDEN"
      - "MUST: content — полный файл (без заглушек «остальное без изменений»); ≤ 48 KB; пустой content → EMPTY_FILE"
      - "MUST: быстрый статический прогон (G0-IMP-01, G0-SEC-01) сразу при записи; нарушение → файл не пишется, ошибка с line"
      - "SHOULD: файл ≤ 400 строк; больше — разбить на компоненты"
    output: "{ok, bytes, warnings: string[]}"
  read_file:
    input: "{path}"
    virtual_paths: { "spec.json": "AppSpec (только чтение); compliance.operatorName/operatorContact/operatorInn/consentText/retentionWaiver.reason заменены на [ОПЕРАТОР]/[СКРЫТО]", "_generated/wizard.d.ts": "сгенерированные типы generateTypes(spec) (runtime/sdk.md §4)", "card.json": "карточка" }
    output: "{content} | {error: NOT_FOUND}"
  list_files:
    input: "{prefix?: 'ui/'|'functions/'}"
    output: "{files: {path, bytes}[]}"
  run_gate:
    input: "{level: 'G0'|'G1'}"
    output: "сжатый GateReport: {passed, failed: {id, message_ru, file?, line?, path?, fixHint?}[] ≤ 20, explanations?: Explanation[] (qa.yaml, для G1)}"
    rules:
      - "MUST: G1 запускается только если G0 последней ревизии passed; иначе GATE_PRECONDITION"
      - "Полный GateReport сохраняется в platform.gate_reports (db.yaml) + событие gate_result (workflows.yaml#events); модели — только упавшие проверки"
  get_ui_kit_docs:
    input: "{components?: string[]}"
    output: "пропсы, примеры и правила компонентов из specs/ui/ui-kit.yaml (без аргумента — оглавление ≤ 1.5k токенов); фрагменты режет packages/agents/scripts/gen-builder-assets.mjs при сборке packages/agents/assets/builder.json (второй копии документации нет). В builder.json — все компоненты ui-kit.yaml с milestone ≤ M2 (M2P считается M2), в том числе FileField, блоки лендинга, Image и темы (themes или tokens.themes), как только они появились в ui-kit.yaml: генератор подхватывает их без правки кода (M2-40)"
  get_sdk_docs:
    input: "{topic?: 'query'|'mutation'|'action'|'db'|'hooks'|'connectors'|'errors'|'limits'}"
    output: "фрагмент specs/runtime/sdk.md (тот же механизм нарезки, что у get_ui_kit_docs)"
  get_capability:
    input: "{id: string}"
    output: "{doc} — карточка возможности (рецепт класса) из packages/agents/assets/capabilities/<id>.md; неизвестный id → NOT_FOUND со списком"
    rules:
      - "Карточка — один файл .md: первая строка «# Заголовок», вторая «> кратко», дальше тело. gen-builder-assets.mjs кладёт карточки в builder.json; оглавление (id, заголовок, кратко) — в статичном промпте. Новая карточка появляется в оглавлении после перегенерации ассета, без правки кода"
      - "Карточки выпуска (D65, D66): site (лендинг из блоков Header → Hero → Features → Steps → Faq → Cta → LeadForm → Footer, Image, тема), booking (услуги, время, напоминание за 24 часа по почте, отмена по ссылке), crm (клиенты, сделки, этапы, задачи), general (бриф вне рецептов). Рецепт — подсказка качества, состав системы задаёт карточка"
  report_capability_gap:
    input: "{category: payments|subscriptions|integration|messaging|design|domain|media|data|mobile|ai|other, quote ≤300, missing ≤200, offered ≤200 | null}"
    output: "{ok: true, recorded: bool, reply}"
    rules:
      - "M2-77, D73: scrub ПДн в quote и offered (packages/pii) → необязательный метод хоста BuildHost.recordDevelopmentRequest({category, quote, offered}); нет метода или ошибка записи — recorded=false, сборка идёт дальше"
      - "Владелец получает agent_message: «Пока не умеем: … Можно сделать так: … «Написать команде»». То, что платформа умеет, строитель собирает дальше"
  ask_orchestrator:
    input: "{question: string, options?: string[2..4]}"
    output: "{answer: string, source: 'card'|'defaults'|'user'}"
    rules:
      - "Оркестратор отвечает сам из карточки и defaults; к пользователю — только если ответ меняет данные/права/деньги (вопрос-кнопки, не больше 2 за прогон)"
      - "В point_edit — единственный путь к изменению спеки (оркестратор превращает запрос в small_edit)"

# ---------------------------------------------------------------- Цикл
loop:
  owner: "runBuild(host, {card, cap, mode}) в packages/agents реализует цикл целиком (architecture.yaml#interfaces.agent_host); каждый LLM-вызов и гейт идёт через host.runStep (M0 — identity, M1 — DBOS-step). platform/workflows.yaml#build описывает только имена шагов и события"
  phases:
    - id: plan
      callType: plan
      do: "Харнесс v2 (#harness): план — это ТЗ архитектора после ops (submit_brief); отдельного вызова submit_plan до ops нет"
    - id: ops
      callType: build_ops
      do: "apply_ops батчами в порядке: roles → entities (с индексами и retention) → permissions → workflows → integrations → functions/pages (объявления) → set_acceptance (из карточки, 1:1) → set_compliance({consentTemplateId, policyPage}). operator*, retentionWaiver и свободный consentText агенту недоступны (OWNER_ONLY_FIELD, appspec/ops.yaml). Страниц входа (/login) и политики ПДн (адрес = policyPage) не объявлять: их рендерит платформа"
      done_when: "Все ops-шаги плана выполнены и G0-SPEC-01/02 проходят"
    - id: code
      callType: build_code
      do: "create|change — этап tasks харнесса (#harness): исполнители по задачам ТЗ. Ниже — point_edit. Прежний общий ход: write_file: сначала functions/** (форма — шпаргалка runtime/sdk.md §1.2), затем каждая страница ui/** (заготовки из спеки переписываются целиком, #scaffold). run_gate(G0) — когда записаны все функции и страницы, без исправлений раньше"
    - id: verify
      do: "Модель заканчивает ход без вызовов инструментов → харнесс сам запускает G0, затем (если passed) QA генерирует проверки (qa.yaml) и G1"
    - id: fix
      callType: fix
      do: "Упавшие проверки + объяснения QA подаются новым user-сообщением «Отчёт проверок»; модель исправляет через apply_ops/write_file и снова заканчивает ход"
  termination:
    success: "G0 и G1 passed на последней ревизии → событие run_finished {status: succeeded, resultRevision, creditsUsed, summary_ru} (humanDiff — в ops_applied.summary_ru)"
    stop: "бюджет исчерпан | эскалация без ответа 24 ч | CANCEL"
  step: "Шаг = один вызов LLM (со всеми его tool calls ≤ 8). Счётчик шагов общий на все фазы"
  idempotency: "Каждый шаг — DBOS-step (M1+); повтор после рестарта не повторяет применённые ops (idempotencyKey = runId:step:i)"
  events: >
    MUST эмитить только типы specs/platform/workflows.yaml#events (источник имён и payload): run_started, step_started/step_finished
    (step = plan, ops, code, verify, fix), ops_applied, file_written, gate_started, gate_result, budget_update, budget_exceeded,
    needs_input, input_received, run_finished, run_failed, plan_ready {steps: [{id, kind, title}] ≤ 20} (после submit_plan),
    model_switched {fromModel, toModel, reason: fallback_circuit_open|fallback_error} — пишется в run_events, но в SSE пользователя не отдаётся (models.yaml#fallback_rules)

scaffold:
  why: "Живой прогон M2P: модель тратила шаги и кредиты на исправление функций и не доходила до страниц → G0-SPEC-03 на каждой странице"
  pages: "MUST: перед фазой code (create|change) харнесс без LLM пишет заготовку для каждой pages[].file, которой ещё нет: первая строка — комментарий с маркером wizard:stub, default export компонента на AppShell с page.title; проходит G0. Событие file_written action=create, как у обычной записи"
  rounds: "Фаза code перечисляет заготовки; после неё, пока в объявленных страницах остался маркер wizard:stub, — до 2 дополнительных ходов build_code с сообщением «Остались незаполненные заготовки страниц: …». Потом — verify как обычно"
  sdk_cheatsheet: "Шпаргалка runtime/sdk.md §1.2 (точный импорт, форма query/mutation/action, v.* с v.optional, методы ctx.db) — целиком в статичном промпте (gen-builder-assets.mjs → builder.json prompt.sdk); тест компилирует её примеры функций через G0 (FN-01, TS-01). Отчёт fix-раунда с упавшими G0-TS-01/G0-FN-01 дописывает короткое напоминание об API SDK"
  functions: "Заготовки функций не пишутся: оставшаяся после remove_function заготовка с default-экспортом валит G0-FN-01, а BuildStore не удаляет файлы"

# ---------------------------------------------------------------- Харнесс v2 (create|change; решение основателя 05.10.2026, D74)
harness:
  why: >
    Замер D67 (05.10.2026): один агент в одном контексте делал план, спеку и весь код; модель увязала в исправлении функций и не
    доходила до страниц, сборки шли дольше 45 минут. Основатель: «строить не одним агентом» — формализация задачи, исполнители по
    задачам, контроль качества. Хост (BuildHost) прежний; всё ниже — внутри runBuild.
  stages:
    - id: ops
      who: "строитель (build_ops), как фаза ops в loop.phases"
      out: "AppSpec: роли, сущности, права, воркфлоу, объявления функций и страниц, acceptance 1:1 из карточки, compliance"
    - id: scaffold
      who: "код (#scaffold)"
      out: "заготовки всех объявленных страниц"
    - id: brief
      who: "архитектор: callType plan, инструмент submit_brief"
      do: >
        Техническое задание по карточке и спеке: ровно одна задача на каждую объявленную функцию и страницу
        {id: T<n>, kind: function|page, file, title ≤80, goal ≤600 — что делает и для кого, details ≤12 строк ≤300 — блоки
        страницы (ui-kit) с их текстами по брифу, поля форм, поведение, состояния пусто/ошибка, контракт функции (аргументы,
        результат, права, побочные эффекты), uses ≤12 — функции, которые страница вызывает, или сущности функции, acRefs — AC}.
      validate: >
        Код: файл каждой задачи объявлен в спеке; каждая объявленная функция и страница покрыта (change — новые и меняемые);
        uses ссылаются на объявленные функции и сущности; acRefs — id карточки; каждый AC карточки, кроме type=permission,
        упомянут хотя бы в одной задаче. Ошибка → повтор вызова с текстом ошибки (≤2, models.yaml#call_policy).
      emits: "plan_ready {steps: задачи → {id, kind: code, title}} (≤20 первых)"
    - id: checks
      who: "QA (qa.yaml#checks) до кода — test-first"
      do: "host.qa.generate по спеке; сценарии, вызывающие функцию (callFn), прикладываются к задаче этой функции текстом «Должно пройти»; те же проверки потом идут в G1"
    - id: tasks
      who: "исполнители: callType build_code, свежий контекст на задачу"
      context: >
        system static (как у строителя, кэшируемый префикс) + одно user-сообщение: карточка сжато, дайджест спеки, задача ТЗ целиком,
        сигнатуры функций из uses, сгенерированные типы системы (_generated/wizard.d.ts, ≤12 000 символов), проверки «Должно
        пройти», текущий текст файла (заготовка или прежняя версия). История других задач не подаётся. Находки проверок —
        с evidence (текст компилятора, ≤300 символов).
      tools: "write_file (только файл задачи, иначе TASK_FILE_ONLY), read_file, list_files, get_sdk_docs, get_ui_kit_docs, get_capability, report_capability_gap"
      check: >
        После хода с записью файла харнесс сам проверяет файл кодовыми проверками G0 (IMP-01, SEC-01, SPEC-01, SPEC-03, FN-01, TS-01)
        без базы и без событий gate_* (@wizard/gates checkCode) и оставляет находки этого файла. Нет находок — задача готова без
        лишнего вызова. Есть — находки уходят исполнителю следующим сообщением.
      limits: "≤4 хода на задачу; задача, не прошедшая проверку, не останавливает сборку — её находки попадут в verify"
      parallel: >
        Волны по 3 задачи (функции раньше страниц), вызовы волны идут одним пакетом: BuildHost.routeBatch, если хост его даёт
        (один durable-шаг и одна проверка бюджета на волну — детерминированный повтор после рестарта), иначе по очереди в порядке задач.
        Пакет в режиме fixture исполняется по очереди. Проверки файлов — по очереди.
    - id: verify
      who: "код: G0 → G1 (как loop.phases.verify)"
      fix: >
        Упавшие проверки с файлом → задачи исправления по файлам (свежий контекст: задача ТЗ, текст файла, находки, объяснение QA,
        напоминание SDK) волнами; проверки без файла (спека, права) → фаза fix строителя с apply_ops (loop.phases.fix).
        Итерации и эскалация — #escalation.
    - id: review
      who: "рецензент: callType audit (models.yaml#routes.audit — семейство, отличное от строителя), инструмент submit_review"
      do: >
        После G0 и G1 passed: каждая страница сверяется с задачей ТЗ и карточкой {verdict: ok|fix, issues ≤8: {severity:
        critical|minor, text ≤300}}. critical — только то, что ломает ценность для владельца: страница пустая или заглушка, нет формы
        или действия из AC, тексты не по брифу или не на русском, видимые служебные строки. Пакетом, как tasks.
      after: "Страницы с critical → один раунд задач исправления, затем снова verify. minor — в метрики. Рецензент недоступен → этап пропускается, отметка в метриках"
  metrics: >
    Внутреннее событие build_metrics (workflows.yaml#events) перед run_finished/run_failed: {stages: {ops: {calls}, brief: {tasks,
    retries}, checks: {total, attached, qaInvalid: ["SC-…: причины"]}, tasks: {total, firstPass, passed, failed, calls}, verify: {g0Runs, g1Runs, fixTasks,
    fixPhases}, review: {pages, ok, critical, minor, skipped}, rejections: [{phase, tool, code, issues: ["код@путь"]}] (первые 20
    отказов инструментов в фазах строителя, для диагностики)}, creditsUsed, durationMs}. ops.calls пишется и при сбое фазы.
    Проверка QA без шагов (check_invalid) — не ошибка системы: перед G1 строитель сразу просит QA заново (≤2 раз за сборку,
    QA_REGENERATIONS), в отчёте для фазы fix такая находка помечена «не меняй спеку, критерии и код ради неё».
    Замер D67 читает его из базы (eval.yaml).
  modes: "create и change; fix стартует с verify; point_edit — без изменений (#point_and_edit)"

budgets:
  credits_cap: "card.cap.credits. Перед каждым вызовом: spent + upper_bound(call) > cap → не вызывать, событие budget_exceeded. upper_bound = оценка входных токенов × input + max_tokens × output"
  warn_at: "used ≥ 0.8·cap: UI показывает предупреждение по budget_update (отдельного события нет)"
  max_steps: 64
  max_wall_clock_min: 45
  on_budget_exceeded: "Ревизия сохраняется как draft с последним состоянием; budget_exceeded, затем needs_input kind=decision decisionId=budget с вариантами raise_cap_<N> (N — platform/workflows.yaml#run_lifecycle.budget.check) и stop («Остановить, оставить как есть»)"
  test: "Fixture-прогон с cap=1 → остановка с budget_exceeded до превышения; ledger ≤ cap (backlog M0-13)"

escalation:
  consecutive_failures:
    counts: "run_gate/итоговый гейт с passed=false; tool error с тем же (code, path), что в предыдущем шаге; 3 одинаковых вызова инструмента подряд (детектор зацикливания)"
    resets: "гейт passed ИЛИ число упавших блокирующих проверок уменьшилось относительно предыдущего прогона гейта"
    threshold: 5
  gate_iterations: "≤ 2 итерации fix на уровень гейта и только по блокерам (D75); исчерпание — тот же порог эскалации. Замечания рецензента — предупреждения в build_metrics, без раунда исправлений"
  action: >
    На 5-й подряд (или при исчерпании итераций): toolChoice=none, модель пишет короткое объяснение для пользователя (что не получается, по-русски, ≤ 400 символов),
    прогон переходит в needs_input kind=decision decisionId=escalation, options = buttons (статусы и события — platform/workflows.yaml).
  outcomes: "без ответа 24 ч → run_failed INPUT_TIMEOUT; rollback → run_finished {status: cancelled}; повторный порог после retry → run_failed CONSECUTIVE_ERRORS (или GATES_FAILED при исчерпании итераций) без новой эскалации"
  buttons:
    - { id: retry,     label: "Попробовать ещё раз",                   effect: "счётчик сброшен, +8 шагов, тот же cap" }
    - { id: simplify,  label: "Упростить: убрать то, что не получается", effect: "строитель удаляет упавшую функцию/экран и связанные AC (единственный случай, когда AC можно убрать; пользователь видит список)" }
    - { id: rollback,  label: "Вернуть последнюю рабочую версию",       effect: "откат к последней ревизии с G0 passed; run_finished {status: cancelled}" }
    - { id: rephrase,  label: "Объяснить по-другому",                   freeText: true, effect: "свободный текст пользователя (provideRunInput.text) → новое user-сообщение, счётчик сброшен" }
  test: "Фейковая модель, 5 раз ломающая typecheck → needs_input kind=decision decisionId=escalation с 4 вариантами; 6-го вызова LLM нет"

# ---------------------------------------------------------------- Контекст
context:
  layout:                        # порядок сообщений; 1–2 — кэшируемый префикс, точка кэша на последнем системном
    - "1. system static: role + platform rules + code_conventions + SDK/ui-kit cheatsheet + оглавление карточек возможностей + правила текста textRules('system') (packages/agents/src/text-rules.ts, D48, D49) + «пока не умеем» (≤ 12k токенов, одинаковый для всех прогонов)"
    - "2. system session: карточка (сжатая) + дайджест спеки + дерево файлов (пути и размеры)"
    - "3. relevant files (user-сообщение, обновляется только при свёртке)"
    - "4. свёрнутая история + последние ходы полностью"
  spec_digest: "Компактный текст: сущности (поля: имя:тип[!req][pii]), роли, права (роль: сущность ops [rowFilter]), страницы, функции, AC. Без compliance.operatorName/operatorContact/operatorInn, consentText и retentionWaiver.reason. Спека — read_file('spec.json') (с теми же полями, замаскированными)"
  collapse:
    unit: "символы (не токены)"
    max_chars: 65536
    min_chars: 8192
    rule: >
      Если хвост истории превысил max_chars — граница свёртки сдвигается скачком так, чтобы полным остался хвост ≤ min_chars
      (гистерезис: следующие ходы снова попадают в кэш промпта, пока хвост не дорастёт до max_chars).
      Свёрнутые результаты инструментов заменяются однострочниками.
    abbreviations:
      apply_ops: "«apply_ops v{a}→v{b}: {n} операций ({первые 3 типа})» или «apply_ops: ошибка {code} в {path}»"
      write_file: "«записан {path} ({KB} КБ)»"
      read_file: "«прочитан {path}»"
      run_gate: "«{level}: {passed|упало N: id1, id2…}»"
      other: "«{tool}: ok|ошибка {code}»"
    never_collapse: "последний отчёт гейта; последнее сообщение пользователя; submit_plan"
  relevant_files:
    max_files: 16
    max_total_bytes: 8192
    selection: "LRU по последнему касанию (write/read) + файлы, упомянутые в упавших проверках (приоритет) + target.file в point_edit"
    overflow: "Файл, не влезающий в бюджет, подаётся outline: экспорт, сигнатуры, число строк; полный текст — через read_file"
  models_without_cache: "max_chars = min_chars = 8192"
  test: "Юнит-тест как у Chef: последовательность из 40 ходов даёт ≤ 3 сдвигов границы свёртки; префикс сообщений 1–2 байтово неизменен между ходами"

# ---------------------------------------------------------------- «Укажи и измени» (M3)
point_and_edit:
  mode: point_edit
  input: "target {wzId, componentName, file, line, route, instruction ≤ 500}; формат wzId и его разметка в превью — ui/ui-kit.yaml#wz_id (источник)"
  rules:
    - "MUST: write_file разрешён только для target.file; попытка записать другой путь → TARGET_ONLY"
    - "MUST: apply_ops недоступен; нужна правка данных/прав → ask_orchestrator (станет small_edit с карточкой)"
    - "MUST: контекст — target.file полностью + его импорты outline + spec_digest"
    - "Бюджет: max_steps 12, cap по умолчанию 3 кредита, G0 обязателен, G1 — только проверки страниц с этим файлом"
  test: "M3 exit: правка по клику меняет ровно один файл (diff ревизии = {target.file})"

# ---------------------------------------------------------------- Правила кода сгенерированных систем
code_conventions:
  imports:
    - "MUST: только '@wizard/sdk', '@wizard/ui-kit' (и их подпути из их package exports), относительные импорты внутри ui/** или внутри functions/**; типы — только import type {…} from '@wizard/sdk' (module augmentation _generated/wizard.d.ts, runtime/sdk.md §4)"
    - "MUST NOT: ui/** импортирует functions/** напрямую — ui/** вызывает функции по строковому имени: useQuery('fnName', args), useMutation('fnName') (runtime/sdk.md §3)"
  forbidden: "Единый список — quality/gates.yaml#G0.forbidden_api (G0-SEC-01, G2-AF-05)"
  functions:
    - "query/mutation/action из @wizard/sdk; валидаторы аргументов (v.*) всегда, return-валидаторы — нет"
    - "ctx.db/systemDb.<e>.list/first/count/paginate: where — префикс объявленного или неявного индекса (IndexWhere<E>, ловит G0-TS-01); list без where — limit ≤100, с where — ≤1000; paginate.numItems ≤200 (G0-IDX-01)"
    - "action не трогает ctx.db, только ctx.runQuery/runMutation; внешние вызовы — только ctx.connectors.*"
    - "Права не проверяются вручную вместо спеки: runtime применяет их сам; функция может только сужать"
    - "Ошибки — ctx.error(CODE, data); тексты для пользователя на русском"
  ui:
    - "Компоненты ui-kit вместо своей вёрстки; цвета/отступы/радиусы — только токены (var(--w-*), ui/ui-kit.yaml#tokens), без хардкода цветов"
    - "Страница = page.file (^ui/…\\.tsx$, рекомендуемо ui/pages/) с default export; общие компоненты — ui/components/**"
    - "Все строки интерфейса — на русском; даты/деньги — форматтеры ui-kit (ru-RU, ₽)"
    - "Доступность: у каждого поля ввода подпись (Field label), у изображений alt, у кнопок-иконок aria-label, фокус видим, порядок табуляции естественный, цвет не единственный носитель смысла"
    - "Адаптивность: без фиксированных ширин > 360 px; таблицы ui-kit сами превращаются в карточки на мобильном"
    - "Состояния загрузки/пусто/ошибка — у каждого списка и формы"
    - "Формы с полями pii≠none от public/login ролей — с компонентом согласия ui-kit (G2-PII-04)"
    - "Не выдумывать данные: демо-значения только в пустых состояниях с пометкой «пример»"
    - "Тексты внутри системы (заголовки, преимущества, ответы, письма) — по правилам textRules('system'): без выдуманных отзывов, цифр, адресов и превосходных степеней; чего нет у владельца — заглушка «Пример: …» (D49)"

