catalog_rules:
  - "MUST: ids моделей — единственные имена в конфигурации, eval и логах (tools/eval использует те же id)"
  - "MUST: модель с enabled=false не выбирается ни роутером, ни фолбэком (тест)"
  - "MUST: T0 = только placement=internal (Cloud.ru внутренний контур) или провайдер yandex с заголовком без логирования"
  - "MUST NOT: провайдеры-API Anthropic, OpenAI, Google, xAI (в т. ч. их модели у посредников). Open-weights этих вендоров с инференсом в РФ (placement=internal) допустимы (решение F3). Линтер реестра проверяет provider и placement, а не префикс providerModel; шлюз дополнительно проверяет каждый вызов — gateway_allowlist"
  - "MUST (V3-16): новая модель встаёт в хвост цепочки с note «после пробы на русском (ступень 2, журнал трат V3-01)»; во главе цепочки — только модели, уже проверенные в репозитории. Передвинуть вперёд — PR с результатом пробы"
  - "SHOULD: цены проверять раз в месяц; изменение цены — правка этого файла + запись в CHANGELOG"

# ---------------------------------------------------------------- Решение недели 0 (F2, основатель)
week0_decision:
  rule: >
    Если на eval недели 0 (spec_only, набор брифов M0, eval.yaml) GLM-5.3 (T1) не превосходит лучшую T0-модель
    по доле g0_pass на ≥ 10 п. п. (или Z.ai не подтвердил условия работы с РФ и отсутствие хранения, E-LEGAL),
    сборка по умолчанию идёт на моделях в РФ (T0)
  switch: "t1_default: true | false — единственный флаг в этом файле. false → на шаге 6 routing_algorithm routes[*].default_tier=T1 трактуется как T0 (reason=default_T0); chain.T1 остаётся для eval (--models)"
  state: "t1_default: true до отчёта tools/eval/results/<дата>-week0.md; смена флага — PR с отчётом и строкой в CHANGELOG (эскалации не требует — правило утверждено)"
  keeps: "scrub, роутер и журнал из M0 не меняются; при t1_default=false объём M1-07 (DLP импорта) и тексты UI про модели сборки — по backlog/platform-screens"
  test: "Юнит-тест роутера: t1_default=false → ни один callType не получает T1 без --models в eval"

# ---------------------------------------------------------------- Маршрутизация
call_types:            # полный список; route() с иным callType → ошибка UNKNOWN_CALL_TYPE
  - interview          # анализ брифа и вопросы (оркестратор)
  - card               # карточка системы (оркестратор)
  - plan               # план сборки (строитель)
  - system_plan        # план системы беты v2: цели → модули → секции (планировщик, B2-20, modules.yaml#ai_rules)
  - build_texts        # сборщик v2: тексты секций лендинга по утверждённому плану (B2-21, builder.yaml#v2)
  - build_design       # сборщик v2: дизайн-направление, тема, шрифты, раскладки секций (B2-21; полный дизайн-агент — B2-37)
  - build_custom       # сборщик v2: дописывание кодом частей plan.custom поверх скомпилированной системы (B2-23, builder.yaml#v2.stages.custom)
  - build_ops          # операции над AppSpec (строитель)
  - build_code         # код UI и функций (строитель)
  - fix                # исправление по отчёту гейта (строитель)
  - qa_generate        # генерация проверок и seed-подсказок (QA)
  - qa_explain         # объяснение провалов (QA)
  - audit              # аудитор G4 (после MVP)
  - import_mapping     # маппинг таблицы на сущности (M1)
  - runtime_ai_extract # ИИ-действие «Извлечь/классифицировать» в системе (M3)
  - runtime_ai_generate # ИИ-действие «Сгенерировать текст» в системе (M3)
  - support            # поддержка/отладка на живых записях
  # v3 (V3-16, specs/agents/builder-v3.md C7, D77)
  - interview_v3       # грилл-интервью v3: вопрос с рекомендацией и кнопками, сырой ввод владельца
  - brief_extract      # извлечение брифа (C1) из чата и файла ТЗ (docx, pdf, md, txt)
  - art_direction      # арт-директор: архетип, принципы по логотипу и референсам, идеи фирменных секций
  - page_compose       # страницы кодом на паттернах и тексты секций (массовый код)
  - signature_section  # 1–2 фирменные секции
  - critic_visual      # ИИ-критик по скриншотам 390/768/1440
  - techreview         # ревьюер техревью (D77 (10)): модель другого семейства, чем строитель
  - research           # факты о нише по результатам веб-поиска и чтения страниц (V3-05)

pii_forbidden_for_T1:
  always: [runtime_ai_extract, runtime_ai_generate, support]
  conditional:
    - callType: import_mapping
      rule: "T1 допустим ТОЛЬКО если вызывающий явно передал containsPiiHint=false (в запросе лишь заголовки, профили колонок и синтетические строки) И DLP по payload нашёл 0 ПДн. Иначе (hint отсутствует/true или DLP>0) → T0"
  any_pii: [interview, interview_v3, brief_extract]   # сырой ввод владельца (чат, файл ТЗ): любая находка детектора → T0 (reason pii_detected_interview) — правило interview в коде до M2-28 (D50, шаг 5); brief_extract к тому же только T0 по маршруту
  test: "Юнит-тест роутера: для каждого callType из always × все orgPolicy × все containsPiiHint → tier=T0; для import_mapping без hint=false → T0"

routing_algorithm:     # route({callType, messages, tools?, containsPiiHint?, orgPolicy: {ruOnly, t1Restricted}, ctx: {orgId, runId?, systemId?, budget?}}) (architecture.yaml#interfaces.llm_call) — детерминированно, policy-as-code
  - "1. dlp = pii.detect(все текстовые части messages, включая результаты инструментов)"
  - "2. Если orgPolicy.ruOnly → T0 (reason=policy_ru_only)"
  - "2a. Если orgPolicy.t1Restricted (регион организации запрещён условиями провайдера T1; platform/db.yaml#orgs.t1_restricted) → T0 (reason=policy_region_restricted). Политика не загружена (поле t1Restricted не передано) → считается true (fail-safe T0). Неизвестный регион организации (region_code NULL) T1 не ограничивает: платформа передаёт t1Restricted=false (product.yaml#decisions.D26_models_default, security/data-boundary.yaml#region_restriction.unknown_region)"
  - "3. Если callType ∈ pii_forbidden_for_T1.always или сработало conditional → T0 (reason=callType_forbidden_T1)"
  - "3a. Если containsPiiHint=true для любого callType → T0 (reason=pii_hint): вызывающий знает, что в payload реальные записи"
  - "4. Если dlp содержит strong-виды security/data-boundary.yaml#detectors или special_context/biometric_context → T0 (reason=pii_high_risk)"
  - "5. (Снят 05.10.2026, product.yaml#decisions.D50_brief_pii_routing.) Было: callType=interview и dlp.count>0 → T0 (pii_detected_interview). Теперь интервью проходит шаги 4, 6 и 7 как остальные callType: basic-ПДн заменяются заглушками, strong-виды → T0 по шагу 4 (реализация — M2-28)"
  - "6. Иначе tier = routes[callType].default_tier с учётом week0_decision.switch (reason=default_T1|default_T0)"
  - "7. Если tier=T1: messages = pii.scrub(messages) (одноразовые заглушки [ТЕЛЕФОН_1], [EMAIL_1], [ФИО_1]… — формат security/data-boundary.yaml#scrub.placeholders, без таблицы соответствия); в журнал — только счётчики категорий"
  - "8. Модель = первая доступная в routes[callType].chain[tier] (circuit closed, enabled, семейство не в avoidFamilies вызова). Нет доступной → фолбэк по fallback_rules"
  - "8a. Модель не проходит gateway_allowlist (хост или модель) → не вызывается: строка llm_calls status=error, error_code=MODEL_NOT_ALLOWED, дальше по цепочке (во всех режимах, и в fixture)"
  - "9. Неизвестная ситуация/исключение в политике → T0 (fail-safe)"
unknown_class_default: T0

routes:                # chain.T1 пробуется только если tier=T1 по алгоритму; chain.T0 — всегда запасной путь
  interview:           { role: orchestrator, default_tier: T1, chain: { T1: [glm-5.3], T0: [glm-5.1, kimi-k2.6, deepseek-v4-pro, yandex-qwen3-235b] }, temperature: 0.3, max_tokens: 8000,  timeout_ms: 180000, note: "B2-41: 4000 не хватало рассуждающей модели на submit_goals (обрыв ответа на пробе D76 mvp-01)" }
  card:                { role: orchestrator, default_tier: T1, chain: { T1: [glm-5.3], T0: [glm-5.1, kimi-k2.6, deepseek-v4-pro, yandex-qwen3-235b] }, temperature: 0.2, max_tokens: 8000,  timeout_ms: 300000 }
  plan:                { role: builder,      default_tier: T1, chain: { T1: [glm-5.3], T0: [glm-5.1, deepseek-v4-pro, kimi-k2.6] },                 temperature: 0.2, max_tokens: 4000,  timeout_ms: 480000, note: "ТЗ харнесса v2 (submit_brief) — самый долгий ответ строителя: 300 с не хватало (замер 06.10.2026, средняя задержка 161 с)" }
