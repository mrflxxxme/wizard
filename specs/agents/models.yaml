# Каталог моделей и маршрутизация LLM. Нормативно для packages/llm и packages/agents.
# Источники: product.yaml#decisions.D2/D3/D10, docs/audit/01-llm-access-and-costs.md (цены),
# docs/audit/04-tech-feasibility.md#t5 (политика AI SDK), docs/research/data-boundary-frontier.md (классы вызовов).
# [?] — не подтверждено по первоисточнику; проверяется контрактным тестом eval-стенда до включения в live.
version: 1

providers:
  cloudru:
    tier: T0
    base_url_env: CLOUDRU_BASE_URL          # по умолчанию https://foundation-models.api.cloud.ru/v1
    api_key_env: CLOUDRU_API_KEY
    rule: "MUST: только модели с placement=internal из internal_models. Внешние (партнёрские) модели Cloud.ru (GLM-5.2, DeepSeek-V4-Flash, MiMo-V2.5-Pro, Qwen3-VL, GLM-4.6V, Claude/GPT/Gemini) MUST NOT быть в каталоге: запрос уходит провайдеру за пределы РФ (docs/audit/01-llm-access-and-costs.md); шлюз отклоняет их (gateway_allowlist)"
    internal_models:                        # «Внутренняя» по каталогу cloud.ru/docs/foundation-models/ug/topics/overview__available__models, снимок 08.10.2026; новая модель — сюда после проверки размещения
      [ai-sage/GigaChat3-10B-A1.8B, ai-sage/GigaChat3.5-432B-A28B, deepseek-ai/DeepSeek-V4-Pro, GigaChat/GigaChat-2-Max, MiniMaxAI/MiniMax-M2.5, MiniMaxAI/MiniMax-M3, moonshotai/Kimi-K2.6, openai/gpt-oss-120b, Qwen/Qwen3-Coder-Next, Qwen/Qwen3.5-397B-A17B, Qwen/Qwen3.6-35B-A3B, zai-org/GLM-4.7, zai-org/GLM-5.1]
    prompt_cache: none                      # в тарифе FM (cloud.ru/documents/tariffs/evolution/foundation-models, 08.10.2026) цены чтения кэша есть только у партнёрских моделей; у внутренних скидки нет → cached = input
  yandex:
    tier: T0
    role: reserve
    base_url_env: YANDEX_BASE_URL           # OpenAI-совместимый эндпоинт AI Studio, напр. https://llm.api.cloud.yandex.net/v1 [?]
    api_key_env: YANDEX_API_KEY
    folder_env: YANDEX_FOLDER_ID            # model = gpt://<folder>/<providerModel> [?]
    required_headers: { x-data-logging-enabled: "false" }
    rule: "MUST: заголовок x-data-logging-enabled: false в каждом запросе; тест проверяет его наличие на уровне HTTP-перехватчика"
    prompt_cache: auto                      # «кэширование включается автоматически, когда возможно» (aistudio.yandex.ru/docs/ru/ai-studio/pricing); поле usage в ответе [?] — читаем prompt_tokens_details.cached_tokens
  zai:
    tier: T1
    base_url_env: ZAI_BASE_URL              # по умолчанию https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    rule: "MUST: только после pii.scrub; MUST NOT для callType из pii_forbidden_for_T1"
    termsCheckedAt: 2026-09-30              # security/data-boundary.yaml#routing.model_registry: старше 90 дней → предупреждение CI
    prompt_cache: auto                      # неявный кэш без параметров (docs.z.ai/guides/capabilities/cache): usage.prompt_tokens_details.cached_tokens; цена — price.cached (docs.z.ai/guides/overview/pricing), хранение кэша бесплатно
  moonshot:
    tier: T1
    base_url_env: MOONSHOT_BASE_URL
    api_key_env: MOONSHOT_API_KEY
    enabled: false
    termsCheckedAt: 2026-09-30
    disabled_reason: "Kimi K3 обучается на контенте API; включать только после договора о запрете обучения (E-LEGAL)"
    prompt_cache: auto                      # автоматический кэш Kimi API (platform.kimi.ai/docs/guide/use-context-caching-feature-of-kimi-api); поле usage.cached_tokens [?]
  deepseek:
    tier: T1
    role: eval_challenger
    base_url_env: DEEPSEEK_BASE_URL         # по умолчанию https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY           # необязателен: без ключа модели провайдера недоступны, цепочка идёт дальше
    termsCheckedAt: 2026-10-01
    rule: "MUST: только после pii.scrub; MUST NOT для callType из pii_forbidden_for_T1 (как zai). Модели провайдера enabled=false и не входят ни в одну цепочку routes — выбираются только в eval через --models (претендент недельного eval, docs/founder/models-research.md#рекомендация-для-пилота п. 4б). Включение в маршрутизацию по умолчанию — отдельное решение (хранение данных в КНР, E-LEGAL)"
    thinking: "MUST: thinking: {type: disabled} в КАЖДОМ запросе (у DeepSeek он включён по умолчанию; с tools в режиме thinking API требует вернуть reasoning_content, а мы его вырезаем → 400 на втором ходе)"
    prompt_cache: auto                      # «Context Caching on Disk» включён по умолчанию (api-docs.deepseek.com/guides/kv_cache): usage.prompt_cache_hit_tokens = prompt_tokens_details.cached_tokens
  openai_compatible:
    tier: T0
    base_url_env: WIZARD_LLM_OPENAI_COMPAT_BASE_URL   # свой vLLM (D77 (13)), напр. http://vllm.internal:8000/v1
    api_key_env: WIZARD_LLM_OPENAI_COMPAT_API_KEY     # необязателен: vLLM без --api-key
    models_env: WIZARD_LLM_OPENAI_COMPAT_MODELS       # имена моделей сервера через запятую → id compat:<имя>, цена 0 (платим за сервер, не за токены), context 131072
    routes_env: WIZARD_LLM_OPENAI_COMPAT_ROUTES       # callType через запятую: модели сервера первыми в chain.T0; в остальных маршрутах — последний резерв T0
    enabled: false                                    # включается заданием base_url и models (packages/llm openAiCompatFromEnv)
    rule: "MUST: только сервер в контуре РФ (свои GPU, Cloud.ru Evolution) — модели идут как T0. Хост западного API или закрытая западная модель → MODEL_NOT_ALLOWED при создании реестра (gateway_allowlist). Позже — основа BYOK (V3-33)"
    prompt_cache: auto                      # vLLM: --enable-prefix-caching (APC); cached_tokens в usage — только с --enable-prompt-tokens-details (по умолчанию выключен)
  fixture:
    tier: any
    rule: "WIZARD_LLM_MODE=fixture: ответы из tools/fixtures/<suite>/<name>.jsonl по правилам specs/quality/eval.yaml#fixtures.lookup (demo — по порядку вызовов callType, eval|unit — по ключу запроса). Маршрутизация и учёт выполняются так же, как в live. Режим record — только с ограничениями eval.yaml#fixtures.rules (брифы из репозитория, T0-запросы после scrub)"

# Цены — ₽ за 1M токенов с НДС. Z.ai/Moonshot/DeepSeek: $ × 95 ₽/$ [?] + 22% НДС налогового агента (DeepSeek — цены часов пик).
# cached — цена кэшированного входа; если провайдер кэш-скидку не даёт (prompt_cache: none), cached = input.
# vision: true — модель принимает изображения (метка Vision каталога); цепочки critic_visual — только из таких моделей.
