fallback_rules:
  - "MUST: при открытом circuit breaker, исчерпанных ретраях или 5xx/timeout модель берётся следующей в цепочке своего tier; затем T1 → T0 (reason=fallback_*)"
  - "MUST NOT: автоматический фолбэк T0 → T1, если T0 выбран по данным (ruOnly, регион, callType из pii_forbidden_for_T1, ПДн — шаги 2–5) или вызов T0-only (multimodal). MAY (D76, WIZARD_LLM_T1_RESERVE=1, по умолчанию выключено — week0_decision.test): вызов, оставшийся на T0 только по умолчанию (reason=default_T0), после отказа всей цепочки T0 пробует chain.T1 — Z.ai резервом Cloud.ru, только заскрабленные сообщения без токенов ПДн. Если все недоступны — вызов падает с LLM_UNAVAILABLE (details.balanceExhausted — провайдеры с нулевым балансом); поведение прогона (повторы шага, статус, run_failed) — specs/platform/workflows.yaml#run_lifecycle"
  - "MUST (D76): нулевой баланс провайдера — HTTP 402 или 429/403 с признаком баланса в ответе (Z.ai: код 1113 «Insufficient balance or no resource package»; Cloud.ru: 402/403 с текстом про баланс, оплату, «недостаточно средств» [?]) — код PROVIDER_BALANCE_EXHAUSTED: без повторов, провайдер пропускается всеми маршрутами процесса 30 мин (общий circuit breaker, provider-wide), вызов идёт дальше по цепочке; пропуски — строки llm_calls status=circuit_open, error_code=PROVIDER_BALANCE_EXHAUSTED. Через 30 мин — снова живой вызов: баланс пополнен → этапы возвращаются к провайдеру, нет → ещё 30 мин. Обычный 429 и 5xx — как раньше (retries, circuit_breaker). Тест: packages/llm/test/balance.test.ts"
  - "MUST (D76): хук роутера onProviderDegraded({provider, reason: balance_exhausted|circuit_open, model?}) — один раз на эпизод (новая блокировка провайдера или открытие circuit модели); platform-api (движок прогонов и шлюз ИИ-действий) шлёт алерт основателю через ops_alerts: нулевой баланс — раз в день МСК на провайдера, circuit — раз в час на модель; текст по-русски, без данных прогона и ПДн"
  - "SHOULD (D76, алерт о балансе заранее): API баланса по ключу API у Z.ai и Cloud.ru FM нет, поэтому оценка: WIZARD_LLM_BALANCE_ZAI / WIZARD_LLM_BALANCE_CLOUDRU = «<₽>@<время ISO>» (остаток по консоли провайдера на момент сверки) минус Σ cost_rub оплачиваемых llm_calls провайдера с этого времени (цены каталога, ± несколько %); остаток ≤ WIZARD_LLM_BALANCE_WARN_RUB (по умолчанию 300 ₽) → одно предупреждение на сверку (проверка перед каждым новым прогоном с моделью, LlmMonthlyCap). Новая сверка — новое значение переменной"
  - "MAY: при переходе T1 → T0 отправить исходные (незаскрабленные) сообщения — T0 допускает любые данные"
  - "MUST: смена модели посреди прогона строителя логируется событием model_switched {fromModel, toModel, reason} (workflows.yaml#events) и llm_calls.fallback_from; в SSE пользователя модель и tier не отдаются; история инструментов переносится без reasoning_content"
  - "MUST: факт фолбэка пользователь видит только обобщённо — строка «Часть шагов выполнена на моделях в РФ» без модели и tier; сигнал — step_finished.ruFallback (platform/workflows.yaml#events), место — ui/platform-screens.yaml (L4-20)"
  - "SHOULD: фолбэк на другое семейство модели внутри одного прогона не сбрасывает кэш-историю (контекст пересобирается по builder.yaml#context)"

# ---------------------------------------------------------------- Allowlist шлюза (V3-16, D18)
gateway_allowlist:     # packages/llm/src/allowlist.ts; проверка перед каждой попыткой вызова (routing_algorithm 8a) и при создании реестра для openai_compatible
  providers: [cloudru, yandex, zai, moonshot, deepseek, openai_compatible]
  western_hosts: [openai.com, openai.azure.com, anthropic.com, claude.ai, googleapis.com, google.com, x.ai, grok.com, openrouter.ai, vercel.sh, amazonaws.com]   # хост base URL или его суффикс
  western_closed_models: "claude, gemini, imagen, grok, chatgpt, dall-e, sora, gpt-* (кроме gpt-oss), o1…o9, text-embedding-3; префиксы anthropic/, x-ai/, xai/ — по имени модели у любого провайдера. Открытые веса (gpt-oss, whisper, gemma) допустимы (D18)"
  cloudru: "providerModel ∈ providers.cloudru.internal_models и placement=internal; остальной каталог Cloud.ru (партнёрские модели) отклоняется"
  on_violation: "вызов не выполняется: llm_calls status=error, error_code=MODEL_NOT_ALLOWED, дальше по цепочке; openai_compatible с западным хостом или моделью → LlmError MODEL_NOT_ALLOWED при создании реестра"
  byok: "ключи пользователя (D77 (14б), V3-33) — отдельный путь со своими правилами; этот allowlist — для ключей платформы"
  test: "packages/llm/test/gateway-v3.test.ts"

# ---------------------------------------------------------------- Политика вызова (AI SDK 7)
call_policy:
  client: "ai 7.x + @ai-sdk/openai-compatible; supportsStructuredOutputs: false; includeUsage: true"
  thinking:
    - "MUST: thinking/reasoning выключен в любом вызове с tools. Параметры: zai → reasoning_effort: 'high' только для card, plan и system_plan (планировщик беты v2, B2-20), 'low' во всех остальных вызовах (D75, решение основателя 06.10.2026; было «high везде» от 05.10; список — packages/llm HIGH_REASONING) (glm-5.3 думает всегда, {thinking: {type: 'disabled'}} даёт 400 «cannot be disabled; please use low, high, or max» — замер на сервере 05.10.2026); deepseek → {thinking: {type: 'disabled'}} в каждом вызове, и без tools; cloudru → {chat_template_kwargs: {enable_thinking: false}} [?]; yandex → без reasoning-параметров [?]"
    - "MUST NOT: отправлять reasoning_content обратно в API (ломает DeepSeek/Kimi, аудит 04 T5)"
    - "MAY: отдельный вызов без tools с thinking для рассуждений; его результат передаётся дальше как обычный текст"
    - "Тест: контрактный тест провайдер×модель в eval (tools/eval --contract) — запрос с tools не содержит включённого thinking"
  structured_output: "MUST NOT: response_format json_object/json_schema. Структурированный вывод — только вызовом инструмента с zod-схемой, серверная валидация, при ошибке — повтор с текстом ошибки (≤2 раза)"
  tool_schemas: "MUST: tool definitions генерируются из zod 4 (z.toJSONSchema); одна схема — и для валидации, и для модели. Имена инструментов snake_case латиницей, описания на английском (экономия токенов), сообщения об ошибках — на русском для пользователя, структурно для модели"
  tool_choice: "auto; 'required' только для вызовов, где единственный выход — инструмент (interview, card, plan, system_plan, qa_generate)"
  parallel_tool_calls: "≤8 вызовов в одном ходе; лишние отклоняются ошибкой TOO_MANY_TOOL_CALLS"
  temperature_and_limits: "из routes[callType]; переопределение только в eval"
  retries:
    max_attempts: 3
    backoff_ms: [1000, 4000, 16000]
    jitter: "±20%"
    retry_on: [HTTP_429, HTTP_5xx, TIMEOUT, NETWORK, EMPTY_RESPONSE]
    no_retry_on: [HTTP_400, HTTP_401, HTTP_403, CONTEXT_TOO_LONG, PROVIDER_BALANCE_EXHAUSTED]
    respect_retry_after: true
    tool_parse_repair: "Невалидные аргументы инструмента не ретраятся на HTTP-уровне: модели возвращается ошибка валидации zod как результат инструмента"
  timeouts: { first_token_ms: 60000, request_ms: "routes[callType].timeout_ms", run_wall_clock: "builder.yaml#budgets" }
  circuit_breaker:
    scope: "provider × model"
    open_when: "5 подряд неуспешных вызовов ИЛИ ≥50% ошибок из последних 20 вызовов за 60 с"
    open_ms: 60000
    half_open: "1 пробный вызов; успех → closed, неуспех → open ещё на 2× (до 10 мин)"
    state_store: "в памяти процесса (M0); в Postgres платформы (M1+), общий для воркеров"
    test: "Фейковый провайдер с 5 ошибками → 6-й вызов уходит на следующую модель без сетевого запроса к первой"
  context_too_long: "Перед вызовом оценить токены (символы/3.2); при превышении 85% context модели — builder.yaml#context сжимает; повтор не делать"

# ---------------------------------------------------------------- Деньги и кредиты
credits:
  rub_per_credit: 5                       # product.yaml D10: 1 кредит ≈ 5 ₽ себестоимости LLM
  cost_rub: "(inputTokens − cachedTokens) × price.input/1e6 + cachedTokens × price.cached/1e6 + outputTokens × price.output/1e6"
  credits_per_call: "credits_milli = ceil(cost_rub × 1000 / rub_per_credit) на строку llm_calls (specs/platform/billing.yaml#credit.from_cost)"
  settlement: "charge = min(cap, Σ credits_milli по строкам прогона с billable=true); округление до 0.1 кредита — только при показе (specs/platform/billing.yaml)"
  fixture_mode: "Кредиты считаются по записанному usage фикстуры — бюджеты тестируются офлайн"
  demo_replay: "B2-02 (D76 (12), grill-6 № 12): режим показа служебной организации (orgs.kind=staff, orgs.demo_replay) — все прогоны организации идут в fixture на записанных сценариях tools/fixtures/demo/<name>.jsonl с опцией роутера free: строки llm_calls mode=fixture, cost_rub 0, credits_milli 0; нет записанного ответа → прогон падает DEMO_REPLAY_MISS «В режиме показа есть только записанные сценарии: …», в live не переходит"
  runtime_ai: "ИИ-действия списывают кредиты организации по факту, с месячным лимитом aiAction.monthlyLimit (вызовов); превышение → ошибка AI_LIMIT_REACHED без вызова модели. Вход от роли access=public — дополнительно ≤ 10 вызовов/ч на IP (M3). Вывод generate — текст, не HTML. Изображения из записей систем в ИИ-действиях идут тем же callType runtime_ai_* — только T0 по pii_forbidden_for_T1 (живые записи с ПДн, 152-ФЗ), а не потому, что вызов мультимодальный. Мультимодальность сама по себе T1 не запрещает (product.yaml#decisions.D45_vision_t1): дизайн-агент и критик берут лучшую модель со зрением, сначала T1 (callType design_* — задача M2-28)"
  test: "Сумма ledger прогона = Σ credits_milli по строкам llm_calls прогона с billable=true (±1 милликредит)"

usage_record:          # одна запись на HTTP-попытку = строка platform.llm_calls (db.yaml, источник); camelCase ↔ snake_case колонки 1:1; payload (промпты/ответы) сюда НЕ пишется
  fields:
    - { name: id,                 type: uuid }
    - { name: runId,              type: "uuid?" }
    - { name: orgId,              type: uuid }
    - { name: systemId,           type: "uuid?" }
    - { name: step,               type: "string?", note: "имя шага workflows.yaml" }
    - { name: callType,           type: string }
    - { name: agentRole,          type: string, note: "routes[callType].role: orchestrator|builder|planner|copywriter|designer|qa|auditor|importer|runtime|support|critic|reviewer|researcher" }
    - { name: tier,               type: "T0|T1" }
    - { name: provider,           type: string }
    - { name: modelId,            type: string, note: "id из models" }
    - { name: attempt,            type: int }
    - { name: status,             type: "ok|error|timeout|circuit_open|aborted" }
    - { name: errorCode,          type: "string?", note: "в т. ч. PROVIDER_BALANCE_EXHAUSTED, MODEL_NOT_ALLOWED (gateway_allowlist)" }
    - { name: routeReason,        type: "policy_ru_only|policy_region_restricted|callType_forbidden_T1|pii_hint|pii_high_risk|pii_detected_interview|default_T1|default_T0|fallback_circuit_open|fallback_error" }
    - { name: fallbackFrom,       type: "string?", note: "modelId, с которого ушли" }
    - { name: policyVersion,      type: string, note: "хеш этого файла + версии packages/pii" }
    - { name: scrubbed,           type: bool }
