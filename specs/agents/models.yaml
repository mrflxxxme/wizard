  - { id: glm-5.3,          provider: zai,      providerModel: "glm-5.3",                      tier: T1, placement: external, context: 200000, price: { input: 162, cached: 30, output: 510 }, enabled: true, note: "$1.4/$0.26/$4.4 [?] курс" }
  - { id: glm-5.3-flash,    provider: zai,      providerModel: "glm-5.3-flash",                tier: T1, placement: external, context: 1000000, price: { input: 17.38, cached: 3.48, output: 57.95 }, enabled: true, vision: true, note: "V3-16: $0.15/$0.03/$0.5 (docs.z.ai/guides/overview/pricing, 08.10.2026) [?] курс; нативно мультимодальная, размышление не выключается. Хвосты page_compose и critic_visual — после пробы на русском (ступень 2, журнал трат V3-01)" }
