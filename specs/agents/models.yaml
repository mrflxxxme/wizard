  - { id: kimi-k2.6,        provider: cloudru, providerModel: "moonshotai/Kimi-K2.6",          tier: T0, placement: internal, context: 262000,  price: { input: 175.68, cached: 175.68, output: 725.9 },  enabled: true, vision: true, note: "формат изображений в API Cloud.ru не описан — дымовой тест до включения критика (docs/research/integrations-2026-10.md#8)" }
  - { id: deepseek-v4-pro,  provider: cloudru, providerModel: "deepseek-ai/DeepSeek-V4-Pro",   tier: T0, placement: internal, context: 1000000, price: { input: 183,    cached: 183,    output: 732 },    enabled: true }
  - { id: glm-5.1,          provider: cloudru, providerModel: "zai-org/GLM-5.1",               tier: T0, placement: internal, context: 202000,  price: { input: 198.86, cached: 198.86, output: 829.6 },  enabled: true }
  - { id: qwen3-coder-next, provider: cloudru, providerModel: "Qwen/Qwen3-Coder-Next",         tier: T0, placement: internal, context: 262000,  price: { input: 122,    cached: 122,    output: 244 },    enabled: true }
  - { id: gpt-oss-120b,     provider: cloudru, providerModel: "openai/gpt-oss-120b",           tier: T0, placement: internal, context: 131000,  price: { input: 15.86,  cached: 15.86,  output: 61 },     enabled: true, note: "[?] id модели. Открытые веса (Apache-2.0), инференс во внутреннем контуре Cloud.ru — допустимо по решению основателя F3 (запрет касается API и сервисов Anthropic/OpenAI/Google/xAI, не open-weights в РФ)" }
  - { id: gigachat-3.5,     provider: cloudru, providerModel: "ai-sage/GigaChat3.5-432B-A28B", tier: T0, placement: internal, context: 262000,  price: { input: 96.22,  cached: 96.22,  output: 288.6 },  enabled: true, note: "[?] id модели" }
  - { id: qwen3.6-35b,      provider: cloudru, providerModel: "Qwen/Qwen3.6-35B-A3B",          tier: T0, placement: internal, context: 262000,  price: { input: 219.6,  cached: 219.6,  output: 329.4 },  enabled: true, vision: true, note: "V3-16: зрение во внутреннем контуре; дневной тариф 08.10.2026 (ночной 10.98/97.6). Хвост цепочки critic_visual — после пробы на русском (ступень 2, журнал трат V3-01)" }
  - { id: yandex-qwen3-235b,        provider: yandex, providerModel: "qwen3-235b-a22b-fp8/latest", tier: T0, placement: internal, context: 262000,  price: { input: 500, cached: 500, output: 500 }, enabled: true, note: "[?] точный URI" }
