# Born to Build (кодовое имя Wizard) — продуктовые рамки. Источник: docs/concept.md v3.1, docs/reviews/grill-2.md, grill-3.md;
# решения основателя F1–F8 от 2026-09-30 (docs/reviews/spec-audit/L4-fidelity.md, раздел c);
# решения основателя из интервью 2026-10-04 (D26–D49) и 2026-10-05 (D50–D64, docs/reviews/grill-4.md № 27–44):
# полнофункциональный пилот до первых клиентов — веха M2P (milestones.yaml)
version: 3.2
name: "Born to Build"       # D27_brand: название продукта во всех текстах наружу
codename: Wizard            # только внутреннее кодовое имя (репозиторий, пакеты @wizard/*, переменные WIZARD_*); клиентам не показывается
language: ru                # весь UI и тексты для пользователей — на русском
domains:                    # D27_brand, D38_sites_domains
  platform: borntobuild.ru
  systems: sandpile.ru      # системы клиентов — <имя>.sandpile.ru; свой домен клиента подключается поверх (D38)

positioning:
  statement: >
    Born to Build собирает рабочую систему под задачу клиента за день: сайт с заявками, онлайн-запись,
    платный доступ, CRM и внутренние инструменты, а для тех, кто запускает проект, — MVP от сайта до кабинета
    и устанавливаемого приложения (PWA). Без программистов, цена известна заранее, человек на связи.
    Клиент описывает задачу в чате, агенты собирают данные, права, интерфейс, логику и интеграции,
    проверяют гейтами, команда смотрит систему перед запуском, хостинг и данные — в РФ.
  promise_draft:              # решение основателя (grill-4 № 9): обещание — КОМБИНАЦИЯ двух формулировок ниже; редактура по правилам humanizer без изменения смысла — M2-86, PR с меткой founder-review (утверждает основатель)
    - "Рабочая система под вашу задачу за день. Цена известна заранее, человек на связи"
    - "От идеи до работающего MVP: сайт, запись, личный кабинет, приложение — без программистов"
  competitive_frame:          # D29_audience
    - id: vibecraft
      who: "Яндекс VibeCraft"
      strength: "корпоративное доверие"
      weakness: "результат воспринимается как прототип; технический интерфейс"
      answer: "рабочая система с проверками и человеком на связи; кабинет без технического жаргона"
    - id: along
      who: "along.ae"
      strength: "MVP-приложение по подписке за 4 недели"
      weakness: "от $15 000 и недели ожидания"
      answer: "самостоятельная сборка за часы по фиксированной цене или «под ключ» за 7–14 дней от 49 000 ₽"
  horizontal: true
  system_classes:             # D33: пилот собирает без ручной доводки (веб-приложение + устанавливаемое PWA)
    - { id: site, name: "Сайт или лендинг с заявками" }
    - { id: booking, name: "Запись на услуги с напоминаниями" }
    - { id: paid_access, name: "Подписка и платный доступ (платный клуб, курс, закрытый раздел)" }
    - { id: crm, name: "CRM и внутренние инструменты" }
  proving_grounds:            # полигоны обкатки M0–M2, НЕ позиционирование
    - b2b_events              # форумы, конференции, экскурсии, регистрация, модерация, квоты, QR-вход
    - made_to_order_goods     # конфигураторы, предзаказы, производство к дате, B2B-прайсы
  core_domain_skeleton: "Каталог → Заявка → Процесс → Оплата → Выдача"   # внутренняя модель полигонов; в живых промптах MUST NOT навязываться (D43)
  differentiators_pilot:      # MUST к первым клиентам пилота (D41, веха M2P)
    - id: working_system_fast
      text: "Рабочая система под задачу за часы; четыре класса систем без ручной доводки (D33)"
    - id: price_and_human
      text: "Цена в рублях известна заранее; человек на связи: «Написать команде», «Передать команде», гарантия запуска (D31, D32)"
    - id: ru_payments_and_messaging
      text: "Оплата в магазин клиента через ЮKassa, Т-Кассу, CloudPayments, Robokassa, Prodamus с чеками 54-ФЗ; подписки; почта, SMS и Telegram из коробки (D35, D36)"
    - id: integrations_and_domains
      text: "amoCRM, Битрикс24, Tilda, МойСклад, СДЭК, вебхуки и исходящие запросы по списку; свой домен, Яндекс Метрика, Яндекс Карты, SmartCaptcha, SEO (D37, D38, D57)"
    - id: design
      text: "Три направления дизайна с настоящим текстом клиента, темы и собственная дизайн-система каждой системы (D39)"
    - id: honest_limits
      text: "Честно говорим, чего платформа пока не умеет, и предлагаем альтернативу или команду (D34)"
  differentiators_mvp:        # MUST быть в закрытой бете (M2)
    - id: reliability
      text: "Гейты перед публикацией, безопасные миграции, откат ревизий, durable-сборки"
    - id: integrations
      text: "ЮKassa, Telegram, email, QR из коробки"
    - id: independence
      text: "Вход по почте и Telegram на Free (по телефону — на платных тарифах, D19), выбор моделей, хостинг вне Yandex Cloud, выгрузка данных"
    - id: price_and_152fz
      text: "Цена сборки с потолком заранее; согласия, политика и автоудаление ПДн в каждой системе"
  differentiators_wave2:      # MUST к публичному запуску (M3)
    - id: point_and_edit
      text: "«Укажи и измени»: клик по элементу превью + инструкция агенту"
    - id: ai_actions
      text: "ИИ-действия «Извлечь/классифицировать» и «Сгенерировать текст» внутри систем (только T0)"

users:
  builder_user: "Нетехнический человек, которому срочно нужна система под задачу, или основатель проекта/малого бизнеса, собирающий MVP (D29_audience)"
  end_user: "Клиенты и сотрудники бизнеса, работающие в созданной системе; посетители без аккаунта (заявка, запись)"

audience:                     # D29_audience
  segments:
    - id: urgent_task
      who: "Нетехнический человек, которому срочно и профессионально нужна система под конкретную задачу: заявки, запись, платный доступ, учёт клиентов"
      needs: "быстро, без изучения инструментов, с понятной ценой и человеком, к которому можно обратиться"
    - id: mvp_builder
      who: "Основатель проекта или малого бизнеса, который собирает MVP: сначала сайт, потом кабинет и приложение"
      needs: "работающий продукт для первых клиентов, предсказуемая цена, рост без смены платформы, возможность отдать сложное людям"

offer:                        # D30_offer; цены — platform/billing.yaml#rub_model (D31_pricing_rub)
  product: "Один продукт, два входа; из самостоятельной сборки можно перейти в «под ключ» на любом шаге («Передать команде», D32)"
  entries:
    - id: self_serve
      name: "Собрать самому"
      what: "ИИ собирает рабочую систему за часы; цена фиксирована; перед запуском систему смотрит человек"
      price: "черновик — бесплатно; запуск — 2 990 ₽ разово + 990 ₽/мес"
    - id: turnkey
      name: "Под ключ"
      what: "MVP под руководством человека за 7–14 дней по фиксированной цене; ИИ ускоряет работу; на пилоте делает основатель"
      price: "от 49 000 ₽ за 14 дней"
  guarantee: "Если система не запустилась, команда доделывает её вручную или возвращает деньги. Ответ команды — до 2 часов в рабочее время (D32)"

non_goals:                  # MUST NOT делать до публичного запуска
  - "Drag-and-drop визуальный редактор"
  - "Синхронное редактирование (как Figma)"
  - "Экспорт кода и редактирование кода пользователем (вкладка «Код» — только чтение, под раскрытием «Подробнее для специалиста», D28). По заказу «под ключ» исходники выдаёт команда вручную; выгрузка данных в ZIP доступна всем (D55)"
  - "Нативные мобильные приложения и публикация в App Store / Google Play (только устанавливаемое PWA, D33)"
  - "Чат-виджет для конечных пользователей (риск ОРИ по 149-ФЗ), чат-боты, ИИ-ассистент и RAG в системах — после пилота (D55). «Написать команде» в кабинете клиента — канал клиента с командой платформы, не это (D32)"
  - "Партнёрская программа интеграторов; публичные приложения amoCRM и Битрикс24 в маркетплейсах на пилоте (D63)"
  - "Генерация изображений ИИ (только загрузка клиента и стоки Pexels и Pixabay с хранением у нас, D61)"
  - "Маркетинговые рассылки из систем клиентов на пилоте — только служебные сообщения (D55)"
  - "Второй язык интерфейса систем на пилоте — только русский (D55)"
  - "Выдуманные факты в текстах агентов и систем: отзывы, превосходные степени без основания, цифры без источника (D49, 38-ФЗ)"
  - "Исходящие запросы систем к хостам вне allowlist AppSpec (D37)"
  - "Публичный лендинг и открытая регистрация на пилоте (только приглашения основателя, D32)"
  - "Госсектор напрямую (реестр ПО, ЕСИА)"
  - "API и сервисы Anthropic, OpenAI, Google, xAI (их условия не допускают РФ). Открытые веса этих вендоров с инференсом в РФ допустимы (D18)"

decisions:                  # зафиксированы; изменение = эскалация E-DECISION
  D1_spec_code_boundary: >
    Спека (AppSpec) владеет данными, правами, миграциями, воркфлоу, интеграциями, разметкой ПДн.
    Код (React UI и функции query/mutation/action) даёт гибкость и пишется агентом на нашем SDK.
  D2_models: >
    T0 — модели, развёрнутые в РФ (Cloud.ru FM внутренний контур; резерв Yandex AI Studio без логирования) —
    для любых данных. T1 — GLM-5.3 (Z.ai) по умолчанию для вызовов сборки ТОЛЬКО после удаления ПДн (если eval недели 0 не опроверг — D2_w0_fallback).
    Переключатель «только российский контур» на уровне организации. Когда сборка идёт только на T0 — D26_models_default (2026-10-04).
  D3_pii_boundary: >
    Наружу (T1) уходят только одноразовые заглушки без таблицы соответствия. Обратимые токены и шифрование — только в РФ.
  D4_runtime: "Postgres, схема на систему, RLS из матрицы прав, шарды ≤2000 схем на кластер, PITR"
  D5_isolation: "Серверный код систем — workerd внутри gVisor, egress только через прокси с allowlist"
  D6_durable_runs: "DBOS Transact на Postgres платформы"
  D7_autonomy: "Одна точка согласования — карточка системы; дальше автономно до гейтов"
  D8_gates: "G0–G2 блокируют публикацию; G3–G4 после запуска, блокируют только критичное"
  D9_hosting: "Системы — на отдельном домене (не домене платформы); prod только после привязки карты РФ; только аддитивные миграции в prod (кроме правок, подтверждённых владельцем со снимком и откатом, — D56). Домен систем — sandpile.ru, свой домен клиента — D38_sites_domains"
  D10_pricing: "Цена за компанию. Free: 100 кредитов на 30 дней + 25/мес, 1 система в prod. Старт 1990 ₽ (50 кр.), Бизнес 6990 ₽ (230 кр.), докупка 990 ₽ = 60 кр. 1 кредит ≈ 5 ₽ себестоимости LLM. Для клиента заменено D31_pricing_rub (2026-10-04): клиент видит рубли, кредиты — внутренняя единица и профили лимитов"
  D11_team: "Роли организации: owner, editor, viewer. Публикует только owner. Одна сборка на систему одновременно"
  D12_mobile: "Все созданные системы — адаптивные PWA; офлайн-сканер QR"
  D13_style: "Панель «Стиль» (токены, без кредитов) + «укажи и измени» (M3) + чат; расширено D39_design (темы, дизайн-агент)"
  D14_code_visibility: "Код скрыт; вкладка «Код» только чтение; пользователь видит понятный diff. Вкладка «Код» — под раскрытием «Подробнее для специалиста» (D28)"
  D15_abuse: "Антифрод в G2, «Пожаловаться», снятие публикации ≤24 ч"
  D16_infra: "Cloud.ru Evolution (РФ) — прод; Yandex — резерв моделей и поиск; Z.ai — T1"
  # --- решения основателя 2026-09-30 (F1–F8); F5–F8 приняты по рекомендации аудита, основатель может пересмотреть ---
  D17_agent_merge: "F1. PR агентов мержатся auto-merge при зелёном CI. Исключение — PR с меткой founder-review: он требует эскалации по escalation.yaml (см. merge_policy)"
  D2_w0_fallback: >
    F2. Если на eval недели 0 GLM-5.3 (T1) не лучше лучшей T0-модели на ≥10 п. п. (валидность AppSpec с первой попытки и скор),
    сборка по умолчанию идёт на моделях в РФ (T0); scrub и роутер из M0 остаются, T1 включается тем же параметром позже.
    Применяется без эскалации (задача M0-30), итог — в CHANGELOG. С 2026-10-04 заменено D26_models_default: по умолчанию T1,
    автоматического переключения нет; смена модели по умолчанию — E-DECISION
  D18_western_models: >
    F3. Запрещены API и сервисы Anthropic, OpenAI, Google, xAI. Открытые веса этих вендоров, развёрнутые в РФ
    (например, openai/gpt-oss-120b в Cloud.ru FM), допустимы. Линтер реестра моделей проверяет провайдера, а не префикс имени модели
  D19_end_user_phone_login: "F4. Вход конечных пользователей по телефону (SMS OTP) — только на тарифах Старт и Бизнес. Free — почта и Telegram. Тариф проверяется при публикации (billing/runtime), не схемой AppSpec"
  D10_interpretations: >
    F5 (по рекомендации). «N систем» — одновременно в prod; «до N пользователей» — участники организации, конечные пользователи
    не лимитируются. Free: 3 участника, 3 черновика; 25 кредитов с 31-го дня, не копятся. Кредиты тарифа сгорают в конце периода,
    докупка живёт 365 дней. Полный возврат кредитов при сбое платформы или если ни одна ревизия не прошла G0.
    После даунгрейда лишние prod-системы снимаются с публикации через 14 дней, данные сохраняются.
    Черновик Free без активности 60 дней: удаляется только draft-схема с тестовыми данными; спека, код и ревизии сохраняются.
    С 2026-10-04 кредиты клиенту не показываются (D31_pricing_rub); правила выше действуют как внутренние
  D20_eval_budget: "F6, пересмотрено основателем 01.10.2026 (D23_pilot): все токены моделей (live-eval + сборки клиентов) ≤ 10 000 ₽/мес; live-eval ≤ 4 000 ₽/мес — 5 брифов раз в неделю на модели по умолчанию + полный прогон только по метке eval:full при смене промпта или модели и перед вехой. Live-прогон порога готовности D42 — до 6 000 ₽ в рамках месячного лимита платформы (D59, 05.10.2026; заменяет предложение отдельной статьи)"
  D21_beta_moderation: "F7 (по рекомендации). В бете модерацию (ревью публикаций, снятие ≤ 24 ч) ведёт основатель как staff-учётка с обязательной MFA; алерты в Telegram и на почту"
  D22_domains: "F8 (по рекомендации). Нейтральный домен систем покупается сейчас (неделя 0, действие основателя E-ACCESS); домен платформы — к неделе 12 вместе с финальным именем. Закрыто D27_brand (2026-10-04): borntobuild.ru и sandpile.ru"
  D23_pilot: >
    Решение основателя 01.10.2026 (грилл). Перед бетой — пилот на паре живых клиентов с полной функциональностью
    (сборка, гейты G0–G2, превью, публикация, песочница, файлы, коннекторы, 152-ФЗ — с реальными ПДн).
    Инфраструктура ≤ 10 000 ₽/мес: один сервер Timeweb Cloud (Москва) с k3s, свой PostgreSQL 16 с непрерывным архивом WAL-G в S3
    (потеря ≤ 1 мин, простой ≤ 2 ч, еженедельная автопроверка восстановления), staging по требованию (deploy.yaml#pilot).
    Самостоятельный рост по метрикам без согласования — до 20 000 ₽/мес; managed K8s и managed PG — не раньше открытой регистрации (M4)
    или первого клиента с SLA. Аттестованный сегмент 152-ФЗ не нужен. Cloud.ru — только API моделей (T0).
  D24_pilot_free: >
    Решение основателя 01.10.2026. Пилот бесплатный: регистрация только по приглашению основателя, тариф pilot (billing.yaml#plans.pilot),
    кредиты начисляет основатель, оплата и привязка карты выключены флагом WIZARD_PAYMENTS=off (код M2-07/M2-11 остаётся и включается после пилота).
    Идентификация владельца на пилоте — приглашение основателя вместо привязки карты. Юрист (базовая проверка шаблонов) и уведомление РКН — до первого
    реального пользователя (M2-13). Ничего из M2 не откладывается. С 2026-10-04 (D31_pricing_rub): кредиты клиенту не показываются,
    внутренний лимит организации начисляется автоматически, основатель поднимает его в /admin
  D25_pilot_no_legal: >
    Решение основателя 01.10.2026 (грилл), осознанный риск. Пилот идёт без юридической обвязки: без юриста, уведомления РКН,
    поручений и формализации передачи ПДн (в т. ч. китайским провайдерам моделей). Цель пилота — найти лучшую архитектуру и конфигурацию
    за минимальные усилия; юр. обвязка (M2-13) — после валидации, до открытой беты. beta_readiness на пилоте включает основатель
    с заметкой «D25 пилот без юр. обвязки»; тексты документов остаются DRAFT. Технические меры не ослабляются: scrub packages/pii
    перед зарубежными моделями (T1), изоляция, MFA staff, секреты только secret://. Почта платформы — Unisender Go (SMTP);
    GitHub без Pro — мерж PR по зелёному CI делает агент. Модели: кроме Cloud.ru FM оцениваются китайские фронтир-модели
    (DeepSeek, Qwen, Kimi, GLM, MiniMax) — docs/founder/models-research.md
  # --- решения основателя 2026-10-04 (интервью после локального стенда на фикстурах: нужен живой полнофункциональный пилот) ---
  D26_models_default: >
    Решение основателя 2026-10-04. По умолчанию сборка всегда идёт на лучших моделях: T1 — GLM-5.3 (Z.ai), при сбое — фолбэк
    на T0 (Cloud.ru FM) по models.yaml#fallback_rules. Только T0 — лишь если регион организации известен и входит в список
    ограничений (security/data-boundary.yaml#region_restriction: реквизиты, выбор при регистрации, геолокация входа) или клиент сам
    включил «Только РФ» в кабинете. Неизвестный регион (NULL) T1 не ограничивает. ПДн по-прежнему удаляются до отправки (D3, scrub).
    Заменяет автоматическое переключение D2_w0_fallback. Месячный лимит платформы на модели — 6 000 ₽ (WIZARD_LLM_MONTHLY_CAP_RUB),
    алерты основателю на 80 % и 100 %. Ключи: локально — .data/local/inputs.env, на сервере — GitHub Secrets; tools/deploy/pilot-secrets.mjs
    передаёт также YANDEX_*, *_BASE_URL и WIZARD_BUILD_DEFAULT_TIER. Локальный стенд пилота работает в live-режиме; фикстуры — только для CI
  D27_brand: >
    Решение основателя 2026-10-04. Название продукта — Born to Build; домен платформы — borntobuild.ru, системы клиентов — <имя>.sandpile.ru.
    «Wizard» остаётся только внутренним кодовым именем (репозиторий, пакеты @wizard/*, переменные WIZARD_*) и наружу не показывается.
    Закрывает E-NAME и D22_domains
  D28_humanizer: >
    Решение основателя 2026-10-04. Все тексты наружу — интерфейс платформы, письма и тексты, которые агенты пишут внутри систем
    клиентов, — проходят правила humanizer (quality/humanizer.yaml, задача M2-29): без раздутой и рекламной лексики, «правила трёх»,
    злоупотребления длинным тире, воды, расплывчатых ссылок на авторитеты и других признаков ИИ-текста. Технический жаргон из кабинета
    клиента убирается (G0/G1/G2, prod, PITR, миграции, file:line, spec.json, кредиты, T0/T1 и т. п.); технические детали — только
    под раскрытием «Подробнее для специалиста» или в /admin. Расширено D48_plain_language (общий модуль правил для всех агентов)
    и D49_no_fabrication
  D29_audience: >
    Решение основателя 2026-10-04. Аудитория: (1) нетехнические люди, которым срочно и профессионально нужна система под задачу;
    (2) те, кто собирает MVP проекта или бизнеса (сайт → кабинет → приложение). Конкурентная рамка: Яндекс VibeCraft
    (корпоративное доверие, но «прототип» и технический интерфейс) и along.ae (MVP-приложение по подписке за 4 недели от $15 000)
  D30_offer: >
    Решение основателя 2026-10-04. Один продукт, два входа: (а) самостоятельно — ИИ собирает рабочую систему за часы, цена фиксирована,
    перед запуском систему смотрит человек; (б) «под ключ» — MVP под руководством человека за 7–14 дней по фиксированной цене,
    ИИ ускоряет (на пилоте делает основатель). Переход из (а) в (б) — на любом шаге (D32)
  D31_pricing_rub: >
    Решение основателя 2026-10-04, гипотеза для пилота. Клиент видит только рубли: собрать и попробовать черновик — бесплатно
    (лимит черновиков против злоупотреблений; число — D58); запуск — 2 990 ₽ разово + 990 ₽/мес (хостинг, бэкапы,
    10 правок в месяц, SMS в пределах лимита); «под ключ» — от 49 000 ₽ за 14 дней. На пилоте цены показываются с пометкой
    «на пилоте бесплатно», оплата выключена (D24). Кредиты остаются внутренней единицей учёта и защитой от перерасхода; клиент их не видит.
    Стоимость моделей неудачных сборок несёт платформа. Детали — platform/billing.yaml#rub_model. Заменяет D10_pricing для клиента;
    тарифы Free/Старт/Бизнес — внутренние профили лимитов до решения после пилота
  D32_human_layer: >
    Решение основателя 2026-10-04. (а) «Написать команде» на любом экране кабинета: сообщение уходит основателю в Telegram со ссылкой
    на систему клиента, основатель отвечает в /admin, клиент видит ответ в кабинете и в письме. (б) «Передать команде»: на любом шаге
    самостоятельная сборка превращается в заказ «под ключ» — бриф, карточка и черновик попадают в очередь /admin, основатель продолжает
    с того же состояния. (в) Публичная гарантия: если система не запустилась, команда доделывает её вручную или возвращает деньги;
    ответ — до 2 часов в рабочее время (Пн–Пт 10–19 МСК, D60). Публичного лендинга на пилоте нет, вход только по приглашению.
    Это канал «клиент — команда платформы» в кабинете, а не чат-виджет в системах клиентов (non_goals)
  D33_system_classes: >
    Решение основателя 2026-10-04. Пилот собирает без ручной доводки четыре класса систем (веб-приложение + устанавливаемое PWA;
    App Store и Google Play — вне рамок): (а) сайт или лендинг с заявками; (б) запись на услуги с напоминаниями; (в) подписка
    и платный доступ (платный клуб, курс, закрытый раздел); (г) CRM и внутренние инструменты (positioning.system_classes)
  D34_capability_gaps: >
    Решение основателя 2026-10-04. Если запрос клиента выходит за возможности платформы, агент честно говорит об этом, предлагает
    ближайшую альтернативу и записывает пробел (категория, цитата клиента, что предложено взамен, ссылка на систему) с кнопкой
    «Передать команде» в один клик. В /admin раздел «Запросы на развитие» собирает пробелы по частоте, чтобы точечно дорабатывать платформу
  D35_client_payments: >
    Решение основателя 2026-10-04. Деньги идут в магазин клиента. Коннекторы всех крупных платёжных сервисов РФ: ЮKassa, Т-Касса (Т-Банк),
    CloudPayments, Robokassa, Prodamus (СБП — через них), чеки 54-ФЗ там, где их даёт сервис. Подписки: доступ до оплаченной даты,
    письмо-напоминание со ссылкой на оплату (за 3 дня до конца — значение агента, настраивается), автопродление сохранённым способом
    оплаты, если оно включено у магазина (у ЮKassa и Т-Банка включает менеджер сервиса, у Robokassa — по согласованию;
    docs/research/integrations-2026-10.md), отмена в один клик. Правило «оплатил — видит» выражается в правах AppSpec
  D36_messaging: >
    Решение основателя 2026-10-04. По умолчанию — аккаунты платформы: почта платформы, аккаунт SMS-агрегатора (кандидаты SMS Aero
    или SMSC — предложение агента), общий Telegram-бот; работают сразу, в том числе на пилоте; SMS входят в абонентскую плату с лимитом (D58). Клиент может подключить своего отправителя, почтовый домен или бота.
    Посетители без аккаунта получают только транзакционные сообщения (подтверждение, напоминание) и только с их согласия.
    Уведомления владельцу о новых заявках и записях работают всегда
  D37_integrations: >
    Решение основателя 2026-10-04. Исходящие HTTP-запросы — только к хостам, объявленным в AppSpec (allowlist), через egress-прокси
    с журналом; список хостов основатель видит на ревью перед публикацией. Входящие вебхуки — на секретный адрес с проверкой подписи.
    Готовые коннекторы: amoCRM, Битрикс24, Tilda (входящие формы), МойСклад, СДЭК
  D38_sites_domains: >
    Решение основателя 2026-10-04. Адрес по умолчанию — <имя>.sandpile.ru; клиент может подключить свой домен по пошаговой инструкции
    (одна DNS-запись, автоматический сертификат, проверка с подсказками). Разрешены Яндекс Метрика (клиент вводит номер счётчика,
    исключение в CSP), SEO-теги (title, description, Open Graph), изображения прямо на страницах (не только скачивание),
    встраивание видео (Rutube, VK Видео, Kinescope)
  D39_design: >
    Решение основателя 2026-10-04. Расширенная библиотека ui-kit (блоки лендинга, календарь со слотами, тарифы и пейвол, галерея,
    видео, графики) и 6–8 тем (агент выбирает по нише, клиент задаёт логотип и фирменный цвет). Дизайн-агент после интервью
    и одобрения карточки (карточка даёт текст и класс системы; до сборки) показывает 3 разных направления первого экрана
    с настоящим текстом клиента; клиент может дать ссылки и скриншоты-референсы,
    логотип, цвета (агент извлекает принципы и не копирует; нужны модель со зрением и безопасная загрузка чужих страниц). Выбранное
    направление разворачивается в собственную дизайн-систему системы (палитра, пара шрифтов с кириллицей, скругления, плотность,
    варианты блоков, движение); автоматические проверки на телефоне и десктопе (контраст, переполнение, читаемость). Знания агента —
    выжимка локальных дизайн-скиллов (docs/research/design-agent-sources.md)
  D40_images: >
    Решение основателя 2026-10-04. Изображения: загрузка клиента (автосжатие и адаптивные варианты) и бесплатные стоки.
    Генерации изображений ИИ нет. Источники стоков уточнены D61 (05.10.2026): Pexels и Pixabay с хранением у нас; Unsplash убран
  D41_all_before_clients: "Заменено D65_mvp_release_cut (2026-10-05). Решение основателя 2026-10-04. Всё из D26–D64 делается до первых клиентов пилота, без волн по клиентам; веха M2P (milestones.yaml). Включая живой смоук каждого из пяти платёжных сервисов и каждого готового коннектора на тестовом аккаунте (эмуляторы — только для разработки)"
  D42_readiness_bar: >
    Решение основателя 2026-10-04. Порог готовности пилота: новый live-набор из 20 наших брифов (по 5 на класс D33; часть написана
    небрежно, как пишет спешащий нетехнический человек; часть выходит за возможности и проверяет D34). Проходит, если ≥ 16 из 20
    доходят до готовности к публикации (все гейты зелёные) без помощи человека, медиана времени сборки ≤ 40 мин, расход на модели
    ≤ 300 ₽ на систему. «Без помощи человека» и бюджет прогона — D59. Результаты проверяют независимые агенты на моделях другого семейства; затем основатель проходит по одному
    сценарию каждого класса на локальном стенде. Репетиционный e2e (packages/e2e/specs/rehearsal/pilot.spec.ts) не зависит
    от золотого брифа «форум» и порядка вопросов фикстуры
  D43_degolden_prompts: >
    Решение основателя 2026-10-04. Живые промпты не привязаны к демо-сценарию: few-shot QA (packages/agents/scripts/gen-qa-assets.mjs)
    не только про билеты форума, текст о платформе в промпте оркестратора не навязывает скелет «Каталог → Заявка → Процесс → Оплата → Выдача»,
    таксономия развилок покрывает 4 класса D33, а не только events/made_to_order/horizontal. Золотые фикстуры остаются только для офлайн-тестов CI
  # --- дополнительные решения основателя 2026-10-04 (тот же грилл) ---
  D44_restriction_principle: >
    Решение основателя 2026-10-04. Правила моделей, агентов и гейтов ограничивают ТОЛЬКО безопасность и то, что критически требует
    закон РФ (прежде всего ПДн / 152-ФЗ и информационная безопасность). Всё остальное, что сейчас ограничивает продукт без правового
    или защитного основания, снимается или превращается в явный пункт «серой зоны» (gray_zone), который основатель согласует
    по отдельности. Ревизия ограничений: таблица docs/reviews/2026-10-04-restrictions-review.md (M2-91), решения основателя по серым
    зонам 05.10.2026 — D50–D63 и gray_zone (M2-92), применение в гейтах и антифроде — M2-93.
    Защита от SSRF (запрет внутренних и приватных сетей) — информационная безопасность, остаётся
  D45_vision_t1: >
    Решение основателя 2026-10-04. Вызовы со зрением (мультимодальные) разрешены и на T1. Дизайн-агент и критик используют лучшую
    доступную модель со зрением (сначала T1); только T0 — по тому же правилу региона и «Только РФ», что и текст (D26). Граница ПДн
    действует и для изображений: перед отправкой к T1 изображение обрабатывается на нашем сервере по D62 (распознать текст, замазать
    имена, телефоны и почты, размыть лица; сильные идентификаторы — только T0) (D3, D44). Заменяет правило
    «мультимодальные вызовы — только T0» (models.yaml); ИИ-действия на живых записях систем остаются T0 по pii_forbidden_for_T1
  D46_open_fetching: >
    Решение основателя 2026-10-04. Загрузка чужих сайтов и любого открытого интернет-контента (референсы клиента, стоки и т. п.)
    разрешена свободно; фильтрация содержимого опирается на политики провайдеров моделей. На уровне платформы — только критический
    правовой минимум и ИБ: SSRF и внутренние диапазоны закрыты, лимиты размера и времени. Снимки и загруженные страницы хранятся
    не дольше, чем нужно для прогона; в системе остаются только извлечённые принципы
  D47_design_sources_and_fonts: >
    Решение основателя 2026-10-04. Из локальных дизайн-скиллов извлекаем максимум полезного (знания встраиваются в наш продукт).
    Серая зона согласована основателем 04.10.2026 (grill-4 № 21): дословно — только из источников под MIT или Apache-2.0
    с LICENSE и NOTICE (запись в THIRD_PARTY_NOTICES.md); репозитории без подтверждённой лицензии и цитаты Apple — только пересказ
    принципов своими словами; дизайн чужих сайтов разбираем на принципы и не копируем. Шрифты — D64. Источники —
    docs/research/design-agent-sources.md и docs/research/design-agent-catalog.md
  D48_plain_language: >
    Решение основателя 2026-10-04. С нетехническими пользователями — простой язык везде. Правила humanizer (без раздутой и рекламной
    лексики, «правила трёх», злоупотребления длинным тире, воды, расплывчатых ссылок, «ИИ-словаря» и т. п.) действуют для ВСЕХ моделей
    и агентов, которые пишут текст для пользователя или внутри систем клиентов: один общий модуль правил в промптах (@wizard/humanizer)
    и детерминированный линтер там, где проверка выполнима. Расширяет D28. В русском тексте тире — грамматический знак: правило
    ловит злоупотребление, а не тире как таковое
  D49_no_fabrication: >
    Решение основателя 2026-10-04. Никаких выдуманных фактов. Агенты могут предлагать и формулировать допущения, явно помечая их
    как допущения, но не выдают непроверенное за факт; где факты чувствительны или пользователь просит — дают источники (хотя бы
    для справки). Относится к агентам платформы и к текстам внутри систем клиентов: без выдуманных отзывов, «лучший в городе»,
    выдуманных цифр. Правовое основание — 38-ФЗ «О рекламе» (недостоверная реклама). Примеры-заглушки помечаются «пример»
    и не публикуются без замены или подтверждения владельцем
  # --- решения основателя 2026-10-05 (grill-4, пункты 27–44: серые зоны ревизии ограничений и параметры по итогам аудитов M2P) ---
  D50_brief_pii_routing: >
    Решение основателя 2026-10-05 (grill-4 № 27). ПДн в тексте брифа: интервью идёт на лучшую модель после замены ПДн заглушками,
    как карточка и сборка (заменяет шаг pii_detected_interview «любая находка → T0»). Сильные идентификаторы (паспорт, СНИЛС, номер
    карты и прочие strong-виды детектора) по-прежнему обрабатываются только в РФ (T0)
  D51_special_categories: >
    Решение основателя 2026-10-05 (grill-4 № 28). Здоровье и другие специальные категории ПДн на пилоте не обрабатываются: клиники,
    салоны и фитнес записывают на услугу (имя, телефон, услуга, время). Поля диагнозов, жалоб, анамнеза, вероисповедания и национальности
    блокируются (G2-PII-01/03) и уходят в «Запросы на развитие» (D34) с предложением альтернативы. Словарь G2-PII-03 сужается, чтобы «аллергены
    в меню», «пожелания по питанию» и «противопоказания к услуге» без медицинских сведений не считались здоровьем. Полный поток
    с письменным согласием — после пилота вместе с юристом
  D52_strong_identifiers: >
    Решение основателя 2026-10-05 (grill-4 № 29). Паспорт, СНИЛС, ИНН физлица и сканы документов разрешаются уже на пилоте:
    только с шифрованием полей и только организациям, которые подали заявку и прошли проверку командой (флаг организации, staff_audit_log).
    Без флага — G2-AF-03 блокирует, как прежде. Данные этих полей к моделям не уходят вовсе
  D53_telegram_names: >
    Решение основателя 2026-10-05 (grill-4 № 30). В Telegram-уведомлениях персоналу разрешены имя клиента и суть заявки — по флажку
    владельца системы; телефон и почта — нет, остальное по ссылке. Текст согласия посетителя упоминает передачу в Telegram.
    Уведомление РКН о трансграничной передаче — пункт чек-листа основателя и юриста (до приёма реальных посетителей)
  D54_direct_chinese_models: >
    Решение основателя 2026-10-05 (grill-4 № 31). DeepSeek напрямую у разработчика включается после замера на условиях Z.ai (только после
    замены ПДн заглушками, не для pii_forbidden_for_T1). Kimi напрямую у Moonshot не включаем без договора о запрете обучения; Kimi через
    Cloud.ru уже в цепочках T0
  D55_pilot_scope_limits: >
    Решение основателя 2026-10-05 (grill-4 № 32, 33, 35, 36, 37). На пилоте: маркетинговые рассылки из систем — нет (только служебные
    сообщения, спрос собирается в «Запросах на развитие»); запрет реквизитов «для перевода на карту» в текстах систем остаётся (защита домена
    систем от антифишинговых списков; пять платёжных коннекторов с СБП закрывают потребность); ИИ-ассистент на сайтах клиентов — после
    пилота, без переписки посетителей между собой и после консультации юриста по 149-ФЗ; исходный код — команда выдаёт вручную
    по заказу «под ключ», кнопки экспорта нет, выгрузка данных в ZIP доступна всем; язык систем — русский, английский вторым — после пилота
  D56_destructive_changes: >
    Решение основателя 2026-10-05 (grill-4 № 34). Правки работающей системы, удаляющие данные (удалить поле, сменить тип), разрешены
    с подтверждением владельца: он видит последствия словами («поле „Телефон“ исчезнет у 112 записей»), подтверждает, перед изменением
    делается снимок данных, откат — одной кнопкой. Заменяет «в prod только аддитивные миграции» (D9) для правок, подтверждённых владельцем
  D57_yandex_widgets: >
    Решение основателя 2026-10-05 (grill-4 № 38). Яндекс Карты и Яндекс SmartCaptcha — готовые компоненты платформы (адреса в закрытом
    списке CSP, подключает runtime, не код агента). SmartCaptcha защищает публичные формы и уведомления посетителям от спама. Пиксели
    соцсетей и виджеты чатов — по спросу из «Запросов на развитие»
  D58_initial_limits: >
    Решение основателя 2026-10-05 (grill-4 № 39). Предложения агента приняты как начальные значения: 3 бесплатных черновика на организацию
    за 30 дней; на запущенную систему в месяц 10 правок и 100 SMS; внутренний запас 400 кредитов на организацию за 30 дней; потолки
    расхода на модели — сборка ≈ 300 ₽ (60 кр.), правка ≈ 100 ₽ (20 кр.), дизайн-этап ≈ 75 ₽ (15 кр.). Корректируются по данным пилота
    без эскалации, с записью в CHANGELOG (platform/billing.yaml#rub_model)
  D59_eval_budget_and_autonomy: >
    Решение основателя 2026-10-05 (grill-4 № 40). Бюджет замера порога D42 — до 6 000 ₽ в рамках месячного лимита платформы (отдельной
    статьи нет): один полный прогон 20 брифов, повтор только по провалившимся брифам. «Без помощи человека» = все автоматические проверки
    (G0, G1, G2) зелёные без вмешательства; ручное ревью основателя перед публикацией (G2-AF-08/09, G2-EGRESS-01, require_founder_review)
    в замер не входит и не считается помощью
  D60_support_hours: >
    Решение основателя 2026-10-05 (grill-4 № 41). Рабочее время для гарантии «ответ до 2 часов» — Пн–Пт 10:00–19:00 МСК. Вне этого
    времени чат обещает ответ в рабочее время с конкретным сроком
  D61_stock_photos: >
    Решение основателя 2026-10-05 (grill-4 № 42). Стоки фото — Pexels и Pixabay с хранением у нас (скачиваем, перекодируем, отдаём
    со своего адреса, атрибуция в метаданных и на странице). Unsplash убран отовсюду: его правила требуют показывать фото с серверов
    за рубежом (IP посетителей уходят за границу — зона 152-ФЗ) и одобрения приложения. Заменяет часть D40 про стоки
  D62_image_pii_masking: >
    Решение основателя 2026-10-05 (grill-4 № 43). Картинки для моделей со зрением: перед отправкой лучшей модели (T1) текст на изображении
    распознаётся на нашем сервере, имена, телефоны и почты замазываются, лица размываются; изображения с сильными идентификаторами
    (паспорт, СНИЛС, карта) к T1 не уходят. Уточняет D45
  D63_crm_connect_by_instruction: >
    Решение основателя 2026-10-05 (grill-4 № 44). amoCRM и Битрикс24 подключаются только по пошаговой инструкции со скриншотами
    (закрытая интеграция с долгосрочным токеном или входящий вебхук портала) и с помощью команды через «Передать команде». Публичные
    приложения в маркетплейсах amoCRM и Битрикс24 и OAuth-интеграция платформы — после пилота
  D64_fonts: >
    Решение основателя 2026-10-05. Шрифты: любая лицензия, которая разрешает бесплатное коммерческое использование, включая встраивание
    на сайты и самостоятельный хостинг (OFL-1.1, Apache-2.0, свободные лицензии словолитен вроде ParaType Free Font License); лицензия
    и источник записываются по каждому шрифту (каталог шрифтов ui-kit и THIRD_PARTY_NOTICES.md). Коммерческие шрифты с сайтов
    «бесплатного скачивания» не используются (согласовано 04.10.2026). Правило лицензий в AGENTS.md обновлено. У Fontshare нет
    кириллических семейств, Velvetyne — почти только латиница: основной источник — Google Fonts и свободные семейства ParaType
  D65_mvp_release_cut: >
    Решение основателя 2026-10-05 (docs/reviews/grill-5.md № 1, 8). Заменяет D41_all_before_clients: приоритет — ценность и скорость.
    До первых клиентов делается срез выпуска MVP (milestones.yaml#milestones.M2P.release_cut: задачи с release: mvp и урезанным
    mvp_scope); остальное из D26–D64 накатывается волнами после выпуска. Классы к выпуску — сайт с заявками, запись с напоминаниями,
    CRM и внутренние инструменты; подписка и платный доступ (D35) — первая волна после выпуска
  D66_universal_build: >
    Решение основателя 2026-10-05 (grill-5 № 1). Сборка универсальна уже в MVP: классы D33 — рецепты качества (эталоны, сценарии QA,
    подсказки строителю), а не ограничитель и не меню. Любой бриф идёт по общему конвейеру (оркестратор → строитель → QA → G0–G2) с
    архитектурными правилами; запрос сверх возможностей получает честный ответ, ближайшую замену и «Написать команде» (D34), а не отказ
    «класс не поддерживается»
  D67_mvp_readiness: >
    Решение основателя 2026-10-05 (grill-5 № 2). Порог выпуска MVP вместо D42 до полного пилота: 10 брифов на сервере пилота через
    настоящий конвейер (по 2–3 на класс D65 и 2 вне классов), не меньше 7 из 10 доходят до готовности к публикации по автоматическим
    проверкам (G0–G2 без блокеров); бюджет моделей до 2 000 ₽ в месячном лимите платформы; повтор — только провалившихся; затем проход
    основателя. D42 остаётся порогом полного пилота
  D68_support_button: >
    Решение основателя 2026-10-05 (grill-5 № 3). Человеческий слой к выпуску — одна кнопка «Написать команде» на экранах кабинета с
    отметкой «Хочу, чтобы доделала команда»: сообщение со ссылкой на систему и почтой клиента уходит основателю в Telegram через бота
    платформы (чат алертов), копия — в /admin, ответ — письмом. Чат с перепиской, очередь «под ключ» и таймер срока (D32) — после выпуска
  D69_mvp_look_and_messages: >
    Решение основателя 2026-10-05 (grill-5 № 4, 5, 7). К выпуску: блоки лендинга (первый экран, преимущества, шаги, вопросы, форма заявки,
    подвал), картинки на страницах (загрузка владельцем), 4 темы с фирменным цветом и шрифтами с кириллицей (D64); уведомления владельцу
    и сотрудникам с ролью — письмо и Telegram, посетителю без аккаунта с его согласия — служебные письма (подтверждение, напоминание
    за 24 часа, ссылка отмены); исходящий HTTP функций систем и входящие вебхуки. Дизайн-агент, стоки, видео, карты, SMS, готовые
    коннекторы — после выпуска
  D70_pilot_free_limits: >
    Решение основателя 2026-10-05 (grill-5 № 6, О3). Клиент на пилоте видит «На пилоте бесплатно» и остаток лимита словами; кредиты
    скрыты и остаются внутренним лимитом. Лимит на организацию — 5 сборок и 20 правок за скользящие 30 дней (заменяет 3 черновика и
    10 правок D58 на время пилота); при исчерпании — «Написать команде», основатель поднимает лимит из /admin. Рублёвый каталог D31 —
    к включению оплаты
  D71_mvp_restrictions: >
    Решение основателя 2026-10-05 (grill-5, финальный раунд О1–О15). Письмо владельцу и сотрудникам системы о заявке содержит данные
    заявки в теле, в теме ПДн нет (ослабление п. 64 ревизии для получателей-сотрудников); Telegram на выпуске без ПДн («Новая заявка —
    откройте по ссылке»), имя по флажку D53 — после уведомления РКН. Исходящие запросы систем — на любой публичный хост, объявленный в
    спеке, через egress-прокси с журналом и лимитами, список на ревью основателя; внутренние сети запрещены. Вебхуки — секретный адрес,
    подпись или общий секрет, защита от повтора. Остальные ограничения О1–О15 — по рекомендации (docs/reviews/grill-5.md)
  D72_destructive_with_warning: >
    Решение основателя 2026-10-05 (grill-5, О10). D56 входит в срез выпуска: клиент правит работающую систему и в сторону добавления,
    и в сторону удаления (поле, сущность, смена типа). Перед применением — предупреждение словами («Удаление поля „Телефон“ затронет
    112 записей») и подтверждение владельца; данные уходят в архив, а не уничтожаются, поэтому правку можно откатить
  D73_development_requests: >
    Решение основателя 2026-10-05 (grill-5, дополнение к № 1). Раздел фиксации запросов сверх возможностей платформы (D34) называется
    «Запросы на развитие» (прежнее рабочее имя — «Ограничения») и входит в срез выпуска: агент в интервью и сборке честно говорит, чего
    платформа пока не умеет, предлагает ближайшую замену и записывает запрос (категория, цитата после scrub ПДн, предложенная замена,
    система); в /admin — раздел «Запросы на развитие» с группировкой по категории и частоте и переходом к клиенту. «Передать команде»
    из записи — через «Написать команде» (D68) до появления очереди «под ключ»

  D74_build_harness: >
    Решение основателя 2026-10-05 (после замера D67 1 из 10). Инженерно правильный харнесс строительства — ключевая ценность продукта:
    систему строит не один агент. Архитектор пишет техническое задание по карточке и спеке, QA готовит проверки до кода, исполнители
    делают по одной задаче ТЗ в свежем контексте с проверкой своего файла, рецензент другого семейства моделей сверяет страницы с ТЗ,
    метрики собираются по этапам (agents/builder.yaml#harness). Входит в срез выпуска

  D75_templates_first: >
    Решение основателя 2026-10-06 (грилл после замеров 05–06.10: 0 готовых систем, ~2,4 тыс. ₽ на модели, баланс Z.ai исчерпан).
    (1) Шаблоны + ИИ: на каждый класс MVP (сайт с заявками, запись, CRM) — проверенный каркас (спека, функции, страницы,
    уведомления, сценарии проверок); ИИ по карточке выбирает шаблон, переименовывает сущности и поля, правит тексты и тему и
    дописывает только то, чего в шаблоне нет; харнесс v2 (D74) остаётся для дописывания и систем вне шаблонов. (2) Три ступени
    проверки: шаблоны проходят G0 и G1 в CI без моделей → «проба этапа» живыми моделями на 2–3 брифах (≤ 30 ₽ за запуск) →
    полный замер только после зелёных проб. (3) Модели: Z.ai пополняется на 1 500 ₽; reasoning_effort high — только карточка и
    выбор/настройка шаблона, остальное — low (меняет решение 05.10 «high везде»); Cloud.ru — запасной контур. (4) Готовность:
    блокируют G0, проверки прав и ПДн, отрисовка, сценарии шаблона; сценарии QA для дописанного и рецензент — предупреждения
    на ревью первой публикации; исправление — не больше 2 раундов и только по блокерам. (5) Бюджет: сборка в замере ≤ 80 ₽ без
    подъёма лимита; суточный потолок расхода платформы на модели 700 ₽ с алертом; полный замер ≤ 800 ₽. (6) Порядок: шаблон
    «сайт с заявками» → пробы → один прогон на сервере и приглашение основателя в /admin; затем «запись» и «CRM»; затем полный
    замер D67, порог 7 из 10 без изменений

gray_zone:                    # D44: пункты без правового или защитного основания либо с гибкой границей закона; решение основателя по каждому
  process: "Таблица ревизии docs/reviews/2026-10-04-restrictions-review.md (M2-91, раздел 3 — серые зоны) → решения основателя (grill-4 № 21–26 от 04.10.2026 и № 27–44 от 05.10.2026; M2-92) → применение (M2-93 и задачи вехи M2P). Новый пункт: {id, what, basis, decision, date, tasks}"
  items:
    - { id: GZ-01, what: "Коммерческие шрифты с сайтов «бесплатного скачивания»", basis: "авторское право на шрифты (ГК РФ ч. 4)", decision: "не используем", date: 2026-10-04, tasks: [M2-42] }
    - { id: GZ-02, what: "Знания дизайн-скиллов без подтверждённой лицензии и цитаты Apple", basis: "авторское право", decision: "только пересказ принципов; дословно — только MIT и Apache-2.0 с NOTICE", date: 2026-10-04, tasks: [M2-41] }
    - { id: GZ-03, what: "Дизайн чужих сайтов-референсов", basis: "авторское право, недобросовестная конкуренция", decision: "разбираем на принципы, не копируем текст, логотипы и раскладку 1:1", date: 2026-10-04, tasks: [M2-62, M2-94] }
    - { id: GZ-04, what: "ПДн в брифе интервью (таблица № 4)", basis: "152-ФЗ, осторожность сверх требования", decision: "D50: заглушки, затем лучшая модель; сильные идентификаторы — только РФ", date: 2026-10-05, tasks: [M2-28] }
    - { id: GZ-05, what: "DeepSeek и Kimi напрямую (№ 12)", basis: "безопасность данных клиента (хранение в КНР, обучение)", decision: "D54: DeepSeek после замера на условиях Z.ai; Moonshot напрямую — нет", date: 2026-10-05, tasks: [M2-28, M2-89] }
    - { id: GZ-06, what: "Специальные категории ПДн (№ 49, 51)", basis: "152-ФЗ ст. 10", decision: "D51: на пилоте нет; словарь G2-PII-03 сужается; полный поток после пилота с юристом", date: 2026-10-05, tasks: [M2-93, M2-77] }
    - { id: GZ-07, what: "Паспорт, СНИЛС, ИНН физлица, сканы (№ 55)", basis: "152-ФЗ ст. 19 (меры защиты)", decision: "D52: открыть сейчас с шифрованием полей по заявке после проверки командой", date: 2026-10-05, tasks: [M2-31, M2-93] }
    - { id: GZ-08, what: "Имя клиента в Telegram (№ 52)", basis: "152-ФЗ ст. 12 (передача за рубеж)", decision: "D53: по флажку владельца, имя и суть без телефона и почты; уведомление РКН — юрист", date: 2026-10-05, tasks: [M2-50, M2-93, M2-46, M2-17] }
    - { id: GZ-09, what: "Маркетинговые рассылки (№ 62)", basis: "38-ФЗ ст. 18, репутация домена", decision: "D55: после пилота", date: 2026-10-05, tasks: [] }
    - { id: GZ-10, what: "Реквизиты «для перевода» (№ 58)", basis: "54-ФЗ, антифрод", decision: "D55: запрет остаётся", date: 2026-10-05, tasks: [] }
    - { id: GZ-11, what: "Правки prod, удаляющие данные (№ 34)", basis: "защита данных клиента", decision: "D56: с подтверждением, снимком и откатом", date: 2026-10-05, tasks: [M2-72] }
    - { id: GZ-12, what: "ИИ-ассистент на сайтах (№ 107, 69)", basis: "149-ФЗ ст. 10.1", decision: "D55: после пилота", date: 2026-10-05, tasks: [] }
    - { id: GZ-13, what: "Выдача кода клиенту (№ 104)", basis: "бизнес-модель", decision: "D55: вручную по заказу «под ключ»", date: 2026-10-05, tasks: [M2-36] }
    - { id: GZ-14, what: "Язык систем (№ 102, 41)", basis: "объём проверок", decision: "D55: русский на пилоте", date: 2026-10-05, tasks: [] }
    - { id: GZ-15, what: "Внешние виджеты (№ 84, 39)", basis: "ИБ, 152-ФЗ ст. 18 ч. 5", decision: "D57: Яндекс Карты и SmartCaptcha — компоненты платформы; остальное по спросу; Unsplash убран (D61)", date: 2026-10-05, tasks: [M2-45, M2-46] }

open_decisions: []            # 05.10.2026: OPEN-1 закрыт (GZ-01, коммерческие шрифты с агрегаторов не используем), OPEN-2 решён D64 (правило лицензий шрифтов в AGENTS.md)

pilot:                        # D23–D25, D31, D32, D41, D42; веха milestones.yaml M2P
  access: "только по приглашению основателя; публичного лендинга и открытой регистрации нет (D32)"
  order: "срез выпуска MVP до первых клиентов (D65, milestones.yaml#milestones.M2P.release_cut), остальное D26–D64 — волнами после выпуска; первые приглашения — после прохода основателя (D67)"
  prices: "цены platform/billing.yaml#rub_model показываются с пометкой «на пилоте бесплатно»; оплата выключена (WIZARD_PAYMENTS=off, D24)"
  free_drafts: "5 сборок и 20 правок на организацию за скользящие 30 дней на время пилота (D70; D58 — после пилота)"
  messaging: "к выпуску MVP — почта и Telegram-бот платформы (D69); SMS-агрегатор — после выпуска, в пределах 100 в месяц на запущенную систему (D36, D58)"
