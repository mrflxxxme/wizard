# Wizard — продуктовые рамки. Источник: docs/concept.md v3.1, docs/reviews/grill-2.md, grill-3.md;
# решения основателя F1–F8 от 2026-09-30 (docs/reviews/spec-audit/L4-fidelity.md, раздел c)
version: 3.1
codename: Wizard            # финальное имя выбирается к неделе 12 (escalation: E-NAME)
language: ru                # весь UI и тексты для пользователей — на русском

positioning:
  statement: >
    Российская альтернатива Яндекс VibeCraft для нетехнических пользователей: не менее мощная,
    более гибкая и кастомизируемая, без привязки к Яндексу. Пользователь описывает систему в чате,
    агенты собирают данные, права, интерфейс, логику и интеграции, проверяют гейтами и публикуют в РФ.
  horizontal: true
  proving_grounds:            # полигоны обкатки, НЕ позиционирование
    - b2b_events              # форумы, конференции, экскурсии, регистрация, модерация, квоты, QR-вход
    - made_to_order_goods     # конфигураторы, предзаказы, производство к дате, B2B-прайсы
  core_domain_skeleton: "Каталог → Заявка → Процесс → Оплата → Выдача"
  differentiators_mvp:        # MUST быть в закрытой бете (M2)
    - id: reliability
      text: "Гейты перед публикацией, безопасные миграции, откат ревизий, durable-сборки"
    - id: integrations
      text: "ЮKassa, Telegram, email, QR из коробки"
    - id: independence
      text: "Вход по почте и Telegram на Free (по телефону — на платных тарифах, D19), выбор моделей, хостинг вне Yandex Cloud, выгрузка данных"
    - id: price_and_152fz
      text: "Цена сборки с потолком заранее; согласия, политика и автоудаление ПДн в каждой системе"
  differentiators_wave2:      # MUST к публичному запуску (M3)
    - id: point_and_edit
      text: "«Укажи и измени»: клик по элементу превью + инструкция агенту"
    - id: ai_actions
      text: "ИИ-действия «Извлечь/классифицировать» и «Сгенерировать текст» внутри систем (только T0)"

users:
  builder_user: "Нетехнический владелец/сотрудник малого бизнеса, организатор мероприятий, продавец товаров на заказ"
  end_user: "Клиенты и сотрудники бизнеса, работающие в созданной системе"

non_goals:                  # MUST NOT делать до публичного запуска
  - "Drag-and-drop визуальный редактор"
  - "Синхронное редактирование (как Figma)"
  - "Экспорт кода и редактирование кода пользователем (вкладка «Код» — только чтение)"
  - "Свои домены клиентов (только поддомены на отдельном домене систем)"
  - "Нативные мобильные приложения (только PWA)"
  - "Чат-виджет для конечных пользователей (риск ОРИ по 149-ФЗ), чат-боты и RAG в системах"
  - "amoCRM и прочие CRM-коннекторы; партнёрская программа интеграторов"
  - "Госсектор напрямую (реестр ПО, ЕСИА)"
  - "API и сервисы Anthropic, OpenAI, Google, xAI (их условия не допускают РФ). Открытые веса этих вендоров с инференсом в РФ допустимы (D18)"

decisions:                  # зафиксированы; изменение = эскалация E-DECISION
  D1_spec_code_boundary: >
    Спека (AppSpec) владеет данными, правами, миграциями, воркфлоу, интеграциями, разметкой ПДн.
    Код (React UI и функции query/mutation/action) даёт гибкость и пишется агентом на нашем SDK.
  D2_models: >
    T0 — модели, развёрнутые в РФ (Cloud.ru FM внутренний контур; резерв Yandex AI Studio без логирования) —
    для любых данных. T1 — GLM-5.3 (Z.ai) по умолчанию для вызовов сборки ТОЛЬКО после удаления ПДн (если eval недели 0 не опроверг — D2_w0_fallback).
    Переключатель «только российский контур» на уровне организации.
  D3_pii_boundary: >
    Наружу (T1) уходят только одноразовые заглушки без таблицы соответствия. Обратимые токены и шифрование — только в РФ.
  D4_runtime: "Postgres, схема на систему, RLS из матрицы прав, шарды ≤2000 схем на кластер, PITR"
  D5_isolation: "Серверный код систем — workerd внутри gVisor, egress только через прокси с allowlist"
  D6_durable_runs: "DBOS Transact на Postgres платформы"
  D7_autonomy: "Одна точка согласования — карточка системы; дальше автономно до гейтов"
  D8_gates: "G0–G2 блокируют публикацию; G3–G4 после запуска, блокируют только критичное"
  D9_hosting: "Системы — на отдельном домене (не домене платформы); prod только после привязки карты РФ; только аддитивные миграции в prod"
  D10_pricing: "Цена за компанию. Free: 100 кредитов на 30 дней + 25/мес, 1 система в prod. Старт 1990 ₽ (50 кр.), Бизнес 6990 ₽ (230 кр.), докупка 990 ₽ = 60 кр. 1 кредит ≈ 5 ₽ себестоимости LLM"
  D11_team: "Роли организации: owner, editor, viewer. Публикует только owner. Одна сборка на систему одновременно"
  D12_mobile: "Все созданные системы — адаптивные PWA; офлайн-сканер QR"
  D13_style: "Панель «Стиль» (токены, без кредитов) + «укажи и измени» (M3) + чат"
  D14_code_visibility: "Код скрыт; вкладка «Код» только чтение; пользователь видит понятный diff"
  D15_abuse: "Антифрод в G2, «Пожаловаться», снятие публикации ≤24 ч"
  D16_infra: "Cloud.ru Evolution (РФ) — прод; Yandex — резерв моделей и поиск; Z.ai — T1"
  # --- решения основателя 2026-09-30 (F1–F8); F5–F8 приняты по рекомендации аудита, основатель может пересмотреть ---
  D17_agent_merge: "F1. PR агентов мержатся auto-merge при зелёном CI. Исключение — PR с меткой founder-review: он требует эскалации по escalation.yaml (см. merge_policy)"
  D2_w0_fallback: >
    F2. Если на eval недели 0 GLM-5.3 (T1) не лучше лучшей T0-модели на ≥10 п. п. (валидность AppSpec с первой попытки и скор),
    сборка по умолчанию идёт на моделях в РФ (T0); scrub и роутер из M0 остаются, T1 включается тем же параметром позже.
    Применяется без эскалации (задача M0-30), итог — в CHANGELOG
  D18_western_models: >
    F3. Запрещены API и сервисы Anthropic, OpenAI, Google, xAI. Открытые веса этих вендоров, развёрнутые в РФ
    (например, openai/gpt-oss-120b в Cloud.ru FM), допустимы. Линтер реестра моделей проверяет провайдера, а не префикс имени модели
  D19_end_user_phone_login: "F4. Вход конечных пользователей по телефону (SMS OTP) — только на тарифах Старт и Бизнес. Free — почта и Telegram. Тариф проверяется при публикации (billing/runtime), не схемой AppSpec"
  D10_interpretations: >
    F5 (по рекомендации). «N систем» — одновременно в prod; «до N пользователей» — участники организации, конечные пользователи
    не лимитируются. Free: 3 участника, 3 черновика; 25 кредитов с 31-го дня, не копятся. Кредиты тарифа сгорают в конце периода,
    докупка живёт 365 дней. Полный возврат кредитов при сбое платформы или если ни одна ревизия не прошла G0.
    После даунгрейда лишние prod-системы снимаются с публикации через 14 дней, данные сохраняются.
    Черновик Free без активности 60 дней: удаляется только draft-схема с тестовыми данными; спека, код и ревизии сохраняются
  D20_eval_budget: "F6, пересмотрено основателем 01.10.2026 (D23_pilot): все токены моделей (live-eval + сборки клиентов) ≤ 10 000 ₽/мес; live-eval ≤ 4 000 ₽/мес — 5 брифов раз в неделю на модели по умолчанию + полный прогон только по метке eval:full при смене промпта или модели и перед вехой"
  D21_beta_moderation: "F7 (по рекомендации). В бете модерацию (ревью публикаций, снятие ≤ 24 ч) ведёт основатель как staff-учётка с обязательной MFA; алерты в Telegram и на почту"
  D22_domains: "F8 (по рекомендации). Нейтральный домен систем покупается сейчас (неделя 0, действие основателя E-ACCESS); домен платформы — к неделе 12 вместе с финальным именем"
  D23_pilot: >
    Решение основателя 01.10.2026 (грилл). Перед бетой — пилот на паре живых клиентов с полной функциональностью
    (сборка, гейты G0–G2, превью, публикация, песочница, файлы, коннекторы, 152-ФЗ — с реальными ПДн).
    Инфраструктура ≤ 10 000 ₽/мес: один сервер Timeweb Cloud (Москва) с k3s, свой PostgreSQL 16 с непрерывным архивом WAL-G в S3
    (потеря ≤ 1 мин, простой ≤ 2 ч, еженедельная автопроверка восстановления), staging по требованию (deploy.yaml#pilot).
    Самостоятельный рост по метрикам без согласования — до 20 000 ₽/мес; managed K8s и managed PG — не раньше открытой регистрации (M4)
    или первого клиента с SLA. Аттестованный сегмент 152-ФЗ не нужен. Cloud.ru — только API моделей (T0).
  D24_pilot_free: >
    Решение основателя 01.10.2026. Пилот бесплатный: регистрация только по приглашению основателя, тариф pilot (billing.yaml#plans.pilot),
    кредиты начисляет основатель, оплата и привязка карты выключены флагом WIZARD_PAYMENTS=off (код M2-07/M2-11 остаётся и включается после пилота).
    Идентификация владельца на пилоте — приглашение основателя вместо привязки карты. Юрист (базовая проверка шаблонов) и уведомление РКН — до первого
    реального пользователя (M2-13). Ничего из M2 не откладывается.

timeline_weeks:
  week0: "ключи Cloud.ru FM и Z.ai, eval T0/T1 (D2_w0_fallback), домен систем (D22_domains), юрист и реквизиты — escalation.yaml#calendar"
  prototype_M0: "как можно быстрее; локальный вертикальный срез (≈12 агенто-дней по критическому пути, milestones.yaml M0.plan)"
  alpha_M1: 9
  final_name_and_platform_domain: 12
  closed_beta_M2: 16
  wave2_M3: "17-19"
  public_launch_M4: 20

founder_involvement: >
  Минимальное. Основатель получает только вопросы из escalation.yaml (доступы, ключи, деньги,
  необратимые действия, изменение зафиксированных решений, юридические позиции).
