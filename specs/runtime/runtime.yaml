# apps/runtime — хостинг созданных систем. Нормативно (backlog M0-09, M1-05, M2-03).
# Связано: sdk.md (контракт кода), ../appspec/ops.yaml (DDL/RLS), ../connectors/, ../security/ (изоляция, ПДн).
version: 1
port: 4100                                   # локально; один процесс обслуживает все системы

routing:
  host_pattern: "<system>--<env>.<systemsDomain>"       # env ∈ {draft, prod}
  prod_alias: "<system>.<systemsDomain>"                 # канонический prod-адрес (D9); <system>--prod.* → 301 на него
  local: "http://<system>--<env>.localhost:4100"         # *.localhost резолвится в 127.0.0.1 без настройки DNS
  system_slug: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$, без '--'; уникален глобально, выдаёт platform-api"
  rules:
    - "MUST: неизвестный host или не опубликованный env → 404 со страницей «Система не найдена»"
    - "MUST: запросы без Host или с доменом платформы → 421"
    - "Пути: /api/* (API системы), /_wizard/* (служебное), /assets/*, /sw.js, /manifest.webmanifest, остальное (включая /login) → index.html (SPA)"
  test: "Две системы в одном процессе на разных хостах не видят данных друг друга (e2e на *.localhost)"

system_loading:
  registry: "platform.deployments {systemId, slug, env, revision, specHash, bundleKey, publishedAt} — читается runtime'ом (read-only роль)"
  artifact_layout: ".data/artifacts/<systemId>/<revision>/{spec.json, manifest.json, client/index.html, client/assets/*, server/functions.mjs}"
  rules:
    - "MUST: при запросе runtime держит в памяти LoadedSystem {spec, compiled permissions, functions bundle, connectors} с LRU на 200 систем"
    - "MUST: смена ревизии — через POST /_wizard/internal/reload {systemId, env} с заголовком X-Wizard-Internal-Token (секрет из .env/KMS) или опрос registry раз в 10 с; переключение атомарно, запросы в полёте дорабатывают на старой ревизии"
    - "MUST: bundleKey и specHash сверяются с manifest.json; расхождение → 503 и лог system_load_failed"
  test: "Публикация ревизии N+1 во время 50 rps не даёт ни одного 5xx (нагрузочный тест M1)"

postgres:
  schema: "app_<systemId>_<env>, systemId — 12 символов [a-z0-9]; все имена в SQL полностью квалифицированы (AGENTS.md)"
  roles:
    owner: "wizard_owner — владелец таблиц, выполняет только миграции (toDDL/toRLS)"
    runtime: "wizard_runtime — без BYPASSRLS и без владения таблицами, поэтому RLS действует всегда"
  system_tables:                             # создаются в схеме системы при create_schema; префикс _w_ зарезервирован
    users: "системная сущность (ops.yaml#semantic_rules): id uuid pk, role text, display_name text, phone text, email text, telegram_id bigint, telegram_chat_id bigint, email_bounced_at, invited_by uuid, created_at, blocked_at — pii-поля шифруются на уровне колонки в M2"
    _w_sessions: "token_hash bytea pk (sha256), user_id, created_at, last_seen_at, expires_at"
    _w_otp: "id, channel, destination_hash, code_hash, attempts, expires_at"
    _w_jobs: "outbox/планировщик: id, kind(function|workflow_step|retention), payload jsonb, run_at, attempts, locked_until, idempotency_key unique"
    _w_connector_calls: "idempotency_key pk, integration, action, status, result jsonb (без ПДн), created_at"
    _w_qr_events: "client_event_id pk, device_id, integration, result, clock_skew bool, received_at (qr.yaml#offline)"
    _w_qr_devices: "device_id pk, user_id, last_sync_at, pending int"
    _w_telegram_links: "token_hash pk, user_id, expires_at (telegram.yaml#chat_linking)"
    _w_consents: "схема и срок хранения — ../security/compliance.yaml#consent; источник — поле _consent тела create или POST /api/fn (sdk.md §3); retention сущностей его не удаляет"
    _w_audit: "id, at, actor_user_id, role, entity, record_id, op, fields text[] (имена, не значения)"
  context: "Каждая транзакция: set_config('wizard.user_id', $1, true), set_config('wizard.role', $2, true), set_config('wizard.user_attrs', $3::text, true) (JSON полей users без контактов); ctx.systemDb и воркфлоу — role='__system'"
  rls_policy_shape: "USING (current_setting('wizard.role', true) = '__system' OR (current_setting('wizard.role', true) = '<role>' AND <rowFilter как колонка = (select current_setting(...))>)) для каждой (role, op) из permissions"
  statement_timeout: "1s для data API и query/mutation; lock_timeout 500ms"

data_api:                                    # CRUD по AppSpec; все ответы — JSON, тексты ошибок на русском
  endpoints:
    - "GET    /api/data/:entity          → 200 {items: Doc[], page, limit, total, hasMore}"
    - "POST   /api/data/:entity          → 201 {item: Doc}"
    - "GET    /api/data/:entity/:id      → 200 {item: Doc} | 404"
    - "PATCH  /api/data/:entity/:id      → 200 {item: Doc}"
    - "DELETE /api/data/:entity/:id      → 204"
  query_params:
    filter: "filter[<field>]=<v> (eq) | filter[<field>][<op>]=<v>, op ∈ eq, ne, lt, lte, gt, gte, in (через запятую), contains (string/text, ILIKE с экранированием); только видимые поля роли"
    sort: "sort=-created_at,name — до 3 полей, только видимые; по умолчанию -created_at"
    page: "page ≥ 1, по умолчанию 1"
    limit: "1..100, по умолчанию 20; больше 100 → 422"
  doc_shape: "{id, created_at, updated_at, created_by, ...видимые поля}; скрытые поля отсутствуют (ключа нет, не null); money — number, date — 'YYYY-MM-DD', datetime — ISO UTC"
  total: "точный COUNT до 10 000; выше — total = 10000 и totalCapped: true"
  writes:
    - "MUST: тело ≤ 1 МиБ; неизвестные поля → 422 UNKNOWN_FIELD; системные поля → 422 FIELD_READONLY"
    - "MUST: required, min/max, maxLength, enum, email/phone/url формат, ref существует и видим роли — иначе 422 VALIDATION_FAILED с fields[]"
    - "MUST: unique-нарушение → 409 CONFLICT с полем"
    - "MUST: qr_token-поля генерирует runtime (128 бит, base32) при insert, если не заданы"
    - "MUST: каждая запись пишет строку в _w_audit (без значений) и событие инвалидации после коммита"
  error_shape: "{error: {code, message, details?: {fields?: [{field, code, message}], allowed?: []}, requestId}}"
  error_codes:
    UNAUTHENTICATED: { http: 401, message: "Войдите в систему" }
    FORBIDDEN: { http: 403, message: "Недостаточно прав для этого действия" }
    NOT_FOUND: { http: 404, message: "Запись не найдена" }
    VALIDATION_FAILED: { http: 422, message: "Проверьте заполнение полей" }
    UNKNOWN_FIELD: { http: 422, message: "Такого поля нет" }
    FIELD_HIDDEN: { http: 422, message: "Поле недоступно" }
    FIELD_READONLY: { http: 422, message: "Поле нельзя изменить" }
    CONFLICT: { http: 409, message: "Такое значение уже есть" }
    CONSENT_REQUIRED: { http: 422, message: "Нужно согласие на обработку персональных данных" }
    RATE_LIMITED: { http: 429, message: "Слишком много запросов, попробуйте позже" }
    PAYLOAD_TOO_LARGE: { http: 413, message: "Слишком большой запрос" }
    TIMEOUT: { http: 504, message: "Операция выполнялась слишком долго" }
    LIMIT_EXCEEDED: { http: 422, message: "Превышен лимит операции" }
    INTERNAL: { http: 500, message: "Внутренняя ошибка, мы уже разбираемся" }
  test: "Контрактные тесты на каждый эндпоинт и каждый код ошибки; снапшоты тел ответов"

permissions:                                 # первый рубеж — построитель запросов; второй — RLS (оба проверяет G2)
  algorithm:
    - "1. Пользователь: сессия → users; без сессии → публичная роль (если есть), иначе 401. Заблокированный → 401"
    - "2. Разрешение (role, entity): нет записи или op ∉ ops → 403 FORBIDDEN (list тоже 403, не пустой список)"
    - "3. rowFilter: подставить $user.id и $user.<attr> (поле системной сущности users, ops.yaml#semantic_rules); NULL-значение или $user.* у публичной роли → условие FALSE. read/update/delete: AND к WHERE; строка вне фильтра → 404, не 403 (не раскрывать существование)"
    - "4. create: поля из rowFilter принудительно равны значению фильтра; другое значение от клиента → 403"
    - "5. hiddenFields: удаляются из ответа; filter/sort по ним → 422 FIELD_HIDDEN; запись в них → 422 FIELD_HIDDEN"
    - "6. readonlyFields: присутствие в теле create/update → 422 FIELD_READONLY (при create берётся default)"
    - "7. Выполнение в транзакции с контекстом postgres.context; RLS отсекает то же самое повторно"
    - "8. Роль с isAdmin не обходит матрицу: права админа — это его permissions"
  test: "Матрица role×entity×op из permissions форума: ожидаемые 200/403/404 (M0-09); RLS-тест прямым SELECT под wizard_runtime с контекстом роли без read → 0 строк"

functions:
  endpoint: "POST /api/fn/:name {args, _consent?} → 200 {result, deps: string[]} | ошибка; только function.public = true"
  roles: "MUST: роль вызывающего ∈ function.roles; roles не задан → только роли с isAdmin; публичная роль — только если указана явно"
  args: "Валидация v-валидаторами до запуска → 422 VALIDATION_FAILED"
  app_errors: "ctx.error(code, {message}) → 400 {error: {code, message, details}}; message по умолчанию «Операция отклонена»"
  limits: "sdk.md#2.1; превышение → 504 TIMEOUT или 422 LIMIT_EXCEEDED"
  isolation:
    M0_M1: "node:vm в worker_threads, только при WIZARD_UNSAFE_LOCAL_EXEC=1 (иначе 503 FUNCTIONS_DISABLED); глобалы fetch/process/require удалены; потолок 5 с; worker убивается по таймауту"
    M2: "workerd в gVisor (D5): ctx.db/ctx.connectors — RPC-биндинги к runtime; сети нет, ctx.http — через egress-прокси с allowlist function.egress"
  test: "Функции из specs/runtime/examples вызываются через /api/fn; fetch из функции недоступен; бесконечный цикл прерывается ≤ 5 с (M0-09)"

payments_endpoint: "POST /api/pay/:integration {binding, id} → 200 {confirmationUrl}; см. ../connectors/yookassa.yaml#runtime_endpoint"

auth:
  session_cookie: "wz_sess (локально, http) / __Host-wz_sess (https): 32 байта случайные, в БД только sha256; HttpOnly; SameSite=Lax; Secure на https; Path=/; без Domain (cookie своя у каждого хоста системы); срок 30 дней скользящий"
  csrf: "MUST: POST/PATCH/DELETE в /api/* требуют заголовок X-Wizard-Request: 1 и Origin = хост системы, иначе 403"
  dev_login_M0: "GET /_wizard/dev-login?role=<role>&next=<path> — только env=draft и WIZARD_DEV_LOGIN=1; создаёт (или берёт) пользователя dev-<role>, ставит cookie, 302 на next или /; в prod → 404. GET /_wizard/dev-logout"
  login_page: "Клиентский маршрут /login?role=&next= (AppShell.Login, ../ui/ui-kit.yaml) — зарезервирован, pages[].route MUST NOT быть /login; методы — loginMethods роли или объединение методов login-ролей"
  methods_M1:
    phone_otp: "POST /api/auth/otp/start {channel: 'phone', destination} → {challengeId}; 6 цифр, TTL 5 мин, 5 попыток, повтор через 60 с; отправка через SMS-провайдера РФ (выбор — E-ACCESS), локально dev-sender в .data/outbox"
    email_otp: "Тот же поток с channel 'email', отправка коннектором email платформы"
    verify: "POST /api/auth/otp/verify {challengeId, code} → Set-Cookie, {user}"
    telegram: "GET /api/auth/telegram/start → OIDC Authorization Code + PKCE (S256) на https://oauth.telegram.org/auth, client_id = id бота системы; /api/auth/telegram/callback меняет code на id_token (https://oauth.telegram.org/token), проверяет подпись по JWKS https://oauth.telegram.org/.well-known/jwks.json, iss, aud, exp; scope 'openid' (+ 'phone' если роли нужен телефон)"
    me_logout: "GET /api/auth/me → {user} | 401; POST /api/auth/logout"
  role_assignment:
    - "MUST: новый пользователь получает роль одним из способов: (а) самостоятельная регистрация (/login?role=R) — только в роль, безопасную для саморегистрации; (б) приглашение от пользователя роли с isAdmin (POST /api/admin/invite {role, phone|email}); (в) владелец системы с платформы получает первую isAdmin-роль при публикации"
    - "MUST: роль безопасна для саморегистрации, если access=login, isAdmin=false и в каждой её permission (1) ops ⊆ {read} или задан rowFilter и (2) read сущности с видимыми полями pii≠none идёт с rowFilter. Форум: participant, speaker, partner; кондитерская: customer. Выводится из спеки до появления явного поля role.selfSignup"
    - "Один пользователь — одна роль в системе (MVP)"
  anti_abuse: "OTP: ≤ 5 кодов в час на адрес, ≤ 20 в час на IP; неверный код не раскрывает, существует ли пользователь"
  test: "e2e: три метода входа с dev-отправителем (M1-05); dev-login недоступен в prod; cookie одной системы не принимается другой"

realtime:
  endpoint: "GET /api/events → text/event-stream"
  event: "event: invalidate; data: {entity, id?, op: 'insert'|'update'|'delete'}"
  rules:
    - "MUST: событие получает только сессия, чья роль имеет read на entity; id передаётся, только если у роли нет rowFilter на entity"
    - "MUST: никаких значений полей в событиях"
    - "Heartbeat-комментарий каждые 25 с; ≤ 3 соединений на сессию; после переподключения клиент перезапрашивает всё"
    - "Шина: M0 — in-process EventEmitter; M2 — межпроцессная pub/sub (выбор агента M2, запись в CHANGELOG)"
  test: "Создание билета одним участником: организатор получает invalidate с id, другой участник — без id, посетитель — ничего"

workflows:                                   # исполнение workflows из AppSpec
  triggers:
    on_create_update_status: "запись в _w_jobs в той же транзакции, что и изменение; on_status срабатывает при переходе field в equals"
    schedule_cron: "cron в часовом поясе Europe/Moscow (до появления app.timezone)"
    schedule_relative: "задание на <record.field + offsetMinutes>; пересчитывается при изменении поля; прошедшее время → не запускать"
    webhook_manual: "POST /api/workflows/:name/run — только isAdmin (manual); webhook — через коннектор"
  step_params:
    - "$record.<field>, $record.id, $now — подстановки; {{field}} и {{ref.field}} — в текстах шаблонов"
    - "if: {<field>: [значения]} — шаг пропускается, если запись не подходит"
    - "notify: {integration, to: '$record.<ref на users>', template | text, attachQr?}"
    - "function: {name, args}; connector: {integration, action, input}; update/create: {entity?, set: {...}}; wait: {minutes}"
  execution: "M0: поллер _w_jobs (FOR UPDATE SKIP LOCKED) в процессе runtime; at-least-once; ключ идемпотентности шага = <jobId>:<stepIndex>; 5 попыток с экспонентой 1 с…16 мин; M1: перенос на DBOS (D6) без смены семантики"
  retention: "Ежесуточно 03:00 МСК: для сущностей с retention строки старше anchorField + deleteAfterDays удаляются или обезличиваются (pii-поля → NULL); счётчик в _w_audit"
  test: "Сценарий AC6 форума: запись с event_starts_at = now-31d после прогона retention имеет pii-поля NULL"

static:
  bundle: "client/index.html (Cache-Control: no-cache), client/assets/* с хешем в имени (max-age=31536000, immutable)"
  pwa:
    manifest: "GET /manifest.webmanifest из app.name, theme.accent, иконки из theme.logoFile или монограммы; lang ru, display standalone, start_url /"
    service_worker: "GET /sw.js: M0 — только кэш оболочки; M2 — precache оболочки и страниц сканера, офлайн-пакет QR в IndexedDB (../connectors/qr.yaml#offline)"
  test: "Lighthouse PWA installable на draft-хосте (M2)"

service_endpoints:
  health: "GET /_wizard/health → 200 {status:'ok', version, db:'ok'|'fail', systemsLoaded} на любом хосте runtime; на хосте системы добавляет {system, env, revision}"
  hooks: "POST /_wizard/hooks/:connector/:integration/:hookToken — вебхуки коннекторов (hookToken — 32 случайных символа на интеграцию)"
  role_spec: "GET /_wizard/spec → RoleSpec текущей роли (../ui/ui-kit.yaml#data_binding.role_spec): без hiddenFields, только свои permissions и pages, theme, compliance; ETag = specHash+role"
  qr: "/_wizard/qr/check, /_wizard/qr/manifest, /_wizard/qr/sync — ../connectors/qr.yaml#endpoints"

rate_limits:                                 # по сессии, для анонимов — по IP; ответ 429 + Retry-After
  data_api: "300 запросов/мин на сессию, 60/мин анонимно"
  functions: "120 вызовов/мин на сессию, 30/мин анонимно"
  events: "3 SSE-соединения на сессию"
  test: "Нагрузка сверх лимита даёт 429 с Retry-After, остальные системы не деградируют"

security_headers:
  csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors <origin платформы> (draft) | 'none' (prod)"
  rules:
    - "MUST: никаких сторонних origin в CSP; шрифты и иконки — из бандла ui-kit. Переходы на ЮKassa и Telegram — навигацией, CSP их не ограничивает"
    - "X-Content-Type-Options: nosniff; Referrer-Policy: strict-origin-when-cross-origin; Permissions-Policy: camera=(self), geolocation=()"
  test: "Бандл с <script src='https://evil.example'> не исполняет его (e2e, ошибка CSP в консоли)"

logging:
  format: "JSON-строки: {ts, level, requestId, system, env, revision, route, entity?, fn?, status, durationMs, role, userIdHash?}"
  rules:
    - "MUST NOT: тела запросов и ответов, значения полей, значения фильтров (только имена), телефоны, email, OTP, токены, cookie, id_token"
    - "userIdHash = первые 12 символов HMAC-SHA256(user_id) с ключом окружения"
  test: "e2e форума с засеянными уникальными ПДн-маркерами: grep по логам runtime не находит ни одного маркера"
