# apps/runtime — хостинг созданных систем. Нормативно (backlog M0-09, M0-23, M0-24, M1-05, M2-03, M2-14).
# Связано: sdk.md (контракт кода), ../appspec/ops.yaml (DDL/RLS), ../connectors/, ../security/ (изоляция, ПДн).
version: 1
port: 4100                                   # локально; один процесс обслуживает все системы

routing:
  host_pattern: "<system>--<env>.<systemsDomain>"       # env ∈ {draft, prod}
  prod_alias: "<system>.<systemsDomain>"                 # канонический prod-адрес (D9); <system>--prod.* → 301 на него
  local: "http://<system>--<env>.localhost:4100"         # *.localhost резолвится в 127.0.0.1 без настройки DNS
  system_slug: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$, без '--'; уникален глобально, выдаёт platform-api; MUST NOT ∈ reserved (www, mail, smtp, mx, mta-sts, autodiscover, autoconfig, api, admin, status, static, cdn, abuse, security, wizard) — L3-29"
  rules:
    - "MUST: неизвестный host или не опубликованный env → 404 со страницей «Система не найдена»"
    - "MUST: registry.suspended = true → 451 со страницей «Система временно недоступна по жалобе» / «Владелец системы уведомлён.» (security/abuse.yaml#messages_ru.http_451; нейтрально, без причины и деталей жалобы; L1-32) на всех путях, кроме /_wizard/health; данные не удаляются. suspended — снятие системы (publications.status = suspended, systems.suspended_at) или всей организации (orgs.suspended_at, platform/db.yaml#views.deployments); restore → снова 200 со следующего чтения реестра"
    - "MUST (M2-08, security/abuse.yaml#report.entry_points): в каждый HTML-документ prod-системы, который отдаёт runtime (index.html бандла, SPA-маршруты, /login), перед </body> вставляется ссылка «Пожаловаться» (data-testid wz-abuse-link, position: fixed справа внизу, только inline-стиль — CSP документа запрещает скрипты) на <WIZARD_PLATFORM_ORIGIN>/abuse?url=<адрес страницы> (адрес — из Host и WIZARD_PUBLIC_SCHEME). Вставка вне корня приложения: код системы её не рендерит и убрать не может, поэтому G0 слот AppShell не проверяет. В draft ссылки нет (превью закрыты); шаблонные страницы runtime (политика compliance.policyPage, /_wizard/privacy) пока без ссылки — остаток M2-08"
    - "MUST: запросы без Host или с доменом платформы → 421. Локально (WIZARD_AUTH_MODE=dev или WIZARD_UNSAFE_LOCAL_EXEC=1): Host вне *.localhost/localhost/127.0.0.1/[::1] → 421, заголовки X-Forwarded-*, Forwarded, CF-* → 403 (platform/deploy.yaml#local.host_guard, L3-10)"
    - "Пути: /api/* (API системы), /_wizard/* (служебное), /assets/*, /sw.js, /manifest.webmanifest; /login и compliance.policyPage рендерит runtime-шаблон (AppShell.Login и страница политики — ui-kit), pages[].route MUST NOT совпадать с ними (G0-SPEC-05, L1-48); остальное → index.html (SPA)"
    - "MUST: /_wizard/internal/* слушается только на внутреннем порту (4101; в облаке — ClusterIP), на публичном порту и ingress → 404 (L3-19)"
  test: "Две системы в одном процессе на разных хостах не видят данных друг друга (e2e на *.localhost)"

system_loading:
  registry: "platform.deployments {systemId, slug, env, revision, specHash, bundleKey, publishedAt, suspended, features: {phoneOtp}} — читается runtime'ом (read-only роль; platform/db.yaml#views.deployments). M0 до появления таблиц — FileRegistry .data/artifacts/registry.json той же формы"
  artifact_layout: ".data/artifacts/<systemId>/<revision>/{spec.json, manifest.json, client/index.html, client/assets/*, server/functions.mjs, wz-map.json (только draft; ui/ui-kit.yaml#wz_id)}; артефакт собирает и пишет packages/build (architecture.yaml#interfaces.build_system: buildSystem + writeArtifact), runtime только раздаёт"
  rules:
    - "MUST: при запросе runtime держит в памяти LoadedSystem {spec, compiled permissions, functions bundle, connectors} с LRU на 200 систем"
    - "MUST: смена ревизии — через POST /_wizard/internal/reload {systemId, env} (внутренний порт) с заголовком X-Wizard-Internal-Token = WIZARD_INTERNAL_TOKEN (сравнение за постоянное время) или опрос registry раз в 10 с; переключение атомарно, запросы в полёте дорабатывают на старой ревизии"
    - "MUST: bundleKey и specHash сверяются с manifest.json; расхождение → 503 и лог system_load_failed"
  test: "Публикация ревизии N+1 во время 50 rps не даёт ни одного 5xx (нагрузочный тест M1)"

postgres:
  schema: "app_<systemId>_<env>, systemId — 12 символов [a-z0-9]; все имена в SQL полностью квалифицированы (AGENTS.md)"
  roles:
    owner: "wizard_owner — владелец таблиц схем app_*, выполняет только миграции (toDDL/toRLS); НЕ владелец схемы platform и не superuser (L3-01, platform/deploy.yaml#local.postgres.roles)"
    runtime: "wizard_runtime — без BYPASSRLS и без владения таблицами, поэтому RLS действует всегда"
  system_tables:                             # создаются в схеме системы при create_schema; префикс _w_ зарезервирован
    users: "системная сущность (ops.yaml#semantic_rules): id uuid pk, role text, display_name text, phone text, email text, telegram_id bigint, telegram_chat_id bigint, email_bounced_at, invited_by uuid, created_at, last_login_at, blocked_at — pii-поля шифруются на уровне колонки в M2. Retention (M2, L3-33): без входа 3 года (coalesce(last_login_at, created_at)) → anonymize (email, phone, telegram_id, telegram_chat_id, display_name → NULL, attrs → {}; без блокировки; ../security/compliance.yaml#system_package.retention.users), счётчик в _w_audit, запись _w_deletion_log mode=retention"
    _w_sessions: "token_hash bytea pk (sha256), user_id, created_at, last_seen_at, expires_at"
    _w_otp: "id, channel, destination_hash, code_hash = HMAC-SHA256(pepper, code) (pepper — из секретов окружения, не в БД; L3-25), attempts, expires_at"
    _w_preview_nonces: "M2: nonce pk, expires_at (TTL 15 мин) — одноразовость токена превью (auth.preview_login_M2, L3-11)"
    _w_jobs: "outbox/планировщик: id, kind(function|workflow_step|retention), payload jsonb, run_at, attempts, locked_until, idempotency_key unique"
    _w_connector_calls: "idempotency_key pk, integration, action, status, result jsonb (без ПДн), created_at"
    _w_qr_events: "client_event_id pk, device_id, integration, result, clock_skew bool, received_at (qr.yaml#offline)"
    _w_qr_devices: "device_id pk, user_id, last_sync_at, pending int"
    _w_telegram_links: "token_hash pk, user_id, expires_at (telegram.yaml#chat_linking)"
    _w_consents: "M2 (журнал): схема и срок хранения — ../security/compliance.yaml#system_package.consent; источник — поле _consent тела create/update, POST /api/fn или входа нового пользователя (entity='users'); время и ip_hmac ставит сервер; retention сущностей его не удаляет"
    _w_audit: "id, at, actor_user_id, role, entity, record_id, op, fields text[] (имена, не значения)"
    _w_messages: "M2-50: журнал доставки шагов notify — id, at, workflow, step, integration, channel (email|telegram), recipient (user|owner|role|visitor), address_hash (sha256 адреса), template, status (sent|test_mode|replayed|no_consent|no_address|not_linked|rate_limited|failed), error_code; без текста и адреса"
    _w_egress_log: "M2-52: исходящие запросы ctx.http.fetch — id, at, fn, host, method, status, outcome (ok|forbidden|rate_limited|limit|too_large|timeout|failed), bytes_out, bytes_in, duration_ms; без пути, query, заголовков и тел"
    _w_webhook_events: "M2-53: входящие вебхуки — id, received_at, integration, event_key (id:<id события> | body:<sha256>), body_hash, status, record_id; unique (integration, event_key) — защита от повтора; без тела и подписи"
    _w_deletion_log: "M2-05: id bigint identity pk, at, entity, mode ∈ delete|anonymize|retention|consent_revoked|subject_request, cutoff, rows_affected, fields text[] — журнал удаления системы, только счётчики; платформа (retention_cron) переносит строки в platform.deletion_log и удаляет их из схемы"
  system_tables_upgrade: "Схемы, созданные более старым runtime: перед DDL плана в migrate_draft и apply_migration (и после DDL при create_schema поверх оставшейся схемы) — CREATE TABLE IF NOT EXISTS по системным таблицам и ADD COLUMN IF NOT EXISTS для nullable колонок или колонок с default (M2-05, upgradeSystemTables)"
  context: "Каждая транзакция: set_config('wizard.user_id', $1, true), set_config('wizard.role', $2, true), set_config('wizard.user_attrs', $3::text, true) (JSON полей users без контактов); ctx.systemDb, воркфлоу и планировщик — set_config('role', 'sys_<key>_<env>_system', true) (M2-01, L3-20); wizard.role='__system' по-прежнему выставляется как логическое имя для аудита и $user.role, но прав не даёт"
  rls_policy_shape: "USING (current_setting('wizard.role', true) = '<role>' AND <rowFilter как колонка = (select current_setting(...))>) для каждой (role, op) из permissions; системный доступ — отдельная политика \"wz__system\" TO sys_<key>_<env>_system USING (true) WITH CHECK (true) (toRLS с DdlOptions.systemRole; без systemRole системной политики нет — fail-closed). Условия на GUC '__system' в политиках нет (M2-01, L3-20; роль: NOLOGIN NOINHERIT NOBYPASSRLS, членство WITH INHERIT FALSE, SET TRUE — только SET ROLE; security/isolation.yaml#db_access)"
  statement_timeout: "1s для data API и query/mutation; lock_timeout 500ms"
  archive: "M2-72 (product.yaml#decisions.D56_destructive_changes, D72): app_<systemId>_prod_archive — данные, удалённые подтверждёнными правками prod (appspec toDDL с DdlOptions.archive). Таблицы <tag>_<entity> (копия строк удалённой сущности) и <tag>_<entity>$<field> (id, value — непустые значения удалённого поля или поля до смены типа), tag = c<12 hex> правки (db.yaml#destructive_changes.archive_tag), отмена правки архивирует добавленное ею под тегом u<…>. Владелец схемы — мигратор (wizard_owner), REVOKE ALL FROM PUBLIC; wizard_runtime и sys_<key>_prod_system прав на схему не получают — data API, функции и воркфлоу систем архива не видят (тест 42501). На время переноса данных мигратор снимает FORCE RLS с таблицы, шаг set_rls в конце плана возвращает его. Удаляется вместе с системой (delete_system). Срок хранения 30 дней и удаление ПДн по запросу субъекта — после выпуска (M2-72 description)"

data_api:                                    # CRUD по AppSpec; все ответы — JSON, тексты ошибок на русском
  endpoints:
    - "GET    /api/data/:entity          → 200 {items: Doc[], page, limit, total, hasMore}"
    - "POST   /api/data/:entity          → 201 {item: Doc}"
    - "GET    /api/data/:entity/:id      → 200 {item: Doc} | 404"
    - "PATCH  /api/data/:entity/:id      → 200 {item: Doc}"
    - "DELETE /api/data/:entity/:id      → 204"
  query_params:
    filter: "filter[<field>]=<v> (eq) | filter[<field>][<op>]=<v>, op ∈ eq, ne, lt, lte, gt, gte, in (через запятую), contains (string/text, ILIKE с экранированием); filter[<field>]=null → IS NULL; только видимые поля роли"
    sort: "sort=-created_at,name — до 3 полей, только видимые; по умолчанию -created_at"
    page: "page ≥ 1, по умолчанию 1"
    limit: "1..100, по умолчанию 20; больше 100 → 422"
  doc_shape: "{id, created_at, updated_at, created_by, ...видимые поля}; скрытые поля отсутствуют (ключа нет, не null); money — number, date — 'YYYY-MM-DD', datetime — ISO UTC"
  total: "точный COUNT до 10 000; выше — total = 10000 и totalCapped: true"
  writes:
    - "MUST: тело ≤ 1 МиБ; неизвестные поля → 422 UNKNOWN_FIELD; системные поля → 422 FIELD_READONLY"
    - "MUST: required, min/max, maxLength, enum, email/phone/url формат, ref существует и видим роли — иначе 422 VALIDATION_FAILED с fields[]"
    - "MUST: unique-нарушение → 409 CONFLICT с полем"
    - "MUST: qr_token-поля генерирует qr-коннектор при insert в формате ../connectors/qr.yaml#token.payload (L1-20); значение qr_token в теле create/update → 422 FIELD_READONLY (L3-30); поле qr_token у сущности без qr-интеграции — ошибка G0 (connector validateSpec)"
    - "MUST (согласие, M0; L1-03): create строки сущности с полем pii≠none, а также update, в теле которого есть хотя бы одно поле pii≠none, ролью без isAdmin требует в теле _consent: {policyVersion, textHash}, совпадающие с RoleSpec.compliance (policyVersion, consentTextHash); иначе 422 CONSENT_REQUIRED. Update без pii-полей в теле (смена статуса, комментарий) согласия не требует: ПДн при этом не собираются. _consent не является полем сущности. Журнал _w_consents — M2"
    - "MUST: каждая запись пишет строку в _w_audit (без значений) и событие инвалидации после коммита"
  error_shape: "{error: {code, message, details?: {fields?: [{field, code, message}], allowed?: []}, requestId}}"
  error_codes:
    UNAUTHENTICATED: { http: 401, message: "Войдите в систему" }
    FORBIDDEN: { http: 403, message: "Недостаточно прав для этого действия" }
    NOT_FOUND: { http: 404, message: "Запись не найдена" }
    VALIDATION_FAILED: { http: 422, message: "Проверьте заполнение полей" }
    UNKNOWN_FIELD: { http: 422, message: "Такого поля нет" }
    FIELD_HIDDEN: { http: 422, message: "Поле недоступно" }
    FIELD_READONLY: { http: 422, message: "Поле нельзя изменить" }
    CONFLICT: { http: 409, message: "Такое значение уже есть" }
    CONSENT_REQUIRED: { http: 422, message: "Нужно согласие на обработку персональных данных" }
    LOGIN_METHOD_UNAVAILABLE: { http: 403, message: "Этот способ входа недоступен" }
    UNSUPPORTED_MEDIA_TYPE: { http: 415, message: "Такой тип файла загрузить нельзя" }
    AI_CREDITS_EXHAUSTED: { http: 402, message: "ИИ-действие временно недоступно" }
    AI_LIMIT_REACHED: { http: 429, message: "Лимит ИИ-действий на этот месяц исчерпан" }   # M3, aiAction.monthlyLimit (agents/models.yaml)
    AI_UNAVAILABLE: { http: 503, message: "ИИ-действие временно недоступно, попробуйте позже" }   # M3-02: модели T0 недоступны, месячный лимит платформы (M2-15) или нет связи со шлюзом
    RATE_LIMITED: { http: 429, message: "Слишком много запросов, попробуйте позже" }
    OTP_BUDGET_EXCEEDED: { http: 429, message: "Не удалось отправить код, попробуйте позже или войдите другим способом" }
    PAYLOAD_TOO_LARGE: { http: 413, message: "Слишком большой запрос" }
    TIMEOUT: { http: 504, message: "Операция выполнялась слишком долго" }
    LIMIT_EXCEEDED: { http: 422, message: "Превышен лимит операции" }
    INTERNAL: { http: 500, message: "Внутренняя ошибка, мы уже разбираемся" }
  test: "Контрактные тесты на каждый эндпоинт и каждый код ошибки; снапшоты тел ответов"

permissions:                                 # первый рубеж — построитель запросов; второй — RLS (оба проверяет G2)
  algorithm:
    - "1. Пользователь: сессия → users; без сессии → публичная роль (если есть), иначе 401. Заблокированный → 401"
    - "2. Разрешение (role, entity): нет записи или op ∉ ops → 403 FORBIDDEN (list тоже 403, не пустой список)"
    - "3. rowFilter: подставить $user.id и $user.<attr> (поле системной сущности users, ops.yaml#semantic_rules); NULL-значение или $user.* у публичной роли → условие FALSE. read/update/delete: AND к WHERE; строка вне фильтра → 404, не 403 (не раскрывать существование)"
    - "4. create: поля из rowFilter принудительно равны значению фильтра; другое значение от клиента → 403"
    - "5. hiddenFields: удаляются из ответа; filter/sort по ним → 422 FIELD_HIDDEN; запись в них → 422 FIELD_HIDDEN"
    - "6. readonlyFields: присутствие в теле create/update → 422 FIELD_READONLY (при create берётся default)"
    - "7. Выполнение в транзакции с контекстом postgres.context; RLS отсекает то же самое повторно"
    - "8. Роль с isAdmin не обходит матрицу: права админа — это его permissions"
  test: "Матрица role×entity×op из permissions форума: ожидаемые 200/403/404 (M0-09); RLS-тест прямым SELECT под wizard_runtime с контекстом роли без read → 0 строк"

functions:
  endpoint: "POST /api/fn/:name {args, _consent?: {policyVersion, textHash}} → 200 {result, deps: string[]} | ошибка; только function.public = true. Для функций с function.collectsPii = true (appspec) вызов ролью без isAdmin без валидного _consent → 422 CONSENT_REQUIRED (L1-03)"
  roles: "MUST: роль вызывающего ∈ function.roles; roles не задан → только роли с isAdmin; публичная роль — только если указана явно"
  args: "Валидация v-валидаторами до запуска → 422 VALIDATION_FAILED"
  app_errors: "ctx.error(code, {message}) → 400 {error: {code, message, details}}; message по умолчанию «Операция отклонена»"
  limits: "sdk.md#2.1; превышение → 504 TIMEOUT или 422 LIMIT_EXCEEDED"
  isolation:
    M0_M1: "node:vm в worker_threads, только при WIZARD_UNSAFE_LOCAL_EXEC=1 (иначе 503 FUNCTIONS_DISABLED); глобалы fetch/process/require удалены; потолок 5 с; worker убивается по таймауту"
    M2: "workerd в gVisor (D5): ctx.db/ctx.connectors — RPC-биндинги к runtime; сети нет, ctx.http — через egress-прокси с allowlist function.egress"
  egress: "M2-52 (D71): ctx.http.fetch(url, {method, headers, body}) — только action; запрос делает runtime по RPC-сообщению гостя (op http), не песочница: https на порт 443, хост ∈ functions[].egress (любой публичный, кроме доменов платформы и внутренних зон — G2-EGRESS-01), методы GET|HEAD|POST|PUT|PATCH|DELETE, без редиректов (3xx возвращается как есть), заголовки Host/Proxy-*/Connection/Transfer-Encoding/Cookie/X-Forwarded-* запрещены. В облаке — через egress-прокси (WIZARD_EGRESS_PROXY_URL; CONNECT с грантом runtime на хосты функции, прокси проверяет его на /_wizard/internal/egress-authorize и адреса после резолва, SNI = хост), локально без прокси — прямое соединение после той же проверки адресов по проверенному IP. Секреты — только 'secret://<имя>' из functions[].secretRefs в значениях заголовков и query, подставляет runtime. Лимиты: 10 запросов на вызов, 60 в минуту на систему, тело запроса ≤ 256 КиБ, ответ ≤ 2 МиБ, 10 с на запрос. Ошибки: EGRESS_FORBIDDEN (адрес запрещён), EGRESS_FAILED (сервис недоступен, таймаут), LIMIT_EXCEEDED, RATE_LIMITED, PAYLOAD_TOO_LARGE; без настроенного транспорта — EGRESS_DISABLED. Журнал _w_egress_log"
  test: "Функции из specs/runtime/examples вызываются через /api/fn; fetch из функции недоступен; бесконечный цикл прерывается ≤ 5 с (M0-09)"

payments_endpoint: "POST /api/pay/:integration {binding, id} → 200 {confirmationUrl}; см. ../connectors/yookassa.yaml#runtime_endpoint"

auth:
  session_cookie: "Имя выбирается по конфигурации WIZARD_PUBLIC_SCHEME, не по запросу (L3-14): http (локально) — wz_sess, https — только __Host-wz_sess; при https cookie wz_sess игнорируется, дубли __Host-wz_sess в запросе → 401. 32 байта случайные, в БД только sha256; HttpOnly; SameSite=Lax; Secure на https; Path=/; без Domain (cookie своя у каждого хоста системы); срок 30 дней скользящий. Draft-хост в iframe превью (L3-15; с M0, т.к. iframe платформы на другом site не получает Lax-cookie): отдельная cookie превью — http (локально) wz_prev, https __Host-wz_prev; Secure; SameSite=None; Partitioned; HttpOnly; Path=/ — только на *--draft (dev-login/вход превью ставит её, runtime принимает её только на draft-хосте); CSRF держится на Origin + X-Wizard-Request; prod-ответ MUST NOT содержать SameSite=None (тест)"
  csrf: "MUST: все не-GET/HEAD запросы (/api/*, /_wizard/qr/*, /api/auth/*), кроме /_wizard/hooks/*, требуют заголовок X-Wizard-Request: 1 и Origin = хост системы, иначе 403 (L1-28, L3-14). CORS-заголовки runtime не отдаёт никогда"
  redirects: "MUST: параметры next/returnTo везде (dev-login, preview-login, /login, OAuth callback) принимают только путь по ^/(?![/\\\\]); иное → игнор и / (L3-11, L3-26)"
  dev_login_M0: "GET /_wizard/dev-login?role=<role>&next=<path> — только env=draft и WIZARD_DEV_LOGIN=1; создаёт (или берёт) пользователя dev-<role>, ставит cookie, 302 на next или /; в prod → 404. GET /_wizard/dev-logout. Старт процесса с WIZARD_DEV_LOGIN=1 MUST падать при NODE_ENV=production, наличии KUBERNETES_SERVICE_HOST или привязке ≠ loopback (L3-11); в облаке dev-login не существует"
  preview_login_M2: "GET /_wizard/preview-login?t=<token>&next=<path> — только draft-хост; token = HMAC(WIZARD_PREVIEW_SECRET) над {systemId, env: draft, role, revision, platformUserId, exp ≤ 15 мин, nonce}; nonce одноразовый (_w_preview_nonces), повтор → 404; ставит __Host-wz_prev (platform/api.yaml#getPreviewUrl)"
  login_page: "Маршрут /login?role=&next= рендерит runtime-шаблон с AppShell.Login (../ui/ui-kit.yaml) — зарезервирован, pages[].route MUST NOT быть /login; методы — loginMethods роли или объединение методов login-ролей, пересечённые с доступными по тарифу (phone_otp — только при registry.features.phoneOtp)"
  consent_at_login: "M2 (L3-33): при первом входе нового пользователя (OTP verify, Telegram callback) тело/состояние входа MUST содержать _consent {policyVersion, textHash} (AppShell.Login показывает ConsentCheckbox и ссылку на политику), иначе 422 CONSENT_REQUIRED; запись _w_consents с entity='users'. Отзыв: страница /_wizard/privacy (для вошедшего) → POST /api/auth/consent/revoke → блокировка и anonymize строк пользователя за ≤ 30 дней, запись в журнал удаления"
  methods_M1:
    phone_otp: "F4 (platform/billing.yaml#plans): prod — только при registry.features.phoneOtp = true (тарифы Старт и Бизнес); иначе метода нет на /login, прямой вызов → 403 LOGIN_METHOD_UNAVAILABLE «Вход по телефону доступен на тарифах Старт и Бизнес». Draft Free-org: метод виден с этой пометкой, SMS не отправляются — код уходит в тестовый ящик превью (как test_mode коннекторов); публикацию блокирует PHONE_LOGIN_PLAN_REQUIRED. POST /api/auth/otp/start {channel: 'phone', destination} → {challengeId}; только номера +7 9xx; 6 цифр, TTL 5 мин, 5 попыток, повтор через 60 с; отправка через SMS-провайдера РФ (выбор — E-ACCESS), локально dev-sender в .data/outbox"
    email_otp: "Тот же поток с channel 'email', отправка коннектором email платформы"
    verify: "POST /api/auth/otp/verify {challengeId, code, _consent?} → Set-Cookie, {user}"
    telegram: "GET /api/auth/telegram/start → OIDC Authorization Code + PKCE (S256) на https://oauth.telegram.org/auth, client_id = id бота системы; state (128 бит, в cookie __Host-wz_oidc, 10 мин) и nonce обязательны; redirect_uri строго https://<host>/api/auth/telegram/callback (L3-26); callback меняет code на id_token (https://oauth.telegram.org/token), проверяет state, nonce, подпись по JWKS https://oauth.telegram.org/.well-known/jwks.json, iss, aud, exp; scope 'openid telegram:bot_access' (связывает чат, connectors/telegram.yaml#chat_linking) + 'phone', если роли нужен телефон (L1-36). Свой бот клиента нужен только для входа через Telegram; уведомления по умолчанию идут через общий бот платформы (connectors/telegram.yaml)"
    me_logout: "GET /api/auth/me → {user} | 401; POST /api/auth/logout"
  role_assignment:
    - "MUST: новый пользователь получает роль одним из способов: (а) самостоятельная регистрация (/login?role=R) — только в роль с role.selfSignup = true (appspec.schema.json; L1-31), иначе 403; (б) приглашение от пользователя роли с isAdmin (POST /api/admin/invite {role, phone|email}; ≤ 20 приглашений в сутки на систему, Free — 5; L3-29); (в) владелец системы с платформы получает первую isAdmin-роль при публикации"
    - "Правило безопасности selfSignup (access=login, isAdmin=false, ops ⊆ {read} или rowFilter, ПДн — только с rowFilter) проверяет G0 (quality/gates.yaml G0-SPEC-05), runtime его не выводит"
    - "Один пользователь — одна роль в системе (MVP)"
  anti_abuse: "M1 (L3-25): OTP ≤ 5 кодов в час на адрес и ≤ 20 в час на IP (IP — platform/deploy.yaml#cloud.client_ip; IPv6 — по /64); глобальные лимиты на destination по всем системам: 5/ч, 10/сут; SMS-бюджет org в сутки — platform/billing.yaml#sms.daily_budget_per_org, превышение → 429 OTP_BUDGET_EXCEEDED и уведомление владельцу; после 3 запросов с IP — капча (своя или российская); алерт при росте SMS > 3× медианы; неверный код не раскрывает, существует ли пользователь"
  test: "e2e: три метода входа с dev-отправителем (M1-05); phone_otp на Free-org → метода нет, прямой вызов 403; dev-login недоступен в prod и не стартует без loopback; cookie одной системы не принимается другой; next=//evil.example → редирект на /"

realtime:
  endpoint: "GET /api/events → text/event-stream"
  event: "event: invalidate; data: {entity, id?, op: 'insert'|'update'|'delete'}"
  rules:
    - "MUST: событие получает только сессия, чья роль имеет read на entity; id передаётся, только если у роли нет rowFilter на entity"
    - "MUST: никаких значений полей в событиях"
    - "Heartbeat-комментарий каждые 25 с; ≤ 3 соединений на сессию; после переподключения клиент перезапрашивает всё"
    - "SDK открывает поток через fetch streaming (EventSource не умеет слать заголовки) с X-Wizard-Request: 1; endpoint принимает и запросы без него (GET), Origin проверяется, если присутствует (CHANGELOG M0-07)"
    - "Шина: M0 — in-process EventEmitter; M2 — межпроцессная pub/sub (выбор агента M2, запись в CHANGELOG)"
  test: "Создание билета одним участником: организатор получает invalidate с id, другой участник — без id, посетитель — ничего"

workflows:                                   # исполнение workflows из AppSpec
  triggers:
    on_create_update_status: "запись в _w_jobs в той же транзакции, что и изменение; on_status срабатывает при переходе field в equals"
    schedule_cron: "cron в app.timezone (по умолчанию Europe/Moscow)"
    schedule_relative: "задание на <record.field + offsetMinutes>; пересчитывается при изменении поля; прошедшее время → не запускать"
    webhook_manual: "POST /api/workflows/:name/run — только isAdmin (manual); webhook — {type: webhook, integration: <интеграция connector=webhook>, entity?} — запускается над записью, которую создал вебхук (../connectors/webhook.yaml, M2-53)"
  step_params:
    - "$record.<field>, $record.id, $now — подстановки; {{field}} и {{ref.field}} — в текстах шаблонов"
    - "if: {<field>: [значения]} — шаг пропускается, если запись не подходит"
    - "notify: {integration, to: '$record.<ref на users>', template | text, attachQr?}"
    - "M2-50 (D69, D71): notify.to — строка или список (1…5) из '$record.<ref на users>', '$owner' (владельцы организации системы: email из platform.system_owner_emails; Telegram — пользователи системы с тем же email и привязанным чатом), '$role:<роль со входом>' (все незаблокированные пользователи роли, ≤ 200) и '$record.<поле type=email>' — посетитель без аккаунта, только email и только с consentField: '<поле bool записи>' = true (отдельная неотмеченная галочка формы); cancel: {set: {<поле>: <значение>}} — что делает {{cancel_link}}. Получатели без согласия, адреса или чата пропускаются с записью в _w_messages; ключ идемпотентности — <jobId>:<step>:<action>:<получатель>"
    - "M2-50: ссылки писем посетителю — GET/POST /_wizard/hooks/message/<cancel|unsubscribe>/<token>: токен — AES-GCM от ключей runtime (WIZARD_SECRETS_KEY) {действие, сущность, id, воркфлоу, шаг, exp 30 дней}, привязан к системе и env; GET показывает подтверждение и ничего не меняет (почтовые сканеры открывают ссылки), POST применяет один раз (метка link:<sha256 токена> в _w_connector_calls в той же транзакции): cancel пишет cancel.set шага, unsubscribe ставит consentField = false; повтор, чужой или просроченный токен → 404 «Ссылка недействительна»"
    - "function: {name, args}; connector: {integration, action, input}; update/create: {entity?, set: {...}}; wait: {minutes}"
  execution: "M0: ctx.scheduler и триггеры только пишут в _w_jobs (outbox), поллер не запускается (G1 проверяет факт постановки задания; решение агента, L2-07). M1: поллер _w_jobs (FOR UPDATE SKIP LOCKED) в процессе runtime; at-least-once; ключ идемпотентности шага = <jobId>:<stepIndex>; 5 попыток с экспонентой 1 с…16 мин; затем перенос на DBOS (D6) без смены семантики. M2-50 (реализовано): поллер — jobsTick процесса runtime раз в WIZARD_JOBS_TICK_MS (по умолчанию 20 с; 0 — выключен) по всем опубликованным prod-системам реестра (не suspended): один проход runJobs на систему (триггеры _w_audit, schedule, due-задания, ≤ 5 раундов); первый проход системы без курсора не поднимает записи старше 15 мин (без «эха» истории); относительное расписание смотрит назад не дальше прошлого прохода − 1 ч, задание помнит dueAt и пропускается, если поле даты сдвинули или очистили"
  retention: "M1+: ежесуточно 03:00 МСК: для сущностей с retention строки старше anchorField + deleteAfterDays удаляются или обезличиваются (pii-поля → NULL, файлы полей file удаляются); счётчик в _w_audit. Запуск — тик процесса runtime (по умолчанию раз в 10 мин проверяет слот 03:00 МСК); отметка прохода — строка _w_jobs с idempotency_key `__wizard_retention`, запрос платформы на внеочередной проход — `__wizard_retention_request` (оба не исполняются как задачи; M2-05)"
  recipe_booking: "M2-50: эталон уведомлений класса «запись» — specs/runtime/examples/booking-notify.json: on_create → письмо $owner и $role:master с данными заявки (тема без ПДн), Telegram им же без ПДн («Новая заявка — откройте по ссылке»), подтверждение посетителю с consentField и cancel; schedule.relative {field: starts_at, offsetMinutes: -1440} → напоминание посетителю с if {status: [booked]}. Эталон QA (agents/qa.yaml#checks.reference_scenarios.booking) — то же напоминание клиенту со входом ($record.<ref на users>)"
  test: "Сценарий AC6 форума: запись с event_starts_at = now-31d после прогона retention имеет pii-поля NULL"

static:
  bundle: "client/index.html (Cache-Control: no-cache), client/assets/* с хешем в имени (max-age=31536000, immutable); assets/logo.(png|webp) ревизии (platform/api.yaml#uploadAsset) — как статика бандла"
  pwa:
    since: M1
    manifest: "GET /manifest.webmanifest из app.name, theme.accent, иконки из theme.logoFile или монограммы; lang ru, display standalone, start_url /"
    service_worker: "GET /sw.js: M1 — только кэш оболочки; M2 — precache оболочки и страниц сканера, офлайн-пакет QR в IndexedDB (../connectors/qr.yaml#offline)"
  test: "Lighthouse PWA installable на draft-хосте (M2)"

files:              # поле type=file (L3-18, L4-12; M2-14). G0 поле file не ограничивает (G0-SPEC-06 снят после M2-14)
  milestone: M2
  upload: "POST /api/files (multipart: file, field, entity?; тело ≤ 10 МБ + 256 КБ, читается с потолком и без Content-Length) → 201 {fileId, name, size, mime}; > 10 МБ → 413 «Файл больше 10 МБ», пустой → 422; право — create или update роли на сущность, поле не hidden и не readonly; entity можно опустить, если поле с таким именем пишет ровно одна сущность роли; тип — только по сигнатуре (magic bytes; имя и Content-Type игнорируются), allowlist image/jpeg, image/png, image/webp, application/pdf; SVG, HTML, XML, JS, архивы, gif → 415 UNSUPPORTED_MEDIA_TYPE «Такой тип файла загрузить нельзя» (../security/isolation.yaml#user_files); имя очищается (без пути, управляющих и bidi-символов, ≤ 120); ≤ 60 загрузок в час на пользователя (public-роль — на HMAC сети клиента) на систему → 429 + Retry-After"
  storage: "FileStorage {put, head, get, delete, list}: s3 (бакет system-files в РФ, path-style, SigV4 на node:crypto, SSE-KMS при WIZARD_S3_KMS_KEY_ID) | fs (папка, dev и e2e) | memory (тесты, G1) — ../platform/deploy.yaml#local.env_vars.M2 (WIZARD_FILES_STORAGE, WIZARD_S3_*); ключ объекта — app_<key>_<env>/<fileId uuid>, бэкенды принимают только такую форму; метаданные {name, mime, size, entity, field, uploadedBy, uploadedAt} хранятся при объекте (S3 — x-amz-meta-wizard, fs — <id>.meta.json), системной таблицы нет; значение поля — fileId, не URL"
  field_value: "Запись поля file (data API и ctx.db): uuid объекта этой системы для той же entity.field, загруженного тем же пользователем (системный контекст — любой загрузкой поля) и не занятого другой строкой; иначе 422 VALIDATION_FAILED с полем {code: FILE_NOT_FOUND, message: «Файл не найден — загрузите его снова»}; неизменённое значение не перепроверяется"
  serve: "GET /api/files/:fileId → проверка права read на строку, держащую файл (rowFilter, hiddenFields; нет права или неизвестный id → 404) → 302 на /api/files/:fileId/content?t=… — ссылку подписывает runtime (AES-GCM {fileId, userId, exp}, TTL 5 мин ≤ 15, только та же сессия; у public-роли — любая), байты отдаёт runtime из хранилища, а не presigned URL S3 (S3 не отдаёт CSP и nosniff по объекту); ответ — Content-Disposition: attachment (ASCII + filename*=UTF-8''…), Content-Security-Policy: sandbox, X-Content-Type-Options: nosniff, Content-Type из allowlist, Cache-Control: private, no-store, Referrer-Policy: no-referrer. GET /api/files/:fileId/info → {fileId, name, size, mime} с той же проверкой (FileField в форме редактирования)"
  pii_and_retention: "поле file по умолчанию pii: basic: попадает под согласие (update только поля file требует _consent), retention и anonymize (файл удаляется), экспорт — только имя файла"
  deletion: "Объект удаляется после коммита, когда на fileId больше не ссылается ни одна строка: замена значения и удаление строки, retention delete/anonymize, отзыв согласия, запрос субъекта; в конце прохода retention — sweep объектов без ссылок старше 24 ч; delete_system — объекты обоих env до DROP SCHEMA, F5 — объекты draft (M2-14). Копия prod → draft переносит fileId без объектов (в draft такие файлы не скачиваются)"
  test: "HTML/SVG с подменённым Content-Type → 415; PDF отдаётся attachment + CSP sandbox; ссылка на файл чужой строки → 404"

ai_actions:         # M3 (L4-07); модели и лимиты — ../agents/models.yaml#runtime_ai_*, оплата — ../platform/billing.yaml#run_charging.runtime_ai
  milestone: M3
  call: "POST /api/ai/:action {entity, id} → runtime вызывает platform-api по внутреннему RPC (WIZARD_INTERNAL_TOKEN, callType runtime_ai_extract | runtime_ai_generate, только T0); результат пишется в поля записи от имени __system, мета записи _aiFilled: string[]"
  triggers: "кнопка (SDK useAiAction, sdk.md §3) и шаг воркфлоу ai_extract / ai_generate; разовый backfill старых записей — по флагу из change-карточки (прогон на платформе, ≤ aiAction.monthlyLimit)"
  limits: "aiAction.monthlyLimit на систему (превышение → 429 AI_LIMIT_REACHED без вызова модели); вход от public-роли — ≤ 10/ч на IP (L3-41); исчерпание кредитов org → 402 AI_CREDITS_EXHAUSTED; вывод generate — только текст, не HTML"
  shape: "input {entity, fields?, instruction?}, output extract {fields} | generate {field} — appspec.schema.json#/$defs/aiAction, разбор packages/appspec/src/ai-actions.ts (M3-02)"
  button: "POST /api/ai/:action {entity, id}: нужен update на сущность и видимость записи (rowFilter), иначе 403/404 без вызова модели; ответ {item (с _aiFilled), filled, skipped}. Public-роль: ≤ 10/ч на сеть клиента (HMAC IP) → 429 RATE_LIMITED с Retry-After, до вызова шлюза"
  gateway: "platform-api POST /internal/v1/ai/run (X-Wizard-Internal-Token; WIZARD_PLATFORM_INTERNAL_URL у runtime): {systemKey, env, callId, source: button|workflow|backfill, monthlyLimit, action {name, kind, instruction, outputs}, record [{label, value}], attachments? [{mime, data}]}. Порядок отказов без вызова модели: месячный лимит платформы (M2-15) → 503 AI_UNAVAILABLE; aiAction.monthlyLimit → 429; кредиты org ≤ 0 → 402 + письмо владельцу раз в месяц. Ответ — только tier=T0 (иной runtime не пишет). Журнал platform.ai_action_calls, списание — billing.yaml#run_charging.runtime_ai. Имена файлов модели не передаются"
  meta: "_aiFilled = свёртка _w_audit записи: op=ai_fill помечает поля, любой другой update поля снимает пометку; отдаётся в GET /api/data/:entity/:id для сущностей-приёмников ИИ-действий (только видимые поля)"
  workflow_step: "ai_extract | ai_generate {action}: запись воркфлоу; ключ вызова wf:<jobId>:<step> (повтор шага не считается и не списывается повторно); update только полей-приёмников ИИ-шагов самого воркфлоу его не перезапускает"
  backfill: "card.aiBackfill: string[] у change-карточки → platform.ai_backfills (draft и prod). Draft — шаг ai_backfill в конце сборки, prod — после smoke публикации со спекой, где есть действие. Исполняет runtime: POST /_wizard/internal/ai-backfill {systemId, env, action, backfillId} на внутреннем порту — записи с пустыми приёмниками, старые первыми, ≤ monthlyLimit; остановка на первом AI_LIMIT_REACHED / AI_CREDITS_EXHAUSTED / AI_UNAVAILABLE"
  test: "кнопка → поле заполнено, RecordCard показывает «заполнено ИИ»; 11-й вызов public-роли за час → 429"

service_endpoints:
  health: "GET /_wizard/health: на публичных хостах → 200 {status: 'ok'} (L3-19); на внутреннем порту 4101 → {status, version, db: 'ok'|'fail', systemsLoaded} и на хосте системы {system, env, revision} (smoke publish)"
  internal: "POST /_wizard/internal/reload — только внутренний порт (routing.rules)"
  dev: "GET /_wizard/dev-login, /_wizard/dev-logout (auth.dev_login_M0); M2 — GET /_wizard/preview-login (auth.preview_login_M2)"
  bridge: "GET /_wizard/bridge.js — только draft (../ui/platform-screens.yaml#preview_contract)"
  fonts: "GET /_wizard/fonts/* — шрифты theme.font (../ui/ui-kit.yaml#tokens.fonts)"
  privacy: "M2: GET /_wizard/privacy (права субъекта и отзыв согласия для вошедшего → POST /api/auth/consent/revoke), /_wizard/pd-requests (админ-страница запросов субъектов для isAdmin-роли) — ../security/compliance.yaml#system_package"
  api_extra: "POST /api/telegram/:integration/link (../connectors/telegram.yaml), POST /api/workflows/:name/run (workflows.triggers.webhook_manual), POST /api/admin/invite (auth.role_assignment), M2: /api/files, M3: /api/ai/:action"
  hooks: "POST /_wizard/hooks/:connector/:integration/:hookToken — вебхуки коннекторов (hookToken — 32 случайных символа на интеграцию); M2-53: /_wizard/hooks/webhook/:integration/:hookToken — входящие вебхуки (../connectors/webhook.yaml); M2-50: /_wizard/hooks/message/:action/:token — ссылки отмены и отписки из писем посетителю"
  role_spec: "GET /_wizard/spec → RoleSpec текущей роли (../ui/ui-kit.yaml#data_binding.role_spec): без hiddenFields, только свои permissions и pages, theme, compliance {consentText, policyPage, policyVersion, consentTextHash = sha256(текст согласия)} (L1-03), loginMethods с учётом features; ETag = specHash+role"
  qr: "/_wizard/qr/check, /_wizard/qr/manifest, /_wizard/qr/sync — ../connectors/qr.yaml#endpoints"

rate_limits:                                 # since: M1 (L2-28); по сессии, для анонимов — по IP (platform/deploy.yaml#cloud.client_ip, IPv6 — /64); ответ 429 + Retry-After
  data_api: "300 запросов/мин на сессию, 60/мин анонимно"
  functions: "120 вызовов/мин на сессию, 30/мин анонимно"
  events: "3 SSE-соединения на сессию"
  test: "Нагрузка сверх лимита даёт 429 с Retry-After, остальные системы не деградируют"

security_headers:
  M0: "только X-Content-Type-Options: nosniff и frame-ancestors (draft — origin платформы, prod — 'none'); полный CSP ниже — since: M1 (L2-28)"
  csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors <origin платформы> (draft) | 'none' (prod)"
  rules:
    - "MUST: никаких сторонних origin в CSP; шрифты и иконки — из бандла ui-kit. Переходы на ЮKassa и Telegram — навигацией, CSP их не ограничивает"
    - "X-Content-Type-Options: nosniff; Referrer-Policy: strict-origin-when-cross-origin; Permissions-Policy: camera=(self), geolocation=()"
    - "MUST: CORS-заголовки (Access-Control-Allow-*) не отдаются никогда (L3-14)"
  test: "Бандл с <script src='https://evil.example'> не исполняет его (e2e, ошибка CSP в консоли)"

logging:
  format: "JSON-строки: {ts, level, requestId, system, env, revision, route, entity?, fn?, status, durationMs, role, userIdHash?}"
  rules:
    - "MUST NOT: тела запросов и ответов, значения полей, значения фильтров (только имена), телефоны, email, OTP, токены, cookie, id_token"
    - "MUST (L3-08): route — без query-строки; ошибки PG → {sqlstate, constraint} без detail/where; сегмент hookToken в пути маскируется; ответы коннекторов и провайдеров — только {status, code}"
    - "userIdHash (since: M1) = первые 12 символов HMAC-SHA256(user_id) с ключом окружения"
  test: "e2e форума с засеянными уникальными ПДн-маркерами: grep по логам runtime не находит ни одного маркера"
