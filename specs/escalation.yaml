# Что требует основателя. ВСЁ, чего здесь нет, агенты решают сами и фиксируют в specs/CHANGELOG.md.
# Канал: один сводный вопрос в чат сессии (AskUserQuestion) с вариантами и рекомендацией; не дробить.
principle: >
  Основатель участвует минимально. Эскалировать только то, что агент не может сделать сам
  по праву или по доступу: доступы и ключи, деньги, необратимые внешние действия, изменение
  зафиксированных решений (product.yaml#decisions), юридические позиции.

merge_policy:                  # product.yaml#decisions.D17_agent_merge (F1)
  default: "PR задачи (ветка task/<id>) мержится в main через auto-merge после зелёного CI. Это не эскалация"
  founder_review: >
    Агент ставит на PR метку founder-review и выключает auto-merge, если PR: меняет product.yaml#decisions или non_goals,
    этот файл или раздел «Жёсткие правила» AGENTS.md; требует E-MONEY, E-LEGAL (тексты от имени компании) или E-EXTERNAL;
    добавляет зависимость вне стека architecture.yaml с лицензией не из списка AGENTS.md
  forbidden: "Прямой push в main в обход PR, force-push в main, выключение обязательных проверок CI"

escalations:
  - id: E-ACCESS
    when: "Нужен ключ/аккаунт/доступ: Cloud.ru (FM, PG, K8s, S3, KMS, Artifact Registry, DNS API), Z.ai API, Yandex AI Studio, ЮKassa (тестовый и боевой магазин), Telegram BotFather (общий бот уведомлений платформы), SMS-провайдер РФ, почтовый провайдер (SMTP), регистратор доменов, GitHub-секреты и окружения"
    ask: "Какие ключи и куда положить (только через защищённый канал: GitHub Secrets / локальный .env, никогда в чат-историю, если есть альтернатива)"
    blocking: "Только live-режим и деплой; разработка продолжается на fixture/моках"
  - id: E-MONEY
    when: "Расход > 5 000 ₽ за раз или > 20 000 ₽ в месяц на инфраструктуру/модели; покупка домена; платные сервисы"
    preapproved:               # уже решено основателем — не эскалировать, пока в пределах
      - "Токены моделей по D20_eval_budget: всего ≤ 10 000 ₽/мес, из них live-eval ≤ 4 000 ₽/мес; прогон, который превысит потолок, не запускается; сборки клиентов останавливаются платформенным лимитом (M2-15)"
      - "Инфраструктура пилота по D23_pilot: ≤ 10 000 ₽/мес; рост по метрикам до 20 000 ₽/мес без согласования; выше — E-MONEY"
      - "Нейтральный домен систем (D22_domains, F8): покупает основатель на неделе 0 (≈ 1–3 тыс. ₽); домен платформы — к неделе 12 через E-NAME"
  - id: E-DECISION
    when: "Реализация требует изменить любое решение из product.yaml#decisions или non_goals"
    ask: "Варианты + рекомендация + цена каждого варианта в днях"
  - id: E-LEGAL
    when: "Юридическая позиция (149-ФЗ, 152-ФЗ, оферта, налоги), тексты, которые публикуются от имени компании"
    default: "До ответа юриста спека фиксирует безопасный вариант; агент не публикует тексты от имени компании"
    open_items:                # бриф юристу: docs/week0/lawyer-brief.md; сводка — L3-security.md «Сводка E-LEGAL»
      - "Список регионов, запрещённых Z.ai (ЛНР, Херсонская обл.), и источники региона организации (L3-02, M1-02)"
      - "Ст. 12 и ст. 18 ч. 5 152-ФЗ для T1 в Сингапуре (265-ФЗ); порог «инцидента» при пропуске детектором — до первого live-вызова T1 с данными не-основателя (L3-03, M2-13)"
      - "Привязка карты как идентификация по ПП 2011 (L3-28, M2-07)"
      - "ОРИ по 149-ФЗ ст. 10.1, статус провайдера хостинга, регламент запросов госорганов (L3-32, L3-35)"
      - "Тексты согласия и отзыва, адрес оператора, срок хранения ПДн по умолчанию 30 или 90 дней (L3-33, L3-34, L4-19)"
      - "Уведомление РКН по ст. 22, поручения Cloud.ru и Yandex, письмо Z.ai (L3-35, M2-13)"
  - id: E-EXTERNAL
    when: "Необратимое/внешнее действие: публикация в интернет вне staging, отправка писем реальным людям, прямой push в main в обход PR, force-push, удаление данных вне тестовых схем"
    not: "Мерж PR задачи в main через auto-merge после зелёного CI — не эскалация (merge_policy)"
  - id: E-NAME
    when: "Выбор финального названия и домена платформы (к неделе 12)"
    resolved: "2026-10-04: Born to Build, borntobuild.ru; системы — sandpile.ru (product.yaml#decisions.D27_brand)"
  - id: E-PARTNERS
    when: "Нужны контакты или брифы дизайн-партнёров"

calendar:                      # действия основателя: когда нужны и что блокируют (L4-fidelity.md, раздел d)
  - { what: "Реквизиты юрлица (ИНН, налоговый режим, ОКВЭД)", when: "неделя 0", for: "Cloud.ru, Z.ai, юрист, ЮKassa, SMS, SMTP, РКН", via: E-LEGAL }
  - { what: "CLOUDRU_API_KEY (FM) и ZAI_API_KEY в GitHub Secrets и .env", when: "неделя 0 (день 0 M0)", for: "eval недели 0 (D2_w0_fallback), M0-18, выход M0", via: E-ACCESS }
  - { what: "Законный способ постоянной оплаты Z.ai", when: "к M1 (ночной eval)", for: "M1-10", via: [E-MONEY, E-LEGAL] }
  - { what: "Нейтральный домен систем", when: "неделя 0", for: "M2-06 (TLS wildcard, PSL)", via: E-ACCESS }
  - { what: "Юрист нанят; бриф docs/week0/lawyer-brief.md", when: "неделя 0; тексты — к неделе 14", for: "M2-05, M2-13, выход M2", via: [E-LEGAL, E-MONEY] }
  - { what: "Заявка в Cloud.ru: staging и prod, Managed K8s (gVisor), PG, S3, KMS, Artifact Registry, DNS API; бюджет инфраструктуры", when: "заявка — неделя 0; доступ — к неделе 11", for: "M2-06", via: [E-ACCESS, E-MONEY] }
  - { what: "6–8 дизайн-партнёров и по 3 брифа", when: "неделя 0; 30 брифов — к M2", for: "M2-12, M2-09", via: E-PARTNERS }
  - { what: "Ключ Yandex AI Studio и folder id", when: "к M1 (не блокирует)", for: "резерв T0", via: E-ACCESS }
  - { what: "GitHub: админ-права, окружения staging/prod с ручным одобрением", when: "к неделе 8", for: "M1-10, M2-06", via: E-ACCESS }
  - { what: "SMS-провайдер РФ: договор и ключ; регистрация имени отправителя (1–2 недели)", when: "ключ — к M1-05 live; имя — к неделе 13", for: "M1-05 (платные тарифы, D19)", via: [E-ACCESS, E-MONEY] }
  - { what: "SMTP-провайдер РФ; SPF, DKIM, DMARC на домене систем", when: "к M1-06 live", for: "M1-06, вход по почте", via: E-ACCESS }
  - { what: "Токен общего бота уведомлений платформы (@BotFather) — секрет платформы; тестовый бот для e2e", when: "до начала M1-06", for: "M1-06 (уведомления Telegram по умолчанию)", via: E-ACCESS }
  - { what: "Магазин ЮKassa платформы и одобрение автоплатежей", when: "подать к неделе 8; боевой — к M2-07", for: "M2-07", via: [E-ACCESS, E-LEGAL] }
  - { what: "Тестовый магазин ЮKassa", when: "к неделе 10", for: "M2-02", via: E-ACCESS }
  - { what: "Финальное имя и домен платформы", when: "решено 2026-10-04 (D27_brand: Born to Build, borntobuild.ru, sandpile.ru)", for: "M2-37, M4-01", via: [E-NAME, E-MONEY] }
  - { what: "Staff-учётка основателя с MFA; алерты жалоб в Telegram и почту", when: "к бете (неделя 15)", for: "M2-08, M2-09 (D21_beta_moderation)", via: E-ACCESS }
  - { what: "Уведомление РКН по ст. 22 и остальные пункты M2-13", when: "до первого реального пользователя (≈ неделя 15)", for: "M2-09, выход M2", via: E-LEGAL }
  - { what: "Пилот P (D26–D64): домены borntobuild.ru и sandpile.ru с API DNS (wildcard *.sandpile.ru по DNS-01); статический IP исходящего egress-прокси (белый список тестовой среды Т-Банка); ключи Z.ai, Cloud.ru, Yandex в .data/local/inputs.env и GitHub Secrets; аккаунт SMS-агрегатора с именем отправителя; ключи Pexels и Pixabay; ключи Яндекс Карт (JS API) и SmartCaptcha; тестовые магазины ЮKassa, Т-Кассы, CloudPayments, Robokassa, Prodamus (автоплатежи ЮKassa и Т-Банка включает менеджер, Robokassa — по согласованию); тестовые аккаунты amoCRM (долгосрочный токен частной интеграции), Битрикс24 (входящий вебхук), МойСклад, СДЭК (публичный тестовый ключ), тестовый проект Tilda; chat_id команды в Telegram. Бюджет замера порога D42 — в месячном лимите платформы (D59), отдельного согласования не нужно", when: "до начала волны p-w1 вехи M2P (домены, DNS и статический IP — раньше всего)", for: "M2-20 и задачи вехи M2P", via: [E-ACCESS] }

not_escalations:               # примеры того, что агент решает сам
  - "Выбор библиотеки внутри зафиксированного стека, структура файлов, имена"
  - "Порядок задач внутри вехи, распараллеливание"
  - "Мелкие противоречия спек (фиксировать в CHANGELOG, брать файл с большим приоритетом)"
  - "Перенос задачи между вехами без изменения даты вехи"
  - "Любые решения в fixture/локальном режиме"
  - "Применение итога eval недели 0 по правилу D2_w0_fallback (M0-30) — с 2026-10-04 правило заменено D26_models_default: модель по умолчанию T1, её смена — E-DECISION"
  - "Мерж PR через auto-merge при зелёном CI (merge_policy)"
