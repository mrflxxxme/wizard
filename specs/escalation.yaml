# Что требует основателя. ВСЁ, чего здесь нет, агенты решают сами и фиксируют в specs/CHANGELOG.md.
# Канал: один сводный вопрос в чат сессии (AskUserQuestion) с вариантами и рекомендацией; не дробить.
principle: >
  Основатель участвует минимально. Эскалировать только то, что агент не может сделать сам
  по праву или по доступу: доступы и ключи, деньги, необратимые внешние действия, изменение
  зафиксированных решений (product.yaml#decisions), юридические позиции.

escalations:
  - id: E-ACCESS
    when: "Нужен ключ/аккаунт/доступ: Cloud.ru (FM, PG, K8s, S3, KMS), Z.ai API, Yandex AI Studio, ЮKassa (тестовый и боевой магазин), Telegram BotFather, почтовый провайдер (SMTP), регистратор доменов, GitHub-секреты"
    ask: "Какие ключи и куда положить (только через защищённый канал: GitHub Secrets / локальный .env, никогда в чат-историю, если есть альтернатива)"
    blocking: "Только live-режим и деплой; разработка продолжается на fixture/моках"
  - id: E-MONEY
    when: "Расход > 5 000 ₽ за раз или > 20 000 ₽ в месяц на инфраструктуру/модели; покупка домена; платные сервисы"
  - id: E-DECISION
    when: "Реализация требует изменить любое решение из product.yaml#decisions или non_goals"
    ask: "Варианты + рекомендация + цена каждого варианта в днях"
  - id: E-LEGAL
    when: "Юридическая позиция (149-ФЗ, 152-ФЗ, оферта, налоги), тексты, которые публикуются от имени компании"
  - id: E-EXTERNAL
    when: "Необратимое/внешнее действие: публикация в интернет вне staging, отправка писем реальным людям, пуш в main, удаление данных вне тестовых схем"
  - id: E-NAME
    when: "Выбор финального названия и доменов (к неделе 12)"
  - id: E-PARTNERS
    when: "Нужны контакты или брифы дизайн-партнёров"

not_escalations:               # примеры того, что агент решает сам
  - "Выбор библиотеки внутри зафиксированного стека, структура файлов, имена"
  - "Порядок задач внутри вехи, распараллеливание"
  - "Мелкие противоречия спек (фиксировать в CHANGELOG, брать файл с большим приоритетом)"
  - "Перенос задачи между вехами без изменения даты вехи"
  - "Любые решения в fixture/локальном режиме"
