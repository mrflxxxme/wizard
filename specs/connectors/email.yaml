# Коннектор email. Нормативно для backlog M1-06. Также используется runtime для email OTP (runtime.yaml#auth) — метод входа на всех тарифах, включая Free (решение F4).
id: email
milestone: M1
principle: "Только транзакционные письма (билет, подтверждение, статус заявки). Рассылки и реклама — нет (38-ФЗ о рекламе требует согласия; вне MVP)."

secrets:
  - { name: smtp_password, required: false, label: "Пароль SMTP (только provider=smtp)" }

config_schema:
  provider: "platform | smtp. platform — SMTP-аккаунт Wizard у российского провайдера (выбор и ключи — E-ACCESS), отправитель noreply@<systemsDomain> с SPF/DKIM/DMARC; smtp — свой ящик клиента"
  host: "smtp: DNS-имя хоста (не IP); адрес после резолва MUST NOT быть RFC1918, loopback, link-local, CGNAT или адресом кластера — проверка при каждом подключении, иначе CONFIG_INVALID (защита от SSRF; M2 — через egress-proxy, ../security/isolation.yaml#M2.network)"
  port: "465 или 587; другие — CONFIG_INVALID"
  secure: "bool: true — TLS с начала соединения (порт 465), false — STARTTLS обязателен (порт 587); без TLS — CONFIG_INVALID"
  user: "smtp: логин"
  from: "{name ≤ 60 символов без @, <, >, CR/LF, address} — для platform address всегда noreply@<systemsDomain>, name — app.name (после той же очистки); домен систем: SPF, DKIM, DMARC p=reject"
  replyTo: "email организатора (необязательно)"
  templates: "{<id>: {subject ≤ 120, body ≤ 10000}}; подстановки {{field}}, {{ref.field}}, {{link}} (ссылка на страницу записи)"
  validation: "G0: шаблоны, на которые ссылаются workflows/код, существуют; subject не ссылается на поля pii≠none (email.subject_pii); body с pii-полями записи — только сотрудникам ($owner, $role:<роль>), владельцу записи (ownerField) или самому посетителю (его собственные поля записи, без {{ref.поле}} с ПДн) — D71, email.body_pii_recipient; {{cancel_link}} — только при cancel.set на поля без ПДн (notify.cancel_link)"

transport: >
  provider=platform уходит по SMTP или через HTTP API Unisender Go (порт 443) — на сервере пилота Timeweb закрыты
  исходящие почтовые порты 25, 465, 587 и 2525. WIZARD_MAIL_TRANSPORT=smtp|unisender-api; по умолчанию unisender-api,
  если WIZARD_SMTP_HOST — *.unisender.ru, иначе smtp. API: POST <база>/ru/transactional/api/v1/email/send.json,
  заголовок X-API-KEY = WIZARD_SMTP_PASSWORD (у Unisender Go пароль SMTP и есть API-ключ — новых секретов нет).
  База: WIZARD_MAIL_API_BASE, иначе smtp.goN.unisender.ru → https://goN.unisender.ru, иначе https://goapi.unisender.ru.
  Тело: recipients [{email}], subject, from_email, from_name, reply_to, body {plaintext, html}, inline_attachments
  [{type, name = cid, content base64}] (QR), attachments, только X-заголовки, template_engine none (текст уже
  отрисован). track_links, track_read, skip_unsubscribe не передаются: их отключение Unisender включает только через
  поддержку (действие основателя). Ошибки — как у SMTP: 4xx кроме 429 — окончательные (401/403 → AUTH_FAILED, API-код
  204 → RECIPIENT_UNAVAILABLE, прочие → INVALID_REQUEST), 429, 5xx и сеть — временные, один повтор; тайм-аут 15 с.
  Ключ, адрес и текст письма в логи и ошибки не попадают. Свой SMTP клиента (provider=smtp) и dev-приёмник остаются
  SMTP. Код: packages/connectors/src/mail-api.ts.
actions:
  sendTemplate:
    input: "{userId, template, params, attachQrOf?: {entity, id}, idempotencyKey?}"
    effect: true
    rules:
      - "MUST: адрес — users.email получателя на хосте; нет адреса → RECIPIENT_UNAVAILABLE"
      - "MUST: HTML-экранирование подставленных значений; текстовая и HTML-версии (шаблон ui-kit, без внешних картинок и трекинга)"
      - "attachQrOf → PNG QR из qr-коннектора как inline-вложение (cid), только если получатель — владелец записи"
      - "Заголовки: Auto-Submitted: auto-generated; Message-ID на домене отправителя"
      - "MUST: в значениях заголовков (subject с подстановками, from.name, replyTo) CR, LF и NUL вырезаются; не-ASCII — кодирование RFC 2047; replyTo — один валидный адрес"
    output: "{messageId}"
  notify_step: >
    Шаг воркфлоу notify с integration=email (M2-50, D69, D71; runtime.yaml#workflows.step_params): получатели to — $record.<ссылка на users>
    (users.email, как sendTemplate), $owner (email владельцев организации — platform.system_owner_emails), $role:<роль со входом>
    (все незаблокированные пользователи роли, ≤ 200), $record.<поле type=email> — посетитель без аккаунта: только при consentField
    (поле bool записи = true; форма заполняет его отдельной неотмеченной галочкой «Согласен получать служебные сообщения»), только
    служебные письма (подтверждение, напоминание, отмена) с его собственными данными; в каждое письмо посетителю добавляется ссылка
    «отписаться» ({{unsubscribe_link}} и строка в конце), {{cancel_link}} — одноразовая подписанная ссылка отмены (cancel.set шага).
    Адреса владельцев и посетителей подставляет хост (sendTemplateToAddress), коду системы они недоступны. Ключ идемпотентности —
    <jobId>:<step>:sendTemplate:<получатель>; журнал _w_messages без адреса и текста (хеш адреса)

limits: "≤ 300 писем в час на систему (Free — 100); превышение → RATE_LIMITED и событие для владельца. M2-50: посетителю без аккаунта ≤ 3 письма в сутки на контакт и интеграцию (RATE_LIMITED, строка rate_limited в _w_messages)"
bounces: "platform: вебхук провайдера /_wizard/hooks/email/<integration>/<hookToken> (подпись по документации выбранного провайдера) → users.email_bounced_at; следующие письма → RECIPIENT_UNAVAILABLE"
logging: "MUST NOT: адрес, тема с подстановками, тело; логируются template id и messageId"

test_mode:
  draft: "Письма пишутся в .data/outbox/<system>/email/*.eml (или локальный SMTP-приёмник dev-smtp на :1025, если WIZARD_DEV_SMTP=1); реальная отправка из draft запрещена"
  mocks: "packages/connectors/test/mocks/smtp — in-memory SMTP-сервер для тестов"

error_mapping:
  "535 auth failed": AUTH_FAILED
  "550/553 mailbox unavailable": RECIPIENT_UNAVAILABLE
  "421/450/451 temporary": UPSTREAM_UNAVAILABLE
  "connection/timeout": UPSTREAM_UNAVAILABLE

acceptance:
  - "G2: subject «Билет для {{holder_name}}» блокирует публикацию"
  - "Письмо с билетом форума в draft оказывается в .data/outbox с QR-вложением, в логах нет адреса"
  - "Повтор шага воркфлоу с тем же ключом не отправляет письмо второй раз"
  - "Подстановка «x\\r\\nBcc: a@b.ru» в subject → одно поле Subject без переноса, заголовка Bcc нет"
  - "provider=smtp с host, резолвящимся в 10.0.0.5 или 127.0.0.1 → CONFIG_INVALID, соединение не открывается"
