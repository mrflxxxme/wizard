# Антифрод и злоупотребления. Решение product.yaml#decisions.D15_abuse; M2-04 (G2), M2-08 (жалобы и снятие).
version: 1

domain:
  rule: "Системы публикуются только на отдельном домене систем (deploy.yaml#cloud.domains), не на домене платформы"
  rationale:
    - "Фишинговая система не наследует доверие и репутацию домена платформы; блокировка домена систем провайдерами/браузерами не кладёт платформу"
    - "Cookie и storage платформы недоступны коду систем (разные registrable domains)"
    - "Разные сертификаты и ingress — снятие систем не трогает платформу"
  psl: "MUST: заявка на включение домена систем в Public Suffix List (private section) — в M2-06; до включения <sys>.<domain> разных тенантов — один site, поэтому действуют tenant_separation. HSTS: max-age ≥ 1 год, includeSubDomains, preload"
  tenant_separation:               # реализация — runtime.yaml#auth; здесь — требования
    - "Имя сессионной cookie выбирается по конфигурации (WIZARD_PUBLIC_SCHEME), не по схеме запроса: за TLS-терминирующим ingress на https принимается только __Host-wz_sess; при нескольких cookie с этим именем → 401"
    - "CSRF: Origin = хост системы и X-Wizard-Request: 1 — для ВСЕХ не-GET запросов, включая /_wizard/qr/check и /_wizard/qr/sync, /api/pay, /api/files, /api/auth/*; исключение — только /_wizard/hooks/* (у них своя проверка подлинности)"
    - "CORS-заголовки runtime не отдаёт никогда"
  reserved_slugs: "slug системы ∉ {www, mail, smtp, mx, mta-sts, autodiscover, autoconfig, api, admin, status, static, cdn, abuse, security, wizard} (runtime.yaml#routing.system_slug) — тенант не захватит служебные поддомены домена-отправителя; для домена систем DMARC p=reject"

identification:
  rule: "Prod доступен только после привязки карты российского банка (billing.yaml#card_binding) — это же идентификация клиента провайдером хостинга (149-ФЗ, позиция юриста E-LEGAL)"
  draft: "Draft-системы закрыты: доступ только по токену превью платформы (api.yaml#getPreviewUrl), индексация запрещена (X-Robots-Tag: noindex, nofollow)"
  founder_review: "В бете orgs.require_founder_review=true: первая публикация каждой системы и каждая публикация с новыми формами сбора ПДн — после одобрения staff (M2-09). В бете staff — основатель с обязательной MFA (решение F7)"

patterns:                          # словари и шаблоны для проверок G2 (specs/quality/gates.yaml — id проверок и severity)
  location: "packages/gates/data/*.json (генерируются из этого файла скриптом; правка — PR)"
  normalize: "Перед сопоставлением: нижний регистр, ё→е, гомоглифы латиница↔кириллица (а/a, е/e, о/o, р/p, с/c, х/x, у/y, к/k, м/m, т/t, н/h, в/b); для многословных брендов — сравнение соседних токенов кандидата без пробелов, дефисов и точек (Сбер-Банк = СберБанк)"
  word_boundary: "\\b в шаблонах этого файла — Unicode-граница слова: (?<![\\p{L}\\p{N}_]) … (?![\\p{L}\\p{N}_]) с флагом u (\\b в JS кириллицу не видит). Шаблоны без \\b — стемы, совпадают с началом слова"
  scope: "спека (app, entities, labels, enum, pages.title, compliance.operatorName), исходники ui/ и functions/ (AST JSX/TS + строковые литералы), тексты шаблонов уведомлений; строки компонентов ui-kit (PayButton, ConsentCheckbox, AppShell.Login, «Напоминания в Telegram») в scope не входят"
  card_collection:                 # G2-AF-01
    names: '(номер|№)\s*карты|card.?number|\bpan\b|\bcvv2?\b|\bcvc2?\b|\bcvp\b|код безопасности|срок действия\s+(банковской\s+)?карт|\bexpiry\b|\bexp.?date\b|держатель карты|cardholder'
    autocomplete: [cc-number, cc-csc, cc-exp, cc-exp-month, cc-exp-year, cc-name]
    code: "маска/regex из 16 цифр группами по 4, реализация алгоритма Луна в коде системы"
    allowed: "только confirmation_url коннектора yookassa (платёжная форма ЮKassa)"
  credentials:                     # G2-AF-02
    names: 'пароль|password|passwd|\b(pin|otp)\b|пин.?код|логин от|код из (смс|sms)|код подтверждения|одноразовый код'
    inputs: "input type=password; любые поля кода подтверждения вне /_wizard/login runtime"
    relay: "поле из этого словаря → шаг notify/connector/ctx.connectors.* (пересылка кодов) — тоже блок"
    rationale: "вход в системы — только через runtime (runtime.yaml#auth): email OTP и Telegram на всех тарифах, phone OTP — только на тарифах Старт и Бизнес (решение F4)"
  gov_ids:                         # G2-AF-03
    names: 'паспорт|серия( и)? номер|кем выдан|код подразделения|снилс|инн( физ)|водительск|вод\.? удостоверение|загранпаспорт'
    file_fields: 'поле type=file, чей name/label совпадает с names ИЛИ с (скан|фото|копи[яи]|снимок|изображени)\W{0,20}(паспорт|документ|удостоверени|снилс|полис|свидетельств) — тот же блок (сканы документов в обход полей)'
    policy: "MVP: блок без исключений (нет шифрования полей). После шифрования полей (data-boundary.yaml#tokenization, envelope) — override orgs.passport_collection_allowed, ставит staff после проверки легитимной цели (пропуск на режимный объект)"
  brands:                          # G2-AF-04; ложные блокировки полигонов — главный риск (M2 exit «0 ложных блокировок»)
    file: "packages/gates/data/brands.ru.json — {id, names[], domains[], category, ambiguous?}; собственная компиляция из этого файла (CC0)"
    zones:
      identity: "app.name, slug, title страниц, имя logoFile, compliance.operatorName"
      forms: "label, placeholder полей ввода и текст кнопок внутри форм (AST JSX: RecordForm, Field, input, button в form)"
      text: "остальные тексты UI и шаблоны уведомлений — НЕ блок, только сигнал scoring.brand_in_text"
    match:
      identity: "имя ≥ 5 символов: совпадение отдельным словом после normalize ИЛИ расстояние Левенштейна ≤ 1; имя < 5 символов (VK, Т2, СБП, МТС, ВТБ, МКБ, ФНС, МВД, СФР, ПФР, МФЦ, DPD, ПЭК, ЕСИА, QIWI, Озон и т. п.) — только точное совпадение отдельным словом"
      forms: "только имена ≥ 5 символов (точно или Левенштейн ≤ 1) И в окне 60 символов слово оплаты, входа или данных карты: оплат|плат[её]ж|перевод|карт|cvc|войти|вход|логин|пароль|код подтвержд; имена < 5 символов в forms не проверяются"
      ambiguous: "Имена-слова Мир, Max, Открытие, Купер, Налоговая — в любой зоне только вместе со словом карт|банк|вход|войти|кабинет в окне 30 символов («Мир сладостей», «Открытие сезона» — не находка)"
    connector_allowlist: "Имена, которые выводит подключённый в спеке коннектор или метод входа, не матчатся в forms и text: integrations[yookassa] → ЮKassa, ЮMoney, СБП, Мир; integrations[telegram] или loginMethods telegram → Telegram, Телеграм"
    override: "platform.brand_allowlist (org подтвердила владение брендом документами, проверка staff)"
    banks: [Сбербанк, Сбер, СберБанк Онлайн, ВТБ, Т-Банк, Тинькофф, Альфа-Банк, Газпромбанк, Россельхозбанк, Совкомбанк, Райффайзенбанк, Почта Банк, МКБ, Открытие, ЮMoney, ЮKassa, СБП, Мир, QIWI]
    government: [Госуслуги, ЕСИА, ФНС, Налоговая, МВД, ГИБДД, Социальный фонд, СФР, Пенсионный фонд, ПФР, ЦБ РФ, Банк России, ФССП, Росреестр, Минцифры, МФЦ, Мос.ру]
    marketplaces: [Ozon, Озон, Wildberries, Яндекс Маркет, Авито, Мегамаркет, AliExpress, Lamoda, Купер]
    delivery: [СДЭК, Почта России, Boxberry, DPD, Яндекс Доставка, Деловые Линии, ПЭК, 5Post, Достависта]
    telecom_social: [МТС, Билайн, МегаФон, Т2, Tele2, Ростелеком, ВКонтакте, VK, Одноклассники, Telegram, WhatsApp, Max]
    platform: [Wizard, "<финальное имя платформы>"]
  external_post:                   # G2-AF-05
    code: "<form action=абсолютный URL>, fetch/XHR/sendBeacon/WebSocket к абсолютным URL, window.location/window.open/<a href> на внешний хост с параметрами из полей формы, <iframe>/<script src> на внешние хосты"
    allowed: "относительные URL runtime; confirmation_url ЮKassa, выданный коннектором; ссылки без параметров из полей (например, на сайт клиента)"
  p2p_payment:                     # G2-AF-06
    text: "«переведите|перевод|оплата» в окне 60 символов от номера карты (Луна), счёта (20 цифр), телефона для СБП или криптоадреса"
  crypto_codes:                    # G2-AF-07
    code: "window.ethereum, eth_sendTransaction, eth_sign, personal_sign, approve(, setApprovalForAll(, permit(; строки ethers|web3|walletconnect|@solana"
    names: "сид.?фраза|seed phrase|мнемоническ|приватный ключ|private key|recovery phrase|секретная фраза"
  secrets:                         # G2-SECRET-01
    regex: ["live_[A-Za-z0-9_-]{20,} (ЮKassa)", '\d{8,10}:[A-Za-z0-9_-]{35} (Telegram bot)', 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+ (JWT)', "-----BEGIN [A-Z ]*PRIVATE KEY-----"]
    entropy: "строка ≥ 24 символов с энтропией Шеннона ≥ 4.0 бит/символ в окне 40 символов от key|token|secret|пароль|password"
  subject_entities: "Сущность-субъект — сущность с полем pii ≠ none, с ref на users или с полем из pii_field_names.strong. pii_field_names.weak и special_categories проверяются только в сущностях-субъектах"
  pii_field_names:                 # G2-PII-02
    strong: 'фио|фамилия|отчество|телефон|\bмоб|e-?mail|дата рождения|день рождения|паспорт|снилс|\bинн\b'
    weak: '\bимя\b|\bадрес|\bпочта\b|telegram|телеграм|whatsapp|\bконтакт'
    weak_exceptions: '(имя|название)\s+(товара|файла|события|позиции|категории)|адрес\s+(площадки|места|проведения|мероприятия|магазина|пункта|точки|офиса|сайта|самовывоза)|контакты\s+(организатора|магазина|площадки)'
  special_categories:              # G2-PII-03; только в сущностях-субъектах
    names: 'здоров|диагноз|болезн|заболеван|инвалид|беремен|аллерги|медицин|анализ(ы)? крови|вероисповед|религи|политическ|партийн|национальност|\bрас[аы]\b|судим|интимн|сексуальн|биометр|отпечат(ок|ки|ков)\b'
    allow: "аллерген (состав товара в каталоге — маркировка, не ПДн); «Тараса», «отпечатать» — не находки"
    note: "Аллергии/диета участников события — данные о здоровье: G2 блокирует; строитель предлагает формулировку «пожелания по питанию» без медицинских сведений"
  ori_signal:                      # G2-AF-09 (warning → founder_review)
    rule: "Сущность с text-полем, которую создаёт одна login-роль, а читает другая login-роль (переписка пользователей) → признак организатора распространения информации (149-ФЗ ст. 10.1) → founder_review. Определение ОРИ и порядок — E-LEGAL"

scoring:                           # G2-AF-08 (warning) — не блок, а флаг ручной модерации перед prod
  signals: { new_org_lt_7d: 2, free_plan: 1, brand_fuzzy_match_distance_2: 3, brand_in_text: 2, obfuscated_strings: 3, "external_links_gt_5": 1, collects_phone_and_email_public: 1, urgent_words: 2, abuse_reports_prev: 4 }
  urgent_words: "срочно|ваш аккаунт заблокирован|подтвердите данные|выигрыш|компенсаци|возврат средств|последнее предупреждение"
  obfuscated_strings: "base64/hex/charCode-строки длиной > 200, собираемые в URL или HTML в рантайме"
  brand_in_text: "бренд из brands в зоне text вне connector_allowlist"
  threshold: 5
  effect: "Сумма ≥ threshold → founder_reviews pending для этой ревизии (даже если orgs.require_founder_review=false); draft не блокируется"
  fixtures: "packages/gates/test/antifraud/{block,allow,score}/*.json — ≥ 40 блокируемых, ≥ 20 легитимных из брифов eval и allow_required. M2 exit: 100% block, 0 ложных блокировок на 12 брифах eval и allow_required"
  allow_required:                  # негативные фикстуры: MUST проходить G2 без блокировки
    - "«Напоминания в Telegram» (компонент ui-kit) и «Войти через Telegram» при loginMethods telegram"
    - "«Оплатить через ЮKassa», «Оплата картой Мир или через СБП» при integrations[yookassa]"
    - "app.name «Мир сладостей», страница «Открытие сезона»"
    - "«Срок действия билета», «Срок действия промокода»"
    - "«Адрес площадки», «Контакты организатора», «Название товара»"
    - "«ул. Тараса Шевченко» в адресе площадки"
    - "«Состав: может содержать аллергены» в каталоге товаров кондитерской (сущность не субъект)"
    - "Идентификаторы shipping, spinner, option, topic в коде"
    - "Тексты макетов 1–10 концепции"
  block_required:
    - "Поле «Номер карты» и «Срок действия карты» вне ЮKassa"
    - "app.name «Госуслуги района», title «Вход в Сбербанк Онлайн»"
    - "Кнопка «Войти через Telegram» без loginMethods telegram рядом с полем «Код из SMS»"
    - "Поле file «Скан паспорта»; поле «Аллергии» в сущности регистрации участника"

messages_ru:                       # нейтральные тексты без раскрытия правил и без обвинений
  G2-AF-01: "Публикация приостановлена: форма похожа на сбор данных банковских карт. Принимать оплату можно через подключение ЮKassa. Если это ошибка — нажмите «Оспорить»."
  G2-AF-02: "Публикация приостановлена: форма похожа на сбор паролей или кодов подтверждения. Вход в систему уже есть — его настраивает платформа. Если это ошибка — нажмите «Оспорить»."
  G2-AF-03: "Публикация приостановлена: сейчас нельзя собирать паспортные данные, СНИЛС, ИНН физлиц и сканы документов. Если это ошибка — нажмите «Оспорить»."
  G2-AF-04: "Публикация приостановлена: название или тексты похожи на известный бренд. Если бренд ваш — нажмите «Оспорить» и приложите подтверждение."
  G2-AF-05: "Публикация приостановлена: данные из форм отправляются на сторонний сайт. Если это ошибка — нажмите «Оспорить»."
  G2-AF-06: "Публикация приостановлена: в системе указаны реквизиты для перевода денег напрямую. Принимать оплату можно через ЮKassa. Если это ошибка — нажмите «Оспорить»."
  G2-AF-07: "Публикация приостановлена: форма похожа на сбор ключей или секретных фраз. Если это ошибка — нажмите «Оспорить»."
  review: "Перед публикацией систему посмотрит модератор — обычно это занимает до одного рабочего дня."
  ORG_SUSPENDED: "Публикации организации приостановлены. Подробности — в письме владельцу; оспорить решение можно ответом на это письмо."
  http_451: "Система временно недоступна по жалобе. Владелец системы уведомлён."
  dispute: "Заявка на проверку отправлена. Ответим на почту владельца в течение 24 часов."

rescan: "При обновлении patterns — ночной перескан live-ревизий; новое срабатывание → abuse_report category=auto_g2 (без автоматического снятия, кроме takedown.auto_suspend). Ложная блокировка в G2 → кнопка «Оспорить» → тикет staff category=auto_g2"

report:                            # «Пожаловаться»
  entry_points: ["Ссылка «Пожаловаться» в футере каждой prod-системы (вставляется runtime, код системы не может её убрать — G0 проверяет наличие слота AppShell)", "страница <platform-domain>/abuse", "abuse@<platform-domain>"]
  endpoint: "POST /api/v1/abuse-reports (api.yaml#createAbuseReport); без входа; лимит 10/ч на IP (IP клиента — только из последнего хопа доверенного ingress, deploy.yaml; для IPv6 — по /64); hCaptcha/капча — только российский сервис или своя (SHOULD, M4)"
  storage: "platform.abuse_reports; sla_deadline = created_at + 24 ч"

takedown:
  sla: "≤ 24 ч от жалобы до решения (снятие или отклонение); очередь модерации сортирована по sla_deadline; алерт при < 2 ч (deploy.yaml#cloud.observability)"
  flow:
    - "new → triaged: staff открывает систему по тикету жалобы (доступ с TTL 24 ч, в staff_audit_log — compliance.yaml#platform.security_org staff_access), фиксирует категорию"
    - "triaged → takedown: publications.status=suspended, systems.suspended_at; runtime отдаёт 451 со страницей messages_ru.http_451 (без раскрытия деталей); данные НЕ удаляются"
    - "Уведомление владельцу (email owner) сразу при takedown: причина, как оспорить"
    - "Повторное нарушение или явный фишинг → orgs.suspended_at: все системы организации снимаются, новые публикации запрещены (ORG_SUSPENDED)"
    - "Апелляция владельца → staff; restore → publications live, событие в staff_audit_log"
    - "Запросы РКН и госорганов (149-ФЗ) — отдельный регламент от юриста (E-LEGAL)"
  auto_suspend: "Без решения staff автоматически НЕ снимать, кроме: ≥ 3 жалобы категории phishing от разных IP за 1 ч И live-ревизия проваливает текущий G2 → немедленное снятие с тикетом"
  test: "M2-08: жалоба → тикет → takedown → prod-URL отдаёт 451 → письмо владельцу в dev-sender; restore → 200"
