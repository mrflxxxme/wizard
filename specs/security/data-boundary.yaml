# Граница данных (ПДн). Нормативно для packages/pii и packages/llm (router). Решения: product.yaml#decisions.D2_models, D3.
# Выбор конкретных моделей и цен — specs/agents/models.yaml; здесь — КУДА можно слать данные и в каком виде.
version: 1

principles:
  - "T0 — модели, развёрнутые в РФ (Cloud.ru FM «внутренние», Yandex AI Studio с отключённым логированием): любые данные"
  - "T1 — Z.ai GLM-5.3 (Сингапур): только данные без ПДн после scrub. Токенизированные ПДн = ПДн → на T1 запрещены (D3)"
  - "T1 — tier сборки по умолчанию, только если eval недели 0 показал выигрыш GLM-5.3 над лучшей T0-моделью ≥ 10 п. п. (решение F2); иначе сборка по умолчанию идёт на T0 (models.yaml#routes). Ограничения этого файла действуют в обоих вариантах"
  - "Deny by default: неизвестный callType, ошибка детектора, неизвестный класс → T0"
  - "Сборка по природе ПДн не требует; ПДн в сборку попадают случайно (бриф). Рантайм-данные систем, импорт значений, поддержка — всегда T0"

categories:                        # совпадает с appspec.schema.json#/$defs/pii
  none: "нет ПДн"
  basic: "обычные ПДн: ФИО, телефон, email, адрес, дата рождения, идентификаторы"
  special: "специальные (ст. 10 152-ФЗ: здоровье, религия, политика, нацпринадлежность, судимость, интимная жизнь) — запрещены в MVP (G2)"
  biometric: "биометрические (ст. 11) — запрещены в MVP (G2)"

detectors:                         # packages/pii/src/detectors/*.ts; чистый TypeScript, без сети
  interface:
    detect: "detect(text: string) -> Finding[] {kind, category, start, end, confidence: 'high'|'medium'}"
    scrub: "scrub(text: string) -> {text: string, counts: Partial<Record<Kind, number>>, maxCategory, strongIds: boolean} — БЕЗ таблицы соответствия"
    scrubJson: "scrubJson(value) — обход всех строк JSON (tool results, спека, отчёты) тем же scrub"
  kinds:
    phone_ru:
      category: basic
      rule: "+7 или 8, затем 10 цифр с разделителями (пробел, -, (, )); ИЛИ 10 цифр, начинающихся с 9, при контексте (тел|телефон|моб|whatsapp|звонить) в окне 30 символов. Не внутри более длинной цифровой последовательности"
    phone_intl:
      category: basic
      rule: "E.164 с кодом страны ≠ 7: «+» и 8–15 цифр с разделителями (+375, +998, +996, +380, +374 и др.); без «+» — только при контексте телефона (как phone_ru)"
    social_handle:
      category: basic
      rule: '@[A-Za-z0-9_]{5,32} (не внутри email) ИЛИ ссылки на профиль (vk\.com|t\.me|ok\.ru|instagram\.com)/[\w.]+ ; служебные адреса системы (t.me/<botUsername> из спеки) — не находка'
    email:
      category: basic
      rule: "local@domain.tld (RFC 5322 lite, tld ≥ 2 букв, кириллические домены .рф); SHOULD: обфускации «ivan собака mail.ru», «ivan at mail dot ru»"
    card:
      category: basic
      strong: true
      rule: "13–19 цифр (группы через пробел/-), проходит Луна, префикс IIN ∈ {2200–2204 Мир, 4 Visa, 51–55 и 2221–2720 MC, 62 UnionPay, 35 JCB}"
    passport_ru:
      category: basic
      strong: true
      rule: "формат «dd dd dddddd» / «dddd dddddd» / «серия dddd № dddddd» — всегда; 10 цифр подряд — только при контексте (паспорт|серия|выдан|номер паспорта) и если это не валидный ИНН-10"
    snils:
      category: basic
      strong: true
      rule: "ddd-ddd-ddd dd или 11 цифр при контексте «снилс»; контрольная сумма: s = Σ d_i×(10−i), i=1..9; s<100 → s; s∈{100,101} → 00; s>101 → s mod 101 (100 → 00). Номера ≤ 001-001-998 контрольную сумму не проверяют"
    inn_person:
      category: basic
      strong: true
      rule: "12 цифр; контрольные цифры 11 и 12 по весам [7,2,4,10,3,5,9,4,6,8] и [3,7,2,4,10,3,5,9,4,6,8], (Σ mod 11) mod 10"
    inn_org:
      category: none
      rule: "10 цифр с контролем по весам [2,4,10,3,5,9,4,6,8] — ИНН юрлица, НЕ ПДн, не заменяется (нужен для спеки: реквизиты)"
    ogrnip:
      category: basic
      strong: true
      rule: "15 цифр, первая 3 или 4; контроль: (число из первых 14 цифр mod 13) mod 10 = 15-я цифра. ОГРНИП идентифицирует физлицо (ИП)"
    car_plate_ru:
      category: basic
      rule: "госномер РФ: буква, 3 цифры, 2 буквы, код региона 2–3 цифры (буквы АВЕКМНОРСТУХ и латинские двойники), с пробелами или без"
    account_ru:
      category: basic
      strong: true
      rule: "20 цифр с префиксом 40817, 40820, 423 (счета физлиц)"
    birthdate:
      category: basic
      rule: "дата (dd.mm.yyyy, d месяца yyyy) при контексте (родил|дата рождения|д\\.р\\.|др) в окне 30 символов"
    address:
      category: basic
      rule: "≥ 2 маркера в окне 60 символов из: г.|город, ул.|улица, пр-т|проспект, пер.|переулок, ш.|шоссе, наб., б-р|бульвар, пл.|площадь, мкр, д.|дом, корп.|к., стр., кв.|квартира, оф., индекс [1-6]\\d{5}; за маркером — слово с заглавной или число. Один город («форум в Казани») — НЕ ПДн"
    person_name:
      category: basic
      rule: >
        Словарь имён packages/pii/data/names.ru.txt (≥ 1500 мужских и женских имён + уменьшительные; к M1 — также имена народов РФ
        и стран СНГ (татарские, башкирские, кавказские, среднеазиатские, украинские, белорусские); генерируется скриптом
        из источника с лицензией MIT/CC0/CC-BY, атрибуция — в THIRD_PARTY_NOTICES.md) + нормализация падежных окончаний (а|у|ом|ем|е|ой|ы|и|ю|я).
        Токен с заглавной буквы из словаря → имя; соседние токены с заглавной и суффиксом отчества (вич|вна|ична|инична + окончания)
        или фамилии (ов|ев|ёв|ин|ын|ский|цкий|ова|ева|ина|ская|цкая + окончания) расширяют спан; «Фамилия И. О.» / «И. О. Фамилия» — имя.
        Неоднозначные имена-слова (Вера, Надежда, Любовь, Роман, Лев, Мир, Слава, Май) — только вместе с фамилией/отчеством.
      M1_option: "Если recall на корпусе < порога — Python-сайдкар Natasha (MIT) через localhost RPC; добавление Python — через CHANGELOG"
    person_name_latin:
      category: basic
      rule: "ФИО латиницей и транслитом: токены с заглавной буквы из транслита словаря person_name (ГОСТ 7.79-2000 Б, ИКАО, распространённые варианты: Ivan, Yevgeniya, Aleksandr/Alexander) + те же правила расширения спана; «Surname I.» / «I. Surname»"
    special_context:
      category: special
      rule: "стемы (диагноз|болезн|заболеван|инвалид|беремен|вич|онколог|психиатр|наркол|вероисповед|религи|партийн|национальност|судим|сексуальн) в окне 100 символов от находки person_name/phone/email/passport_ru. Описание поля без субъекта («спросить про аллергии») — не находка"
    biometric_context:
      category: biometric
      rule: "стемы (биометр|отпечат|распознаван лиц|образец голоса|скан лица|фото лица для прохода) рядом с субъектом (как special_context)"
  piiKind_map: { phone_ru: phone, phone_intl: phone, email: email, person_name: fio, person_name_latin: fio, passport_ru: passport, inn_person: inn, snils: snils, card: card, account_ru: other, ogrnip: other, birthdate: birthdate, address: address, social_handle: other, car_plate_ru: other }   # kind → appspec.schema.json#/$defs/piiKind (импорт piiKindGuess, карточка системы)
  quality:
    corpus: "packages/pii/test/corpus.ru.jsonl — ≥ 200 строк, генерируется скриптом (синтетика + валидные контрольные суммы), с разметкой спанов; + ≥ 100 строк «ловушек» без ПДн (код, CSS, ИНН-10, даты событий, города)"
    holdout: "M1: отложенный корпус ≥ 300 строк из реальных формулировок (не синтетика авторов детекторов), размечен вручную; хранится в РФ (S3 eval), НЕ в репозитории; recall на нём — критерий M1 (пороги thresholds.M0)"
    thresholds: { M0: "recall ≥ 0.95, precision ≥ 0.90 (M0-05)", M2: "recall ≥ 0.98 для strong-видов, ≥ 0.95 для остальных" }
    independent_check: "Метрика утечек в eval (quality/eval.yaml#metrics.pii_leaks) MUST NOT считаться тем же детектором, что делает scrub: (а) канарейки в ≥ 4 брифах eval (ФИО нерусского происхождения, латиница, @handle, телефон не РФ) — вхождения в T1-payload, порог 0; (б) находки независимого детектора (Natasha-сайдкар, M1) в T1-payload"
    perf: "scrub 20 КБ текста ≤ 20 мс на 1 vCPU (бенчмарк vitest bench)"

scrub:
  placeholders: { phone_ru: "[ТЕЛЕФОН_n]", phone_intl: "[ТЕЛЕФОН_n]", email: "[EMAIL_n]", card: "[КАРТА_n]", passport_ru: "[ПАСПОРТ_n]", snils: "[СНИЛС_n]", inn_person: "[ИНН_n]", ogrnip: "[ОГРНИП_n]", account_ru: "[СЧЁТ_n]", birthdate: "[ДАТА_РОЖДЕНИЯ_n]", address: "[АДРЕС_n]", person_name: "[ФИО_n]", person_name_latin: "[ФИО_n]", social_handle: "[КОНТАКТ_n]", car_plate_ru: "[ГОСНОМЕР_n]" }
  semantics:
    - "MUST: одноразовые плейсхолдеры; n — порядковый номер отличающегося значения внутри ОДНОГО вызова scrub (чтобы модель различала людей). Соответствие живёт только в локальной переменной и не возвращается, не логируется, не сохраняется (M0-05)"
    - "MUST NOT: обратная подстановка в ответы T1 — ответы T1 (спека, код) используются как есть"
    - "MUST: плейсхолдер склонению не подлежит; формат ^\\[[А-ЯЁ_]+_\\d+\\]$"
    - "SHOULD: G0 выдаёт предупреждение, если в спеке/коде системы встречается строка формата плейсхолдера (модель скопировала заглушку в интерфейс)"
    - "special_context/biometric_context не заменяются частично — весь вызов уходит на T0 (routing.forced_t0)"

tokenization:                      # обратимо, ТОЛЬКО в РФ
  milestone: M1
  purpose: "Стабильные токены для T0-логов, отладки и поддержки; НЕ для T1"
  scheme: "token = tok_<kind>_<base32(HMAC-SHA256(k_org, value))[0:16]>; значение шифруется AES-256-GCM (DEK на организацию, KEK в OpenBao transit / Cloud.ru KMS)"
  storage: "Отдельная схема pii_vault, отдельная роль БД и ключи (ПП 1154: таблица соответствия хранится отдельно); TTL 30 дней; каждое чтение — в staff_audit_log"
  fpe: "FF1 (NIST SP 800-38G) — только если нужен валидный формат в фикстурах; FF3 не использовать"
  guard: "MUST: router отклоняет T1-вызов, если в payload найден шаблон tok_[a-z_]+_[A-Z2-7]{16} (тест)"

call_types:                        # список совпадает с models.yaml#call_types; здесь — допустимые tier с точки зрения ПДн
  interview:           { allowed: [T0, T1], t1_requires: scrub, note: "сырой ввод пользователя; предпочтительный tier — models.yaml" }
  card:                { allowed: [T0, T1], t1_requires: scrub }
  plan:                { allowed: [T0, T1], t1_requires: scrub }
  system_plan:         { allowed: [T0, T1], t1_requires: scrub, note: "B2-20: бриф и ответы интервью после scrub; сам план без ПДн (modules.yaml#system_plan.privacy)" }
  build_texts:         { allowed: [T0, T1], t1_requires: scrub, note: "B2-21: тексты секций утверждённого плана (план без ПДн, modules.yaml#system_plan.privacy)" }
  build_design:        { allowed: [T0, T1], t1_requires: scrub, note: "B2-21: ниша, цели и текущий дизайн плана — без ПДн" }
  build_custom:        { allowed: [T0, T1], t1_requires: scrub, note: "B2-23: ниша, цели, описание частей plan.custom и сводка спеки (сущности, роли, страницы) — без записей и ПДн" }
  build_ops:           { allowed: [T0, T1], t1_requires: scrub }
  build_code:          { allowed: [T0, T1], t1_requires: scrub }
  fix:                 { allowed: [T0, T1], t1_requires: scrub }
  qa_generate:         { allowed: [T0, T1], t1_requires: scrub, note: "seed только синтетический" }
  qa_explain:          { allowed: [T0, T1], t1_requires: scrub }
  audit:               { allowed: [T0, T1], t1_requires: scrub, note: "G4, после MVP; модель другого семейства" }
  import_mapping:      { allowed: [T0, T1], t1_requires: "SyntheticPayload (import.payload); реальные значения → только T0" }
  interview_v3:        { allowed: [T0, T1], t1_requires: scrub, note: "V3-03, D77 (8): грилл-интервью; сырой ввод и ТЗ из файла — правило ПДн как у interview (V3-16: любая находка → T0 до M2-28)" }
  brief_extract:       { allowed: [T0], note: "V3-04: разбор ТЗ из файла — документ клиента может содержать ПДн и реквизиты; только T0" }
  art_direction:       { allowed: [T0, T1], t1_requires: scrub, note: "V3-07, V3-09: ниша, цели, голос, фирменный цвет, аудитория и сценарии посетителя из брифа — после scrub, без ПДн; тексты первых экранов трёх направлений" }
  page_compose:        { allowed: [T0, T1], t1_requires: scrub, note: "V3-12: код страниц по брифу (тексты без ПДн, D77 (9)); записи систем не передаются" }
  signature_section:   { allowed: [T0, T1], t1_requires: scrub, note: "V3-12: фирменные секции по брифу и дизайн-системе — без ПДн" }
  critic_visual:       { allowed: [T0, T1], t1_requires: "изображение после packages/pii/image (D45, D62); до него — только T0", note: "V3-13: скриншоты сгенерированных страниц на тестовых данных" }
  techreview:          { allowed: [T0], note: "V3-15: ревьюер системы — модель другого семейства, чем строитель" }
  research:            { allowed: [T0], note: "V3-05: сводка найденных страниц и документации; запрос к поиску — после scrub" }
  runtime_ai_extract:  { allowed: [T0] }
  runtime_ai_generate: { allowed: [T0] }
  support:             { allowed: [T0] }
  pii_forbidden_for_T1: ["import_mapping(real values)", runtime_ai_extract, runtime_ai_generate, support]

routing:
  normative_order: "Порядок шагов, route_reason и цепочки моделей — specs/agents/models.yaml#routing_algorithm (единственный источник). Ниже — ограничения ПДн, которым он MUST соответствовать; противоречие = баг спеки"
  constraints:
    - "callType не из call_types → route() бросает UNKNOWN_CALL_TYPE (вызов не выполняется); любая иная неясность политики → T0"
    - "orgPolicy.ruOnly → T0 (policy_ru_only)"
    - "orgPolicy.t1Restricted → T0 (policy_region_restricted) — см. region_restriction"
    - "T1 ∉ allowed → T0 (callType_forbidden_T1); import_mapping → T1 только если payload собран buildMappingPayload (он передаёт containsPiiHint=false) И detect() по payload = 0 находок"
    - "containsPiiHint=true для любого callType → T0 (pii_hint): вызывающий знает, что в payload реальные записи (шаг models.yaml#routing_algorithm)"
    - "Находки strong-видов (все kinds с strong: true в detectors.kinds), special_context или biometric_context → T0 (pii_high_risk); models.yaml шаг 4 ссылается на этот список"
    - "callType=interview: с 05.10.2026 (product.yaml#decisions.D50_brief_pii_routing) — как остальные callType: находки basic-видов заменяются заглушками и вызов идёт на tier по умолчанию; strong-виды и спецкатегории → T0 (pii_high_risk, правило выше). Прежнее «любая находка → T0 (pii_detected_interview)» снято; значение route_reason pii_detected_interview остаётся в CHECK для исторических строк (реализация — M2-28)"
    - "Изображения (вызовы со зрением, D45, D62): к T1 — только после обработки на сервере платформы (packages/pii/image, M2-97): распознанный текст → detect(); имена, телефоны, почты замазываются на изображении, лица размываются; strong-виды (паспорт, СНИЛС, карта) или документ на снимке → вызов только T0 или без изображения. Изображения из записей систем (runtime_ai_*) — только T0 (pii_forbidden_for_T1)"
    - "Иначе tier по умолчанию из models.yaml; если T1 — scrubJson всех сообщений и tool results перед отправкой, scrubbed=true"
  fallback: "Фолбэк и circuit breaker — models.yaml#fallback_rules. Требование границы: фолбэк возможен только T1 → T0, никогда T0 → T1. Пользователь видит только общую строку «Часть шагов выполнена на моделях в РФ» (формулировка — models.yaml#fallback_rules; платформа показывает её по step_finished.ruFallback, platform/workflows.yaml#events; L4-20). Событие model_switched {fromModel, toModel, reason} — только во внутренний журнал, в SSE пользователя не отдаётся (tier не раскрывается)"
  model_registry:
    - "MUST: T0 допускает только модели с placement=internal в agents/models.yaml (внутренние модели Cloud.ru, Yandex AI Studio). «Внешние» модели Cloud.ru (GLM-5.2, DeepSeek-V4-Flash) MUST NOT быть T0; партнёрские Claude/GPT/Gemini запрещены вовсе (правило ниже)"
    - "MUST NOT: API и сервисы Anthropic, OpenAI, Google, xAI (в т. ч. их модели у посредников) в реестре. Открытые веса этих вендоров, развёрнутые в РФ (placement=internal, например openai/gpt-oss-120b на Cloud.ru), допустимы — решение F3. Тест-линтер реестра проверяет provider и baseUrl, а не префикс имени модели"
    - "MUST: каждый запрос к Yandex AI Studio несёт заголовок x-data-logging-enabled: false (тест на мок-сервере)"
    - "MUST: у каждого провайдера T1 — дата последней проверки условий (models.yaml#providers.<id>.termsCheckedAt); старше 90 дней → предупреждение в CI"
    - "DeepSeek API (провайдер deepseek, Ханчжоу, хранение в КНР, обучение с opt-out) — T1 на тех же условиях, что Z.ai: только после scrub, MUST NOT для pii_forbidden_for_T1 и вызовов с вложениями; thinking выключен в каждом запросе. До замера — только претендент eval (enabled=false, вне цепочек routes; models.yaml#providers.deepseek). С 05.10.2026 (D54): включается в цепочки T1 после замера (eval не хуже GLM-5.3 по g0g1_pass) на тех же условиях, что Z.ai; решение о включении — PR с отчётом eval и строкой в CHANGELOG. Kimi напрямую у Moonshot — не включается без договора о запрете обучения"
  storage_of_content: >
    Содержимое промптов и ответов НЕ хранится в llm_calls и логах. Отладочные транскрипты (M1+, по умолчанию выключены): только после scrub,
    в РФ, отдельная таблица с TTL 30 дней, доступ под staff_audit_log. Ошибки провайдеров логируются только как {status, code} — тело ответа
    (эхо промпта) не логируется. MUST: durable-движок (DBOS, схема dbos) не хранит содержимое промптов и ответов LLM и значения секретов:
    выход LLM-шага — ссылки (revision, messageId), секрет — только secret://name (platform/workflows.yaml). Fixture-запись (WIZARD_LLM_MODE=record)
    — только для брифов eval-стенда без ПДн: record отказывает, если sha256 брифа ∉ tools/eval/briefs и demo; T0-запросы в фикстуре хранятся
    после scrub (ключ фикстуры считается от scrubbed-формы)

region_restriction:                # условия Z.ai: тенанты из запрещённых регионов — только T0 (CHANGELOG week0); M0-06 — поле и шаг роутера, M1 — источники; правило T0 — product.yaml#decisions.D26_models_default
  principle: "D26_models_default (2026-10-04): только T0 — лишь когда регион организации ИЗВЕСТЕН и входит в restricted_regions (по любому источнику из sources) или когда клиент сам включил «Только РФ» (ru_only). Во всех остальных случаях сборка идёт на модели по умолчанию (T1, models.yaml#routes) с удалением ПДн (scrub)"
  restricted_regions: "Коды субъектов РФ 90 Запорожская обл., 91 Республика Крым, 92 Севастополь, 93 ДНР, 94 ЛНР, 95 Херсонская обл. Точный список — E-LEGAL (условия Z.ai явно называют Крым, Донецк, Запорожье); до ответа юриста действуют все шесть (безопасный вариант)"
  fields: "platform.orgs.region_code text (двузначный код субъекта РФ; NULL — неизвестен) и platform.orgs.t1_restricted boolean not null default false (db.yaml#tables.orgs)"
  sources:
    - "Регион, указанный при регистрации организации (выбор из списка субъектов; на пилоте приглашение его не требует — тогда region_code = NULL)"
    - "ИНН организации или ИП из реквизитов и привязки карты: первые две цифры — код региона"
    - "Офлайн-GeoIP по IP входов участников org: база хранится и обновляется в РФ, без внешних запросов; лицензия базы допускает коммерческое использование, атрибуция — THIRD_PARTY_NOTICES.md"
  rule: "t1_restricted = true, если region_code ∈ restricted_regions ИЛИ любой вход участника org за 90 дней геолоцирован в restricted_regions (даже при другом region_code) — это тоже «известный регион». Пересчёт — при входе и смене реквизитов. Снять флаг может только staff по документам (staff_audit_log)"
  unknown_region: "region_code = NULL (регион не указан и не выведен) T1 НЕ ограничивает (D26, заменяет прежний fail_safe «NULL → T0»): платформа передаёт роутеру orgPolicy.t1Restricted = orgs.t1_restricted (по умолчанию false). Реализация — apps/platform-api orgPolicyOf (задача M2-31)"
  router_fail_safe: "Отдельно от региона: если вызывающий не передал orgPolicy или поле t1Restricted (политика не загружена или неизвестна), route() считает t1Restricted=true → T0 (architecture.yaml#interfaces.llm_call, M0-06). Платформа всегда передаёт поле явно"
  routing: "orgPolicy.t1Restricted — шаг models.yaml#routing_algorithm сразу после ruOnly; значение policy_region_restricted — в CHECK route_reason (db.yaml#tables.llm_calls)"

audit:
  table: platform.llm_calls
  fields: "db.yaml#tables.llm_calls = models.yaml#usage_record (одна строка на HTTP-попытку): callType, tier, модель, routeReason, policyVersion, pii_categories_count (только счётчики по kind), scrubbed, токены, стоимость"
  rule: "MUST NOT: текст, фрагменты, хэши отдельных значений ПДн. CHECK (tier = 'T0' or scrubbed) на уровне БД"
  report: "Еженедельная выборка: доля T1-вызовов с pii_categories_count ≠ {} (ожидаемо: только плейсхолдеры), доли pii_high_risk, pii_detected_interview и fallback_* — в Grafana"

ru_only:
  milestone: M1
  setting: "orgs.ru_only (PATCH /orgs/:id/settings, только owner)"
  effect: "Все вызовы организации → T0 со следующего LLM-шага (router читает политику на каждый вызов, кэш ≤ 10 с). При включении ruOnly или t1_restricted — инвалидация кэша политики (pub/sub) и отмена T1-вызовов организации в полёте (AbortSignal); прерванный шаг повторяется на T0"
  ui: "Бейдж «Только российский контур» в шапке; при включении — предупреждение, что сборка может быть медленнее/дороже (цифры из eval)"
  test: "Включение ruOnly посреди fixture-прогона → все последующие llm_calls.tier = T0"

import:
  milestone: M1
  payload: >
    SyntheticPayload — брендированный тип, создаётся ТОЛЬКО функцией packages/pii/import#buildMappingPayload(sheet):
    {sheets: [{name*, columns: [{header*, inferredType, pattern, checksumValidShare, nullShare, distinctRatio, avgLength,
    piiKindGuess}], syntheticRows: ≤ 5}]}. * — после scrub; заголовок/имя листа с находкой → col_<n>/sheet_<n>.
    Числовые колонки — только округлённые min/max; свободный текст — «free_text, средняя длина N».
  synthetic: "Синтетические строки генерируются локально по профилю (@faker-js/faker, MIT, локаль ru) — ни одно реальное значение не копируется"
  values: "Реальные значения читаются только процессом импорта и пишутся в app_<key>_draft без LLM; исходный файл — в S3 imports (SSE-KMS), TTL 7 дней"
  test: "M1-07: xlsx с 50 канареечными значениями (уникальные ФИО/телефоны/email) → мок T1 фиксирует все запросы; ни одна канарейка не встречается; в app-схеме все 50 строк"

tests:                             # MUST в CI (M0-06, M1-07, milestones M0 exit)
  - "Матрица роутера: каждый callType × ruOnly{true,false} × t1Restricted{true,false} × payload{без ПДн, basic, strong, special} × containsPiiHint{undefined,false,true} → ожидаемый tier и route_reason из models.yaml (таблица-фикстура packages/llm/test/routing.matrix.json)"
  - "Регион (D26): org с region_code=91 и org с region_code=77, но входом с IP из restricted_regions (мок GeoIP) → все вызовы tier=T0, route_reason=policy_region_restricted; org с region_code=NULL и org с region_code=77 без таких входов → tier по умолчанию (T1 при t1_default); orgPolicy без поля t1Restricted → T0 (router_fail_safe)"
  - "Включение ruOnly во время T1-вызова в полёте (мок с задержкой) → вызов отменён, повтор ушёл на T0"
  - "Канарейки e2e: fixture-прогон «форум», бриф с ФИО (в т. ч. латиницей и неславянским), телефоном РФ и не РФ, email, @handle, паспортом, СНИЛС; мок-провайдер T1 записывает payload; assert: 0 вхождений канареек, 0 совпадений detect() кроме плейсхолдеров; вызовы со strong-видами ушли на T0; интервью с basic-ПДн ушло на T1 только с заглушками (D50)"
  - "Канарейки в изображениях (M2-97): PNG с ФИО, телефоном и email → в T1-payload изображение с замазанными участками и 0 канареек в распознанном тексте; PNG со страницей паспорта → вызов T0 или без изображения"
  - "llm_calls после прогона: нет колонок с текстом; pii_categories_count заполнен; для всех tier=T1 scrubbed=true"
  - "Токены tok_* в T1-payload → ошибка до отправки"
  - "runtime_ai_*, support: при любых входах tier=T0 (M3-02 повторно)"
  - "Детекторы: корпус с порогами из detectors.quality; отдельные тесты контрольных сумм СНИЛС/ИНН/Луна (валидные и с одной изменённой цифрой)"
  - "Логгер: allowlist полей, свободный текст не логируется; канареечный e2e + grep логов всех процессов (platform-api, runtime, воркер, egress-proxy) — 0 вхождений канареек (deploy.yaml#cloud.observability)"

byok:                              # V3-33, product.yaml#decisions.D77_v3 (14), (14б); D18 — запрет западных API на ключах ПЛАТФОРМЫ
  principle: "Ключи пользователя к любым провайдерам — с его однократного явного согласия; ограничения только для защиты от юридических рисков. gateway_allowlist (models.yaml) охраняет ключи платформы и BYOK не касается"
  flag:
    default: "Выключено для всех. WIZARD_BYOK_ORGS=<uuid,…> — организации основателя для проверки; WIZARD_BYOK=on — для всех"
    rule: "MUST NOT: WIZARD_BYOK=on до проверки схемы юристом (V3-35, docs/reviews/grill-8.md № 14б). Флаг выключен → GET /orgs/:id/byok отвечает {available: false}, раздел скрыт, роутер не получает хука"
  providers:
    source: "packages/llm/src/byok/providers.json (данные, не код): acceptsRu, baseUrl, officialHosts, verifiedModels"
    direct: "acceptsRu=true (Z.ai, DeepSeek, Moonshot, Cloud.ru) — вызов напрямую по baseUrl списка; адрес шлюза не принимается"
    gateway: "acceptsRu=false (OpenAI, Anthropic, Google, xAI, «другой провайдер») — только OpenAI-совместимый шлюз пользователя: https, без логина/пароля и параметров в адресе, не officialHosts провайдеров, блокирующих РФ, не частная сеть (проверка при сохранении и на каждом DNS-ответе при соединении; редиректы запрещены)"
    no_workarounds: "MUST NOT: свои прокси, VPN или иные обходы геоблокировок; прямой вызов officialHosts провайдера, блокирующего РФ"
    unverified: "Модель вне verifiedModels помечается «не проверена нами»; гейты, критик и техревью работают на моделях платформы"
  call_types:
    allowed: [interview, interview_v3, card, plan, system_plan, art_direction, build_texts, build_design, build_custom, build_ops, build_code, fix, page_compose, signature_section]
    never: "T0-only (brief_extract, research, runtime_ai_*, support), import_mapping, и проверки качества — techreview, audit, qa_generate, qa_explain, critic_visual (скриншоты не маскируются до packages/pii/image, M2-97): они всегда на моделях платформы"
    rule: "Вызов уходит на ключ пользователя только если на нём проходят правила T1 целиком (packages/llm byokDecision): не ruOnly, t1Restricted = false, нет containsPiiHint, нет strong/special ПДн, у сырого ввода интервью нет находок, нет вложений и токенов tok_*; переключатель уровня сборки (week0) не влияет"
  scrub: "MUST: перед любым вызовом по ключу пользователя — pii.scrub всех сообщений (плейсхолдеры scrub.placeholders), независимо от страны провайдера: модель выбирает пользователь, её размещение нам не видно"
  storage:
    scheme: "Конвертное шифрование: ключ → AES-256-GCM ключом данных (AAD byok:<org>:<id>), ключ данных обёрнут OpenBao Transit (transit/datakey/plaintext, decrypt; ключ wizard-byok) или локальным KEK стенда (SecretStore, WIZARD_SECRETS_KEY) — тот же интерфейс TransitKms. В БД только шифртекст, обёрнутый ключ данных и последние 4 символа (db.yaml#byok_keys)"
    kms: "WIZARD_BYOK_KMS=openbao (по умолчанию в production; WIZARD_OPENBAO_ADDR, WIZARD_OPENBAO_TOKEN с политикой только datakey и decrypt этого ключа) | local (dev, тесты)"
    decrypt: "Расшифровка — только на время вызова (проверка ключа, вызов модели в воркере прогона); ключ не кэшируется"
    revoke: "Отзыв удаляет шифртекст и обёрнутый ключ данных (CHECK в БД)"
    rls: "platform.byok_keys и byok_consents — RLS ENABLE + FORCE по org_id = set_config('wizard.org_id', …, true) в транзакции"
    logs: "MUST NOT: ключ в логах, текстах ошибок, ответах API, llm_calls и деталях валидации; ошибки провайдера сводятся к коду (без тела ответа)"
  consent: "Однократное явное согласие организации (владелец) с текстом версии yyyy-mm-dd.n (apps/platform-api/src/byok/consent.ts): риски условий провайдера, счетов и блокировок несёт пользователь; ПДн маскируются; модельная часть не списывается; при сбое ключа шаг идёт на моделях платформы за кредиты. Запись — db.yaml#byok_consents (версия, sha256 текста, кто, когда). Новая версия текста → ключи не используются до нового согласия"
  billing: "Попытки по ключу пользователя — строки llm_calls с byok = true, tier T1, scrubbed, cost_rub 0, credits_milli 0, billable false (CHECK llm_calls_byok_free): модельная часть сборки не списывается с баланса. Ошибка ключа → шаг идёт по цепочке платформы как обычно и оплачивается; 401/403 и нулевой баланс выключают ключ до новой проверки"
  tests: "packages/llm/test/byok.test.ts (политика, URL, хук роутера, проверка ключа, guarded DNS), apps/platform-api/test/byok.test.ts (флаг, согласие, шифрование, отзыв, RLS, прогон на своём ключе, grep ключа в логах и ошибках), apps/platform-web/test/byok.*.test.ts (раздел настроек 390/1280)"
  legal_v3_35: "До публичного включения юрист подтверждает: текст согласия; трансграничную передачу после маскирования (152-ФЗ, уведомление РКН); ответственность за условия провайдеров; запрет для restricted_regions; хранение у провайдеров КНР (DeepSeek, Moonshot)"
