# Вехи. Критерий готовности вехи = все её задачи в backlog.yaml закрыты + exit_criteria проходят.
milestones:
  - id: M0
    name: "Первый прототип: локальный вертикальный срез"
    target: "как можно быстрее (ориентир — 2–3 недели агентной работы)"
    goal: >
      На одной машине пройти путь: промпт → вопросы-кнопки → карточка системы → сборка (спека + React-код)
      → гейты G0 и базовый G1 → живое превью системы. Работает офлайн на fixture-LLM (демо-сценарий форума)
      и онлайн с ключами Cloud.ru и/или Z.ai.
    in_scope:
      - "Монорепо, CI (lint, typecheck, test), скрипт `pnpm dev` поднимает всё локально"
      - "packages: appspec, pii (базовые детекторы), llm (роутер T0/T1 + fixture), sdk, ui-kit (8 компонентов ядра), agents, gates (G0, G1-базовый)"
      - "apps: platform-api (один локальный пользователь, прогоны в процессе), runtime (data API + права + RLS, функции в unsafe-local), platform-web (чат, кнопки, карточка, журнал сборки, превью, отчёт гейтов, панель «Стиль»)"
      - "Демо-сценарии в fixture-режиме: форум (ивенты) и кондитерская (товары на заказ)"
    out_of_scope: ["аккаунты и команды", "кредиты и оплата", "prod-публикация", "коннекторы кроме QR", "DBOS", "изоляция workerd/gVisor"]
    exit_criteria:
      - "`pnpm i && pnpm dev` на чистой машине с Postgres 16 поднимает платформу на :4000 и runtime на :4100"
      - "`pnpm test` зелёный; `pnpm e2e` (Playwright) проходит сценарий «форум» в fixture-режиме от промпта до превью с созданием билета"
      - "С ключами (WIZARD_LLM_MODE=live) хотя бы 1 из 12 брифов eval-стенда собирается до прохождения G0"
      - "Никакие данные с ПДн не уходят к T1 (юнит-тест роутера + тест журнала вызовов)"

  - id: M1
    name: "Альфа: надёжность и публикация"
    target: "неделя 9"
    goal: "Durable-прогоны, аккаунты и команды, кредиты, draft/prod, миграции и откат, email и Telegram, полноценная граница данных, eval в CI"
    exit_criteria:
      - "Прогон переживает рестарт воркера (тест с kill -9)"
      - "Публикация в prod с аддитивной миграцией на живых данных и откат к предыдущей ревизии — e2e-тест"
      - "Карточка системы показывает оценку и потолок кредитов; списание по факту через ledger"
      - "Импорт таблицы: к T1 уходит только схема + синтетические строки (тест)"

  - id: M2
    name: "Закрытая бета"
    target: "неделя 16"
    goal: "Всё из differentiators_mvp: ЮKassa, QR с офлайн-сканером (PWA), команды, G2 с антифродом, workerd+gVisor, развёртывание в Cloud.ru на отдельном домене систем, биллинг, пакет 152-ФЗ в системах, «Пожаловаться»"
    exit_criteria:
      - "6–8 дизайн-партнёров провели минимум по одному реальному событию/продаже"
      - "G2 блокирует 100% кейсов из набора антифрод-фикстур (фишинг-формы карт/паролей/паспортов, имитация брендов)"
      - "Security review изоляции кода пройден (escape-тесты workerd+gVisor)"
      - "Юридический пакет от юриста интегрирован (оферта, ДПО, политика, согласия)"

  - id: M3
    name: "Вторая волна беты"
    target: "недели 17–19"
    goal: "«Укажи и измени», ИИ-действия extract/generate на T0, доводка по обратной связи"
    exit_criteria:
      - "Клик по элементу превью → правка затрагивает только файл выбранного компонента (тест)"
      - "ИИ-действия уважают месячный лимит и никогда не вызывают T1 (тест)"

  - id: M4
    name: "Публичный запуск"
    target: "неделя 20"
    goal: "Финальное название и домены, лендинг, самостоятельная регистрация, Free/тарифы, нагрузочный тест, мониторинг"
