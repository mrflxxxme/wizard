# Вехи. Критерий готовности вехи = все её задачи в backlog.yaml закрыты + exit_criteria проходят.
milestones:
  - id: M0
    name: "Первый прототип: локальный вертикальный срез"
    target: "как можно быстрее: ≈ 12 агенто-дней по критическому пути при 6–7 агентах в пике (plan)"
    goal: >
      На одной машине пройти путь: промпт → вопросы-кнопки → карточка системы → сборка (спека + React-код)
      → гейты G0 и базовый G1 → живое превью системы. Работает офлайн на fixture-LLM (демо-сценарий форума)
      и онлайн с ключами Cloud.ru и/или Z.ai.
    in_scope:
      - "Монорепо, CI (lint, typecheck, test), скрипт `pnpm dev` поднимает всё локально"
      - "packages: appspec, pii (базовые детекторы), llm (роутер T0/T1 + fixture), sdk, ui-kit (компоненты scope.M0), build (esbuild + wz-id), connectors (configSchema/validateSpec, QR online, mock-оплата), agents, gates (G0, G1-базовый), e2e"
      - "apps: platform-api (один локальный пользователь, прогоны в процессе), runtime (data API + права + RLS, функции в unsafe-local), platform-web (чат, кнопки, карточка, журнал сборки, превью, отчёт гейтов, панель «Стиль»)"
      - "Демо-сценарии на золотых фикстурах (M0-21, ключи не нужны): форум (ивенты) — до превью и QR-входа; кондитерская (товары на заказ) — до G0=passed"
    out_of_scope: ["аккаунты и команды", "ledger, баланс и оплата (в M0 только подсчёт кредитов прогона, оценка и потолок)", "prod-публикация", "коннекторы кроме QR (для остальных — только configSchema/validateSpec и test-mode заглушки)", "DBOS", "изоляция workerd/gVisor", "исполнение воркфлоу систем (_w_jobs только пишется), runWorkflows/advanceTime в DSL", "warning-проверки G0", "rate limits, полный CSP, PWA и OTP в runtime", "e2e кондитерской (S9) — M1, неблокирующий"]
    exit_criteria:
      - "`pnpm i && pnpm dev` на чистой машине с Postgres 16 поднимает платформу на :4000 и runtime на :4100"
      - "`pnpm test` зелёный; `pnpm e2e` (Playwright) проходит сценарий «форум» в fixture-режиме от промпта до превью с созданием билета"
      - "С ключами (WIZARD_LLM_MODE=live) хотя бы 1 из 12 брифов eval-стенда собирается до прохождения G0 (ключи — E-ACCESS в день 0, escalation.yaml#calendar)"
      - "Никакие данные с ПДн не уходят к T1 (юнит-тест роутера + тест журнала вызовов)"
      - "Итог eval недели 0 применён по D2_w0_fallback (M0-30)"
    plan:                      # docs/reviews/spec-audit/L2-executability.md §3; день 0 = 2026-09-30
      critical_path: "M0-04 → M0-09 (2,5) → M0-23 (2) → M0-11 (2) → M0-14 (1) → M0-26 (1,5) → M0-17 (1,5) ≈ 12 агенто-дней; вторая ветка M0-05 → M0-06 → M0-12 → M0-13 заканчивается к дню 7,5"
      speedup: "M0-09 первым делом публикует DataAccess (architecture.yaml#interfaces.data_access) — M0-23 стартует с дня 2,5 (путь ≈ 10 дней)"
      waves:
        - { group: m0-w0, window: "дни 0–1,5", tasks: [M0-01, M0-02, M0-03, M0-04, M0-05, M0-07, M0-08, M0-19, M0-20, M0-27, M0-28, M0-29] }
        - { group: m0-w1, window: "дни 1–5", tasks: [M0-06, M0-09, M0-10, M0-15, M0-16, M0-21, M0-25] }
        - { group: m0-w2, window: "дни 2,5–6", tasks: [M0-12, M0-22, M0-23, M0-24, M0-30] }
        - { group: m0-w3, window: "дни 4,5–8,5", tasks: [M0-11, M0-13, M0-18] }
        - { group: m0-w4, window: "дни 8–9", tasks: [M0-14] }
        - { group: m0-w5, window: "дни 9–10,5", tasks: [M0-26] }
        - { group: m0-w6, window: "дни 10,5–12", tasks: [M0-17] }
      human_actions: "Единственное действие основателя на пути M0 — E-ACCESS (ключи Cloud.ru FM и Z.ai) в день 0; всё остальное — на золотых фикстурах"

  - id: M1
    name: "Альфа: надёжность и публикация"
    target: "неделя 9"
    goal: "Durable-прогоны, аккаунты и команды, кредиты, draft/prod, миграции и откат, email и Telegram, полноценная граница данных, eval в CI"
    note: "prod в M1 — локальный/staging; публичный prod только после привязки карты (M2-07)"
    exit_criteria:
      - "Прогон переживает рестарт воркера (тест с kill -9)"
      - "Публикация в prod с аддитивной миграцией на живых данных и откат к предыдущей ревизии — e2e-тест"
      - "Карточка системы показывает оценку и потолок кредитов; списание по факту через ledger"
      - "Импорт таблицы: к T1 уходит только схема + синтетические строки (тест)"
      - "S10 (команда, «только РФ», ревизии и откат) и карточка «Публикация» в S6 работают в e2e (M1-11)"

  - id: M2
    name: "Закрытая бета"
    target: "неделя 16"
    goal: "Всё из differentiators_mvp: ЮKassa, QR с офлайн-сканером (PWA), команды, G2 с антифродом, workerd+gVisor, развёртывание в Cloud.ru на отдельном домене систем, биллинг, пакет 152-ФЗ в системах, «Пожаловаться»"
    exit_criteria:
      - "6–8 дизайн-партнёров подключены, у каждого есть система в draft или prod"
      - "До первого реального пользователя беты закрыта M2-13 (beta_readiness): уведомление РКН по ст. 22 подано; позиция юриста по хостингу и ОРИ исполнена; поручения Cloud.ru и Yandex подписаны; письменное подтверждение Z.ai получено или T1 отключён; в docs/security — модель угроз, акт УЗ, перечень допущенных, runbook pd-incident. Пилот на паре клиентов (product.yaml#decisions.D25_pilot_no_legal) — без M2-13, флаг с заметкой D25; M2-13 — до открытой беты"
      - "G2 блокирует 100% кейсов из набора антифрод-фикстур (фишинг-формы карт/паролей/паспортов, имитация брендов)"
      - "Security review изоляции кода пройден (escape-тесты workerd+gVisor)"
      - "Юридический пакет от юриста интегрирован (оферта, ДПО, политика, согласия)"

  - id: M2P
    name: "P — полнофункциональный пилот"
    target: "до первых клиентов пилота (product.yaml#decisions.D41_all_before_clients); первые приглашения — после M2-90"
    goal: >
      Живая, не фикстурная платформа Born to Build: лучшие модели по умолчанию, рубли вместо кредитов, человек на связи
      («Написать команде», «Передать команде», гарантия запуска), четыре класса систем без ручной доводки (сайт с заявками,
      запись с напоминаниями, подписка и платный доступ, CRM), оплата в магазин клиента через пять сервисов РФ, сообщения почтой,
      SMS и в Telegram, интеграции (amoCRM, Битрикс24, Tilda, МойСклад, СДЭК, вебхуки, исходящий HTTP по allowlist), свой домен,
      Метрика, Яндекс Карты, SmartCaptcha, SEO, изображения и видео, темы и дизайн-агент, правила humanizer для всех текстов наружу,
      раздел «Запросы на развитие», ограничения только по закону и ИБ (D44), без выдуманных фактов (D49), серые зоны по решениям
      основателя 05.10.2026 (D50–D64). Решения — product.yaml#decisions D26–D64 и product.yaml#gray_zone
    note: >
      Идёт после пилотного режима M2-15…M2-19 и до первых клиентов пилота; бета (M2-09, M2-13) — после. Id вехи M2P, а не «P»:
      tools/specs/validate.mjs требует id задач вида M<n>-<nn>, tools/specs/slice.mjs — веху вида M<n>… (M2P читается как M2).
      Задачи вехи — M2-17, M2-20…M2-99 (81 задача). Раунд правок 05.10.2026 (аудиты docs/reviews/spec-audit/2026-10-04-M2P-*.md
      и grill-4 № 27–44): новые M2-17, M2-95…M2-99; id M2-31 и M2-72 переиспользованы — прежние «правило региона» и «Битрикс24»
      объединены с M2-32 и M2-71; M2-91 и M2-92 закрыты (таблица ревизии и решения основателя готовы). Спецификация впереди кода:
      волна p-w0 пишет контракты, остальные волны их реализуют; описание задач в backlog.yaml — договорённость об именах между
      параллельными задачами p-w0. Волна = глубина зависимостей: агент берёт задачу по готовности deps, сначала critical: true
      (AGENTS.md п. 1). Дизайн-часть опирается на docs/research/design-agent-sources.md и design-agent-catalog.md; интеграции —
      docs/research/integrations-2026-10.md
    in_scope:
      - "Модели и регион (D26, D50, D54), бренд и домены (D27), humanizer и кабинет без жаргона (D28, D48), рублёвая модель и начальные лимиты (D31, D58)"
      - "Человеческий слой: «Написать команде», «Передать команде», «Под ключ», гарантия, рабочие часы (D30, D32, D60)"
      - "Четыре класса систем (D33) и инструмент «Запросы на развитие» (D34); спецкатегории ПДн на пилоте не обрабатываются (D51)"
      - "Платежи и подписки в магазин клиента: ЮKassa, Т-Касса, CloudPayments, Robokassa, Prodamus, чеки 54-ФЗ, платный доступ в правах AppSpec (D35)"
      - "Сообщения: почта, SMS-агрегатор, Telegram платформы и свои отправители клиента; посетители без аккаунта — только транзакционные, с согласием и лимитами; имя клиента в Telegram по флажку владельца (D36, D53)"
      - "Интеграции: исходящий HTTP по allowlist через egress-прокси с журналом, входящие вебхуки с проверкой по способу сервиса, amoCRM и Битрикс24 по инструкции, Tilda, МойСклад, СДЭК (D37, D63)"
      - "Адреса и сайт: <имя>.sandpile.ru, свой домен с подтверждением владения, Яндекс Метрика, Яндекс Карты, SmartCaptcha, SEO, изображения на страницах, видео Rutube/VK Видео/Kinescope (D38, D57)"
      - "Дизайн: расширенный ui-kit, 6–8 тем, дизайн-агент с тремя направлениями и критиком, проверки на телефоне и десктопе (D39); изображения: загрузка и стоки Pexels и Pixabay с хранением у нас (D61), маскирование ПДн на изображениях перед моделями (D62); шрифты (D64)"
      - "Документы с сильными идентификаторами — с шифрованием полей по заявке (D52); правки prod, удаляющие данные, — с подтверждением, снимком и откатом (D56)"
      - "Порог готовности: live-набор из 20 брифов, независимый аудит, живые смоуки провайдеров и коннекторов, сценарии основателя, e2e без золотого брифа (D41, D42, D43, D59)"
    out_of_scope:
      - "Нативные приложения и публикация в App Store / Google Play (только устанавливаемое PWA)"
      - "Генерация изображений ИИ; Unsplash (D61)"
      - "Публичный лендинг и открытая регистрация"
      - "Включение оплаты рублёвой модели (оферта, магазин платформы, E-LEGAL) — после пилота"
      - "Кнопка экспорта кода (исходники «под ключ» — вручную, D55); чат-виджеты, боты и ИИ-ассистент в системах клиентов (D55)"
      - "Маркетинговые рассылки, второй язык систем, полный поток спецкатегорий ПДн — после пилота (D51, D55); публичные приложения amoCRM и Битрикс24 (D63)"
      - "Ослабления таблицы ревизии, требующие новых функций (свой CSS систем, docx и xlsx с антивирусом, несколько ролей, встраивание /embed и др.) — перечень в M2-93, решение о приоритете после пилота"
    exit_criteria:
      - "Live-набор P (20 брифов, по 5 на класс, quality/eval.yaml#thresholds.by_milestone.M2P): ≥ 16 из 20 доходят до готовности к публикации (G0–G2 без блокеров) без помощи человека — ревью основателя в замер не входит (D59); медиана времени сборки ≤ 40 мин; расход на модели ≤ 300 ₽ на систему; бюджет замера — до 6 000 ₽ в месячном лимите платформы (M2-88, повтор провалившихся — M2-89)"
      - "Брифы, выходящие за возможности, заканчиваются честным ответом, альтернативой и записью в «Запросы на развитие»; 0 ложных блокировок G2 на наборе P (M2-88)"
      - "Результаты прогона проверены моделью другого семейства и не меньше чем двумя независимыми агентами-ревьюерами; отчёт в tools/eval/results/ и docs/reviews/p-eval/ (M2-88)"
      - "Живые смоуки на тестовых аккаунтах (D41, fidelity P-06): каждый из пяти платёжных сервисов, SMS-агрегатор, amoCRM, Битрикс24, Tilda, МойСклад, СДЭК; свой домен клиента подключён на реальной DNS-записи — docs/reviews/p-eval/connectors-smoke.md (M2-88)"
      - "Основатель прошёл по одному сценарию каждого класса на локальном стенде в live-режиме (M2-90)"
      - "packages/e2e/specs/rehearsal/pilot.spec.ts зелёный без золотого брифа «форум» и без порядка вопросов фикстуры (M2-85)"
      - "Линтер humanizer в строгом режиме: 0 нарушений в текстах кабинета, письмах и шаблонах систем (M2-86, M2-87)"
      - "В кабинете клиента нет кредитов и технического жаргона вне «Подробнее для специалиста» (M2-86)"
      - "Серые зоны записаны в product.yaml#gray_zone и применены в гейтах, антифроде и согласиях (M2-92, M2-93)"
      - "Тексты агентов и систем: 0 выдуманных отзывов, превосходных степеней без основания и цифр без источника в собранных системах набора P (G2-COPY, M2-88)"
    release_cut:               # D65–D73, docs/reviews/grill-5.md: срез выпуска MVP до первых клиентов; остальное M2P — волнами после
      goal: >
        Рабочая система на сервере пилота с ценностью для клиента как можно скорее: живые модели, универсальная сборка (D66) с рецептами
        трёх классов (сайт с заявками, запись с напоминаниями, CRM), уведомления владельцу и посетителю, блоки лендинга, картинки и
        4 темы, исходящий HTTP и вебхуки, удаляющие правки с предупреждением, «Написать команде», «Запросы на развитие», «на пилоте
        бесплатно» с лимитом 5 сборок и 20 правок
      tasks: "задачи backlog.yaml с release: mvp; объём каждой — её поле mvp_scope (остальное из description — после выпуска)"
      deps_rule: "Для задач среза зависимости от контрактов p-w0 не блокируют: контракт пишется в той же задаче ровно в объёме mvp_scope"
      after_release: "Волна 1 — подписка и платный доступ (D35: ЮKassa с автоплатежом, M2-49, M2-64, M2-65, M2-83); дальше по спросу из «Запросов на развитие»: дизайн-агент, свои домены, SMS, стоки, готовые коннекторы, Метрика и видео, рублёвый каталог"
      exit_criteria:
        - "Замер D67 на сервере пилота: 10 брифов, ≥ 7 из 10 доходят до готовности к публикации по G0–G2 без блокеров, расход ≤ 2 000 ₽ (M2-88 в объёме mvp_scope)"
        - "Бриф сверх возможностей заканчивается честным ответом, заменой и записью в «Запросы на развитие» (M2-77, M2-59)"
        - "Новая заявка анонимного посетителя приходит владельцу письмом с данными заявки и в Telegram без ПДн; посетитель с согласием получает подтверждение (M2-50)"
        - "В кабинете клиента нет кредитов и «Докупите»; кнопка «Написать команде» доставляет сообщение основателю в Telegram (M2-56, M2-35, M2-57)"
        - "Основатель прошёл по одному сценарию каждого класса на сервере пилота (M2-90)"
    plan:
      critical_path: "M2-21 (3) → M2-49 (2,5) → M2-64 (2,5) → M2-83 (2) → M2-88 (1,5) → M2-89 (2) → M2-90 (1) ≈ 14,5 агенто-дня (длина не изменилась после раунда правок 05.10.2026). Без запаса идут также M2-50 (→ M2-64); с запасом ≤ 1 дня (critical: true в backlog) — контракты M2-23, M2-24, ветка дизайна M2-42 → M2-62 → M2-94 (запас 0,5), M2-47 → M2-61 → M2-81, M2-52 → M2-71 → M2-79 → M2-86, M2-40, M2-65, M2-70, M2-78. Объём ≈ 148,5 агенто-дня (79 открытых задач): при 6–8 агентах закладывать 18–22 дня, при 12 и больше — ≈ 15 (executability MP-20)"
      waves:
        - { group: p-w0, window: "контракты и инструменты (без зависимостей внутри вехи)", tasks: [M2-17, M2-20, M2-21, M2-22, M2-23, M2-24, M2-25, M2-26, M2-27, M2-28, M2-29, M2-30, M2-91, M2-98, M2-99] }
        - { group: p-w1, window: "независимые потоки возможностей", tasks: [M2-32, M2-33, M2-34, M2-35, M2-36, M2-37, M2-38, M2-39, M2-40, M2-41, M2-42, M2-43, M2-45, M2-46, M2-47, M2-48, M2-49, M2-50, M2-51, M2-52, M2-54, M2-55, M2-72, M2-92, M2-95, M2-96, M2-97] }
        - { group: p-w2, window: "зависимые потоки: интерфейсы, провайдеры, коннекторы, дизайн-агент, шифрование полей, серые зоны", tasks: [M2-31, M2-44, M2-53, M2-56, M2-57, M2-58, M2-59, M2-60, M2-61, M2-62, M2-63, M2-64, M2-65, M2-66, M2-67, M2-68, M2-69, M2-70, M2-71, M2-74, M2-76, M2-84, M2-93] }
        - { group: p-w3, window: "интеграция: классы систем, дизайн-этап и критик, подключения, старт, Tilda и СДЭК, тексты писем", tasks: [M2-73, M2-75, M2-77, M2-78, M2-79, M2-80, M2-81, M2-82, M2-83, M2-87, M2-94] }
        - { group: p-w4, window: "финал: тексты кабинета и бренд, e2e, live-eval со смоуками", tasks: [M2-85, M2-86, M2-88] }
        - { group: p-w5, window: "доводка и повтор провалившихся брифов", tasks: [M2-89] }
