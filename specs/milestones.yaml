# Вехи. Критерий готовности вехи = все её задачи в backlog.yaml закрыты + exit_criteria проходят.
milestones:
  - id: M0
    name: "Первый прототип: локальный вертикальный срез"
    target: "как можно быстрее: ≈ 12 агенто-дней по критическому пути при 6–7 агентах в пике (plan)"
    goal: >
      На одной машине пройти путь: промпт → вопросы-кнопки → карточка системы → сборка (спека + React-код)
      → гейты G0 и базовый G1 → живое превью системы. Работает офлайн на fixture-LLM (демо-сценарий форума)
      и онлайн с ключами Cloud.ru и/или Z.ai.
    in_scope:
      - "Монорепо, CI (lint, typecheck, test), скрипт `pnpm dev` поднимает всё локально"
      - "packages: appspec, pii (базовые детекторы), llm (роутер T0/T1 + fixture), sdk, ui-kit (компоненты scope.M0), build (esbuild + wz-id), connectors (configSchema/validateSpec, QR online, mock-оплата), agents, gates (G0, G1-базовый), e2e"
      - "apps: platform-api (один локальный пользователь, прогоны в процессе), runtime (data API + права + RLS, функции в unsafe-local), platform-web (чат, кнопки, карточка, журнал сборки, превью, отчёт гейтов, панель «Стиль»)"
      - "Демо-сценарии на золотых фикстурах (M0-21, ключи не нужны): форум (ивенты) — до превью и QR-входа; кондитерская (товары на заказ) — до G0=passed"
    out_of_scope: ["аккаунты и команды", "ledger, баланс и оплата (в M0 только подсчёт кредитов прогона, оценка и потолок)", "prod-публикация", "коннекторы кроме QR (для остальных — только configSchema/validateSpec и test-mode заглушки)", "DBOS", "изоляция workerd/gVisor", "исполнение воркфлоу систем (_w_jobs только пишется), runWorkflows/advanceTime в DSL", "warning-проверки G0", "rate limits, полный CSP, PWA и OTP в runtime", "e2e кондитерской (S9) — M1, неблокирующий"]
    exit_criteria:
      - "`pnpm i && pnpm dev` на чистой машине с Postgres 16 поднимает платформу на :4000 и runtime на :4100"
      - "`pnpm test` зелёный; `pnpm e2e` (Playwright) проходит сценарий «форум» в fixture-режиме от промпта до превью с созданием билета"
      - "С ключами (WIZARD_LLM_MODE=live) хотя бы 1 из 12 брифов eval-стенда собирается до прохождения G0 (ключи — E-ACCESS в день 0, escalation.yaml#calendar)"
      - "Никакие данные с ПДн не уходят к T1 (юнит-тест роутера + тест журнала вызовов)"
      - "Итог eval недели 0 применён по D2_w0_fallback (M0-30)"
    plan:                      # docs/reviews/spec-audit/L2-executability.md §3; день 0 = 2026-09-30
      critical_path: "M0-04 → M0-09 (2,5) → M0-23 (2) → M0-11 (2) → M0-14 (1) → M0-26 (1,5) → M0-17 (1,5) ≈ 12 агенто-дней; вторая ветка M0-05 → M0-06 → M0-12 → M0-13 заканчивается к дню 7,5"
      speedup: "M0-09 первым делом публикует DataAccess (architecture.yaml#interfaces.data_access) — M0-23 стартует с дня 2,5 (путь ≈ 10 дней)"
      waves:
        - { group: m0-w0, window: "дни 0–1,5", tasks: [M0-01, M0-02, M0-03, M0-04, M0-05, M0-07, M0-08, M0-19, M0-20, M0-27, M0-28, M0-29] }
        - { group: m0-w1, window: "дни 1–5", tasks: [M0-06, M0-09, M0-10, M0-15, M0-16, M0-21, M0-25] }
        - { group: m0-w2, window: "дни 2,5–6", tasks: [M0-12, M0-22, M0-23, M0-24, M0-30] }
        - { group: m0-w3, window: "дни 4,5–8,5", tasks: [M0-11, M0-13, M0-18] }
        - { group: m0-w4, window: "дни 8–9", tasks: [M0-14] }
        - { group: m0-w5, window: "дни 9–10,5", tasks: [M0-26] }
        - { group: m0-w6, window: "дни 10,5–12", tasks: [M0-17] }
      human_actions: "Единственное действие основателя на пути M0 — E-ACCESS (ключи Cloud.ru FM и Z.ai) в день 0; всё остальное — на золотых фикстурах"

  - id: M1
    name: "Альфа: надёжность и публикация"
    target: "неделя 9"
    goal: "Durable-прогоны, аккаунты и команды, кредиты, draft/prod, миграции и откат, email и Telegram, полноценная граница данных, eval в CI"
    note: "prod в M1 — локальный/staging; публичный prod только после привязки карты (M2-07)"
    exit_criteria:
      - "Прогон переживает рестарт воркера (тест с kill -9)"
      - "Публикация в prod с аддитивной миграцией на живых данных и откат к предыдущей ревизии — e2e-тест"
      - "Карточка системы показывает оценку и потолок кредитов; списание по факту через ledger"
      - "Импорт таблицы: к T1 уходит только схема + синтетические строки (тест)"
      - "S10 (команда, «только РФ», ревизии и откат) и карточка «Публикация» в S6 работают в e2e (M1-11)"

  - id: M2
    name: "Закрытая бета"
    target: "неделя 16"
    goal: "Всё из differentiators_mvp: ЮKassa, QR с офлайн-сканером (PWA), команды, G2 с антифродом, workerd+gVisor, развёртывание в Cloud.ru на отдельном домене систем, биллинг, пакет 152-ФЗ в системах, «Пожаловаться»"
    exit_criteria:
      - "6–8 дизайн-партнёров подключены, у каждого есть система в draft или prod"
      - "До первого реального пользователя беты закрыта M2-13 (beta_readiness): уведомление РКН по ст. 22 подано; позиция юриста по хостингу и ОРИ исполнена; поручения Cloud.ru и Yandex подписаны; письменное подтверждение Z.ai получено или T1 отключён; в docs/security — модель угроз, акт УЗ, перечень допущенных, runbook pd-incident. Пилот на паре клиентов (product.yaml#decisions.D25_pilot_no_legal) — без M2-13, флаг с заметкой D25; M2-13 — до открытой беты"
      - "G2 блокирует 100% кейсов из набора антифрод-фикстур (фишинг-формы карт/паролей/паспортов, имитация брендов)"
      - "Security review изоляции кода пройден (escape-тесты workerd+gVisor)"
      - "Юридический пакет от юриста интегрирован (оферта, ДПО, политика, согласия)"

  - id: M3
    name: "Вторая волна беты"
    target: "недели 17–19"
    goal: "«Укажи и измени», ИИ-действия extract/generate на T0, доводка по обратной связи"
    exit_criteria:
      - "Клик по элементу превью → правка затрагивает только файл выбранного компонента (тест)"
      - "ИИ-действия уважают месячный лимит и никогда не вызывают T1 (тест)"
      - "6–8 дизайн-партнёров провели минимум по одному реальному событию/продаже"

  - id: M4
    name: "Публичный запуск"
    target: "неделя 20"
    goal: "Лендинг под финальным именем (выбрано к неделе 12, домен платформы — D22_domains), самостоятельная регистрация, Free/тарифы, нагрузочный тест, мониторинг"
    exit_criteria:
      - "Нагрузочный тест 200 одновременных прогонов пройден, отчёт в docs/ (M4-01)"
      - "Самостоятельная регистрация и Free работают на домене платформы"
