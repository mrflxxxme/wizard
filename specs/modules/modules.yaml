          - { actor: owner, text: "Открывает панель цели" }
        expect:
          - { kind: metric, text: "По каждой цели плана есть метрика, числа совпадают с данными seed" }

  - id: visitor_cabinet
    version: 1
    name: "Кабинет посетителя"
    summary: "Вход посетителя по коду: свои записи, заявки и абонементы, отмена и перенос"
    status: draft
