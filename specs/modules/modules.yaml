    status: draft
    order: 90
    origin: { kind: v1_code, ref: "ui-kit StatsReport" }
    goals: [visibility]
    params:
      - name: period
        label: "Период по умолчанию"
        type: enum
        options:
          - { value: week, label: "Неделя" }
          - { value: month, label: "Месяц" }
