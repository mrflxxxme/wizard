    goals: [self_service]
    params:
      - name: login
        label: "Вход посетителя"
        type: enum
        options:
          - { value: email_otp, label: "Код на почту" }
          - { value: phone_otp, label: "Код по телефону" }
        default: email_otp
      - { name: show_bookings, label: "Мои записи", type: bool, default: true }
      - { name: show_leads, label: "Мои заявки", type: bool, default: false }
      - { name: show_packages, label: "Мои абонементы", type: bool, default: false }
    requires:
      - { module: booking, reason: "раздел «Мои записи» показывает записи", when: { param: show_bookings } }
      - { module: leads, reason: "раздел «Мои заявки» показывает заявки", when: { param: show_leads } }
      - { module: packages, reason: "раздел «Мои абонементы» показывает абонементы", when: { param: show_packages } }
    provides: { roles: [visitor], routes: ["/me"] }
    metrics:
      - id: visitors_active
        label: "Посетителей входили в кабинет"
        goal: self_service
        unit: count
        better: up
        compute: { kind: function, name: activeVisitors }
    goalScenarios:
      - id: GS-visitor_cabinet-1
        goal: self_service
        title: "Посетитель входит по коду и видит только свои записи"
        withModules: [booking, catalog, notify]
        when: { param: show_bookings }
        steps:
          - { actor: client, text: "Записывается, затем входит в кабинет по коду из письма" }
          - { actor: client, text: "Открывает «Мои записи»" }
        expect:
          - { kind: record, text: "В списке его запись" }
          - { kind: denied, text: "Записей других посетителей нет" }

  - id: packages
    version: 1
    name: "Абонементы и пакеты"
    summary: "Продажа пакетов визитов или периодов, списание визита, остаток и напоминание об окончании"
    status: draft
    order: 60
    origin: { kind: new }
    goals: [retention]
    params:
      - { name: package_label, label: "Как называть пакет", type: string, maxLength: 40, default: "Абонемент" }
      - name: kind
        label: "Что продаём"
        type: enum
        options:
          - { value: visits, label: "Число визитов" }
          - { value: period, label: "Срок" }
          - { value: both, label: "Визиты на срок" }
        default: both
      - { name: validity_days, label: "Срок действия, дней", type: int, min: 7, max: 365, default: 30 }
      - { name: write_off_on_booking, label: "Списывать визит при записи", type: bool, default: true }
      - { name: freeze, label: "Заморозка", type: bool, default: false }
      - { name: expiry_reminder_days, label: "Напомнить об окончании за, дней", type: int, min: 0, max: 14, default: 3 }
    requires:
      - { module: client_card, reason: "абонемент принадлежит клиенту" }
      - { module: booking, reason: "визит списывается по записи", when: { param: write_off_on_booking } }
      - { module: notify, reason: "напоминание об окончании абонемента", when: { param: expiry_reminder_days } }
    provides: { entities: [package_plan, client_package, package_usage] }
    functions:
      - { name: writeOffVisit, kind: mutation, file: functions/packages/writeOffVisit.ts, roles: [$owner, $staff], purpose: "списание визита с остатком и защитой от двойного списания" }
    metrics:
      - id: packages_sold
        label: "Продано абонементов"
        goal: retention
        unit: count
        better: up
        compute: { kind: count, entity: client_package, dateField: created_at }
      - id: packages_renewed
        label: "Продлили абонемент"
        goal: retention
        unit: percent
        better: up
        compute: { kind: repeat_share, entity: client_package, by: client, dateField: created_at }
    goalScenarios:
      - id: GS-packages-1
        goal: retention
        title: "Визит по записи списывается с абонемента"
        withModules: [client_card, booking, catalog, notify]
        when: { param: write_off_on_booking }
        steps:
          - { actor: owner, text: "Продаёт клиенту абонемент на 4 визита" }
          - { actor: staff, text: "Отмечает запись клиента как состоявшуюся" }
        expect:
          - { kind: record, text: "В карточке клиента остаток 3 визита" }
      - id: GS-packages-2
        goal: retention
        title: "Клиент получает напоминание об окончании абонемента"
        withModules: [client_card, notify]
        when: { param: expiry_reminder_days }
        steps:
          - { actor: system, text: "Время сдвигается к дате напоминания" }
        expect:
          - { kind: outbox_email, text: "Клиенту ушло письмо об окончании абонемента" }

  - id: resources
    version: 1
    name: "Учёт выдачи и ресурсов"
    summary: "Что выдано, кому и до какого числа; возврат, просрочки и напоминания"
    status: draft
    order: 70
    origin: { kind: new }
    goals: [resource_tracking]
    params:
      - { name: resource_label, label: "Как называть предмет", type: string, maxLength: 40, default: "Инвентарь" }
      - { name: with_quantity, label: "Учёт количества", type: bool, default: false }
      - { name: default_days, label: "Срок выдачи по умолчанию, дней", type: int, min: 1, max: 90, default: 7 }
      - { name: overdue_reminder, label: "Напоминание о просрочке", type: bool, default: true }
      - { name: deposit, label: "Залог", type: bool, default: false }
      - { name: extra_fields, label: "Дополнительные поля предмета", type: fields, maxItems: 6 }
    requires:
      - { module: notify, reason: "напоминание о возврате и просрочке", when: { param: overdue_reminder } }
    links:
      - { module: client_card, effect: "выдача ссылается на клиента, история выдач в карточке" }
      - { module: staff, effect: "кто выдал и кто принял — сотрудник" }
    provides: { entities: [resource, resource_issue] }
    metrics:
      - id: issued_count
        label: "Выдач"
        goal: resource_tracking
        unit: count
        better: up
        compute: { kind: count, entity: resource_issue, dateField: issued_at }
      - id: overdue_share
        label: "Доля просрочек"
        goal: resource_tracking
        unit: percent
        better: down
        compute: { kind: ratio, entity: resource_issue, dateField: issued_at, numerator: { status: overdue } }
    goalScenarios:
      - id: GS-resources-1
        goal: resource_tracking
        title: "Сотрудник выдаёт предмет и принимает возврат"
        steps:
          - { actor: owner, text: "Выдаёт предмет со сроком возврата" }
          - { actor: owner, text: "Отмечает возврат" }
        expect:
          - { kind: status, text: "Предмет снова «в наличии», выдача закрыта" }
      - id: GS-resources-2
        goal: resource_tracking
        title: "Просроченная выдача помечается и даёт напоминание"
        withModules: [notify]
        when: { param: overdue_reminder }
        steps:
          - { actor: owner, text: "Выдаёт предмет на 1 день" }
          - { actor: system, text: "Время сдвигается на 2 дня" }
        expect:
          - { kind: status, text: "Выдача в статусе «просрочена»" }
          - { kind: outbox_email, text: "Владельцу ушло напоминание о просрочке" }
